<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>宅建 本試験 過去問模試</title>
<style>
:root{
  --bg:#FFFFFF; --panel:#F7F8FA; --ink:#1B2430; --sub:#68758A;
  --line:#E5E9F0; --navy:#16294F;
  --gold:#C99B2E; --ok:#1FA971; --okbg:#E9F8F1; --ng:#E05252; --ngbg:#FDEDED;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;line-height:1.7;font-size:15px}
#app{max-width:600px;margin:0 auto;padding:16px 16px 48px}
header{padding:6px 0 12px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand{font-weight:700;font-size:16px}
.brand small{margin-left:8px;font-weight:500;color:var(--sub);font-size:11px;letter-spacing:.10em}
.goal{margin-top:10px}
.goal .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);font-weight:600;margin-bottom:5px}
.goal .lbl b{color:var(--ok)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:.2s}
h2{font-size:12px;color:var(--sub);font-weight:700;letter-spacing:.12em;margin:22px 0 8px}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;text-align:center}
.btn.primary{background:var(--navy);color:#fff}
.btn.gold{background:var(--gold);color:#fff}
.btn.line{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.soft{background:var(--panel);color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.row2{display:flex;gap:10px;margin-top:10px}
.row2 .btn{flex:1}
/* set tabs */
.tabs{display:flex;gap:6px;margin-bottom:6px;overflow-x:auto}
.tab{flex:none;border:1.5px solid var(--line);background:#fff;color:var(--sub);border-radius:999px;font-size:13px;font-weight:700;padding:7px 14px;cursor:pointer}
.tab.on{border-color:var(--navy);background:var(--navy);color:#fff}
.tab.dis{opacity:.45;cursor:default}
/* category list */
.cathead{display:flex;align-items:center;justify-content:space-between;margin:20px 0 8px}
.cathead h3{font-size:14px;font-weight:800}
.cathead h3 span{font-size:11px;color:var(--sub);font-weight:600;margin-left:6px}
.cathead button{border:1px solid var(--navy);color:var(--navy);background:#fff;border-radius:999px;font-size:12px;font-weight:700;padding:5px 12px;cursor:pointer}
.qrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;cursor:pointer;color:var(--ink)}
.qrow .st{flex:none;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;background:var(--panel);border:1px solid var(--line);color:#B6BFCC}
.qrow.ok .st{background:var(--okbg);border-color:#BFE8D6;color:var(--ok)}
.qrow.ng .st{background:var(--ngbg);border-color:#F5C9C9;color:var(--ng)}
.qrow .tt{flex:1;min-width:0}
.qrow .tt b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .tt span{font-size:11px;color:var(--sub)}
.qrow .cnt{flex:none;text-align:right;font-size:11px;color:var(--sub);line-height:1.5}
.qrow .cnt b{font-size:12px}
.qrow .cnt .o{color:var(--ok)} .qrow .cnt .x{color:var(--ng)}
/* quiz */
.qtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px}
.chip{font-size:11px;font-weight:700;color:var(--navy);background:#EDF1F9;border-radius:6px;padding:3px 9px;line-height:1.5}
.chip.c1{color:#16294F;background:#EDF1F9}
.chip.c2{color:#7A4A0E;background:#FBF2E2}
.chip.c3{color:#175E4C;background:#E7F5F0}
.chip.c4{color:#7A2E5B;background:#F7E9F1}
.qnum{font-size:12px;color:var(--sub);font-weight:600;flex:none}
.timer{font-size:12px;color:var(--gold);font-weight:800;flex:none;font-variant-numeric:tabular-nums}
.pbar{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.pbar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.qhist{font-size:11px;color:var(--sub);margin-bottom:10px}
.qhist b.o{color:var(--ok)} .qhist b.x{color:var(--ng)}
.qtext{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14px;white-space:pre-wrap;margin-bottom:14px}
.choice{display:flex;gap:10px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:14px;line-height:1.65;margin-bottom:10px;cursor:pointer;color:var(--ink)}
.choice .no{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--sub)}
.choice.sel-ok{border-color:var(--ok);background:var(--okbg)}
.choice.sel-ok .no{border-color:var(--ok);background:var(--ok);color:#fff}
.choice.sel-ng{border-color:var(--ng);background:var(--ngbg)}
.choice.sel-ng .no{border-color:var(--ng);background:var(--ng);color:#fff}
.choice.pick{border-color:var(--navy);background:#EDF1F9}
.choice.pick .no{border-color:var(--navy);background:var(--navy);color:#fff}
.choice.dim{opacity:.45}
.verdict{font-size:20px;font-weight:800;margin:4px 0 10px}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.exp{background:#FBF7EC;border:1px solid #EADFC2;border-radius:12px;padding:13px 14px;font-size:13px;margin-bottom:14px}
.exp p{margin-bottom:6px}
.exp p:last-child{margin-bottom:0}
.exp .hd{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:.12em;margin-bottom:6px}
.src{font-size:11px;color:var(--sub);margin-bottom:12px}
/* result */
.score{text-align:center;padding:22px 0 6px}
.score b{font-size:44px;font-weight:800}
.score span{color:var(--sub);font-size:15px}
.score .tm{display:block;margin-top:4px;font-size:13px;color:var(--sub)}
.rlist{margin-top:14px}
.rrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:7px;cursor:pointer;color:var(--ink)}
.rrow .st{flex:none;width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.rrow.ok .st{background:var(--okbg);color:var(--ok)} .rrow.ng .st{background:var(--ngbg);color:var(--ng)}
.rrow .tt{flex:1;min-width:0}
.rrow .tt b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .tt span{font-size:10.5px;color:var(--sub)}
/* boxes */
.gptbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.gptbox p{font-size:13px;color:var(--sub);margin-bottom:10px}
textarea{width:100%;height:200px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:11px;color:var(--ink);background:#fff;margin-top:10px;display:none}
.copied{color:var(--ok)!important}
.note{font-size:12px;color:var(--sub);background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:12px;text-align:center}
footer{margin-top:30px;text-align:center;font-size:11px;color:var(--sub)}
.modes{display:flex;flex-direction:column;gap:10px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SETS = {"1":[{"id":1,"cat":"権利関係","title":"詐欺・錯誤と第三者","ans":4,"q":"AがBに甲土地を売却し、Bが所有権移転登記を備えた場合に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。","choices":["AがBとの売買契約をBの詐欺を理由に取り消した後、CがBから甲土地を買い受けて所有権移転登記を備えた場合、AC間の関係は対抗問題となり、Aは、いわゆる背信的悪意者ではないCに対して、登記なくして甲土地の返還を請求することができない。","AがBとの売買契約をBの詐欺を理由に取り消す前に、Bの詐欺について悪意のCが、Bから甲土地を買い受けて所有権移転登記を備えていた場合、AはCに対して、甲土地の返還を請求することができる。","Aの売却の意思表示に法律行為の目的及び取引上の社会通念に照らして重要な錯誤がある場合、Aに重大な過失がなければ、Aは、Aが取り消す前にBから甲土地を買い受けた悪意のCに対して、錯誤による当該意思表示の取消しを主張して、甲土地の返還を請求することができる。","Aの売却の意思表示に法律行為の目的及び取引上の社会通念に照らして重要な錯誤がある場合、BがAに錯誤があることを過失なく知らなかったときにおいて、Aに重大な過失があったとしても、AはBに対して、錯誤による当該意思表示の取消しを主張して、甲土地の返還を請求することができる。"],"exp":["1 ○ 詐欺取消後の第三者との優劣は登記の先後で決まる（177条・判例）。背信的悪意者でないCに、Aは登記なくして返還請求できない。","2 ○ 詐欺取消は取消前の善意無過失の第三者に対抗できない（96条3項）。悪意のCには対抗でき返還請求できる。","3 ○ 錯誤取消も取消前の善意無過失の第三者に対抗できない（95条4項）。重過失のないAは悪意のCに取消主張・返還請求できる。","4 × 表意者に重過失があれば錯誤取消は主張できない（95条3項）。重過失あるAはBに取消主張できず返還請求できない。→誤り＝正解"]},{"id":2,"cat":"権利関係","title":"無権代理","ans":2,"q":"A所有の甲土地につき、Aから売却に関する代理権を与えられていないBが、Aの代理人として、Cとの間で売買契約を締結した場合における次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。なお、表見代理は成立しないものとする。","choices":["Bの無権代理行為をAが追認した場合には、AC間の売買契約は有効となる。","Aの死亡により、BがAの唯一の相続人として相続した場合、Bは、Aの追認拒絶権を相続するので、自らの無権代理行為の追認を拒絶することができる。","Bの死亡により、AがBの唯一の相続人として相続した場合、AがBの無権代理行為の追認を拒絶しても信義則には反せず、AC間の売買契約が当然に有効になるわけではない。","Aの死亡により、BがDとともにAを相続した場合、DがBの無権代理行為を追認しない限り、Bの相続分に相当する部分においても、AC間の売買契約が当然に有効になるわけではない。"],"exp":["1 ○ 無権代理を本人が追認すれば本人に効力が生じる（113条1項）。AがCに追認すればAC間は有効。","2 × 無権代理人が単独で本人を相続すると当然に有効となり、追認拒絶はできない（判例）。→誤り＝正解","3 ○ 本人が単独で無権代理人を相続しても、本人の追認拒絶は信義則に反しない（判例）。当然有効にはならない。","4 ○ 無権代理人が本人を共同相続した場合、他の共同相続人全員が共同で追認しない限り、無権代理人の相続分でも当然有効にはならない（判例）。"]},{"id":3,"cat":"権利関係","title":"債務不履行・損害賠償","ans":4,"q":"債務不履行に基づく損害賠償請求権に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。","choices":["AがBと契約を締結する前に、信義則上の説明義務に違反して契約締結の判断に重要な影響を与える情報をBに提供しなかった場合、Bが契約を締結したことにより被った損害につき、Aは、不法行為による賠償責任を負うことはあっても、債務不履行による賠償責任を負うことはない。","AB間の利息付金銭消費貸借契約において、利率に関する定めがない場合、借主Bが債務不履行に陥ったことによりAがBに対して請求することができる遅延損害金は、年3パーセントの利率により算出する。","AB間でB所有の甲不動産の売買契約を締結した後、Bが甲不動産をCに二重譲渡してCが登記を具備した場合、AはBに対して債務不履行に基づく損害賠償請求をすることができる。","AB間の金銭消費貸借契約において、借主Bは当該契約に基づく金銭の返済をCからBに支払われる売掛代金で予定していたが、その入金がなかった（Bの責めに帰すべき事由はない。）ため、返済期限が経過してしまった場合、Bは債務不履行には陥らず、Aに対して遅延損害金の支払義務を負わない。"],"exp":["1 ○ 契約締結前の説明義務違反は、不法行為責任は負っても債務不履行責任は負わない（判例）。","2 ○ 利率の定めのない利息付金銭消費貸借の遅延損害金は、遅滞責任を負った時点の法定利率（年3％）による（419条1項・404条）。","3 ○ 二重譲渡で第二買主に移転登記が完了すれば、第一買主は売主に債務不履行に基づく損害賠償請求ができる（判例）。","4 × 金銭債務は不可抗力を抗弁にできない（419条3項）。Bは債務不履行に陥り遅延損害金の支払義務を負う。→誤り＝正解"]},{"id":4,"cat":"権利関係","title":"請負・契約不適合","ans":2,"q":"Aを注文者、Bを請負人として、A所有の建物に対して独立性を有さずその構成部分となる増築部分の工事請負契約を締結し、Bは3か月間で増築工事を終了させた。この場合に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。なお、この問において「契約不適合」とは品質に関して契約の内容に適合しないことをいい、当該請負契約には契約不適合責任に関する特約は定められていなかったものとする。","choices":["AがBに請負代金を支払っていなくても、Aは増築部分の所有権を取得する。","Bが材料を提供して増築した部分に契約不適合がある場合、Aは工事が終了した日から1年以内にその旨をBに通知しなければ、契約不適合を理由とした修補をBに対して請求することはできない。","Bが材料を提供して増築した部分に契約不適合があり、Bは不適合があることを知りながらそのことをAに告げずに工事を終了し、Aが工事終了日から3年後に契約不適合を知った場合、AはBに対して、消滅時効が完成するまでは契約不適合を理由とした修補を請求することができる。","増築した部分にAが提供した材料の性質によって契約不適合が生じ、Bが材料が不適当であることを知らずに工事を終了した場合、AはBに対して、Aが提供した材料によって生じた契約不適合を理由とした修補を請求することはできない。"],"exp":["1 ○ 不動産に付合した物の所有権は不動産所有者が取得する（242条本文）。増築部分は建物に付合しAが取得。","2 × 契約不適合の通知期間は「不適合を知った時から1年以内」（637条1項）。「工事終了日から1年以内」ではない。→誤り＝正解","3 ○ 引渡時に請負人が不適合を知り又は重過失で知らなかったときは通知不要（637条2項）。消滅時効完成まで修補請求できる。","4 ○ 注文者の供した材料の性質・指図で生じた不適合は責任追及できない（636条本文）。Aの材料による不適合は修補請求できない。"]},{"id":5,"cat":"権利関係","title":"民法の条文","ans":1,"q":"次の記述のうち、民法の条文として規定されていないものはどれか。","choices":["隔地者間の契約は、承諾の通知を発した時に成立する。","無効な行為に基づく債務の履行として給付を受けた者は、相手方を原状に復させる義務を負う。","代理人が自己又は第三者の利益を図る目的で代理権の範囲内の行為をした場合において、相手方がその目的を知り、又は知ることができたときは、その行為は、代理権を有しない者がした行為とみなす。","未成年者が法律行為をするには、その法定代理人の同意を得なければならない。ただし、単に権利を得、又は義務を免れる法律行為については、この限りでない。"],"exp":["1 × 契約は承諾で成立し（522条1項）、意思表示は到達時に効力を生じる（97条1項）。「承諾の通知を発した時に成立」は民法に規定がない。→規定されていない＝正解","2 ○ 無効な行為の給付受領者は原状回復義務を負う（121条の2第1項）。規定あり。","3 ○ 代理人が利益相反目的で代理権の範囲内の行為をした場合、相手方が悪意・有過失なら無権代理とみなす（107条）。規定あり。","4 ○ 未成年者の法律行為には法定代理人の同意が必要、ただし単に利益を得・義務を免れる行為は除く（5条1項）。規定あり。"]},{"id":6,"cat":"権利関係","title":"委任","ans":2,"q":"Aが、A所有の不動産の売買をBに対して委任する場合に関する次の記述のうち、民法の規定によれば、正しいものはどれか。なお、A及びBは宅地建物取引業者ではないものとする。","choices":["不動産のような高価な財産の売買を委任する場合には、AはBに対して委任状を交付しないと、委任契約は成立しない。","Bは、委任契約をする際、有償の合意をしない限り、報酬の請求をすることができないが、委任事務のために使った費用とその利息は、Aに請求することができる。","Bが当該物件の価格の調査など善良な管理者の注意義務を怠ったため、不動産売買についてAに損害が生じたとしても、報酬の合意をしていない以上、AはBに対して賠償の請求をすることができない。","委任はいつでも解除することができるから、有償の合意があり、売買契約成立寸前にAが理由なく解除してBに不利益を与えたときでも、BはAに対して損害賠償を請求することはできない。"],"exp":["1 × 委任は諾成契約。委任状の交付がなくても契約は成立する。","2 ○ 委任は無償が原則で特約がなければ報酬請求できない（648条1項）が、委任事務に要した費用と利息は請求できる（650条1項）。→正しい＝正解","3 × 受任者は有償・無償を問わず善管注意義務を負う（644条）。これを怠り損害が生じればAはBに賠償請求できる（415条）。","4 × 委任はいつでも解除できるが、相手方に不利な時期の解除等では損害賠償義務が生じる（651条2項）。BはAに賠償請求できる。"]},{"id":7,"cat":"権利関係","title":"抵当権・法定地上権","ans":4,"q":"Aは、Bに対する貸付金債権の担保のために、当該貸付金債権額にほぼ見合う評価額を有するB所有の更地である甲土地に抵当権を設定し、その旨の登記をした。その後、Bはこの土地上に乙建物を築造し、自己所有とした。この場合、民法の規定及び判例によれば、次の記述のうち正しいものはどれか。","choices":["Aは、Bに対し、乙建物の築造行為は、甲土地に対するAの抵当権を侵害する行為であるとして、乙建物の収去を求めることができる。","Bが、甲土地及び乙建物の双方につき、Cのために抵当権を設定して、その旨の登記をした後（甲土地についてはAの後順位）、Aの抵当権が実行されるとき、乙建物のために法定地上権が成立する。","Bが、乙建物築造後、甲土地についてのみ、Dのために抵当権を設定して、その旨の登記をした場合（甲土地についてはAの後順位）、Aの抵当権及び被担保債権が存続している状態で、Dの抵当権が実行されるとき、乙建物のために法定地上権が成立する。","Aは、乙建物に抵当権を設定していなくても、甲土地とともに乙建物を競売することができるが、優先弁済権は甲土地の代金についてのみ行使できる。"],"exp":["1 × 更地に抵当権を設定した後に築造された建物の収去は請求できない。","2 × 法定地上権は抵当権設定時に建物が存在することが必要（388条・判例）。更地への設定では成立しない。","3 × 同上。設定時に更地であれば法定地上権は成立しない。","4 ○ 抵当権設定後に設定者が築造した建物は土地とともに一括競売できるが、優先弁済は土地代金についてのみ行使できる（389条1項）。→正しい＝正解"]},{"id":8,"cat":"権利関係","title":"連帯債務・連帯保証","ans":2,"q":"AからBとCとが負担部分2分の1として連帯して1,000万円を借り入れる場合と、DからEが1,000万円を借り入れ、Fがその借入金返済債務についてEと連帯して保証する場合とに関する次の記述のうち、民法の規定によれば、正しいものはどれか。","choices":["Aが、Bに対して債務を免除した場合にはCが、Cに対して債務を免除した場合にはBが、それぞれ500万円分の債務を免れる。Dが、Eに対して債務を免除した場合にはFが、Fに対して債務を免除した場合にはEが、それぞれ全額の債務を免れる。","Aが、Bに対して履行を請求した効果はCには及ばず、Cに対して履行を請求した効果もBには及ばない。Dが、Eに対して履行を請求した効果はFに及び、Fに対して履行を請求した効果はEに及ばない。","Bについて時効が完成した場合にはCが、Cについて時効が完成した場合にはBが、それぞれ500万円分の債務を免れる。Eについて時効が完成した場合にはFが、Fについて時効が完成した場合にはEが、それぞれ全額の債務を免れる。","AB間の契約が無効であった場合にはCが、AC間の契約が無効であった場合にはBが、それぞれ1,000万円の債務を負う。DE間の契約が無効であった場合はFが、DF間の契約が無効であった場合はEが、それぞれ1,000万円の債務を負う。"],"exp":["1 × 連帯債務者の1人への免除は他の債務者に影響しない（相対効・441条）。一方、主たる債務の免除は保証債務にも及ぶ（付従性）。前段が誤り。","2 ○ 連帯債務者の1人への履行請求は他に及ばない（441条）が、主たる債務者への請求は連帯保証人に及ぶ（458条・457条）。→正しい＝正解","3 × 連帯債務者の1人の時効完成は他に影響しない（相対効・441条）。連帯保証人の時効完成も主たる債務者に影響しない。","4 × 一部の契約が無効でも、他の債務者が負う債務額は変わらない。本肢は誤り。"]},{"id":9,"cat":"権利関係","title":"使用者責任・共同不法行為","ans":1,"q":"Aに雇用されているBが、勤務中にA所有の乗用車を運転し、営業活動のため顧客Cを同乗させている途中で、Dが運転していたD所有の乗用車と正面衝突した（なお、事故についてはBとDに過失がある。）場合における次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","choices":["Aは、Cに対して事故によって受けたCの損害の全額を賠償した。この場合、Aは、BとDの過失割合に従って、Dに対して求償権を行使することができる。","Aは、Dに対して事故によって受けたDの損害の全額を賠償した。この場合、Aは、被用者であるBに対して求償権を行使することはできない。","事故によって損害を受けたCは、AとBに対して損害賠償を請求することはできるが、Dに対して損害賠償を請求することはできない。","事故によって損害を受けたDは、Aに対して損害賠償を請求することはできるが、Bに対して損害賠償を請求することはできない。"],"exp":["1 ○ B・Dの共同不法行為（719条1項）で、Bの使用者Aは使用者責任を負う（715条1項）。全額賠償した使用者は、他の共同不法行為者Dに過失割合に従って求償できる（判例）。→正しい＝正解","2 × 使用者は被用者にも求償できるが、信義則上相当な限度に制限される（判例）。「求償できない」は誤り。","3 × 被害者Cは、共同不法行為者であるDに対しても損害賠償を請求できる。","4 × 被害者Dは、運転していたBに対しても損害賠償を請求できる。"]},{"id":10,"cat":"権利関係","title":"相続の承認・放棄","ans":4,"q":"相続の承認及び放棄に関する次の記述のうち、民法の規定によれば、誤っているものはどれか。","choices":["相続の放棄をする場合、その旨を家庭裁判所に申述しなければならない。","相続人が数人あるときは、限定承認は、共同相続人の全員が共同してのみこれをすることができる。","相続人が、自己のために相続の開始があったことを知った時から3カ月（家庭裁判所が期間の伸長をした場合は当該期間）以内に、限定承認又は放棄をしなかったときは、単純承認をしたものとみなされる。","被相続人の子が、相続の開始後に相続放棄をした場合、その者の子がこれを代襲して相続人となる。"],"exp":["1 ○ 相続放棄をする者は、その旨を家庭裁判所に申述しなければならない（938条）。","2 ○ 相続人が数人あるとき、限定承認は共同相続人全員が共同してのみできる（923条）。","3 ○ 自己のために相続開始を知った時から3か月以内に限定承認・放棄をしなければ単純承認とみなされる（915条1項・921条）。","4 × 相続放棄は代襲原因ではない。放棄した者の子は代襲相続しない（887条2項・939条）。→誤り＝正解"]},{"id":11,"cat":"権利関係","title":"建物買取請求権","ans":2,"q":"Aが、Bに土地を賃貸し、Bがその土地上に建物を所有している場合の契約終了に伴う建物買取請求権に関する次の記述のうち、借地借家法の規定及び判例によれば、誤っているものはどれか。","choices":["AB間の借地契約が、公正証書により10年の事業専用の目的で締結された場合には、Bは建物買取請求権を有しない。","建物買取請求権は、契約終了の理由を問わず、Bの債務不履行を原因とする契約終了の場合にも、BはAに対して建物の買取りを請求することができる。","BがAの承諾を得て土地をCに転貸し、建物を譲渡した場合、AB間、BC間の契約が、ともに期間満了し更新がなければ、CはAに対し直接建物買取請求権を有する。","Bが適法にAに建物買取請求権を行使すると、その所有権は直ちにBからAに移転するが、BはAが代金を支払うまで、建物の引渡しを拒むことができる。"],"exp":["1 ○ 公正証書・存続期間10年の事業専用（事業用定期借地権）では建物買取請求権は認められない（借地借家法23条2項等）。","2 × 借地人の債務不履行を原因とする契約終了の場合は、建物買取請求権を行使できない。→誤り＝正解","3 ○ 適法な転借地で、AB間・BC間がともに期間満了で更新がなければ、転借地権者CはAに直接建物買取請求できる。","4 ○ 建物買取請求権を行使すると所有権は直ちにBからAに移転するが、Bは代金支払まで建物の引渡しを拒める。"]},{"id":12,"cat":"権利関係","title":"借地借家法（建物賃貸借）","ans":4,"q":"Aが所有する甲建物をBに対して3年間賃貸する旨の契約をした場合における次の記述のうち、借地借家法の規定によれば、正しいものはどれか。","choices":["AがBに対し、甲建物の賃貸借契約の期間満了の1年前に更新をしない旨の通知をしていれば、AB間の賃貸借契約は期間満了によって当然に終了し、更新されない。","Aが甲建物の賃貸借契約の解約の申入れをした場合には申入れ日から3月で賃貸借契約が終了する旨を定めた特約は、Bがあらかじめ同意していれば、有効となる。","Cが甲建物を適法に転借している場合、AB間の賃貸借契約が期間満了によって終了するときに、Cがその旨をBから聞かされていれば、AはCに対して、賃貸借契約の期間満了による終了を対抗することができる。","AB間の賃貸借契約が借地借家法第38条の定期建物賃貸借で、契約の更新がない旨を定めるものである場合、当該契約前にAがBに契約の更新がなく期間の満了により終了する旨を記載した書面を交付し又はBの承諾を得て電磁的方法による提供をして説明しなければ、契約の更新がない旨の約定は無効となる。"],"exp":["1 × 期間満了の1年前から6か月前までに更新拒絶の通知をしなければ、従前と同一条件で更新したものとみなされる（借地借家法26条1項）。当然終了ではない。","2 × 建物賃貸借の解約申入れは申入れから6か月経過で終了（27条1項・30条）。これより短い特約は賃借人に不利で無効。","3 × 転貸借がある場合、賃貸人は転借人に通知しなければ期間満了による終了を対抗できない（34条1項）。Bからの説明では足りない。","4 ○ 定期建物賃貸借は、更新がない旨を書面交付又は電磁的方法＋説明しなければ、更新がない旨の定めは無効となる（借地借家法38条3項〜5項）。→正しい＝正解"]},{"id":13,"cat":"権利関係","title":"区分所有法","ans":2,"q":"建物の区分所有等に関する法律に関する次の記述のうち、誤っているものはどれか。","choices":["管理者は、少なくとも毎年1回集会を招集しなければならない。","区分所有者（議決権を有しないものを除く。）の5分の1以上の者であって議決権の5分の1以上を有するものは、管理者に対し、会議の目的たる事項を示して、集会の招集を請求することができるが、この定数は規約で減ずることはできない。","集会の招集の通知は、区分所有者が管理者に対して通知を受け取る場所をあらかじめ通知した場合には、管理者はその場所にあててすれば足りる。","集会は、区分所有者（議決権を有しないものを除く。）全員の同意があれば、招集の手続を経ないで開くことができる。"],"exp":["1 ○ 管理者は少なくとも毎年1回集会を招集しなければならない（区分所有法34条2項）。","2 × 集会招集請求の定数（区分所有者・議決権の各5分の1以上）は、規約で減ずることができる（35条3項）。「減ずることはできない」は誤り。→誤り＝正解","3 ○ 招集通知は、区分所有者があらかじめ通知を受ける場所を通知したときはその場所にあてれば足りる（35条3項）。","4 ○ 区分所有者全員の同意があれば、招集手続を経ないで集会を開ける（36条）。"]},{"id":14,"cat":"権利関係","title":"不動産登記法","ans":4,"q":"不動産登記の申請に関する次の記述のうち、誤っているものはどれか。","choices":["登記の申請を共同してしなければならない者の一方に登記手続をすべきことを命ずる確定判決による登記は、当該申請を共同してしなければならない者の他方が単独で申請することができる。","相続又は法人の合併による権利の移転の登記は、登記権利者が単独で申請することができる。","登記名義人の氏名若しくは名称又は住所についての変更の登記又は更正の登記は、登記名義人が単独で申請することができる。","所有権の登記の抹消は、所有権の移転の登記の有無にかかわらず、現在の所有権の登記名義人が単独で申請することができる。"],"exp":["1 ○ 登記手続を命ずる確定判決による登記は、他方が単独で申請できる（不登法63条1項）。","2 ○ 相続又は法人の合併による権利移転の登記は、登記権利者が単独で申請できる（63条2項）。","3 ○ 登記名義人の氏名・名称・住所の変更・更正の登記は、登記名義人が単独で申請できる（64条1項）。","4 × 所有権の登記の抹消は、所有権移転登記がない場合に限り単独で申請できる（不登法77条）。「有無にかかわらず」は誤り。→誤り＝正解"]},{"id":15,"cat":"法令上の制限","title":"都市計画法（区域区分）","ans":3,"q":"都市計画法に関する次の記述のうち、誤っているものはどれか。","choices":["都市計画区域は、一体の都市として総合的に整備し、開発し、及び保全される必要がある区域であり、2以上の都府県にまたがって指定されてもよい。","都市計画は、都市計画区域内において定められるものであるが、道路や公園などの都市施設については、特に必要があるときは当該都市計画区域外においても定めることができる。","市街化区域は、既に市街地を形成している区域であり、市街化調整区域は、おおむね10年以内に市街化を図る予定の区域及び市街化を抑制すべき区域である。","無秩序な市街化を防止し、計画的な市街化を進めるため、都市計画区域を市街化区域と市街化調整区域に区分することができるが、すべての都市計画区域において区分する必要はない。"],"exp":["1 ○ 都市計画区域は一体の都市として整備・開発・保全する区域で、2以上の都府県にまたがって指定できる（都計法5条1項）。","2 ○ 都市計画は都市計画区域内で定めるが、都市施設は必要があれば区域外にも定められる（都計法11条1項）。","3 × 記述が逆。市街化区域は既に市街地を形成している区域＋おおむね10年以内に市街化を図るべき区域（7条2項）、市街化調整区域は市街化を抑制すべき区域（7条3項）。→誤り＝正解","4 ○ 都市計画区域は市街化区域と市街化調整区域に区分できるが（7条1項）、すべての区域で区分する必要はない。"]},{"id":16,"cat":"法令上の制限","title":"開発許可","ans":3,"q":"都市計画法の開発許可に関する次の記述のうち、正しいものはどれか。なお、この問における都道府県知事とは、地方自治法に基づく指定都市、中核市及び施行時特例市にあってはその長をいうものとする。","choices":["都道府県知事は、開発許可の申請があったときは、申請があった日から21日以内に、許可又は不許可の処分をしなければならない。","開発行為とは、主として建築物の建築の用に供する目的で行う土地の区画形質の変更をいい、建築物以外の工作物の建設の用に供する目的で行う土地の区画形質の変更は開発行為には該当しない。","開発許可を受けた者は、開発行為に関する工事を廃止したときは、遅滞なく、その旨を都道府県知事に届け出なければならない。","開発行為を行おうとする者は、開発許可を受けてから開発行為に着手するまでの間に、開発行為に関係がある公共施設の管理者と協議し、その同意を得なければならない。"],"exp":["1 × 開発許可の申請には遅滞なく許可・不許可の処分をする（都計法35条1項）。「21日以内」ではない。","2 × 開発行為には特定工作物の建設目的の区画形質変更も含む（都計法4条12項）。","3 ○ 開発許可を受けた者は、工事を廃止したとき遅滞なくその旨を都道府県知事に届け出なければならない。→正しい＝正解","4 × 開発行為に関係がある公共施設の管理者との協議・同意は、開発許可の申請前に行う必要がある。"]},{"id":17,"cat":"法令上の制限","title":"建築基準法（防火・単体）","ans":1,"q":"建築基準法に関する次の記述のうち、正しいものはどれか。","choices":["防火地域にある建築物で、外壁が耐火構造のものについては、その外壁を隣地境界線に接して設けることができる。","高さ30mの建築物には、原則として非常用の昇降機を設けなければならない。","準防火地域内においては、延べ面積が2,000㎡の共同住宅は準耐火建築物としなければならない。","延べ面積が1,000㎡を超える耐火建築物は、防火上有効な構造の防火壁又は防火床によって有効に区画し、かつ、各区画における床面積の合計をそれぞれ1,000㎡以内としなければならない。"],"exp":["1 ○ 防火地域・準防火地域内にある外壁が耐火構造の建築物は、その外壁を隣地境界線に接して設けられる（建基法63条）。→正しい＝正解","2 × 非常用昇降機は高さ31mを超える建築物に必要（34条2項）。高さ30mでは不要。","3 × 準防火地域で延べ面積1,500㎡を超える建築物は耐火建築物等としなければならず、2,000㎡なら準耐火建築物では足りない。","4 × 延べ面積1,000㎡超の建築物は防火壁等で1,000㎡以内ごとに区画するが、耐火建築物・準耐火建築物はこの限りでない（26条但書）。"]},{"id":18,"cat":"法令上の制限","title":"建築基準法（集団規定）","ans":2,"q":"建築基準法（以下この問において「法」という。）に関する次の記述のうち、誤っているものはどれか。","choices":["田園住居地域内においては、建築物の高さは、一定の場合を除き、10m又は12mのうち当該地域に関する都市計画において定められた建築物の高さの限度を超えてはならない。","一の敷地で、その敷地面積の40％が第二種低層住居専用地域に、60％が第一種中高層住居専用地域にある場合は、原則として、当該敷地内には大学を建築することができない。","都市計画区域の変更等によって法第3章の規定が適用されるに至った際現に建築物が立ち並んでいる幅員2mの道で、特定行政庁の指定したものは、同章の規定における道路とみなされる。","容積率規制を適用するに当たっては、前面道路の境界線又はその反対側の境界線からそれぞれ後退して壁面線の指定がある場合において、特定行政庁が一定の基準に適合すると認めて許可した建築物については、当該前面道路の境界線又はその反対側の境界線は、それぞれ当該壁面線にあるものとみなす。"],"exp":["1 ○ 田園住居地域内では建築物の高さは10m又は12mのうち都市計画で定めた限度を超えてはならない（55条1項）。","2 × 敷地が用途規制の異なる複数地域にわたるときは、過半の属する地域の用途規制が全部に適用される（91条）。過半が第一種中高層住居専用地域なら大学を建築できる。→誤り＝正解","3 ○ 第3章適用時に現に建築物が立ち並ぶ幅員4m未満の道で特定行政庁が指定したものは道路とみなされる（42条2項）。","4 ○ 壁面線の指定があり特定行政庁が許可した建築物は、容積率算定上、前面道路の境界線が壁面線にあるものとみなされる（52条11項）。"]},{"id":19,"cat":"法令上の制限","title":"盛土規制法","ans":4,"q":"宅地造成及び特定盛土等規制法に関する次の記述のうち、誤っているものはどれか。なお、この問において「都道府県知事」とは、地方自治法に基づく指定都市及び中核市にあってはその長をいうものとし、地方自治法に基づく施行時特例市に係る経過措置については考慮しないものとする。","choices":["宅地造成等工事規制区域内において、過去に宅地造成等に関する工事が行われ現在は工事主とは異なる者がその工事が行われた土地を所有している場合、当該土地の所有者は、宅地造成に伴う災害が生じないよう、その土地を常時安全な状態に維持するように努めなければならない。","宅地造成等工事規制区域内において行われる宅地造成等に関する工事について許可をする都道府県知事は、当該許可に、工事の施行に伴う災害を防止するために必要な条件を付することができる。","宅地を宅地以外の土地にするために行う土地の形質の変更は、宅地造成に該当しない。","宅地造成等工事規制区域内において、切土であって、当該切土をする土地の面積が400㎡で、かつ、高さ1mの崖を生ずることとなるものに関する工事を行う場合には、一定の場合を除き、都道府県知事の許可を受けなければならない。"],"exp":["1 ○ 工事主と異なる土地所有者も、宅地造成に伴う災害が生じないよう常時安全な状態に維持する努力義務を負う（盛土規制法22条1項）。","2 ○ 許可をする都道府県知事は、工事の施行に伴う災害を防止するため必要な条件を付すことができる（12条3項）。","3 ○ 宅地を宅地以外の土地にするための土地の形質変更は「宅地造成」に該当しない。","4 × 切土で高さ2m以下（本肢は1m）かつ面積500㎡以下（本肢は400㎡）の工事は規模要件を満たさず、許可は不要。→誤り＝正解"]},{"id":20,"cat":"法令上の制限","title":"土地区画整理法","ans":4,"q":"土地区画整理法に関する次の記述のうち、誤っているものはどれか。","choices":["施行者は、換地処分を行う前において、換地計画に基づき換地処分を行うため必要がある場合においては、施行地区内の宅地について仮換地を指定することができる。","仮換地が指定された場合においては、従前の宅地について権原に基づき使用し、又は収益することができる者は、仮換地の指定の効力発生の日から換地処分の公告がある日まで、仮換地について、従前の宅地について有する権利の内容である使用又は収益と同じ使用又は収益をすることができる。","施行者は、仮換地を指定した場合において、特別の事情があるときは、その仮換地について使用又は収益を開始することができる日を仮換地の指定の効力発生日と別に定めることができる。","土地区画整理組合の設立の認可の公告があった日後、換地処分の公告がある日までは、施行地区内において、土地区画整理事業の施行の障害となるおそれがある土地の形質の変更を行おうとする者は、当該土地区画整理組合の許可を受けなければならない。"],"exp":["1 ○ 施行者は換地処分前に、換地計画に基づき必要がある場合、仮換地を指定できる（区画法98条1項）。","2 ○ 仮換地指定を受けた者は、指定の効力発生日から換地処分の公告日まで、仮換地を従前の宅地と同様に使用収益できる（99条1項）。","3 ○ 特別の事情があるときは、仮換地の使用収益を開始できる日を指定の効力発生日と別に定められる（99条2項）。","4 × 認可公告後の土地の形質変更等は、土地区画整理組合ではなく都道府県知事（市の区域内では市長）の許可が必要（76条1項）。→誤り＝正解"]},{"id":21,"cat":"法令上の制限","title":"農地法","ans":3,"q":"農地法（以下この問において「法」という。）に関する次の記述のうち、正しいものはどれか。","choices":["山林を開墾し現に水田として耕作している土地であっても、土地登記簿上の地目が山林である限り、法の適用を受ける農地には当たらない。","農業者が、住宅を建設するために法第4条第1項の許可を受けた農地をその後住宅建設の工事着工前に宅地として売却する場合、改めて法第5条第1項の許可を受ける必要はない。","耕作目的で農地の売買契約を締結し、代金の支払をした場合でも、法第3条第1項の許可を受けていなければその所有権の移転の効力は生じない。","農業者が、自ら農業用倉庫として利用する目的で自己の所有する農地を転用する場合には、転用する農地の面積の規模にかかわらず、法第4条第1項の許可を受ける必要がある。"],"exp":["1 × 現に耕作している土地は、登記簿上の地目にかかわらず農地に当たる（農地法2条1項）。","2 × 4条許可を受けた農地を工事着工前に宅地として売却するには、改めて5条許可が必要。","3 ○ 耕作目的の農地売買は、3条許可を受けなければ所有権移転の効力を生じない（農地法3条6項）。→正しい＝正解","4 × 自己の農地を農業用施設に転用する場合、2アール未満なら4条許可は不要（施行規則29条1号）。「面積にかかわらず必要」は誤り。"]},{"id":22,"cat":"法令上の制限","title":"国土法・重要土地等調査法","ans":1,"q":"土地を取得する場合における届出に関する次の記述のうち、正しいものはどれか。なお、この問において「事後届出」とは、国土利用計画法第23条の届出をいい、「重要土地等調査法」とは、重要施設周辺及び国境離島等における土地等の利用状況の調査及び利用の規制等に関する法律をいうものとする。","choices":["都市計画区域外において、国から一団の土地である6,000㎡と5,000㎡の土地を購入した者は、事後届出を行う必要はない。","市街化区域を除く都市計画区域内において、Aが所有する7,000㎡の土地をBが相続により取得した場合、Bは事後届出を行う必要がある。","市街化区域において、Cが所有する3,000㎡の土地をDが購入する契約を締結した場合、C及びDは事後届出を行わなければならない。","重要土地等調査法の規定による特別注視区域内にある100㎡の規模の土地に関する所有権又はその取得を目的とする権利の移転をする契約を締結する場合には、当事者は、一定の事項を、あらかじめ、内閣総理大臣に届け出なければならない。"],"exp":["1 ○ 当事者の一方又は双方が国等である場合は、事後届出は不要（国土法23条2項3号）。→正しい＝正解","2 × 相続は「対価を得て行う契約」ではなく、事後届出は不要。7,000㎡でも相続なら不要。","3 × 市街化区域で2,000㎡以上の売買は届出が必要だが、届出義務者は権利取得者（買主D）のみ。売主Cも届出、は誤り。","4 × 重要土地等調査法の特別注視区域内の届出対象は200㎡以上。100㎡は届出不要。"]},{"id":23,"cat":"税その他","title":"印紙税","ans":3,"q":"印紙税に関する次の記述のうち、正しいものはどれか。","choices":["「建物の電気工事に係る請負代金は1,100万円（うち消費税額及び地方消費税額100万円）とする」旨を記載した工事請負契約書について、印紙税の課税標準となる当該契約書の記載金額は1,100万円である。","「Aの所有する土地（価額5,000万円）とBの所有する土地（価額4,000万円）とを交換する」旨の土地交換契約書を作成した場合、印紙税の課税標準となる当該契約書の記載金額は4,000万円である。","国を売主、株式会社Cを買主とする土地の売買契約において、共同で売買契約書を2通作成し、国とC社がそれぞれ1通ずつ保存することとした場合、C社が保存する契約書には印紙税は課されない。","「契約期間は10年間、賃料は月額10万円、権利金の額は100万円とする」旨が記載された土地の賃貸借契約書は、記載金額1,300万円の土地の賃借権の設定に関する契約書として印紙税が課される。"],"exp":["1 × 消費税額が区分記載されているときは消費税額を記載金額に含めない。記載金額は1,000万円で、1,100万円ではない。","2 × 交換契約書は交換対象物の双方の価額のうち高い方が記載金額。5,000万円であり4,000万円ではない。","3 ○ 国等と私人が共同作成し私人が保存する文書は、国等が作成したものとみなされ印紙税が課されない（印紙税法4条5項・5条2号）。→正しい＝正解","4 × 土地賃貸借契約書の記載金額は権利金等（後日返還されない金銭）。記載金額は100万円で、1,300万円ではない。"]},{"id":24,"cat":"税その他","title":"不動産取得税","ans":2,"q":"不動産取得税に関する次の記述のうち、正しいものはどれか。","choices":["令和8年4月に住宅以外の家屋を取得した場合、不動産取得税の標準税率は、100分の3である。","令和8年4月に宅地を取得した場合、当該取得に係る不動産取得税の課税標準は、当該宅地の価格の2分の1の額とされる。","不動産取得税は、不動産の取得に対して、当該不動産の所在する都道府県が課する税であるが、その徴収は特別徴収の方法がとられている。","令和8年4月に床面積250㎡である新築住宅に係る不動産取得税の課税標準の算定については、当該新築住宅の価格から1,200万円が控除される。"],"exp":["1 × 住宅以外の家屋の取得の標準税率は100分の4（100分の3ではない）。","2 ○ 宅地を取得した場合の不動産取得税の課税標準は、宅地の価格の2分の1とされる（特例）。→正しい＝正解","3 × 不動産取得税の徴収は普通徴収による。特別徴収ではない。","4 × 新築住宅の1,200万円控除は床面積50㎡以上240㎡以下が要件。250㎡は範囲外で控除を受けられない。"]},{"id":25,"cat":"税その他","title":"不動産鑑定評価","ans":2,"q":"不動産の鑑定評価に関する次の記述のうち、正しいものはどれか。","choices":["不動産の価格を求める鑑定評価の手法は、原価法、取引事例比較法及び収益還元法に大別されるが、鑑定評価に当たっては、案件に即してこれらの三手法のいずれか1つを適用することが原則である。","取引事例比較法とは、まず多数の取引事例を収集して適切な事例の選択を行い、これらに係る取引価格に必要に応じて事情補正及び時点修正を行い、かつ、地域要因の比較及び個別的要因の比較を行って求められた価格を比較考量し、これによって対象不動産の試算価格を求める手法である。","収益還元法は、文化財の指定を受けた建造物等の一般的に市場性を有しない不動産も含め基本的にすべての不動産に適用すべきものであり、自用の不動産といえども賃貸を想定することにより適用されるものである。","賃料の鑑定評価において、支払賃料とは、賃料の種類の如何を問わず賃貸人等に支払われる賃料の算定の期間に対応する適正なすべての経済的対価をいい、純賃料及び不動産の賃貸借等を継続するために通常必要とされる諸経費等から成り立つものである。"],"exp":["1 × 鑑定評価は原価法・取引事例比較法・収益還元法を原則として併用すべきで、いずれか1つを適用するのではない。","2 ○ 取引事例比較法は、多数の取引事例から適切な事例を選択し、事情補正・時点修正、地域要因・個別的要因の比較を行って試算価格を求める手法。→正しい＝正解","3 × 収益還元法は、文化財等の市場性を有しない不動産「以外」のすべてに適用すべき手法。市場性を有しないものも含めすべて、は誤り。","4 × 支払賃料は各支払時期に実際に支払われる賃料。設問の説明（純賃料＋諸経費＝実質賃料）とは異なる。"]},{"id":26,"cat":"宅建業法","title":"免許（業の該当性）","ans":1,"q":"宅地建物取引業の免許（以下この問において「免許」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはいくつあるか。\n\nア Aの所有する商業ビルを賃借しているBが、フロアごとに不特定多数の者に反復継続して転貸する場合、AとBは免許を受ける必要はない。\n\nイ 宅地建物取引業者Cが、Dを代理して、Dの所有するマンション（30戸）を不特定多数の者に反復継続して分譲する場合、Dは免許を受ける必要はない。\n\nウ Eが転売目的で反復継続して宅地を購入する場合でも、売主が国その他宅地建物取引業法の適用がない者に限られているときは、Eは免許を受ける必要はない。\n\nエ Fが借金の返済に充てるため、自己所有の宅地を10区画に区画割りして、不特定多数の者に反復継続して売却する場合、Fは免許を受ける必要はない。","choices":["一つ","二つ","三つ","なし"],"exp":["ア ○ 自ら所有ビルを賃貸するAも、賃借して転貸するBも、貸借は「取引」に当たらず免許不要。","イ × 所有者Dが不特定多数に反復継続して分譲する行為は「業」に当たり、Dは免許が必要（業者に代理させても同じ）。","ウ × 転売目的で反復継続して宅地を購入するのも「業」に当たり、売主が誰でもEは免許が必要。","エ × 自己所有地を10区画に分割し不特定多数に反復継続して売却するFは免許が必要。","→免許不要が正しいのはアの一つ。①が正解。"]},{"id":27,"cat":"宅建業法","title":"事務所","ans":2,"q":"宅地建物取引業法第3条第1項に規定する事務所（以下この問において「事務所」という。）に関する次の記述のうち、正しいものはどれか。","choices":["事務所とは、契約締結権限を有する者を置き、継続的に業務を行うことができる施設を有する場所を指すものであるが、商業登記簿に登載されていない営業所又は支店は事務所には該当しない。","宅地建物取引業を営まず他の兼業業務のみを営んでいる支店は、事務所には該当しない。","宅地建物取引業者は、主たる事務所については、免許証、標識及び国土交通大臣が定めた報酬の額を掲げ、従業者名簿及び帳簿を備え付ける義務を負う。","宅地建物取引業者は、その事務所ごとに一定の数の成年者である専任の宅地建物取引士を置かなければならないが、既存の事務所がこれを満たさなくなった場合は、30日以内に必要な措置を執らなければならない。"],"exp":["1 × 商業登記簿に登載されていない営業所・支店でも、契約締結権限者を置き継続的に業務を行う施設は事務所に該当する。","2 ○ 宅建業を営まず兼業業務のみを営む支店は、事務所に該当しない。→正しい＝正解","3 × 主たる事務所には標識・報酬額の掲示、従業者名簿・帳簿の備付けが必要だが、免許証の掲示義務はない。","4 × 事務所の専任宅建士が不足したときは、2週間以内に必要な措置を執らなければならない（30日ではない）。"]},{"id":28,"cat":"宅建業法","title":"免許の欠格事由","ans":1,"q":"宅地建物取引業の免許（以下この問において「免許」という。）に関する次の記述のうち、正しいものはどれか。","choices":["免許を受けようとするA社に、刑法第204条（傷害）の罪により拘禁刑1年（刑の全部の執行猶予2年）の刑に処せられ、その執行猶予期間を満了した者が役員として在籍している場合、その満了の日から5年を経過していなくとも、A社は免許を受けることができる。","免許を受けようとするB社に、刑法206条（現場助勢）の罪により罰金の刑に処せられた者が非常勤役員として在籍している場合、その刑の執行が終わってから5年を経過していなくとも、B社は免許を受けることができる。","免許を受けようとするC社に、刑法第208条（暴行）の罪により拘留の刑に処せられた者が役員として在籍している場合、その刑の執行が終わってから5年を経過していなければ、C社は免許を受けることができない。","免許を受けようとするD社に、刑法第209条（過失傷害）の罪により科料の刑に処せられた者が非常勤役員として在籍している場合、その刑の執行が終わってから5年を経過していなければ、D社は免許を受けることができない。"],"exp":["1 ○ 傷害罪で拘禁刑・執行猶予付の役員も、執行猶予期間が満了すれば刑の言渡しは効力を失い欠格事由に当たらない。満了日から5年経過していなくてもA社は免許を受けられる。→正しい＝正解","2 × 現場助勢罪（暴力系の一定の罪）の罰金刑の役員がいると、刑の執行終了から5年経過しないとB社は免許を受けられない。","3 × 拘留は欠格事由（罰金以上の刑）に当たらない。C社は免許を受けられる。","4 × 科料は欠格事由に当たらない。D社は免許を受けられる。"]},{"id":29,"cat":"宅建業法","title":"免許（総合）","ans":3,"q":"次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはどれか。","choices":["宅地建物取引業の免許の有効期間は5年であり、免許の更新の申請は、有効期間満了の日の90日前から30日前までの間に行わなければならない。","宅地建物取引業者から免許の更新の申請があった場合において、有効期間の満了の日までにその申請について処分がなされないときは、従前の免許は、有効期間の満了後もその処分がなされるまでの間は、なお効力を有する。","個人である宅地建物取引業者A（甲県知事免許）が死亡した場合、Aの相続人は、Aの死亡の日から30日以内に、その旨を甲県知事に届け出なければならない。","法人である宅地建物取引業者B（乙県知事免許）が合併により消滅した場合、Bを代表する役員であった者は、その日から30日以内に、その旨を乙県知事に届け出なければならない。"],"exp":["1 ○ 免許の有効期間は5年、更新申請は満了日の90日前から30日前までの間に行う（業法3条2項・規則3条）。","2 ○ 更新申請後、満了日までに処分がなければ、従前の免許は処分がなされるまでなお効力を有する（3条4項）。","3 × 個人業者が死亡したときの届出は、相続人が「死亡を知った日から30日以内」（業法11条1項1号）。「死亡の日から」は誤り。→誤り＝正解","4 ○ 法人が合併消滅したときは、消滅法人を代表する役員だった者が30日以内に届け出る（11条1項2号）。"]},{"id":30,"cat":"宅建業法","title":"登録・取引士証","ans":1,"q":"宅地建物取引士の登録（以下この問において「登録」という。）及び宅地建物取引士証に関する次の記述のうち、民法及び宅地建物取引業法の規定によれば、正しいものはいくつあるか。\n\nア 登録を受けている者は、宅地建物取引士証の交付を受けていない場合は、その住所に変更があっても、登録を受けている都道府県知事に変更の登録を申請する必要はない。\n\nイ 宅地建物取引士証を亡失し、その再交付を申請している者は、再交付を受けるまでの間、宅地建物取引業法第35条に規定する重要事項の説明をする時は、宅地建物取引士証に代えて、再交付申請書の写しを提示すればよい。\n\nウ 甲県知事から宅地建物取引士証の交付を受けている者が、宅地建物取引士としての事務を禁止する処分を受け、その禁止の期間中に本人の申請により登録が消除された場合は、その者が乙県で宅地建物取引士資格試験に合格したとしても、当該期間が満了しないときは、乙県知事の登録を受けることができない。","choices":["一つ","二つ","三つ","なし"],"exp":["ア × 宅建士証の交付を受けているか否かにかかわらず、住所変更があれば変更の登録を申請しなければならない（業法20条・18条2項）。","イ × 重要事項説明の際は宅建士証の提示が必要（35条4項）。再交付申請書の写しの提示で足りる旨の規定はない。","ウ ○ 事務禁止処分の期間中に自ら登録消除を申請して登録が消除され、その禁止期間が満了しない者は登録を受けられない（18条1項11号）。","→正しいのはウの一つ。①が正解。"]},{"id":31,"cat":"宅建業法","title":"営業保証金","ans":4,"q":"宅地建物取引業者A（国土交通大臣免許）が、宅地建物取引業法の規定に基づき供託する営業保証金に関する次の記述のうち、正しいものはどれか。","choices":["Aは、営業保証金を主たる事務所又はその他の事務所のいずれかの最寄りの供託所に供託することができる。","Aが営業保証金を供託した旨は、供託所から国土交通大臣あてに通知されることから、Aがその旨を直接国土交通大臣に届け出る必要はない。","Aとの取引により生じた電気工事業者の工事代金債権について、当該電気工事業者は、営業継続中のAが供託している営業保証金から、その弁済を受ける権利を有する。","営業保証金の還付により、営業保証金の額が政令で定める額に不足することとなった場合、Aは、国土交通大臣から不足額を供託すべき旨の通知書の送付を受けた日から2週間以内にその不足額を供託しなければならない。"],"exp":["1 × 営業保証金は主たる事務所の最寄りの供託所に供託する（業法25条1項）。「いずれかの最寄り」ではない。","2 × 供託した旨は、A自身が免許権者（国土交通大臣等）に届け出なければならない（25条4項）。供託所からの通知ではない。","3 × 弁済を受けられるのは宅建業に関する「取引」により生じた債権のみ（27条1項）。電気工事代金債権は対象外。","4 ○ 還付で不足を生じたときは、免許権者からの通知書送付を受けた日から2週間以内に不足額を供託する（28条1項）。→正しい＝正解"]},{"id":32,"cat":"宅建業法","title":"保証協会","ans":3,"q":"宅地建物取引業保証協会（以下この問において「保証協会」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはどれか。","choices":["保証協会は、その名称、住所又は事務所の所在地を変更しようとするときは、あらかじめ、その旨を国土交通大臣に届け出なければならない。","保証協会は、新たに社員が加入したときは、直ちに、その旨を当該社員である宅地建物取引業者が免許を受けた国土交通大臣又は都道府県知事に報告しなければならない。","宅地建物取引業者で保証協会に加入しようとする者は、その加入した日から1週間以内に、政令で定める額の弁済業務保証金分担金を当該保証協会に納付しなければならない。","保証協会の社員は、自らが取り扱った宅地建物取引業に係る取引の相手方から当該取引に関する苦情について解決の申出が保証協会にあり、保証協会から説明を求められたときは、正当な理由がある場合でなければ、これを拒んではならない。"],"exp":["1 ○ 保証協会は名称・住所・事務所所在地を変更しようとするとき、あらかじめ国土交通大臣に届け出る。","2 ○ 新たに社員が加入したときは、直ちにその旨を当該社員の免許権者（国土交通大臣又は都道府県知事）に報告する。","3 × 分担金は「加入しようとする日までに」納付する（業法64条の9第1項）。「加入した日から1週間以内」は誤り。→誤り＝正解","4 ○ 社員は、取引の相手方からの苦情解決の申出につき保証協会から説明を求められたとき、正当な理由がなければ拒めない。"]},{"id":33,"cat":"宅建業法","title":"媒介契約","ans":2,"q":"宅地建物取引業者A社が、Bから自己所有の甲宅地の売却の媒介を依頼され、Bと媒介契約を締結した場合における次の記述のうち、宅地建物取引業法の規定によれば、正しいものはいくつあるか。\n\nア A社が、Bとの間に専任媒介契約を締結し、甲宅地の売買契約を成立させたときは、A社は、遅滞なく、登録番号、取引価格、売買契約の成立した年月日、売主及び買主の氏名を指定流通機構に通知しなければならない。\n\nイ A社は、Bとの間に媒介契約を締結し、Bに対して甲宅地を売買すべき価額又はその評価額について意見を述べるときは、その根拠を明らかにしなければならない。\n\nウ A社がBとの間に締結した専任媒介契約の有効期間は、Bからの申出により更新することができるが、更新の時から3月を超えることができない。","choices":["一つ","二つ","三つ","なし"],"exp":["ア × 指定流通機構への通知事項は登録番号・取引価格・契約成立年月日（業法34条の2第7項）。売主・買主の氏名は通知不要。","イ ○ 価額・評価額について意見を述べるときは、その根拠を明らかにしなければならない（34条の2第2項）。","ウ ○ 専任媒介契約は依頼者の申出があれば更新でき、更新後の期間は3か月を超えられない（34条の2第4項）。","→正しいのはイ・ウの二つ。②が正解。"]},{"id":34,"cat":"宅建業法","title":"広告規制","ans":1,"q":"宅地建物取引業者が行う広告に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","choices":["宅地建物取引業者は、宅地の造成又は建物の建築に関する工事が完了するまでの間は、当該工事に必要な都市計画法に基づく開発許可、建築基準法に基づく建築確認その他法令に基づく許可等の処分があった後でなければ、当該工事に係る宅地又は建物の売買その他の業務に関する広告をすることはできない。","宅地建物取引業者が、複数の区画がある宅地の売買について、数回に分けて広告をするときは、最初に行う広告以外には取引態様の別を明示する必要はない。","宅地建物取引業者は、建物の貸借の媒介において広告を行った場合には、依頼者の依頼の有無にかかわらず、報酬とは別に、当該広告の料金に相当する額を受領することができる。","宅地建物取引業の免許を取り消された者は、免許の取消し前に建物の売買の広告をしていれば、当該建物の売買契約を締結する目的の範囲内においては、なお宅地建物取引業者とみなされる。"],"exp":["1 ○ 造成・建築工事の完了前は、開発許可・建築確認等の処分後でなければ、当該工事に係る売買等の広告をすることはできない（業法33条）。→正しい＝正解","2 × 取引態様の別の明示は、広告のつど必要（業法34条1項）。最初だけでは足りない。","3 × 依頼者の依頼によって行う広告料金は、報酬とは別に受領できる（報酬告示第11）。「依頼の有無にかかわらず」ではない。","4 × 免許失効後も締結済み契約の取引を結了する範囲で宅建業者とみなされる（業法76条）が、広告をしていたというだけではみなされない。"]},{"id":35,"cat":"宅建業法","title":"重要事項説明（35条）","ans":2,"q":"宅地建物取引業者が行う宅地建物取引業法第35条に規定する重要事項の説明に関する次の記述のうち、誤っているものはどれか。なお、説明の相手方は宅地建物取引業者ではないものとする。","choices":["区分所有建物の売買の媒介を行う場合、当該1棟の建物及びその敷地の管理が委託されているときは、その委託を受けている者の氏名（法人にあっては、その商号又は名称）及び住所（法人にあっては、その主たる事務所の所在地）を説明しなければならない。","土地の売買の媒介を行う場合、移転登記の申請の時期の定めがあるときは、その内容を説明しなければならない。","住宅の売買の媒介を行う場合、宅地内のガス配管設備等に関して、当該住宅の売買後においても当該ガス配管設備等の所有権が家庭用プロパンガス販売業者にあるものとするときは、その旨を説明する必要がある。","中古マンションの売買の媒介を行う場合、当該マンションの計画的な維持修繕のための費用の積立てを行う旨の規約の定めがあるときは、その内容及び既に積み立てられている額について説明しなければならない。"],"exp":["1 ○ 区分所有建物の売買媒介で管理が委託されているときは、受託者の氏名・住所（法人は商号等・主たる事務所所在地）を35条書面で説明する（35条1項6号、規則16条の2第8号）。","2 × 移転登記の申請時期は37条書面の記載事項であり（37条1項5号）、重要事項として説明する必要はない。→誤り＝正解","3 ○ ガス配管設備等の所有権が売買後もプロパンガス販売業者にあるときは、その旨を説明しなければならない（35条1項、解釈・運用の考え方）。","4 ○ 計画的な維持修繕費用の積立てを行う旨の規約の定めがあるときは、その内容及び既に積み立てられた額を説明しなければならない（35条1項6号、規則16条の2第6号）。"]},{"id":36,"cat":"宅建業法","title":"37条書面","ans":1,"q":"宅地建物取引業者Aが宅地建物取引業法第37条の規定により交付すべき書面（以下この問において「37条書面」という。）に関する次の記述のうち、正しいものはどれか。なお、この問においては、電磁的方法により提供する場合を考慮しないものとする。","choices":["Aが媒介により建物の貸借の契約を成立させたときは、37条書面に借賃の額並びにその支払の時期及び方法を記載しなければならず、また、当該書面を契約の各当事者に交付しなければならない。","Aが媒介により宅地の貸借の契約を成立させた場合において、当該宅地の引渡しの時期について重要事項説明書に記載して説明を行ったときは、その内容を37条書面に記載する必要はない。","Aが自ら売主として宅地建物取引業者である買主と建物の売買契約を締結した場合、37条書面に宅地建物取引士をして記名させる必要はない。","Aが自ら売主として宅地の売買契約を締結した場合、代金についての金銭の貸借のあっせんに関する定めがある場合における当該あっせんに係る金銭の貸借が成立しないときの措置については、37条書面に記載する必要はない。"],"exp":["1 ○ 建物の貸借の媒介では、借賃の額並びに支払の時期・方法を37条書面に必ず記載し、各当事者に交付しなければならない（37条2項2号・5項）。→正しい＝正解","2 × 引渡しの時期は37条書面の記載事項（37条2項1号・1項4号）。重要事項説明書に記載・説明しても、37条書面への記載は省略できない。","3 × 37条書面には宅建士をして記名させなければならない（37条3項）。相手方が宅建業者でも省略できない。","4 × 金銭貸借のあっせんの定めがあるときは、あっせんが不成立の場合の措置を37条書面に記載しなければならない（37条1項9号・4項）。"]},{"id":37,"cat":"宅建業法","title":"報酬計算","ans":3,"q":"宅地建物取引業者A（消費税課税事業者）が売主B（消費税課税事業者）からB所有の土地付建物の媒介の依頼を受け、買主Cとの間で売買契約を成立させた場合、AがBから受領できる報酬の上限額は、次のうちどれか。なお、土地付建物の代金は6,600万円（うち、土地代金は4,400万円）で、消費税額及び地方消費税額を含むものとする。","choices":["1,980,000円","2,046,000円","2,178,000円","2,244,000円"],"exp":["土地代金には消費税が課されないため、建物代金のみを税抜きにする。(2,200万円÷1.1)＝2,000万円、＋土地4,400万円＝6,400万円が報酬計算の基礎。","課税事業者なので報酬上限＝(6,400万円×3％＋6万円)×1.1＝2,178,000円。","→③（2,178,000円）が正解。"]},{"id":38,"cat":"宅建業法","title":"業務上の規制","ans":2,"q":"宅地建物取引業者Aが行う業務に関する次の記述のうち、宅地建物取引業法の規定に違反するものはいくつあるか。\n\nア Aは、自ら売主として、建物の売買契約を締結するに際し、買主が手付金を持ち合わせていなかったため手付金の分割払いを提案し、買主はこれに応じた。\n\nイ Aは、建物の販売に際し、勧誘の相手方から値引きの要求があったため、広告に表示した販売価格から100万円値引きすることを告げて勧誘し、売買契約を締結した。\n\nウ Aは、土地の売買の媒介に際し重要事項の説明の前に、宅地建物取引士ではないAの従業者をして媒介の相手方に対し、当該土地の交通等の利便の状況について説明させた。\n\nエ Aは、投資用マンションの販売に際し、電話で勧誘を行ったところ、勧誘の相手方から「購入の意思がないので二度と電話をかけないように」と言われたことから、電話での勧誘を諦め、当該相手方の自宅を訪問して勧誘した。","choices":["一つ","二つ","三つ","四つ"],"exp":["ア 違反する 手付の分割受領も「信用の供与」に該当し、これにより契約締結を誘引する行為は禁止（業法47条3号）。","イ 違反しない 代金の値引きは「信用の供与」に該当しない。","ウ 違反しない 土地の交通等の利便の状況は重要事項説明の対象外。宅建士でない従業者に説明させても違反しない。","エ 違反する 相手方が契約しない旨の意思を表示したのに勧誘を継続することは禁止（47条の2第3項、規則16条の11）。","→違反するのはア・エの二つ。②が正解。"]},{"id":39,"cat":"宅建業法","title":"宅建士","ans":1,"q":"宅地建物取引業法に規定する宅地建物取引士に関する次の記述のうち、正しいものはどれか。","choices":["都道府県知事は、その登録を受けている宅地建物取引士が、他人に自己の名義の使用を許し、その他人がその名義を使用して宅地建物取引士である旨の表示をしたとき、当該宅地建物取引士に対し、必要な指示をすることができる。","宅地建物取引業者は、10戸以上の一団の建物の分譲について案内所を設置して行う場合、その案内所において業務に従事する者の数に対する宅地建物取引士の数の割合が5分の1以上の成年者である専任の宅地建物取引士を置かなければならない。","宅地建物取引業者の従業者である宅地建物取引士は、本人の同意がある場合を除き、正当な理由がある場合でも、宅地建物取引業の業務を補助したことについて知り得た秘密を他に漏らしてはならない。","宅地建物取引士Aは、甲県知事から事務の禁止の処分を受け、宅地建物取引士証を甲県知事に提出したが、禁止処分の期間が満了した場合は、返還の請求がなくても、甲県知事は、直ちに宅地建物取引士証をAに返還しなければならない。"],"exp":["1 ○ 宅建士が名義使用を許し士証を貸与するなどして他人が宅建士である旨を表示したときは、指示処分を受けることがある（業法68条1項2号）。→正しい＝正解","2 × 案内所で契約・申込みを受けるときの専任宅建士は1名以上でよい（31条の3第1項）。「業務従事者の5分の1以上」ではない。","3 × 従業者は正当な理由があれば秘密を漏らせる（守秘義務、75条の3）。正当な理由には本人の同意のほか裁判の証人になる場合等がある。「本人の同意がある場合を除き」は誤り。","4 × 事務禁止処分で提出された士証は、禁止期間満了後、提出者から返還請求があったときに返還すればよい（22条の2第8項）。「直ちに返還」は誤り。"]},{"id":40,"cat":"宅建業法","title":"監督処分","ans":2,"q":"宅地建物取引業者A（甲県知事免許）に対する監督処分に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはどれか。","choices":["Aが、乙県の区域内の業務に関し乙県知事から受けた業務停止の処分に違反した場合でも、乙県知事は、Aの免許を取り消すことはできない。","Aが、乙県の区域内の業務に関し乙県知事から指示を受け、その指示に従わなかった場合でも、甲県知事は、Aに対し業務停止の処分をすることはできない。","Aが、甲県の区域内の業務に関し甲県知事から指示を受け、その指示に従わなかった場合で、情状が特に重いときであっても、国土交通大臣は、Aの免許を取り消すことはできない。","Aの取締役が宅地建物取引業の業務に関し、建築基準法の規定に違反したとして罰金刑に処せられた場合、甲県知事は、Aに対して必要な指示をすることができる。"],"exp":["1 ○ 免許の取消しは免許権者のみができる（業法66条）。乙県知事はAの免許を取り消せない。","2 × 免許権者は、指示に従わない宅建業者に業務停止処分ができる（65条2項3号）。免許権者である甲県知事はAに業務停止処分ができる。→誤り＝正解","3 ○ 指示に従わず情状が特に重いときは免許取消処分事由に該当するが（66条1項9号）、取消しは免許権者のみ。国土交通大臣はAの免許を取り消せない。","4 ○ 取締役が業務に関し建築基準法に違反し宅建業者として不適当と認められるときは、免許権者は必要な指示ができる（65条1項3号）。"]},{"id":41,"cat":"宅建業法","title":"手付・損害賠償額の予定","ans":4,"q":"宅地建物取引業者Aが、自ら売主として宅地建物取引業者でない買主Bとの間で宅地の売買契約を締結した場合における次の記述のうち、民法及び宅地建物取引業法の規定並びに判例によれば、正しいものはどれか。","choices":["当事者の債務不履行を理由とする契約の解除に伴う損害賠償の予定額を定めていない場合、損害賠償の請求額は売買代金の額を超えてはならない。","当事者の債務不履行を理由とする契約の解除に伴う損害賠償の予定額を売買代金の2割とし、違約金の額を売買代金の1割とする定めは、これらを合算した額が売買代金の3割を超えていないことから有効である。","Aが、当該売買契約の解除を行う場合は、Bに対して「手付の倍額を現実に提供して、契約を解除する。」という意思表示を書面で行うことのみをもって、契約を解除することができる。","Aは、当該売買契約の締結日にBから手付金を受領し、翌日、Bから内金を受領した。その2日後、AがBに対して、手付の倍額を現実に提供することにより契約解除の申出を行った場合、Bは、契約の履行に着手しているとしてこれを拒むことができる。"],"exp":["1 × 損害賠償額の予定・違約金の定めがないときは、代金の額と無関係に、実際の損害額を証明して請求できる。上限（代金の2/10）は定めを置く場合の制限（業法38条1項）。","2 × 損害賠償額の予定＋違約金の合算が代金の2/10を超える定めは、超える部分についてのみ無効（業法38条2項）。全体が無効ではない。","3 × 売主が手付解除するには、買主に手付の倍額を現実に提供する必要がある（業法39条2項、民法557条）。書面での意思表示のみでは手付解除できない。","4 ○ 解約手付による解除は相手方が履行に着手するまでに行う必要がある。買主Bが内金（中間金）を支払うなど履行に着手している以上、売主Aは手付解除できず、Bはこれを拒める。→正しい＝正解"]},{"id":42,"cat":"宅建業法","title":"クーリング・オフ","ans":4,"q":"宅地建物取引業者Aが、自ら売主として、宅地建物取引業者ではない個人Bとの間で宅地の売買契約を締結し、手付金を支払ったBが、宅地建物取引業法第37条の2の規定に基づくいわゆるクーリング・オフにより、当該売買契約を契約締結の日の翌日に解除しようとしている。この場合に関する次の記述のうち、誤っているものはどれか。","choices":["Aがクーリング・オフについて告げるときに交付すべき書面には、Aの商号又は名称及び住所並びに免許証番号の記載は必要であるが、Aの宅地建物取引士の記名は必要ない。","Bが、自らの申出により、Bの勤務する会社の事務所において、宅地の買受けの申込み及びAとの売買契約の締結をした場合、Bは、クーリング・オフによる当該売買契約の解除を行うことができない。","Bが、自らの申出により、喫茶店において、宅地の買受けの申込み及びAとの売買契約の締結をした場合、Bは、クーリング・オフによる当該売買契約の解除を行うことができる。","Bは、自らの申出により、Bが融資を受ける銀行（宅地建物取引業者ではない。）において、宅地の買受けの申込み及びAとの売買契約の締結をした場合、クーリング・オフによる当該売買契約の解除を行うことができない。"],"exp":["1 ○ クーリング・オフを告げる書面には商号・住所・免許証番号等の記載が必要だが、宅建士の記名は不要（規則16条の6）。","2 ○ 買主が自らの申出により自宅又は勤務先で買受けを申し込んだ場合は、クーリング・オフできない（規則16条の5第2号）。","3 ○ 喫茶店はクーリング・オフができない「事務所等」に当たらないので、買受けを申し込んでもクーリング・オフできる。","4 × 買主が申し出た銀行も「事務所等」に当たらないので、クーリング・オフできる。「できない」は誤り。→誤り＝正解"]},{"id":43,"cat":"宅建業法","title":"自ら売主制限（総合）","ans":3,"q":"宅地建物取引業者Aが、自ら売主として、宅地建物取引業者でないBとの間で建物の売買契約を締結する場合における次の記述のうち、民法及び宅地建物取引業法の規定によれば、正しいものはどれか。","choices":["Cが建物の所有権を有している場合、AはBとの間で当該建物の売買契約を締結してはならない。ただし、AがCとの間で、すでに当該建物を取得する契約（当該建物を取得する契約の効力の発生に一定の条件が付されている。）を締結している場合は、この限りではない。","Aは、Bとの間における建物の売買契約において、「Bが、契約不適合担保責任を追及するためのその不適合をAに通知する期間は、建物の引渡しの日から1年間とする」旨の特約を付した。この場合、当該特約は無効となり、BがAに対して契約不適合である旨の通知をすべき期間は、当該引渡しの日から2年間となる。","Aは、Bから喫茶店で建物の買受けの申込みを受け、翌日、同じ喫茶店で当該建物の売買契約を締結した際に、その場で契約代金の2割を受領するとともに、残代金は5日後に決済することとした。契約を締結した日の翌日、AはBに当該建物を引き渡したが、引渡日から3日後にBから宅地建物取引業法第37条の2の規定に基づくクーリング・オフによる契約の解除が書面によって通知された。この場合、Aは、契約の解除を拒むことができない。","AB間の建物の売買契約における「宅地建物取引業法第37条の2の規定に基づくクーリング・オフによる契約の解除の際に、AからBに対して損害賠償を請求することができる」旨の特約は有効である。"],"exp":["1 × 停止条件付きで取得する契約では、自ら売主となる売買契約を締結できない（業法33条の2第1号）。","2 × 契約不適合の通知期間を「引渡しから2年以上」とする特約は有効だが、本肢の「1年間」は買主に不利で無効。無効の結果、民法の「不適合を知った時から1年以内に通知」が適用され、「引渡しから2年間」にはならない。","3 ○ 引渡し＋代金全部の支払でクーリング・オフができなくなるが、本肢は残代金支払日の前日に書面で解除通知しているため、Aは解除を拒めない。→正しい＝正解","4 × クーリング・オフが行われた場合、宅建業者は損害賠償・違約金を請求できず（業法37条の2第1項）、これに反する買主に不利な特約は無効（同4項）。"]},{"id":44,"cat":"宅建業法","title":"重要事項説明・書面交付","ans":2,"q":"宅地建物取引業者が行う宅地建物取引業法第35条に規定する重要事項の説明及び書面の交付に関する次の記述のうち、正しいものはどれか。なお、説明の相手方は宅地建物取引業者ではないものとする。","choices":["宅地建物取引業者ではない売主に対しては、買主に対してと同様に、宅地建物取引士をして、契約締結時までに重要事項を記載した書面を交付して、その説明をさせなければならない。","重要事項の説明及び書面の交付は、取引の相手方の自宅又は勤務する場所等、宅地建物取引業者の事務所以外の場所において行うことができる。","宅地建物取引業者が代理人として売買契約を締結し、建物の購入を行う場合は、代理を依頼した者に対して重要事項の説明をする必要はない。","重要事項の説明を行う宅地建物取引士は専任の宅地建物取引士でなくてもよいが、書面に記名する宅地建物取引士は専任の宅地建物取引士でなければならない。"],"exp":["1 × 重要事項の説明は、売買では買主のみ、貸借では借主のみに対して行う（業法35条）。売主には説明不要。","2 ○ 重要事項説明を行う場所に定めはなく、事務所以外の場所でも行える。→正しい＝正解","3 × 宅建業者が代理して売買契約を締結するときは、代理を依頼した者（買主）に重要事項を説明しなければならない（35条1項）。","4 × 重要事項説明を行う宅建士も、書面に記名する宅建士も、専任である必要はない（35条5項参照）。"]},{"id":45,"cat":"宅建業法","title":"住宅瑕疵担保履行法","ans":4,"q":"特定住宅瑕疵担保責任の履行の確保等に関する法律に基づく住宅販売瑕疵担保保証金の供託又は住宅販売瑕疵担保責任保険契約の締結に関する次の記述のうち、正しいものはどれか。","choices":["宅地建物取引業者は、自ら売主として宅地建物取引業者である買主との間で新築住宅の売買契約を締結し、その住宅を引き渡す場合、住宅販売瑕疵担保保証金の供託又は住宅販売瑕疵担保責任保険契約の締結を行う義務を負う。","自ら売主として新築住宅を販売する宅地建物取引業者は、住宅販売瑕疵担保保証金の供託をする場合、宅地建物取引業者でない買主へのその住宅の引渡しまでに、買主に対し、保証金を供託している供託所の所在地等について記載した書面を交付又は買主の承諾を得て電磁的方法による提供をして説明しなければならない。","自ら売主として新築住宅を宅地建物取引業者でない買主に引き渡した宅地建物取引業者は、基準日に係る住宅販売瑕疵担保保証金の供託及び住宅販売瑕疵担保責任保険契約の締結の状況について届出をしなければ、当該基準日以後、新たに自ら売主となる新築住宅の売買契約を締結することができない。","住宅販売瑕疵担保責任保険契約を締結している宅地建物取引業者は、当該保険に係る新築住宅に、構造耐力上主要な部分及び雨水の浸入を防止する部分の瑕疵（構造耐力又は雨水の浸入に影響のないものを除く。）がある場合に、特定住宅販売瑕疵担保責任の履行によって生じた損害について保険金を請求することができる。"],"exp":["1 × 資力確保措置（保証金供託又は保険契約）の義務を負うのは、宅建業者でない買主に新築住宅を売る場合。買主が宅建業者なら資力確保措置は不要（履行法2条7項2号ロ・11条）。","2 × 供託所の所在地等の書面交付・説明は「売買契約を締結するまでに」行う（履行法15条・10条2項）。「引渡しまでに」ではない。","3 × 届出をしないと新たな売買契約が禁止されるのは、基準日の「翌日から起算して50日を経過した日」以後（履行法13条）。「基準日以後」ではない。","4 ○ 保険契約を締結している宅建業者は、特定住宅販売瑕疵担保責任を履行したとき、その損害を塡補するため保険金を請求できる（履行法2条7項2号イ）。→正しい＝正解"]}],"2":[],"3":[],"4":[],"5":[]};
const SETLABEL = {"1":"第1回","2":"第2回","3":"第3回","4":"第4回","5":"第5回"};
const CATS=["権利関係","法令上の制限","税その他","宅建業法"];
const CATLABEL={"権利関係":"権利関係（民法等）","法令上の制限":"法令上の制限","税その他":"税・その他","宅建業法":"宅建業法"};
const CATCLS={"権利関係":"c1","法令上の制限":"c2","税その他":"c3","宅建業法":"c4"};
const KEY="takkenhonshiken";
let curSet="1";
let db=load();
function load(){ try{const d=JSON.parse(localStorage.getItem(KEY)); if(d&&d.rec) return d;}catch(e){} return {rec:{}}; }
function save(){ try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){} }
function rkey(set,id){ return set+"-"+id; }
function rec(set,id){ return db.rec[rkey(set,id)]||null; }
function QS(){ return SETS[curSet]||[]; }
function getById(id){ return QS().find(q=>q.id===id); }

let quiz={list:[],i:0,correct:0,wrongIds:[],answered:false,single:false,exam:false,picks:{},t0:0,timer:null};
const app=document.getElementById("app");
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function fmt(ms){const s=Math.floor(ms/1000);const m=Math.floor(s/60);return m+":"+String(s%60).padStart(2,"0");}

function header(){
  const qs=QS();
  const total=qs.length;
  const ok=qs.filter(q=>{const r=rec(curSet,q.id);return r&&r.last==="o";}).length;
  const pct=total?ok/total*100:0;
  return '<header><div class="brand">宅建 本試験 過去問模試<small>出る順・全5回</small></div>'+
  '<div class="goal"><div class="lbl"><span>ゴール：全問を「直近○」にする（'+SETLABEL[curSet]+'）</span><b>'+ok+' / '+total+'</b></div>'+
  '<div class="bar"><i style="width:'+pct+'%"></i></div></div></header>';
}

function tabs(){
  let h='<div class="tabs">';
  Object.keys(SETLABEL).forEach(s=>{
    const has=(SETS[s]&&SETS[s].length>0);
    const cls='tab'+(s===curSet?' on':'')+(has?'':' dis');
    h+='<button class="'+cls+'" '+(has?'onclick="pickSet(\''+s+'\')"':'disabled')+'>'+SETLABEL[s]+(has?'':'（準備中）')+'</button>';
  });
  h+='</div>';
  return h;
}
function pickSet(s){ curSet=s; home(); }

function home(){
  const qs=QS();
  let html=header()+tabs();
  if(!qs.length){
    html+='<div class="note" style="margin-top:16px">'+SELABEL_note()+'</div>';
    html+=footerBoxes();
    app.innerHTML=html; window.scrollTo(0,0); return;
  }
  const ngList=qs.filter(q=>{const r=rec(curSet,q.id);return r&&r.last==="x";});
  const newCount=qs.filter(q=>!rec(curSet,q.id)).length;
  html+='<div class="modes" style="margin-top:12px">'+
  '<button class="btn primary" onclick="startAll()">全'+qs.length+'問 順番に解く</button>'+
  '<button class="btn gold" onclick="startExam()">本番モード（時間を計って一気に）</button>'+
  '<div class="row2" style="margin-top:0">'+
  '<button class="btn line" onclick="startWrong()" '+(ngList.length?'':'disabled')+'>×だけ潰す ('+ngList.length+')</button>'+
  '<button class="btn line" onclick="startNew()" '+(newCount?'':'disabled')+'>未回答だけ ('+newCount+')</button>'+
  '</div></div>';
  CATS.forEach(cat=>{
    const cqs=qs.filter(q=>q.cat===cat);
    if(!cqs.length) return;
    html+='<div class="cathead"><h3>'+CATLABEL[cat]+'<span>'+cqs.length+'問</span></h3>'+
    '<button onclick="startCat(\''+cat+'\')">通しで解く</button></div>';
    cqs.forEach(q=>{
      const r=rec(curSet,q.id);
      const cls=r?(r.last==="o"?"ok":"ng"):"";
      const mark=r?(r.last==="o"?"○":"×"):"—";
      const cnt=r?('<b>'+r.a+'</b>回<br><b class="o">○'+r.o+'</b> <b class="x">×'+r.x+'</b>'):'未回答';
      html+='<button class="qrow '+cls+'" onclick="startOne('+q.id+')">'+
      '<span class="st">'+mark+'</span>'+
      '<span class="tt"><b>問'+q.id+'　'+esc(q.title)+'</b><span>'+CATLABEL[cat]+'</span></span>'+
      '<span class="cnt">'+cnt+'</span></button>';
    });
  });
  html+=footerBoxes();
  app.innerHTML=html;
  const vta=document.getElementById("vta"); if(vta) vta.value=buildVerifyText();
  window.scrollTo(0,0);
}
function SELABEL_note(){ return SETLABEL[curSet]+'の問題はまだ登録されていません。追加され次第ここに表示されます。'; }

function footerBoxes(){
  let h='<h2>端末間の同期（PC⇔スマホ）</h2>'+
  '<div class="gptbox"><p>進めた端末で「同期コードをコピー」→ もう一方の端末で「取り込み」に貼り付けると、全回の解答記録がそのまま移る。</p>'+
  '<button class="btn line" id="syncbtn" onclick="copySync()">同期コードをコピー</button>'+
  '<button class="btn soft" style="margin-top:8px" onclick="importSync()">同期コードを取り込み</button></div>';
  if(QS().length){
    h+='<h2>GPTで検証（'+SETLABEL[curSet]+'）</h2>'+
    '<div class="gptbox"><p>この回の全問＋正解＋解説を検証プロンプト付きでコピー。GPTに貼って読み込みミスがないかチェック。</p>'+
    '<button class="btn line" id="cpbtn" onclick="copyVerify()">検証用テキストをコピー</button>'+
    '<button class="btn soft" style="margin-top:8px" onclick="toggleVerify()">テキストを表示/非表示</button>'+
    '<textarea id="vta" readonly></textarea></div>';
  }
  h+='<button class="btn soft" style="margin-top:14px" onclick="resetSet()">この回（'+SETLABEL[curSet]+'）の記録をリセット</button>'+
  '<footer>データはこの端末のブラウザ内に保存</footer>';
  return h;
}
function resetSet(){ if(confirm(SETLABEL[curSet]+'の解答記録を消す？')){ QS().forEach(q=>{delete db.rec[rkey(curSet,q.id)];}); save(); home(); } }

function startAll(){ run(QS().map(q=>q.id),false,false); }
function startCat(cat){ run(QS().filter(q=>q.cat===cat).map(q=>q.id),false,false); }
function startWrong(){ run(QS().filter(q=>{const r=rec(curSet,q.id);return r&&r.last==="x";}).map(q=>q.id),false,false); }
function startNew(){ run(QS().filter(q=>!rec(curSet,q.id)).map(q=>q.id),false,false); }
function startOne(id){ run([id],true,false); }
function startExam(){ if(confirm(SETLABEL[curSet]+' 全'+QS().length+'問を本番モードで解く。途中で正解・解説は出ません。始める？')) run(QS().map(q=>q.id),false,true); }
function run(list,single,exam){
  if(!list.length)return;
  stopTimer();
  quiz={list:list.slice(),i:0,correct:0,wrongIds:[],answered:false,single:single,exam:exam,picks:{},t0:Date.now(),timer:null};
  if(exam){ quiz.timer=setInterval(tick,1000); }
  renderQ();
}
function stopTimer(){ if(quiz.timer){clearInterval(quiz.timer);quiz.timer=null;} }
function tick(){ const el=document.getElementById("tm"); if(el) el.textContent="⏱ "+fmt(Date.now()-quiz.t0); }
function getQ(){ return getById(quiz.list[quiz.i]); }

function renderQ(){
  const q=getQ();
  quiz.answered=false;
  const r=rec(curSet,q.id);
  const pct=Math.round(quiz.i/quiz.list.length*100);
  let top='<div class="qtop" style="margin-top:14px"><span class="chip '+CATCLS[q.cat]+'">'+CATLABEL[q.cat]+'　問'+q.id+'</span>';
  if(quiz.exam){ top+='<span class="timer" id="tm">⏱ '+fmt(Date.now()-quiz.t0)+'</span><span class="qnum">'+(quiz.i+1)+' / '+quiz.list.length+'</span>'; }
  else if(!quiz.single){ top+='<span class="qnum">'+(quiz.i+1)+' / '+quiz.list.length+'</span>'; }
  top+='</div>';
  const hist=(!quiz.exam&&r)?('<div class="qhist">これまで <b>'+r.a+'回</b>解いて <b class="o">○'+r.o+'</b> / <b class="x">×'+r.x+'</b></div>'):(!quiz.exam?'<div class="qhist">初挑戦</div>':'');
  const pbar=(quiz.single?'':'<div class="pbar"><i style="width:'+pct+'%"></i></div>');
  app.innerHTML=header()+top+pbar+hist+
  '<div class="qtext">'+esc(q.q)+'</div>'+
  q.choices.map((c,idx)=>'<button class="choice" id="ch'+idx+'" onclick="answer('+idx+')"><span class="no">'+(idx+1)+'</span><span>'+esc(c)+'</span></button>').join('')+
  '<div id="after"></div>'+
  '<button class="btn soft" style="margin-top:6px" onclick="leaveQuiz()">'+(quiz.exam?'中断して一覧へ':'一覧に戻る')+'</button>';
  window.scrollTo(0,0);
}
function leaveQuiz(){ stopTimer(); home(); }

function answer(idx){
  if(quiz.answered) return;
  const q=getQ();
  const okAns=q.ans-1;
  const good=(idx===okAns);
  // record stats (both modes)
  const k=rkey(curSet,q.id);
  const r=db.rec[k]||{a:0,o:0,x:0};
  r.a++; good?r.o++:r.x++; r.last=good?"o":"x";
  db.rec[k]=r; save();
  quiz.picks[q.id]=idx;
  if(good) quiz.correct++; else quiz.wrongIds.push(q.id);
  if(quiz.exam){
    // mark pick, brief, auto-advance
    const el=document.getElementById("ch"+idx); if(el){el.classList.add("pick");}
    q.choices.forEach((c,i2)=>{const e=document.getElementById("ch"+i2); if(e)e.disabled=true;});
    setTimeout(()=>{ if(quiz.i===quiz.list.length-1){ examResult(); } else { quiz.i++; renderQ(); } }, 180);
    return;
  }
  quiz.answered=true;
  q.choices.forEach((c,i2)=>{
    const el=document.getElementById("ch"+i2);
    el.disabled=true;
    if(i2===okAns) el.classList.add("sel-ok");
    else if(i2===idx) el.classList.add("sel-ng");
    else el.classList.add("dim");
  });
  let nextBtns;
  if(quiz.single){
    const ids=QS().map(x=>x.id); const pos=ids.indexOf(q.id); const nid=(pos>=0&&pos<ids.length-1)?ids[pos+1]:null;
    nextBtns=(nid?'<button class="btn primary" onclick="startOne('+nid+')">次の問題（問'+nid+'）</button>':'')+
    '<button class="btn soft" style="margin-top:8px" onclick="home()">一覧に戻る</button>';
  }else{
    const last=(quiz.i===quiz.list.length-1);
    nextBtns='<button class="btn primary" onclick="'+(last?'result()':'next()')+'">'+(last?'結果を見る':'次の問題へ')+'</button>';
  }
  document.getElementById("after").innerHTML=
  '<div class="verdict '+(good?'ok':'ng')+'">'+(good?'正解！':'不正解…　正解は '+q.ans)+'</div>'+
  '<div class="exp"><div class="hd">解説</div>'+q.exp.map(e=>'<p>'+esc(e)+'</p>').join('')+'</div>'+nextBtns;
  document.getElementById("after").scrollIntoView({behavior:"smooth",block:"start"});
}
function next(){ quiz.i++; renderQ(); }
function result(){
  stopTimer();
  const n=quiz.list.length;
  const missHtml=quiz.wrongIds.length?
  '<div class="rlist">'+quiz.wrongIds.map(id=>{const q=getById(id);return '<button class="rrow ng" onclick="reviewOne('+id+')"><span class="st">×</span><span class="tt"><b>問'+id+'　'+esc(q.title)+'</b><span>正解 '+q.ans+'・タップで解説</span></span></button>';}).join('')+'</div>':'';
  app.innerHTML=header()+
  '<div class="score"><b>'+quiz.correct+'<span style="font-size:20px;color:var(--sub)"> / '+n+'</span></b><br><span>'+(quiz.correct===n?'全問正解。仕上がってる。':'×を潰せば勝ち。')+'</span></div>'+
  missHtml+
  '<div class="modes" style="margin-top:18px">'+
  (quiz.wrongIds.length?'<button class="btn primary" onclick="retryWrong()">今の間違いだけやり直す</button>':'')+
  '<button class="btn soft" onclick="home()">一覧に戻る</button>'+
  '</div>';
  window.scrollTo(0,0);
}
function examResult(){
  stopTimer();
  const n=quiz.list.length;
  const elapsed=Date.now()-quiz.t0;
  const rows=quiz.list.map(id=>{
    const q=getById(id); const pick=quiz.picks[id]; const good=(pick===q.ans-1);
    return '<button class="rrow '+(good?'ok':'ng')+'" onclick="reviewOne('+id+')"><span class="st">'+(good?'○':'×')+'</span><span class="tt"><b>問'+id+'　'+esc(q.title)+'</b><span>'+CATLABEL[q.cat]+'・あなた '+(pick==null?'-':pick+1)+' / 正解 '+q.ans+'</span></span></button>';
  }).join('');
  app.innerHTML=header()+
  '<div class="score"><b>'+quiz.correct+'<span style="font-size:20px;color:var(--sub)"> / '+n+'</span></b><span class="tm">所要時間 '+fmt(elapsed)+'　（本試験目安 50問120分）</span></div>'+
  '<div class="modes" style="margin-top:14px">'+
  (quiz.wrongIds.length?'<button class="btn primary" onclick="retryWrong()">間違い（'+quiz.wrongIds.length+'問）だけやり直す</button>':'')+
  '<button class="btn soft" onclick="home()">一覧に戻る</button></div>'+
  '<h2>全問の結果（タップで解説）</h2><div class="rlist">'+rows+'</div>';
  window.scrollTo(0,0);
}
function reviewOne(id){
  const q=getById(id); const pick=quiz.picks[id];
  const okAns=q.ans-1;
  app.innerHTML=header()+
  '<div class="qtop" style="margin-top:14px"><span class="chip '+CATCLS[q.cat]+'">'+CATLABEL[q.cat]+'　問'+q.id+'　'+esc(q.title)+'</span></div>'+
  '<div class="qtext">'+esc(q.q)+'</div>'+
  q.choices.map((c,idx)=>{
    let cls='choice';
    if(idx===okAns) cls+=' sel-ok';
    else if(pick!=null&&idx===pick) cls+=' sel-ng';
    else cls+=' dim';
    return '<div class="'+cls+'"><span class="no">'+(idx+1)+'</span><span>'+esc(c)+'</span></div>';
  }).join('')+
  '<div class="verdict '+(pick===okAns?'ok':'ng')+'">'+(pick===okAns?'正解！':'正解は '+q.ans)+'</div>'+
  '<div class="exp"><div class="hd">解説</div>'+q.exp.map(e=>'<p>'+esc(e)+'</p>').join('')+'</div>'+
  '<button class="btn soft" onclick="backToResult()">結果一覧に戻る</button>';
  window.scrollTo(0,0);
}
function backToResult(){ if(quiz.exam) examResult(); else result(); }
function retryWrong(){ run(quiz.wrongIds.slice(),false,false); }

function syncCode(){ return "HK1."+btoa(unescape(encodeURIComponent(JSON.stringify(db.rec)))); }
function copySync(){
  const t=syncCode();
  const done=()=>{const b=document.getElementById("syncbtn");b.textContent="コピーした！もう一方の端末で取り込み";b.classList.add("copied");setTimeout(()=>{b.textContent="同期コードをコピー";b.classList.remove("copied");},2500);};
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done).catch(()=>{prompt("このコードをコピーして",t);}); }
  else{ prompt("このコードをコピーして",t); }
}
function importSync(){
  const t=prompt("同期コードを貼り付けて");
  if(!t) return;
  const s=t.trim();
  if(s.indexOf("HK1.")!==0){ alert("コードの形式が違う"); return; }
  try{
    const rec=JSON.parse(decodeURIComponent(escape(atob(s.slice(4)))));
    if(typeof rec!=="object"||rec===null) throw 0;
    if(!confirm("この端末の記録をコードの内容で置き換える？")) return;
    db.rec=rec; save(); home();
    alert("同期完了");
  }catch(e){ alert("読み込めなかった。コードをもう一度コピーして試して"); }
}

function buildVerifyText(){
  const qs=QS();
  let t="以下は宅建（本試験）過去問模試の書き起こしです（"+SETLABEL[curSet]+"／全"+qs.length+"問）。\n";
  t+="OCRの読み間違い・選択肢の脱落・「正解」や解説の誤りがないか、1問ずつ検証してください。\n";
  t+="特に、正解番号が問題文・選択肢と整合しているか、最新の法改正と矛盾しないかを重点的に確認し、怪しい箇所は問番号を挙げて指摘してください。\n\n";
  qs.forEach(q=>{
    t+="====================\n【問"+q.id+"】"+CATLABEL[q.cat]+"／"+q.title+"\n"+q.q+"\n\n";
    q.choices.forEach((c,i)=>{ t+=(i+1)+". "+c+"\n"; });
    t+="\n正解："+q.ans+"\n解説：\n";
    q.exp.forEach(e=>{ t+="・"+e+"\n"; });
    t+="\n";
  });
  return t;
}
function copyVerify(){
  const t=buildVerifyText();
  const done=()=>{const b=document.getElementById("cpbtn");b.textContent="コピーした！GPTに貼り付けてOK";b.classList.add("copied");setTimeout(()=>{b.textContent="検証用テキストをコピー";b.classList.remove("copied");},2500);};
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done).catch(()=>{fallbackCopy(t);done();}); }
  else{ fallbackCopy(t); done(); }
}
function fallbackCopy(t){
  const ta=document.getElementById("vta"); if(!ta)return; ta.style.display="block"; ta.value=t; ta.select();
  try{document.execCommand("copy");}catch(e){}
}
function toggleVerify(){
  const ta=document.getElementById("vta");
  ta.style.display = ta.style.display==="block"?"none":"block";
}
home();
</script>
</body>
</html>
