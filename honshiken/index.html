証金分担金（事務所ごとに30万円）を保証協会に納付する（業法64条の9第2項）。営業保証金の供託ではない。","3 ○ 一部の事務所廃止による分担金返還の場合は、還付請求権者に対する公告は不要（業法64条の11第4項参照）。→正しい＝正解","4 × 還付充当金を通知を受けた日から2週間以内に納付しないときは、催告なしに社員の地位を失う（業法64条の10第3項）。"]},{"id":33,"cat":"宅建業法","title":"建物状況調査","ans":4,"q":"宅地建物取引業法第34条の2第1項第4号に規定する建物状況調査（以下この問において「建物状況調査」という。）に関する次の記述のうち、誤っているものはどれか。","choices":["建物状況調査とは、建物の構造耐力上主要な部分又は雨水の浸入を防止する部分として国土交通省令で定めるものの状況の調査であって、経年変化その他の建物に生じる事象に関する知識及び能力を有する者として国土交通省令で定める者が実施するものをいう。","宅地建物取引業者が建物状況調査を実施する者のあっせんを行う場合、建物状況調査を実施する者は建築士法第2条第1項に規定する建築士であって国土交通大臣が定める講習を修了した者でなければならない。","既存住宅の売買の媒介を行う宅地建物取引業者が売主に対して建物状況調査を実施する者のあっせんを行った場合、宅地建物取引業者は売主から報酬とは別にあっせんに係る料金を受領することはできない。","既存住宅の貸借の媒介を行う宅地建物取引業者は、宅地建物取引業法第37条の規定により交付すべき書面に建物の構造耐力上主要な部分等の状況について当事者の双方が確認した事項を記載しなければならない。"],"exp":["1 ○ 建物状況調査は、構造耐力上主要な部分・雨水の浸入を防止する部分の状況の調査で、国土交通省令で定める者が実施するもの（業法34条の2第1項4号、規則15条の8）。","2 ○ 建物状況調査を実施する者は、建築士であって国土交通大臣が定める講習を修了した者でなければならない（規則15条の8第1項）。","3 ○ あっせんは媒介業務の一環であり、あっせんに係る料金を別途受領することはできない（解釈・運用の考え方）。","4 × 建物状況調査の結果の概要等を37条書面に記載するのは「売買・交換」の場合。貸借の媒介では記載不要（業法37条2項参照）。→誤り＝正解"]},{"id":34,"cat":"宅建業法","title":"契約締結の制限","ans":3,"q":"次の記述のうち、宅地建物取引業法の規定に違反しないものの組合せとして、正しいものはどれか。なお、この問において「建築確認」とは、建築基準法第6条第1項の確認をいうものとする。\n\nア 宅地建物取引業者Aは、建築確認の済んでいない建築工事完了前の賃貸住宅の貸主Bから当該住宅の貸借の媒介を依頼され、取引態様を媒介と明示して募集広告を行った。\n\nイ 宅地建物取引業者Cは、建築確認の済んでいない建築工事完了前の賃貸住宅の貸主Dから当該住宅の貸借の代理を依頼され、代理人として借主Eとの間で当該住宅の賃貸借契約を締結した。\n\nウ 宅地建物取引業者Fは、自己の所有に属しない宅地について、自ら売主として、宅地建物取引業者Gと売買契約の予約を締結した。\n\nエ 宅地建物取引業者Hは、農地の所有者Iと建物の敷地に供するため農地法第5条の許可を条件とする売買契約を締結したので、自ら売主として宅地建物取引業者ではない個人JとI所有の農地の売買契約を締結した。","choices":["ア、イ","ア、エ","イ、ウ","ウ、エ"],"exp":["ア 違反する 建築確認前は、貸借の代理・媒介であっても広告をしてはならない（業法33条）。","イ 違反しない 建築確認前でも「貸借」の契約締結は制限されない（業法36条は売買・交換のみ）。","ウ 違反しない 相手方が宅建業者Gであれば、自己の所有に属しない宅地の売買（予約を含む）の制限は適用されない（業法78条2項）。","エ 違反する 農地法5条の許可を停止条件とする契約では、業者が物件を取得する契約が「停止条件付き」であるため、自ら売主として非業者Jと契約できない（業法33条の2第1号）。","→違反しないのはイ・ウ。③が正解。"]},{"id":35,"cat":"宅建業法","title":"重要事項説明（35条）","ans":4,"q":"宅地建物取引業者Aが、マンションの分譲に際して行う宅地建物取引業法第35条の規定に基づく重要事項の説明に関する次の記述のうち、正しいものはどれか。なお、説明の相手方は宅地建物取引業者ではないものとする。","choices":["当該マンションの建物又はその敷地の一部を特定の者にのみ使用を許す旨の規約の定めがある場合、Aは、その内容だけでなく、その使用者の氏名及び住所について説明しなければならない。","建物の区分所有等に関する法律第2条第4項に規定する共用部分に関する規約がまだ案の段階である場合、Aは、規約の設定を待ってから、その内容を説明しなければならない。","当該マンションの建物の計画的な維持修繕のための費用の積立を行う旨の規約の定めがある場合、Aは、その内容を説明すれば足り、既に積み立てられている額については説明する必要はない。","当該マンションの建物の計画的な維持修繕のための費用を特定の者にのみ減免する旨の規約の定めがある場合、Aは、買主が当該減免対象者であるか否かにかかわらず、その内容を説明しなければならない。"],"exp":["1 × 特定の者にのみ使用を許す旨の規約の定めがあるときは、その内容を説明すれば足り、使用者の氏名・住所まで説明する必要はない（規則16条の2第4号）。","2 × 規約が案の段階であっても、その案の内容を説明しなければならない（業法35条1項6号、規則16条の2）。","3 × 維持修繕費用の積立ての規約の定めがあるときは、その内容に加え、既に積み立てられている額も説明しなければならない（規則16条の2第6号）。","4 ○ 維持修繕費用を特定の者にのみ減免する旨の規約の定めがあるときは、買主が減免対象かどうかにかかわらずその内容を説明しなければならない（規則16条の2第5号）。→正しい＝正解"]},{"id":36,"cat":"宅建業法","title":"重要事項説明（貸借）","ans":4,"q":"宅地建物取引業者が建物の貸借の媒介を行う場合における宅地建物取引業法第35条に規定する重要事項の説明に関する次の記述のうち、正しいものはどれか。なお、説明の相手方は宅地建物取引業者ではないものとする。","choices":["当該建物が住宅の品質確保の促進等に関する法律第5条第1項に規定する住宅性能評価を受けた新築住宅であるときは、その旨を説明しなければならない。","当該建物が既存の建物であるときは、既存住宅に係る住宅の品質確保の促進等に関する法律第6条第3項に規定する建設住宅性能評価書の保存の状況について説明しなければならない。","当該建物が既存の建物である場合、石綿使用の有無の調査結果の記録がないときは、石綿使用の有無の調査を自ら実施し、その結果について説明しなければならない。","当該建物が建物の区分所有等に関する法律第2条第1項に規定する区分所有権の目的であるものであって、同条第3項に規定する専有部分の用途その他の利用の制限に関する規約の定めがあるときは、その内容を説明しなければならない。"],"exp":["1 × 住宅性能評価を受けた新築住宅である旨の説明は「売買・交換」の場合の説明事項。貸借では不要（規則16条の2の3）。","2 × 建設住宅性能評価書の保存の状況は「売買・交換」の場合の説明事項。貸借では不要。","3 × 石綿使用の有無の調査結果の記録があるときはその内容を説明するが、記録がないときに自ら調査を実施する義務はない（規則16条の4の3第4号）。","4 ○ 区分所有建物の貸借では、専有部分の用途その他の利用の制限に関する規約の定めがあるときは、その内容を説明しなければならない（規則16条の4の3第2号）。→正しい＝正解"]},{"id":37,"cat":"宅建業法","title":"37条書面","ans":2,"q":"宅地建物取引業者A社が宅地建物取引業法第37条の規定により交付すべき書面（以下この問において「37条書面」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものの組合せはどれか。なお、この問においては、電磁的方法により提供する場合を考慮しないものとする。\n\nア A社は、建物の貸借に関し、自ら貸主として契約を締結した場合に、その相手方に37条書面を交付しなければならない。\n\nイ A社は、建物の売買に関し、その媒介により契約が成立した場合に、当該売買契約の各当事者のいずれに対しても、37条書面を交付しなければならない。\n\nウ A社は、建物の売買に関し、その媒介により契約が成立した場合に、天災その他不可抗力による損害の負担に関する定めがあるときは、その内容を記載した37条書面を交付しなければならない。\n\nエ A社は、建物の売買に関し、自ら売主として契約を締結した場合に、その相手方が宅地建物取引業者であれば、37条書面を交付する必要はない。","choices":["ア、イ","イ、ウ","ウ、エ","ア、エ"],"exp":["ア × 自ら貸主となる賃貸借契約は「取引」に当たらず、宅建業法は適用されない。37条書面の交付は不要。","イ ○ 媒介により売買契約が成立したときは、契約の各当事者に37条書面を交付しなければならない（業法37条1項）。","ウ ○ 天災その他不可抗力による損害の負担（危険負担）に関する定めがあるときは、その内容を37条書面に記載しなければならない（業法37条1項10号）。","エ × 相手方が宅建業者であっても、37条書面の交付は省略できない（業法78条2項の適用除外に37条は含まれない）。","→正しいのはイ・ウ。②が正解。"]},{"id":38,"cat":"宅建業法","title":"報酬","ans":1,"q":"宅地建物取引業者A（消費税課税事業者）は貸主Bから建物の貸借の媒介の依頼を受け、宅地建物取引業者C（消費税課税事業者）は借主Dから建物の貸借の媒介の依頼を受け、BとDの間での賃貸借契約を成立させた。この場合における次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはどれか。なお、1か月分の借賃は9万円（消費税等相当額を含まない。）である。また、長期の空家等の貸借の媒介又は代理における特例については考慮しないものとする。","choices":["建物を店舗として貸借する場合、当該賃貸借契約において200万円の権利金（権利設定の対価として支払われる金銭であって返還されないものをいい、消費税等相当額を含まない。）の授受があるときは、A及びCが受領できる報酬の限度額の合計は220,000円である。","AがBから49,500円の報酬を受領し、CがDから49,500円の報酬を受領した場合、AはBの依頼によって行った広告の料金に相当する額を別途受領することができない。","Cは、Dから報酬をその限度額まで受領できるほかに、法第35条の規定に基づく重要事項の説明を行った対価として、報酬を受領することができる。","建物を居住用として貸借する場合、当該賃貸借契約において100万円の保証金（Dの退去時にDに全額返還されるものとする。）の授受があるときは、A及びCが受領できる報酬の限度額の合計は110,000円である。"],"exp":["1 ○ 居住用建物以外（店舗）の貸借で権利金の授受があるときは、権利金を売買代金とみなして計算できる。200万円×5%＝10万円、×1.1＝11万円がA・Cそれぞれの上限で、合計220,000円。→正しい＝正解","2 × 依頼者の依頼によって行った広告の料金は、報酬とは別に受領できる（報酬告示第11）。","3 × 重要事項説明は媒介業務の一環であり、その対価として報酬とは別に金銭を受領することはできない。","4 × 保証金は退去時に全額返還されるため権利金とみなせない。居住用建物の貸借の報酬上限は双方合計で借賃1か月分＋消費税＝99,000円（承諾がある場合の配分の問題）で、110,000円ではない。"]},{"id":39,"cat":"宅建業法","title":"従業者証明書・名簿・帳簿","ans":1,"q":"宅地建物取引業法に規定する宅地建物取引士証、従業者証明書、従業者名簿、帳簿及び標識に関する次の記述のうち、誤っているものはどれか。","choices":["宅地建物取引業者の従業者は、宅地建物取引業者が発行する従業者証明書をその業務に従事する間、常に携帯し、取引の関係者から請求があったときは、従業者証明書を提示しなければならないが、従業者が宅地建物取引士である場合は、宅地建物取引士証の提示をもってこれに代えることができる。","宅地建物取引業者は、その事務所ごとに従業者名簿を備え、取引の関係者から請求があったときは、当該名簿をその者の閲覧に供しなければならないが、当該名簿を事務所のパソコンのハードディスクに記録し、ディスプレイの画面に表示する方法で閲覧に供することもできる。","宅地建物取引業者は、その事務所ごとにその業務に関する帳簿を備え、取引のあったつど、所定の事項を記載しなければならないが、当該帳簿の記載事項を事務所のパソコンのハードディスクに記録し、必要に応じ当該事務所においてパソコンやプリンタを用いて紙面に印刷することが可能な環境を整えることで、当該帳簿への記載に代えることができる。","宅地建物取引業者は、売主として一団の宅地建物の分譲を当該物件から約500m離れた駅前に案内所を設置して行う場合、当該物件の所在する場所及び案内所のそれぞれに、免許証番号、主たる事務所の所在地等の所定の事項を記載した標識を掲示しなければならない。"],"exp":["1 × 従業者証明書の携帯・提示義務は宅建士であっても免除されず、宅建士証の提示では代えられない（業法48条1項・2項）。→誤り＝正解","2 ○ 従業者名簿は事務所ごとに備え、請求があれば閲覧に供する。電磁的記録による備付け・画面表示による閲覧も認められる（業法48条3項・4項、規則17条の2第3項）。","3 ○ 帳簿も電磁的記録で備えることができ、必要に応じ紙面に印刷できる環境を整えていれば記載に代えられる（業法49条、規則18条2項）。","4 ○ 一団の宅地建物の分譲では、物件の所在する場所と案内所のそれぞれに標識を掲示しなければならない（業法50条1項、規則19条1項2号・3号）。"]},{"id":40,"cat":"宅建業法","title":"手付・自ら売主制限","ans":1,"q":"宅地建物取引業者Aが、自ら売主として、宅地建物取引業者でないBと建物の売買契約を締結する場合に関する次の記述のうち、宅地建物取引業法（以下この問において「法」という。）及び民法の規定によれば、正しいものはどれか。","choices":["Bが契約の履行に着手するまでにAが売買契約の解除をするには、手付の3倍に当たる額をBに現実に提供しなければならないとの特約を定めることができる。","Aの違約によりBが受け取る違約金を売買代金の額の10分の3とするとの特約を定めることができる。","Bから法第37条の2の規定に基づくいわゆるクーリング・オフによる売買契約の解除があった場合でも、Aが契約の履行に着手していれば、AはBに対して、それに伴う損害賠償を請求することができる。","Bが契約不適合担保責任を追及するための通知期間として、引渡しの日から2年で、かつ、Bが契約不適合を発見した時から30日以内とする特約を定めることができる。"],"exp":["1 ○ 買主が履行に着手するまでは、売主は手付の倍額を現実に提供して解除できる（業法39条2項）。買主に有利な「3倍」の特約は買主に不利ではないので有効。→正しい＝正解","2 × 損害賠償額の予定・違約金の合算は代金の10分の2を超えられない（業法38条1項）。10分の3の特約は超える部分が無効。","3 × クーリング・オフによる解除の場合、宅建業者は損害賠償・違約金を請求できない（業法37条の2第1項）。","4 × 契約不適合の通知期間は「引渡しの日から2年以上」とする特約のみ有効（業法40条1項）。「発見した時から30日以内」は買主に不利で無効。"]},{"id":41,"cat":"宅建業法","title":"クーリング・オフ","ans":1,"q":"宅地建物取引業者Aが自ら売主として締結した建物の売買契約について、買主が宅地建物取引業法第37条の2の規定に基づき売買契約の解除をする場合に関する次の記述のうち、正しいものはどれか。","choices":["宅地建物取引業者でない買主Bは、建物の物件の説明を自宅で受ける申し出を行い、自宅でこの説明を受け、即座に買受けを申し込んだ。後日、勤務先の近くのホテルのロビーで売買契約を締結した場合、Bは売買契約の解除はできない。","宅地建物取引業者でない買主Cは、建物の物件の説明をAの事務所で受け、翌日、出張先から電話で買受けを申し込んだ。後日、勤務先の近くの喫茶店で売買契約を締結した場合、Cは売買契約の解除はできない。","宅地建物取引業者である買主Dは、建物の物件の説明をAの事務所で受けた。後日、Aの事務所近くの喫茶店で買受けを申し込むとともに売買契約を締結した場合、Dは売買契約の解除はできる。","宅地建物取引業者でない買主Eから売買契約の解除があった場合で、この契約の解除が法的要件を満たし、かつ、Aが手付金を受領しているとき、Aは契約に要した費用を手付金から控除して返還することができる。"],"exp":["1 ○ 買主が自ら申し出た自宅は「事務所等」に当たり、そこで買受けの申込みをした場合はクーリング・オフできない（規則16条の5第2号）。→正しい＝正解","2 × 事務所で説明を受けても、買受けの申込みを電話（事務所等以外）で行っているため、クーリング・オフできる。","3 × 買主Dが宅建業者であれば、そもそも自ら売主制限（クーリング・オフ）の規定は適用されない（業法78条2項）。解除はできない。","4 × クーリング・オフの場合、宅建業者は速やかに手付金その他の金銭を全額返還しなければならず、費用を控除できない（業法37条の2第3項）。"]},{"id":42,"cat":"宅建業法","title":"他人物売買の制限","ans":4,"q":"宅地建物取引業者Aが自ら売主となって宅地建物の売買契約を締結した場合に関する次の記述のうち、宅地建物取引業法の規定に違反するものはどれか。なお、この問において、AとC以外の者は宅地建物取引業者でないものとする。","choices":["Bの所有する宅地について、BとCが売買契約を締結し、所有権の移転登記がなされる前に、CはAに転売し、Aは更にDに転売した。","Aの所有する土地付建物について、Eが賃借していたが、Aは当該土地付建物を停止条件付でFに売却した。","Gの所有する宅地について、AはGと売買契約の予約をし、Aは当該宅地をHに転売した。","Iの所有する宅地について、AはIと停止条件付で取得する売買契約を締結し、その条件が成就する前に当該物件についてJと売買契約を締結した。"],"exp":["1 違反しない BC間で売買契約が締結されている以上、Cは物件を取得する契約を締結済み。AはCから取得する契約を締結しているので、Dへの転売は適法（業法33条の2第1号）。","2 違反しない Aが所有する物件なので「自己の所有に属しない物件」に当たらない。停止条件付きで売却しても差し支えない。","3 違反しない AはGと売買契約の「予約」を締結しており、これは物件を取得する契約に含まれる（業法33条の2第1号かっこ書）。Hへの転売は適法。","4 違反する 停止条件付きで取得する契約は「物件を取得する契約」に含まれない（業法33条の2第1号かっこ書）。条件成就前にJと売買契約を締結するのは違反。→正解"]},{"id":43,"cat":"宅建業法","title":"監督処分","ans":1,"q":"宅地建物取引業者A（甲県知事免許）に対する監督処分に関する次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはどれか。","choices":["Aは、自らが売主となった分譲マンションの売買において、法第35条に規定する重要事項の説明を行わなかった。この場合、Aは、甲県知事から業務停止を命じられることがある。","Aは、乙県内で宅地建物取引業に関する業務において、著しく不当な行為を行った。この場合、乙県知事は、Aに対し、業務停止を命ずることはできない。","Aは、甲県知事から指示処分を受けたが、その指示処分に従わなかった。この場合、甲県知事は、Aに対し、1年を超える期間を定めて、業務停止を命ずることができる。","Aは、自ら所有している物件について、直接賃借人Bと賃貸借契約を締結するに当たり、法第35条に規定する重要事項の説明を行わなかった。この場合、Aは、甲県知事から業務停止を命じられることがある。"],"exp":["1 ○ 重要事項説明を行わなかった場合、免許権者である甲県知事は業務停止を命じることができる（業法65条2項2号）。→正しい＝正解","2 × 業務地の都道府県知事も、その区域内の業務に関し業務停止を命じることができる（業法65条4項）。乙県知事も命じられる。","3 × 業務停止処分の期間は1年以内（業法65条2項柱書）。1年を超える期間は定められない。","4 × 自ら貸借は「取引」に当たらず宅建業法が適用されないため、重要事項説明義務はなく監督処分の対象にもならない。"]},{"id":44,"cat":"宅建業法","title":"宅建士・取引士証","ans":4,"q":"宅地建物取引業法（以下この問において「法」という。）に規定する宅地建物取引士及び宅地建物取引士証に関する次の記述のうち、正しいものはどれか。","choices":["宅地建物取引業者は、20戸以上の一団の分譲建物の売買契約の申込みのみを受ける案内所を設置し、売買契約の締結は事務所で行う場合、当該案内所には専任の宅地建物取引士を置く必要はない。","未成年者は、成年者と同一の行為能力を有していたとしても、成年に達するまでは宅地建物取引士の登録を受けることができない。","宅地建物取引士は、法第35条の規定による重要事項説明を行うにあたり、相手方から請求があった場合にのみ、宅地建物取引士証を提示すればよい。","宅地建物取引士資格試験に合格した日から1年以内に宅地建物取引士証の交付を受けようとする者は、登録をしている都道府県知事の指定する講習を受講する必要はない。"],"exp":["1 × 申込みのみを受ける案内所であっても、専任の宅建士を1人以上置かなければならない（業法31条の3第1項、規則15条の5の2第3号）。","2 × 未成年者でも、成年者と同一の行為能力を有していれば宅建士の登録を受けられる（業法18条1項1号）。","3 × 重要事項説明を行うときは、請求の有無にかかわらず宅建士証を提示しなければならない（業法35条4項）。","4 ○ 試験合格の日から1年以内に宅建士証の交付を受けようとする者は、法定講習の受講が免除される（業法22条の2第2項但書）。→正しい＝正解"]},{"id":45,"cat":"宅建業法","title":"住宅瑕疵担保履行法","ans":4,"q":"宅地建物取引業者Aが自ら売主として、宅地建物取引業者でない買主Bに新築住宅を販売する場合における次の記述のうち、特定住宅瑕疵担保責任の履行の確保等に関する法律の規定によれば、正しいものはどれか。","choices":["Bが建設業者である場合、Aは、Bに引き渡した新築住宅について、住宅販売瑕疵担保保証金の供託又は住宅販売瑕疵担保責任保険契約の締結を行う義務を負わない。","Aは、基準日に係る住宅販売瑕疵担保保証金の供託及び住宅販売瑕疵担保責任保険契約の締結の状況について届出をしなければ、当該基準日から3週間を経過した日以後、新たに自ら売主となる新築住宅の売買契約を締結してはならない。","Aは、住宅販売瑕疵担保保証金の供託をする場合、Bに対する供託所の所在地等について記載した書面の交付（電磁的方法による提供を含む。）及び説明を、Bに新築住宅を引き渡すまでに行えばよい。","Aが住宅販売瑕疵担保保証金を供託する場合、当該住宅の床面積が55㎡以下であるときは、新築住宅の合計戸数の算定に当たって、2戸をもって1戸と数えることになる。"],"exp":["1 × 買主が建設業者でも、宅建業者でなければ資力確保措置の義務を負う。免除されるのは買主が宅建業者の場合（履行法2条7項2号ロ）。","2 × 届出をしないと新たな売買契約が禁止されるのは、基準日の翌日から起算して50日を経過した日以後（履行法13条）。「3週間」ではない。","3 × 供託所の所在地等の書面交付・説明は「売買契約を締結するまでに」行う（履行法15条）。引渡しまででは遅い。","4 ○ 床面積55㎡以下の住宅は、合計戸数の算定に当たって2戸をもって1戸と数える（履行法11条3項、施行令6条）。→正しい＝正解"]}],"3":[],"4":[{"id":1,"cat":"権利関係","title":"意思表示","ans":4,"q":"Aが、Bの欺罔行為によって、A所有の建物をCに売却する契約をした場合に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。","choices":["Aは、Bが欺罔行為をしたことを、Cが知っているとき又は知ることができたときでないと、売買契約の取消しをすることができない。","AがCに所有権移転登記を済ませ、CがAに代金を完済した後、詐欺による有効な取消しがなされたときには、登記の抹消と代金の返還は同時履行の関係になる。","Aは、詐欺に気が付いていたが、契約に基づき、異議を留めることなく所有権移転登記手続をし、代金を請求していた場合、詐欺による取消しをすることはできない。","Cが当該建物を、詐欺について善意無過失のDに転売して所有権移転登記を済ませても、Aは詐欺による取消しをして、Dから建物の返還を求めることができる。"],"exp":["1 ○ AはBの欺罔行為、つまり詐欺によってCと売買契約を結んでいることから、いわゆる第三者の詐欺の問題である。そして、第三者の詐欺によって意思表示をした場合、その意思表示の相手方が、その詐欺の事実を知らず、又は知ることができなかったときはその意思表示を取り消すことができないが、知っていたとき又は知ることができたときは取り消すことができる（民法96条2項）。よって、本肢は正しい。","2 ○ 売買契約を詐欺を理由として取り消した場合、その契約は初めからなかったものとなるので、契約当事者は、互いに相手方に対して、すでに受け取った物を返還する義務を負う（民法121条、121条の2第1項）。この場合における、当事者の義務は、同時履行の関係にある（判例、民法533条本文）。したがって、Cに移転された登記の抹消とAが受け取った代金の返還は、同時履行の関係になる。よって、本肢は正しい。","3 ○ 本肢のAのように、詐欺に気が付いていても、異議を留めることなく契約の全部もしくは一部の履行をし、又は相手方に履行の請求をしたときは、追認をしたものとみなされる（法定追認、民法125条1号、2号）。したがって、Aは、詐欺による取消しをすることができない。よって、本肢は正しい。","4 × 詐欺による意思表示の取消しは善意かつ無過失の第三者に対抗不可。詐欺による意思表示の取消しは、善意かつ無過失の第三者に対抗することができない（民法96条3項）。したがって、Bの詐欺を理由としてAが取消しをしても、Aは、善意無過失のDから建物の返還を求めることはできない。よって、本肢は誤りであり、本問の正解肢となる。"]},{"id":2,"cat":"権利関係","title":"請負","ans":2,"q":"AがBに対して建物の建築工事を代金3,000万円で注文し、Bがこれを完成させた。この場合に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","choices":["請負契約の目的物たる建物に種類・品質に関する契約内容の不適合がある場合において、目的物の修補が可能であれば、AはBに対して損害賠償請求を行う前に、修補を請求しなければならない。","請負契約の目的物たる建物に種類・品質に関する契約内容の不適合があるためにこれを建て替えざるを得ない場合には、Aは当該建物の建替えに要する費用相当額の損害賠償を請求することができる。","請負契約の目的物たる建物に種類・品質に関する契約内容の不適合があり、修補に要する費用が契約代金を超える場合には、Aは請負契約を解除することができない。","請負契約の目的物たる建物の種類・品質に関する契約内容の不適合について、Bが担保責任を負わない旨の特約をした場合には、Aは当該建物の契約不適合についてBの責任を一切追及することができなくなる。"],"exp":["1 × 損害賠償請求する前に修補請求する必要はない。注文者が請負人に対して契約不適合責任を追及する場合、目的物の修補とともに損害賠償を請求することができる（民法559条、562条、564条）。よって、本肢は誤り。","2 ○ 請負契約の目的物たる建物に種類・品質に関する契約内容の不適合がある場合、注文者は請負人に対して損害賠償請求をすることができる（民法559条、564条、415条1項）。したがって、請負目的物である建物に建て替えざるを得ない契約不適合が存在する場合、注文者は請負人に対し、建物の建替え費用相当額の損害賠償を請求することができる。よって、本肢は正しく、本問の正解肢となる。","3 × 注文者は請負契約を解除することができる。請負契約の目的物たる建物に種類・品質に関する契約内容の不適合があり、修補に要する費用が契約代金を超える場合にも、注文者は請負契約を解除することができる（民法559条、564条、541条）。よって、本肢は誤り。","4 × 担保責任を負わない旨の特約をしても責任追及しうる。請負人が担保責任を負わない旨の特約をしているときであっても、請負人が知りながら告げなかった事実については担保責任を免れることはできない（民法559条、572条）。したがって、一切責任を追及することができなくなるわけではない。よって、本肢は誤り。"]},{"id":3,"cat":"権利関係","title":"債務不履行・解除","ans":1,"q":"AはBに甲建物を売却し、AからBに対する所有権移転登記がなされた。AB間の売買契約の解除と第三者との関係に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","choices":["BがBの債権者Cとの間で甲建物につき抵当権設定契約を締結し、その設定登記をした後、AがAB間の売買契約を適法に解除した場合、Aはその抵当権の消滅をCに主張できない。","Bが甲建物をDに賃貸し引渡しも終えた後、AがAB間の売買契約を適法に解除した場合、Aはこの賃借権の消滅をDに主張できる。","BがBの債権者Eとの間で甲建物につき抵当権設定契約を締結したが、その設定登記をする前に、AがAB間の売買契約を適法に解除し、その旨をEに通知した場合、BE間の抵当権設定契約は無効となり、Eの抵当権は消滅する。","AがAB間の売買契約を適法に解除したが、AからBに対する甲建物の所有権移転登記を抹消する前に、Bが甲建物をFに賃貸し引渡しも終えた場合、Aは、適法な解除後に設定されたこの賃借権の消滅をFに主張できる。"],"exp":["1 ○ 売買契約が解除された場合でも、第三者は、登記などの対抗要件を備えていれば保護される（判例）。したがって、Aは抵当権設定登記を備えたCに抵当権の消滅を主張できない。よって、本肢は正しく、本問の正解肢となる。","2 × Aは建物の引渡しを受けたDには主張できない。売買契約が解除された場合でも、第三者は、登記などの対抗要件を備えていれば保護される（判例）。そして、建物賃貸借では、建物の引渡しをもって、第三者への対抗要件となる（借地借家法31条）。したがって、Aは、建物の引渡しを受けているDに賃借権の消滅を主張できない。よって、本肢は誤り。","3 × 抵当権設定行為が無効となるわけではない。売買契約が解除された場合でも、第三者は、登記などの対抗要件を備えていれば保護される（判例）。ただし、第三者が対抗要件を備えていなくても、契約そのものが無効になるわけではない。よって、本肢は誤り。","4 × Aは建物の引渡しを受けたFには主張できない。売買契約を解除した者と解除後に権利を取得した第三者とは、対抗関係に立つ（民法177条、判例）。したがって、Aは、建物の引渡しを受けているFに賃借権の消滅を主張できない。よって、本肢は誤り。"]},{"id":4,"cat":"権利関係","title":"賃貸借","ans":1,"q":"土地の転貸借に関する次の1から4までの記述のうち、民法の規定、判例及び下記判決文によれば、誤っているものはどれか。\n（判決文）\n　土地の賃借人が賃貸人の承諾を得ることなく右土地を他に転貸しても、転貸について賃貸人に対する背信行為と認めるに足りない特段の事情があるため賃貸人が民法第612条第2項により賃貸借を解除することができない場合において、賃貸人が賃借人（転貸人）と賃貸借を合意解除しても、これが賃借人の賃料不払等の債務不履行があるため賃貸人において法定解除権の行使ができるときにされたものである等の事情のない限り、賃貸人は、転借人に対して右合意解除の効果を対抗することができず、したがって、転借人に対して賃貸土地の明渡を請求することはできないものと解するのが相当である。","choices":["土地の賃借人が無断転貸した場合において賃貸人に対する背信行為と認めるに足りない特段の事情があるため賃貸人が無断転貸を理由に賃貸借契約を解除できないときであっても、賃貸借契約を合意解除したときは、賃貸人は転借人に対して賃貸土地の明渡しを請求することができる。","土地の賃貸人が転貸借について承諾を与えた場合には、賃貸人は、無断転貸を理由としては賃貸借契約を解除することはできないが、賃借人と賃貸借契約を合意解除することは可能である。","土地の賃借人が無断転貸した場合、賃貸人は、賃貸借契約を民法第612条第2項により解除できる場合とできない場合があり、土地の賃借人が賃料を支払わない場合にも、賃貸人において法定解除権を行使できる場合とできない場合がある。","土地の賃借人が無断転貸した場合、転借人は、賃貸人と賃借人との間で賃貸借契約が合意解除されたとしても、賃貸人からの賃貸土地の明渡し請求を拒絶することができる場合がある。"],"exp":["1 × 明渡しを請求できない。判決文は、承諾なき転貸（無断転貸）があっても、転貸について背信行為と認めるに足りない特段の事情があるため、賃貸人が民法612条2項による解除をすることができない場合において、賃貸人が賃借人と賃貸借を合意解除しても、特段の事情のない限り、賃貸人は転借人に対して合意解除の効果を対抗することができず、転借人に対して賃貸土地の明渡を請求することはできない、としている。しかし、本肢は、判決文の考えとは逆に、合意解除すれば土地の明渡しを請求することができるとしている。よって、本肢は誤りであり、本問の正解肢となる。","2 ○ 賃貸人の承諾がある転貸の場合には、無断転貸を理由として賃貸借契約を解除することはできない（民法612条2項参照）。よって、本肢の前半部分は正しい。また、賃貸人と賃借人が合意解除したとしても、この解除の効果は転借人に対抗できないに過ぎないのであって、賃貸人と賃借人の間で合意解除が許されなくなるわけではない（民法613条3項本文）。よって、本肢は正しい。","3 ○ 判決文は、無断転貸があっても、それが背信行為と認めるに足りない特段の事情がある場合には、民法612条により解除できない場合があることを前提としている（判例）。また、賃借人に軽微な賃料不払があっても、信頼関係を破壊するほどのものでなければ、解除することは認められないとした判例がある（判例）。よって、本肢は正しい。","4 ○ 肢1の解説で述べたように、判決文は、無断転貸があっても、賃貸人が民法612条2項による解除をすることができない場合において、賃貸人が賃借人と賃貸借を合意解除しても、特段の事情のない限り、賃貸人は転借人に対して合意解除の効果を対抗することができず、転借人に対して賃貸土地の明渡を請求することはできないとしている。よって、本肢は正しい。"]},{"id":5,"cat":"権利関係","title":"債権譲渡","ans":4,"q":"Aは、Bに対して貸付金債権を有しており、Aはこの貸付金債権をCに対して譲渡した。この場合、民法の規定及び判例によれば、次の記述のうち誤っているものはどれか。","choices":["貸付金債権に譲渡禁止特約が付いている場合で、Cが譲渡禁止特約の存在を過失なく知らないとき、BはCに対して債務の履行を拒むことはできない。","Bが債権譲渡を承諾しない場合、CがBに対して債権譲渡を通知するだけでは、CはBに対して自分が債権者であることを主張することができない。","Aが貸付金債権をDに対しても譲渡し、Cへは確定日付のない証書、Dへは確定日付のある証書によってBに通知した場合で、いずれの通知もBによる弁済前に到達したとき、Bへの通知の到達の先後にかかわらず、DがCに優先して権利を行使することができる。","Aが貸付金債権をEに対しても譲渡し、Cへは令和8年10月10日付、Eへは同月9日付のそれぞれ確定日付のある証書によってBに通知した場合で、いずれの通知もBによる弁済前に到達したとき、Bへの通知の到達の先後にかかわらず、EがCに優先して権利を行使することができる。"],"exp":["1 ○ 債権に譲渡禁止特約が付されている場合であっても、当該債権譲渡は有効である（民法466条2項）。しかし、譲渡禁止特約について悪意・重過失の譲受人その他の第三者に対しては、債務者は、その債務の履行を拒むことができ、かつ、譲渡人に対する弁済その他の債務を消滅させる事由をもってその第三者に対抗することができる（民法466条3項）。したがって、Bは譲渡禁止特約について善意・無過失のCに対して、債務の履行を拒むことができない。よって、本肢は正しい。","2 ○ 債権譲渡は、譲渡人が債務者に通知するか、又は、債務者が承諾しなければ、債務者に対抗することができない（民法467条1項）。したがって、債権譲渡の通知は債権の譲渡人であるAが行わなければならず、譲受人であるCが債務者に対して通知をしたとしても、債務者Bの承諾がない以上、Cは、Bに対して自分が債権者であることを主張することができない。よって、本肢は正しい。","3 ○ 債権が二重に譲渡された場合において、一方の譲渡の通知が確定日付のある証書によってなされ、他方の譲渡の通知が確定日付のない証書によってなされたとき、確定日付のある証書による通知が優先する（民法467条2項、判例）。したがって、確定日付のある通知がなされているDがCに優先して権利を行使することができる。よって、本肢は正しい。","4 × Bへの通知が先に到達したほうが優先する。債権が二重に譲渡された場合において、双方の譲渡の通知が確定日付のある証書によってなされたとき、譲受人相互間の優劣は、その通知が債務者に到達した日時の先後により決する（判例）。したがって、Bへの通知の到達の先後により、CとEの優劣が決することになる。よって、本肢は誤りであり、本問の正解肢となる。"]},{"id":6,"cat":"権利関係","title":"相続","ans":2,"q":"遺産分割に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","choices":["被相続人は、遺言によって遺産分割を禁止することはできず、共同相続人は、遺産分割協議によって遺産の全部又は一部の分割をすることができる。","共同相続人は、既に成立している遺産分割協議につき、その全部又は一部を全員の合意により解除した上、改めて遺産分割協議を成立させることができる。","遺産に属する預貯金債権は、相続開始と同時に当然に相続分に応じて分割され、共同相続人は、その持分に応じて、単独で預貯金債権に関する権利を行使することができる。","遺産の分割は、共同相続人の遺産分割協議が成立した時から効力を生ずるが、第三者の権利を害することはできない。"],"exp":["1 × 被相続人は、遺言によって遺産分割を禁止することができる。共同相続人は、原則として、いつでも、遺産分割協議により遺産の全部又は一部の分割をすることができる（民法907条1項）。ただし、被相続人は、遺言で、相続開始の時から5年を超えない期間を定めて、遺産の分割を禁止することができる（民法908条）。よって、本肢は誤り。","2 ○ 遺産分割の解除は、法的安定性を害することになるため、原則として認められない（判例）。ただし、共同相続人は、既に成立している遺産分割協議につき、その全部又は一部を全員の合意により解除した上、改めて遺産分割協議を成立させることはできる（判例）。よって、本肢は正しく、本問の正解肢となる。","3 × 預貯金債権は、相続開始と同時に当然に相続分に応じて分割はされない。共同相続された預貯金債権は、相続開始と同時に相続分に応じて分割されることはなく、遺産分割の対象となる（判例）。したがって、共同相続人は、持分に応じて、単独で預貯金債権に関する権利を行使することはできない。よって、本肢は誤り。なお、各共同相続人は、遺産に属する預貯金債権のうち相続開始時の債権額の3分の1に当該共同相続人の相続分を乗じた額（預貯金債権の債務者ごとに法務省令で定める額を限度とする。）については、単独でその権利を行使することができる（民法909条の2前段）。","4 × 遺産の分割は、「相続開始の時」にさかのぼってその効力を生ずる。遺産の分割は、「相続開始の時」にさかのぼってその効力を生ずる（民法909条本文）。共同相続人の「遺産分割協議が成立した時」ではない。よって、本肢は誤り。なお、第三者の権利を害することはできない、とする点は正しい（民法909条但書）。"]},{"id":7,"cat":"権利関係","title":"共有","ans":3,"q":"甲土地につき、A、B、C、Dの4人がそれぞれ4分の1の共有持分を有していて、A、B、CのいずれもDの所在を知ることができない場合に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。なお、Dの共有持分は、相続財産には属していないものとする。","choices":["甲土地に、その形状又は効用の著しい変更を伴う変更を加える場合には、共有者の過半数の同意が必要であり、本件ではA、B、C3人の同意が必要となる。","甲土地の所有権の登記名義人となっている者が所有者ではないEである場合、持分に基づいてEに対して登記の抹消を求めるためには、所在が判明しているA、B、Cのうち2人の同意が必要である。","A、B、C3人の同意があれば、甲土地を資材置場として賃借したいFとの間で期間を3年とする賃貸借契約を締結することができる。","Aが裁判所に請求して、裁判所がDの持分をAに取得させる旨の決定をした場合、Dは、その決定から3年以内に限り、Aが取得したDの共有持分の時価相当額をAに対して支払うよう請求することができる。"],"exp":["1 × 全員の同意が必要。共有物にその形状又は効用の著しい変更を伴う変更を加える場合には、共有者全員の同意が必要となる（変更行為、民法251条1項）。共有者の過半数の同意ではない。よって、本肢は誤り。","2 × 保存行為に他の共有者の同意不要。所有者でない者が登記名義人となっている登記の抹消を求めることは、保存行為となる（判例）。各共有者は、単独で、保存行為をすることができる（民法252条5項）。したがって、他の共有者の同意は必要ではない。よって、本肢は誤り。","3 ○ 一定の山林以外の土地の賃貸借等であって5年を超えないものの設定は、各共有者の持分の価格に従い、その過半数で決する（管理行為、民法252条1項、4項2号）。本肢において、共有者4人のうちABC3人の同意があれば、共有者の持分価格の過半数を満たす。よって、本肢は正しく、本問の正解肢となる。","4 × 支払請求は3年以内に限定されない。共有者が他の共有者の所在を知ることができないとき、裁判所は、共有者の請求により、その共有者に、当該所在等不明共有者の持分を取得させる旨の裁判をすることができる（民法262条の2第1項）。共有者が裁判により所在等不明共有者の持分を取得したときは、当該所在等不明共有者は、当該共有者に対し、当該共有者が取得した持分の時価相当額の支払を請求することができる（民法262条の2第4項）。しかし、支払請求が3年以内に限定されるわけではない。よって、本肢は誤り。"]},{"id":8,"cat":"権利関係","title":"物権変動","ans":1,"q":"不動産に関する物権変動の対抗要件に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。","choices":["不動産の所有権がAからB、BからC、CからDと転々譲渡された場合、Aは、Dと対抗関係にある第三者に該当する。","土地の賃借人として当該土地上に登記ある建物を所有する者は、当該土地の所有権を新たに取得した者と対抗関係にある第三者に該当する。","第三者のなした登記後に時効が完成して不動産の所有権を取得した者は、当該第三者に対して、登記を備えなくても、時効取得をもって対抗することができる。","共同相続財産につき、相続人の一人から相続財産に属する不動産につき所有権の全部の譲渡を受けて移転登記を備えた第三者に対して、他の共同相続人は、自己の持分を登記なくして対抗することができる。"],"exp":["1 × Aは、Dと対抗関係にある第三者に該当しない。不動産が転々譲渡された場合、前主と後主はそれぞれ当事者となり、対抗関係にある第三者（民法177条）の地位に立たない。よって、本肢は誤りであり、本問の正解肢となる。","2 ○ 第三者とは、当事者及びその包括承継人以外の者であって、不動産に関する物権の得喪、変更の登記欠缺を主張する正当の利益を有する者をいう（民法177条、判例）。土地の賃借人として当該土地上に登記ある建物を所有する者は、当該土地の所有権を新たに取得した者との間で、土地の使用収益について利害関係を有することから、対抗関係に立つものといえる。よって、本肢は正しい。","3 ○ 時効によって不動産の所有権を取得した者は、時効完成前に権利者から所有権を取得した者に対して、登記なくして所有権を対抗することができる（判例）。よって、本肢は正しい。","4 ○ 共同相続財産について、第三者が相続人の一人から相続財産に属する不動産につき所有権の全部の譲渡を受けて移転登記を備えたとしても、他の共同相続人の持分に関しては無権利である。それゆえ、他の共同相続人は、自己の持分につき第三者に対して、登記なくして対抗することができる（判例）。よって、本肢は正しい。"]},{"id":9,"cat":"権利関係","title":"抵当権","ans":1,"q":"①不動産質権と②抵当権に関する次の記述のうち、民法の規定によれば、誤っているものはどれか。","choices":["①では、被担保債権の利息のうち、満期となった最後の2年分についてのみ担保されるが、②では、設定行為に別段の定めがない限り、被担保債権の利息は担保されない。","①は、10年を超える存続期間を定めたときであっても、その期間は10年となるのに対し、②は、存続期間に関する制限はない。","①は、目的物の引渡しが効力の発生要件であるのに対し、②は、目的物の引渡しは効力の発生要件ではない。","①も②も不動産に関する物権であり、登記を備えなければ第三者に対抗することができない。"],"exp":["1 × 不動産質権は利息が担保されないが、抵当権は担保される。不動産質権者は、その債権の利息を請求することができない（民法358条）。抵当権者は、利息に関し、その満期となった最後の2年分についてのみ抵当権を行使することができる（民法375条1項）。よって、本肢は①についても、②についても誤りであり、本問の正解肢となる。","2 ○ 不動産質権の存続期間は10年を超えることができず、これより長い期間を定めたときであっても、その期間は10年となる（民法360条1項）。抵当権については、存続期間に関する制限はない。よって、本肢は正しい。","3 ○ 質権の設定は、債権者にその目的物を引き渡すことによって、その効力を生ずる（民法344条）。抵当権にはこのような規定はなく、引渡しは効力の発生要件ではない。よって、本肢は正しい。","4 ○ 質権も抵当権も物権であり、ともに登記が対抗要件である（民法177条、不動産登記法3条、4条参照）。よって、本肢は正しい。"]},{"id":10,"cat":"権利関係","title":"不法行為","ans":2,"q":"Aが、その過失によってB所有の建物を取り壊し、Bに対して不法行為による損害賠償債務を負担した場合に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","choices":["Aの不法行為に関し、Bにも過失があった場合でも、Aから過失相殺の主張がなければ、裁判所は、賠償額の算定に当たって、賠償金額を減額することができない。","不法行為がAの過失とCの過失による共同不法行為であった場合、Aの過失がCより軽微なときでも、Bは、Aに対して損害の全額について賠償を請求することができる。","Bが、不法行為による損害と加害者を知った時から1年間、損害賠償請求権を行使しなければ、当該請求権は消滅時効により消滅する。","Aの損害賠償債務は、BからAへ履行の請求があった時から履行遅滞となり、Bは、その時以後の遅延損害金を請求することができる。"],"exp":["1 × 過失相殺の主張がなくても、賠償金額の減額はできる。不法行為においては、裁判所は、被害者の過失を認定することができるときには、当事者が過失相殺の主張をしていなくても、損害賠償の額を定めるにあたってこれを考慮することができる（民法722条2項）。したがって、Aから過失相殺の主張がなくても、Bの過失を認定することができれば、裁判所は賠償額の算定にあたって賠償金額を減額することができる。よって、本肢は誤り。","2 ○ 数人が共同の不法行為によって他人に損害を加えたときは、各自連帯して全損害につき賠償の責任を負う（民法719条1項）。したがって、Aの過失がCより軽微であったとしても、Bは、Aに対して損害の全額について賠償を請求することができる。よって、本肢は正しく、本問の正解肢となる。","3 × 1年間ではなく、3年間である。不法行為による損害賠償請求権は、被害者又はその法定代理人が損害及び加害者を知った時から3年間行使しないと、時効により消滅する（民法724条1号）。したがって、Bが、不法行為による損害と加害者を知った時から1年間損害賠償請求権を行使しなくても、当該請求権は消滅時効により消滅しない。よって、本肢は誤り。","4 × 請求があった時ではなく、損害発生時から遅滞となる。不法行為に基づく損害賠償債務は、期限の定めのない債務であるが、被害者保護の見地から催告を待たず、損害発生と同時に遅滞に陥る（判例）。したがって、Bは損害発生以後の遅延損害金を請求することができる。よって、本肢は誤り。"]},{"id":11,"cat":"権利関係","title":"借地借家法（借地）","ans":4,"q":"Aが所有者として登記されている甲土地上に、Bが所有者として登記されている乙建物があり、CがAから甲土地を購入した場合に関する次の記述のうち、民法及び借地借家法の規定並びに判例によれば、誤っているものはどれか。","choices":["Bが甲土地を自分の土地であると判断して乙建物を建築していた場合であっても、Cは、Bに対して建物を収去して土地を明け渡すよう請求できない場合がある。","BがAとの間で甲土地の使用貸借契約を締結していた場合には、Cは、Bに対して建物を収去して土地を明け渡すよう請求できる。","BがAとの間で甲土地の借地契約を締結しており、甲土地購入後に借地権の存続期間が満了した場合であっても、Cは、Bに対して建物を収去して土地を明け渡すよう請求できない場合がある。","BがAとの間で期間を定めずに甲土地の借地契約を締結している場合には、Cは、いつでも正当事由とともに解約を申し入れて、Bに対して建物を収去して土地を明け渡すよう請求できる。"],"exp":["1 ○ Bが甲土地を自分の土地であると判断していた場合、Bは甲土地を時効により取得できる場合がある（民法162条）。この場合、CがAから甲土地を購入した時期がBの時効完成前ならば当然、Bの時効完成後であってもBが甲土地について登記を得たときは、CはBに対して甲土地の所有権を対抗できない以上、本肢のような請求をすることはできない（民法177条、判例）。よって、本肢は正しい。","2 ○ 使用貸借契約については、借地借家法の適用はない（借地借家法1条）。したがって、Bは甲土地上に自己名義で登記した建物を所有している場合であっても、その使用借権をCに対抗することはできないので、CはBに対して建物を収去して土地を明け渡すよう請求できる。よって、本肢は正しい。","3 ○ 借地権の存続期間が満了した場合であっても、借地権者が契約の更新を請求したときや、借地権者が土地の使用を継続するときは、建物がある場合に限り、契約は更新される（借地借家法5条2項）。いずれの場合でも、借地権設定者が遅滞なく異議を述べれば更新を拒絶できるが、この異議を述べるためには正当事由が必要である（借地借家法6条）。したがって、借地権設定者が正当事由を欠くため異議を述べることができないときは、借地権が存続することになり、本肢のような請求をすることはできない。よって、本肢は正しい。","4 × いつでも解約申入れできるわけではない。借地権設定契約において期間の定めがない場合、その存続期間は30年となる（借地借家法3条本文）。このことは借地権設定後当該土地を取得した者も同様である。したがって、本肢のような請求をすることはできない。よって、本肢は誤りであり、本問の正解肢となる。"]},{"id":12,"cat":"権利関係","title":"借地借家法（借家）","ans":2,"q":"Aが所有する甲建物をBに対して賃貸する場合の賃貸借契約の条項に関する次の記述のうち、民法及び借地借家法の規定によれば、誤っているものはどれか。","choices":["AB間の賃貸借契約が借地借家法第38条に規定する定期建物賃貸借契約であるか否かにかかわらず、Bの造作買取請求権をあらかじめ放棄する旨の特約は有効に定めることができる。","AB間で公正証書等の書面又は電磁的記録によって借地借家法第38条に規定する定期建物賃貸借契約を契約期間を2年として締結する場合、契約の更新がなく期間満了により終了することを書面を交付又はBの承諾を得て電磁的方法により提供をしてあらかじめBに説明すれば、期間満了前にAがBに改めて通知しなくても契約が終了する旨の特約を有効に定めることができる。","法令によって甲建物を2年後には取り壊すことが明らかである場合、取り壊し事由を記載した書面又は電磁的記録によって契約を締結するのであれば、建物を取り壊すこととなる2年後には更新なく賃貸借契約が終了する旨の特約を有効に定めることができる。","AB間の賃貸借契約が一時使用目的の賃貸借契約であって、賃貸借契約の期間を定めた場合には、Bが賃貸借契約を期間内に解約することができる旨の特約を定めていなければ、Bは賃貸借契約を中途解約することはできない。"],"exp":["1 ○ 借家人に不利な特約を無効とする借地借家法37条は、造作買取請求権を規定する33条を対象としていないので、造作買取請求権をあらかじめ放棄する旨の特約は有効である（借地借家法37条、33条参照）。この特約は、建物賃貸借契約が定期建物賃貸借契約であるか否かを問わず、有効に定めることができる。よって、本肢は正しい。","2 × あらかじめ終了する旨の通知をしなければ、終了を対抗できない。期間が1年以上の定期建物賃貸借契約においては、期間満了の1年前から6月前までの間に借家人に対する通知をしなければ、契約は終了しない（借地借家法38条6項）。そして、これに反する特約で建物の賃借人に不利なものは、無効とされる（借地借家法38条8項）。したがって、本肢の特約は無効である。よって、本肢は誤りであり、本問の正解肢となる。","3 ○ 取壊し予定建物については、建物を取り壊すべき事由を記載した書面又は電磁的記録によれば、建物を取り壊すこととなる時に賃貸借契約が終了する旨の特約を定めることができる（借地借家法39条）。よって、本肢は正しい。","4 ○ 一時使用目的の建物賃貸借契約は、民法のみが適用され、借地借家法は適用されない（借地借家法40条）。民法では、期間を定めた賃貸借契約については、期間内に解約する権利を留保しなければ、各当事者は解約の申入れをすることができない（民法618条、617条1項）。よって、本肢は正しい。"]},{"id":13,"cat":"権利関係","title":"建物区分所有法","ans":2,"q":"建物の区分所有等に関する法律に関する次の記述のうち、誤っているものはどれか。","choices":["共用部分の保存行為は、規約に別段の定めがない限り、集会の決議を経ずに各区分所有者が単独ですることができる。","共用部分の変更（その形状又は効用の著しい変更を伴わないものを除く。）は、集会が適法に開かれている場合において、区分所有者（議決権を有しないものを除く。）及び議決権の各4分の3以上の多数による集会の決議で決するが、規約でこの区分所有者の議決権を2分の1を超える割合にすることはできない。","管理者は、その職務に関して区分所有者を代理するため、その行為の効果は、規約に別段の定めがない限り、本人である各区分所有者に共用部分の持分の割合に応じて帰属する。","共用部分の管理に要した各区分所有者の費用の負担については、規約に別段の定めがない限り、共用部分の持分に応じて決まる。"],"exp":["1 ○ 共用部分の管理に関する事項のうち、保存行為については、規約に別段の定めがある場合を除き、集会の決議を経ずに各区分所有者が単独ですることができる（区分所有法18条1項但書、2項）。よって、本肢は正しい。","2 × 規約で議決権も2分の1を超える割合とすることができる。共用部分の変更（その形状又は効用の著しい変更を伴わないものを除く。）は、集会が適法に開かれた場合において、区分所有者（議決権を有しないものを除く。）及びその議決権の各4分の3以上の多数による集会の決議で決する。ただし、区分所有者（議決権を有しないものを除く。）およびその議決権の各2分の1を超える割合を規約で定めることができる（区分所有法17条1項）。よって、議決権について規約で2分の1を超える割合にすることができないとする本肢は誤りであり、本問の正解肢となる。","3 ○ 管理者は、その職務に関し、区分所有者を代理する（区分所有法26条2項）。そして、管理者がその職務の範囲内で第三者との間で行った行為の責任は、規約で別段の定めがない限り、各区分所有者が共用部分の持分割合に応じて負担する（区分所有法29条1項、14条1項）。よって、本肢は正しい。","4 ○ 各区分所有者は、規約に別段の定めがない限り、その持分に応じて、共用部分の負担を負い、共用部分から生じる利益を収取する（区分所有法19条）。したがって、共用部分の管理に要した費用についても、その持分割合に応じて負担する。よって、本肢は正しい。"]},{"id":14,"cat":"権利関係","title":"不動産登記法","ans":1,"q":"不動産の登記に関する次の記述のうち、不動産登記法の規定によれば、正しいものはどれか。","choices":["敷地権付き区分建物の表題部所有者から所有権を取得した者は、当該敷地権の登記名義人の承諾を得なければ、当該区分建物に係る所有権の保存の登記を申請することができない。","所有権に関する仮登記に基づく本登記は、登記上の利害関係を有する第三者がある場合であっても、その承諾を得ることなく、申請することができる。","債権者Aが債務者Bに代位して所有権の登記名義人CからBへの所有権の移転の登記を申請した場合において、当該登記を完了したときは、登記官は、Aに対し、当該登記に係る登記識別情報を通知しなければならない。","配偶者居住権は、登記することができる権利に含まれない。"],"exp":["1 ○ 区分建物にあっては、表題部所有者から所有権を取得した者も、所有権の保存の登記を申請することができる。この場合、当該建物が敷地権付き区分建物であるときは、当該敷地権の登記名義人の承諾を得なければならない（不登法74条2項）。よって、本肢は正しく、本問の正解肢となる。","2 × 第三者の承諾が必要である。所有権に関する仮登記に基づく本登記は、登記上の利害関係を有する第三者がある場合には、当該第三者の承諾があるときに限り、申請することができる（不登法109条1項）。よって、本肢は誤り。","3 × 代位した場合、登記識別情報は通知されない。登記官は、その登記をすることによって申請人自らが登記名義人となる場合において、当該登記を完了したときは、速やかに、当該申請人に対し、当該登記に係る登記識別情報を通知しなければならない（不登法21条本文）。登記識別情報を通知しなければならないのは、申請人「自ら」が「登記名義人となる」場合であり、代位して移転登記をした場合、その代位した者に登記識別情報を通知する必要はない。よって、本肢は誤り。","4 × 配偶者居住権は、登記をすることができる。配偶者居住権は、登記することができる権利である（不登法3条9号）。よって、本肢は誤り。なお、居住建物の所有者は、配偶者居住権を取得した配偶者に対し、配偶者居住権の設定の登記を備えさせる義務を負う（民法1031条1項）。"]},{"id":15,"cat":"法令上の制限","title":"都市計画法","ans":3,"q":"都市計画法に関する次の記述のうち、誤っているものはどれか。","choices":["都市計画区域については、用途地域が定められていない土地の区域であっても、一定の場合には、都市計画に、地区計画を定めることができる。","高度利用地区は、市街地における土地の合理的かつ健全な高度利用と都市機能の更新とを図るため定められる地区であり、用途地域内において定めることができる。","準都市計画区域においても、用途地域が定められている土地の区域については、市街地開発事業を定めることができる。","高層住居誘導地区は、住居と住居以外の用途とを適正に配分し、利便性の高い高層住宅の建設を誘導するために定められる地区であり、近隣商業地域及び準工業地域においても定めることができる。"],"exp":["1 ○ 地区計画は、建築物の建築形態、公共施設その他の施設の配置等からみて、一体としてそれぞれの区域の特性にふさわしい態様を備えた良好な環境の各街区を整備し、開発し、及び保全するための計画であり、用途地域が定められている土地の区域、用途地域が定められていない一定の土地の区域に定めることができる（都計法12条の5第1項2号）。よって、本肢は正しい。","2 ○ 高度利用地区は、土地の合理的かつ健全な高度利用と都市機能の更新とを図るため、建築物の容積率の最高限度及び最低限度、建築物の建蔽率の最高限度、建築物の建築面積の最低限度ならびに壁面の位置の制限を定める地区であり、用途地域内において定めるものである（都計法9条19項）。よって、本肢は正しい。","3 × 準都市計画区域に市街地開発事業を定めることはできない。市街地開発事業は、市街化区域又は区域区分が定められていない都市計画区域内において、一体的に開発し、又は整備する必要がある土地の区域について定めるものであり、準都市計画区域に定めることはできない（都計法13条1項13号）。よって、本肢は誤りであり、本問の正解肢となる。","4 ○ 高層住居誘導地区は、住居と住居以外の用途とを適正に配分し、利便性の高い高層住宅の建設を誘導するため、第一種住居地域、第二種住居地域、準住居地域、近隣商業地域、準工業地域で一定の容積率の定められたものの内において定める地区である（都計法9条17項）。よって、本肢は正しい。"]},{"id":16,"cat":"法令上の制限","title":"開発行為の規制等","ans":2,"q":"都市計画法に関する次の記述のうち、正しいものはどれか。ただし、許可を要する開発行為の面積について、条例による定めはないものとし、この問において「都道府県知事」とは、地方自治法に基づく指定都市、中核市及び施行時特例市にあってはその長をいうものとする。","choices":["準都市計画区域内において、工場の建築の用に供する目的で1,000㎡の土地の区画形質の変更を行おうとする者は、あらかじめ、都道府県知事の許可を受けなければならない。","市街化区域内において、農業を営む者の居住の用に供する建築物の建築の用に供する目的で1,000㎡の土地の区画形質の変更を行おうとする者は、あらかじめ、都道府県知事の許可を受けなければならない。","都市計画区域及び準都市計画区域外の区域内において、変電所の建築の用に供する目的で1,000㎡の土地の区画形質の変更を行おうとする者は、あらかじめ、都道府県知事の許可を受けなければならない。","区域区分の定めのない都市計画区域内において、遊園地の建設の用に供する目的で3,000㎡の土地の区画形質の変更を行おうとする者は、あらかじめ、都道府県知事の許可を受けなければならない。"],"exp":["1 × 準都市計画区域で開発許可が必要となる規模は3,000㎡以上である。準都市計画区域内において行う開発行為で、その規模が3,000㎡未満であるものは、開発許可が不要となる（都計法29条1項但書1号、施行令19条1項）。本肢では、準都市計画区域内でその規模が1,000㎡の開発行為であるから、都道府県知事の許可を受ける必要はない。よって、本肢は誤り。","2 ○ 市街化区域内においては、農業を営む者の居住の用に供する建築物の建築の用に供する目的で行う開発行為は、その規模が1,000㎡以上であれば、あらかじめ、都道府県知事の許可を受けなければならない（都計法29条1項但書1号、2号、施行令19条1項）。よって、本肢は正しく、本問の正解肢となる。","3 × 変電所は公益上必要な建築物であり、開発許可は不要である。駅舎その他の鉄道の施設、図書館、公民館、変電所その他これらに類する公益上必要な建築物の建築の用に供する目的で行う開発行為は、許可が不要となる（都計法29条1項但書3号）。本肢は、変電所の建築の用に供する目的で行う開発行為であるから、開発許可は不要である。よって、本肢は誤り。","4 × 3,000㎡の遊園地は、第2種特定工作物とならない。遊園地はその規模が10,000㎡以上であれば、第2種特定工作物になる（都計法4条11項、施行令1条2項1号）。本肢では、その規模が3,000㎡であるから、第2種特定工作物にはならない。したがって、開発行為に該当しないので、都道府県知事の許可を受ける必要はない。よって、本肢は誤り。"]},{"id":17,"cat":"法令上の制限","title":"建築基準法総合","ans":2,"q":"建築基準法に関する次の記述のうち、正しいものはどれか。","choices":["建築基準法の改正により、現に存する建築物が改正後の建築基準法の規定に適合しなくなった場合、当該建築物は違反建築物となり、速やかに改正後の建築基準法の規定に適合させなければならない。","事務所の用途に供する建築物を、飲食店（その床面積の合計250㎡）に用途変更する場合、建築主事等又は指定確認検査機関の確認を受けなければならない。","住宅の居室には、原則として、換気のための窓その他の開口部を設け、その換気に有効な部分の面積は、その居室の床面積に対して、25分の1以上としなければならない。","建築主事等は、建築主から建築物の確認の申請を受けた場合において、申請に係る建築物の計画が建築基準法令の規定に適合しているかを審査すれば足り、都市計画法等の建築基準法以外の法律の規定に適合しているかは審査の対象外である。"],"exp":["1 × 既存不適格建築物は違反建築物とはならない。建築基準法の改正により、現に存する建築物が建築基準法の規定に適合しなくなった場合、当該建築物に対しては、改正された建築基準法の規定は、適用しない（建基法3条2項）。これを既存不適格建築物という。したがって、当該建築物は違反建築物とはならない。よって、本肢は誤り。","2 ○ 特殊建築物への用途変更は、その用途に供する部分の床面積が200㎡を超える場合に建築確認が必要となる（建基法87条1項）。飲食店は特殊建築物であるから（建基法6条1項1号、別表第一（い）（四）、施行令115条の3第3号）、その用途に供する部分の床面積が250㎡である本問では、建築確認が必要となる。よって、本肢は正しく、本問の正解肢となる。","3 × 20分の1以上としなければならない。住宅の居室には、原則として、換気のための窓その他の開口部を設け、その換気に有効な部分の面積は、その居室の床面積に対して、20分の1以上としなければならない（建基法28条2項）。25分の1以上ではない。よって、本肢は誤り。","4 × 建築基準法以外の規定に適合しているかも審査対象である。建築主事等は、建築主からの建築物の確認の申請を受けた場合において、申請に係る建築物の計画が建築基準関係規定に適合しているかについて審査しなければならない。ここで建築基準関係規定とは、建築基準法令の規定その他建築物の敷地、構造又は建築設備に関する法律並びにこれに基づく命令及び条例の規定で政令で定めるものをいう（建基法6条1項）。都市計画法等もここに含まれる（施行令9条12号）。よって、本肢は誤り。"]},{"id":18,"cat":"法令上の制限","title":"建築基準法総合","ans":1,"q":"建築基準法（以下この問において「法」という。）に関する次の記述のうち、正しいものはどれか。","choices":["都市計画区域又は準都市計画区域内における用途地域の指定のない区域内の建築物の建ぺい率の上限値は、原則として、法で定めた数値のうち、特定行政庁が土地利用の状況等を考慮し当該区域を区分して都道府県都市計画審議会の議を経て定めるものとなる。","第二種中高層住居専用地域内では、原則として、ホテル又は旅館を建築することができる。","幅員4m以上であり、法が施行された時点又は都市計画区域若しくは準都市計画区域に入った時点で現に存在する道は、特定行政庁の指定がない限り、法上の道路とはならない。","建築物の前面道路の幅員により制限される容積率について、前面道路が2つ以上ある場合には、これらの前面道路の幅員の最小の数値（12m未満の場合に限る。）を用いて算定する。"],"exp":["1 ○ 用途地域の指定のない区域内の建築物の建蔽率の上限値は、10分の3、10分の4、10分の5、10分の6又は10分の7のうち、特定行政庁が土地利用の状況等を考慮し当該区域を区分して都道府県都市計画審議会の議を経て定める（建基法53条1項6号）。よって、本肢は正しく、本問の正解肢となる。","2 × 第二種中高層住居専用地域では、原則、ホテルも旅館も建築できない。第二種中高層住居専用地域では、原則として、ホテル又は旅館は建築できない（建基法48条4項、別表第二）。よって、本肢は誤り。","3 × 幅員4m以上のものは、原則として建築基準法上の道路である。都市計画区域及び準都市計画区域内では、幅員4m以上のものは道路である（建基法42条1項）。よって、本肢は誤り。なお、建築基準法が施行された時点又は都市計画区域もしくは準都市計画区域に入った時点で現に存在する道で、特定行政庁の指定がない限り、建築基準法上の道路にならないのは、幅員が4m未満の道の場合である（建基法42条2項）。","4 × 前面道路の幅員の最大の数値を用いる。前面道路（前面道路が2以上あるときは、その幅員の最大のもの。）の幅員が12m未満である建築物の容積率は、当該前面道路の幅員のメートルの数値に、区分に従い、その定める数値を乗じたもの以下でなければならない（建基法52条2項）。前面道路の幅員の最小の数値を用いて算定するのではない。よって、本肢は誤り。"]},{"id":19,"cat":"法令上の制限","title":"盛土規制法","ans":1,"q":"宅地造成及び特定盛土等規制法（以下この問において「法」という。）に関する次の記述のうち、誤っているものはどれか。なお、この問において「都道府県知事」とは、地方自治法に基づく指定都市及び中核市にあってはその長をいうものとし、地方自治法に基づく施行時特例市に係る経過措置については考慮しないものとする。","choices":["宅地造成等工事規制区域外に盛土によって造成された一団の造成宅地の区域において、造成された盛土の高さが5m未満の場合は、都道府県知事は、当該区域を造成宅地防災区域として指定することができない。","宅地造成等工事規制区域内において、盛土又は切土をする土地の面積が600㎡である場合、その土地における排水施設は、政令で定める資格を有する者によって設計される必要はない。","宅地造成等工事規制区域内の公共施設用地を除く土地において、高さが2mを超える擁壁を除却する工事を行おうとする者は、一定の場合を除き、その工事に着手する日の14日前までにその旨を都道府県知事に届け出なければならない。","宅地造成等工事規制区域内において、公共施設用地を宅地に転用した者は、一定の場合を除き、その転用した日から14日以内にその旨を都道府県知事に届け出なければならない。"],"exp":["1 × 5m未満でも指定できる場合がある。都道府県知事は、宅地造成又は特定盛土等（宅地において行うものに限る。）に伴う災害で相当数の居住者等に危害を生ずるものの発生のおそれが大きい一団の造成宅地（宅地造成等工事規制区域内の土地を除く。）の区域であって、一定の基準に該当するものを、造成宅地防災区域として指定することができる（盛土規制法45条1項）。そして、造成された盛土の高さが5m未満でも、盛土をした土地の面積が3,000㎡以上であり、かつ、盛土をしたことにより、当該盛土をした土地の地下水位が盛土をする前の地盤面の高さを超え、盛土の内部に浸入しているものは、造成宅地防災区域として指定できる（施行令35条1項1号イ）。よって、本肢は誤りであり、本問の正解肢となる。","2 ○ 宅地造成等工事規制区域内において宅地造成等に関する工事を行う場合、盛土又は切土をする土地の面積が1,500㎡を超える土地における排水施設の設置については、政令で定める資格を有する者の設計によらなければならない（盛土規制法13条2項、施行令21条2号）。よって、本肢は正しい。","3 ○ 宅地造成等工事規制区域内の土地（公共施設用地を除く）において、擁壁又は崖面崩壊防止施設で高さが2mを超えるものの除却工事を行おうとする者は、一定の場合を除き、その工事に着手する日の14日前までに、その旨を都道府県知事に届け出なければならない（盛土規制法21条3項、施行令26条1項）。よって、本肢は正しい。","4 ○ 宅地造成等工事規制区域内において、公共施設用地を宅地に転用した者は、一定の場合を除き、その転用した日から14日以内に、その旨を都道府県知事に届け出なければならない（盛土規制法21条4項）。よって、本肢は正しい。"]},{"id":20,"cat":"法令上の制限","title":"土地区画整理法","ans":2,"q":"土地区画整理法に関する次の記述のうち、正しいものはどれか。","choices":["組合施行の土地区画整理事業において、施行地区内の宅地について所有権を有する組合員から当該所有権の一部のみを承継した者は、当該組合員とはならない。","組合施行の土地区画整理事業において、換地処分前に、施行地区内の宅地について所有権を有する組合員から当該所有権を譲り受けた者は、当該組合の総会において賦課金徴収の議決があったときは、賦課金の納付義務を負う。","換地処分は、換地計画に係る区域の全部について土地区画整理事業の工事がすべて完了した後でなければすることができない。","組合施行の土地区画整理事業において、定款に特別の定めがある場合には、換地計画において、保留地の取得を希望する宅地建物取引業者に当該保留地に係る所有権が帰属するよう定めることができる。"],"exp":["1 × 施行地区内の宅地の所有者は組合員となる。組合が施行する土地区画整理事業に係る施行地区内の宅地について所有権又は借地権を有する者は、すべてその組合の組合員となる（区画法25条1項）。したがって、施行地区内の宅地について所有権を有する組合員から当該所有権の一部のみを承継した者も組合員となる。よって、本肢は誤り。","2 ○ 施行地区内の宅地について組合員の有する所有権の全部又は一部を承継した者がある場合においては、その組合員が組合に対して有する権利義務は、その承継した者に移転する（区画法26条1項）。よって、本肢は正しく、本問の正解肢となる。","3 × すべて完了した後に限られない。規準、規約、定款又は施行規程に別段の定めがある場合においては、換地計画に係る区域の全部について工事が完了する以前においても換地処分をすることができる（区画法103条2項但書）。よって、本肢は誤り。","4 × 保留地は施行者が取得するから、定めることはできない。換地計画において定められた保留地は、換地処分の公告があった日の翌日において、施行者が取得する（区画法104条11項）。したがって、換地計画において、保留地の取得を希望する宅地建物取引業者に、当該保留地に係る所有権が帰属するように定めることはできない。よって、本肢は誤り。"]},{"id":21,"cat":"法令上の制限","title":"農地法","ans":2,"q":"農地法（以下この問において「法」という。）に関する次の記述のうち、正しいものはどれか。","choices":["農業者が相続により取得した市街化調整区域内の農地を自己の住宅用地として転用する場合には、法第4条第1項の許可を受ける必要はない。","住宅を建設する目的で市街化区域内の農地の所有権を取得するに当たって、あらかじめ農業委員会に届け出た場合には、法第5条第1項の許可を受ける必要はない。","耕作する目的で原野の所有権を取得し、その取得後、造成して農地にする場合には、法第3条第1項の許可を受ける必要がある。","市街化調整区域内の農地を駐車場に転用するに当たって、当該農地がすでに利用されておらず遊休化している場合には、法第4条第1項の許可を受ける必要はない。"],"exp":["1 × 市街化調整区域内では4条の許可が必要である。農地を農地以外のものに転用する場合には、原則として農地法4条の許可を受けなければならない（農地法4条1項）。したがって、市街化調整区域内の農地を自己の住宅用地に転用する場合には、農地法4条の許可を受ける必要がある。よって、本肢は誤り。","2 ○ 農地を農地以外のものに転用するために取得する場合には、原則として農地法5条の許可を受けなければならない（農地法5条1項）。しかし、市街化区域内にある農地を農地以外のものに転用するために取得する場合には、あらかじめ農業委員会に届け出れば、農地法5条の許可を受ける必要はない（農地法5条1項但書6号）。よって、本肢は正しく、本問の正解肢となる。","3 × 原野は農地ではない。原野は、農地法上の農地又は採草放牧地にあたらない（農地法2条1項）。農地法3条の許可を必要とするのは、農地又は採草放牧地について所有権を移転し、又は地上権等の使用収益を目的とする権利を設定又は移転する場合であるから、原野の所有権を取得し、その後造成して農地にする場合には、農地法3条の許可を受ける必要はない（農地法3条1項）。よって、本肢は誤り。","4 × 遊休化していても農地であるから4条の許可が必要である。農地法上の「農地」とは、耕作の目的に供される土地をいい（農地法2条1項）、遊休化している農地（いわゆる休耕地）も、耕作しうる以上農地にあたる。そして、農地を農地以外のものに転用する場合には、原則として農地法4条の許可を受けなければならない（農地法4条1項）。よって、本肢は誤り。"]},{"id":22,"cat":"法令上の制限","title":"国土利用計画法","ans":1,"q":"国土利用計画法第23条の届出（以下この問において「事後届出」という。）に関する次の記述のうち、正しいものはどれか。","choices":["Aが所有する市街化区域内の1,500㎡の土地をBが購入した場合には、Bは事後届出を行う必要はないが、Cが所有する市街化調整区域内の6,000㎡の土地についてDと売買に係る予約契約を締結した場合には、Dは事後届出を行う必要がある。","Eが所有する市街化区域内の2,000㎡の土地をFが購入した場合、Fは当該土地の所有権移転登記を完了した日から起算して2週間以内に事後届出を行う必要がある。","Gが所有する都市計画区域外の15,000㎡の土地をHに贈与した場合、Hは事後届出を行う必要がある。","Iが所有する都市計画区域外の10,000㎡の土地とJが所有する市街化調整区域内の10,000㎡の土地を交換した場合、I及びJは事後届出を行う必要はない。"],"exp":["1 ○ 市街化区域内においては、2,000㎡以上の土地を購入した場合に事後届出が必要となる（国土法23条1項、2項1号イ）。したがって、Bは事後届出を行う必要はない。市街化調整区域内において、5,000㎡以上の一団の土地に関する権利を対価を得て移転又は設定する契約（予約を含む。）を締結した場合、権利取得者は、事後届出を行わなければならない（国土法23条1項、2項1号ロ、14条1項）。Dは、市街化調整区域内における6,000㎡の土地を購入する旨の予約をしているので、事後届出を行わなければならない。よって、本肢は正しく、本問の正解肢となる。","2 × 移転登記を完了した日から起算するのではない。土地売買等の契約を締結した場合、権利取得者は、その契約を締結した日から起算して2週間以内に、都道府県知事に届け出なければならない（国土法23条1項）。移転登記を完了した日から起算するのではない。よって、本肢は誤り。","3 × 贈与の場合、事後届出は不要である。事後届出が必要となる「土地売買等の契約」とは、土地に関する所有権若しくは地上権及び賃借権の移転又は設定であり、対価を得て行われる移転又は設定に限られる（国土法23条1項、14条1項、施行令5条）。贈与契約は、対価を得ていないことからこれに該当せず、事後届出は不要である。よって、本肢は誤り。","4 × 両者とも届出が必要となる。都市計画区域外においては10,000㎡以上、市街化調整区域内では5,000㎡以上の一団の土地に関する権利を、対価を得て移転又は設定する契約を締結した場合、権利取得者は、原則として事後届出をする必要がある（国土法23条1項、2項1号ロ、ハ、14条1項）。そして、土地の交換契約は、ここでいう契約に該当するので、I・J両者ともに権利取得者として事後届出をする必要がある。よって、本肢は誤り。"]},{"id":23,"cat":"税その他","title":"印紙税","ans":1,"q":"印紙税に関する次の記述のうち、正しいものはどれか。なお、以下の契約書はいずれも書面により作成されたものとする。","choices":["売主Aと買主Bが土地の譲渡契約書を3通作成し、A、B及び仲介人Cがそれぞれ1通ずつ保存する場合、当該契約書3通には印紙税が課される。","一の契約書に土地の譲渡契約（譲渡金額5,000万円）と建物の建築請負契約（請負金額6,000万円）をそれぞれ区分して記載した場合、印紙税の課税標準となる当該契約書の記載金額は1億1,000万円である。","「Dの所有する甲土地（時価2,000万円）をEに贈与する」旨を記載した贈与契約書を作成した場合、印紙税の課税標準となる当該契約書の記載金額は、2,000万円である。","当初作成の「土地を1億円で譲渡する」旨を記載した土地譲渡契約書の契約金額を変更するために作成する契約書で、「当初の契約書の契約金額を1,000万円減額し、9,000万円とする」旨を記載した変更契約書について、印紙税の課税標準となる当該変更契約書の記載金額は、1,000万円である。"],"exp":["1 ○ 土地の譲渡契約書は課税文書である（印紙税法別表第一）。そして、契約当事者以外の者に提出又は交付する一定の文書は課税文書に該当しないが、不動産売買契約における仲介人は、契約当事者以外の者には該当しないので、仲介人Cが保存する契約書も印紙税の課税対象となる（印紙税法基本通達20条）。したがって、本肢の契約書3通には印紙税が課されることになる。よって、本肢は正しく、本問の正解肢となる。","2 × 6,000万円である。印紙税法上、土地の譲渡契約書は1号文書であり、建物の建築請負契約書は2号文書である（印紙税法別表第一）。そして、一つの契約書で1号文書と2号文書の契約金額を区分することができる場合において、1号文書の契約金額が2号文書の契約金額未満であるときは、2号文書の契約金額が記載金額になる（印紙税法別表第一、課税物件表の適用に関する通則3ロ）。本肢の場合、土地の譲渡契約金額は5,000万円であり、建物の建築請負契約金額6,000万円未満なので、2号文書である建築請負契約金額6,000万円が記載金額となる。よって、本肢は誤り。","3 × 記載金額なしとなる。不動産の贈与契約書は不動産の譲渡に関する契約書であり課税文書である（印紙税法別表第一）。ただし、贈与契約においては、譲渡の対価である金額はないから、契約金額はないものとして扱う（印紙税法基本通達23条（1）ホ（注））。よって、本肢は誤り。","4 × 記載金額なしとなる。契約金額を変更する契約書については、一定の条件のもと、契約金額を減少させる場合には、記載金額のない契約書となる（印紙税法基本通達30条2項（2）、印紙税法別表第一、課税物件表の適用に関する通則4ニ）。よって、本肢は誤り。"]},{"id":24,"cat":"税その他","title":"固定資産税","ans":4,"q":"固定資産税に関する次の記述のうち、正しいものはどれか。","choices":["令和8年1月15日に新築された家屋に対する令和8年度分の固定資産税は、新築住宅に係る特例措置により税額の2分の1が減額される。","固定資産税の税率は、1.7％を超えることができない。","区分所有家屋の土地に対して課される固定資産税は、各区分所有者が連帯して納税義務を負う。","市町村は、財政上その他特別の必要がある場合を除き、当該市町村の区域内において同一の者が所有する土地に係る固定資産税の課税標準額が30万円未満の場合には課税できない。"],"exp":["1 × 賦課期日は当該年度の初日の属する年の1月1日である。新築された住宅に対する固定資産税の減額は、当該住宅に対して新たに固定資産税が課されることとなった年度から3年度分、中高層耐火建築物である住宅については当該住宅に対して新たに固定資産税が課されることとなった年度から5年度分、固定資産税額の2分の1に相当する額を当該住宅に係る固定資産税額から減額する（地方税法附則15条の6）。固定資産税の賦課期日は当該年度の初日の属する年の1月1日とする（地方税法359条）。本肢の建物は、令和8年1月15日に新築されているため、令和8年度分の固定資産税は課税されない。課税されないので減税ということも生じない。よって、本肢は誤り。","2 × 税率の上限に関する規定はない。固定資産税の標準税率は、100分の1.4であるが、制限税率に関する規定は廃止されている（地方税法350条1項）。よって、本肢は誤り。","3 × 自己の持分に応じた税額を各自が納税する。区分所有に係る家屋の敷地の用に供されている土地に対して課する固定資産税は、当該共用土地に係る固定資産税額を当該共用土地に係る各共用土地納税義務者の当該共用土地に係る持分の割合によってあん分した額を、当該各共用土地納税義務者の当該共用土地に係る固定資産税として納付する義務を負う（地方税法352条の2第1項）。したがって、各区分所有者が連帯して納税義務を負うわけではない。よって、本肢は誤り。","4 ○ 市町村は、同一の者について当該市町村の区域内におけるその者の所有に係る土地に対して課する固定資産税の課税標準となるべき額が30万円に満たない場合においては、固定資産税を課することができない。ただし、財政上その他特別の必要がある場合においては、当該市町村の条例の定めるところによって、その額が30万円に満たないときであっても、固定資産税を課することができる（地方税法351条）。よって、本肢は正しく、本問の正解肢となる。"]},{"id":25,"cat":"税その他","title":"地価公示法","ans":3,"q":"地価公示法に関する次の記述のうち、正しいものはどれか。","choices":["都市及びその周辺の地域等において、土地の取引を行う者は、取引の対象土地から最も近傍の標準地について公示された価格を指標として取引を行うよう努めなければならない。","標準地は、都市計画区域外や国土利用計画法の規定により指定された規制区域内からは選定されない。","標準地の正常な価格とは、土地について、自由な取引が行われるとした場合におけるその取引（一定の場合を除く。）において通常成立すると認められる価格をいい、当該土地に関して地上権が存する場合は、この権利が存しないものとして通常成立すると認められる価格となる。","土地鑑定委員会は、自然的及び社会的条件からみて類似の利用価値を有すると認められる地域において、土地の利用状況、環境等が特に良好と認められる一団の土地について標準地を選定する。"],"exp":["1 × 最も近傍の標準地の価格を指標とするものではない。都市及びその周辺の地域等において、土地の取引を行う者は、取引の対象土地に類似する利用価値を有すると認められる標準地について公示された価格を指標として取引を行うよう努めなければならないものとされている（地価公示法1条の2）。「最も近傍の標準地」の価格を指標とするものではない。よって、本肢は誤り。","2 × 都市計画区域外からも選定できる。土地鑑定委員会は、「都市計画区域その他国土交通省令で定める区域内の標準地について、正常な価格を判定し、これを公示するものとする（地価公示法2条）。したがって、都市計画区域外から選定することもできる。よって、本肢は誤り。なお、国土利用計画法の規制区域内から選定されないという点は正しい。","3 ○ 「正常な価格」とは、土地について、自由な取引が行われるとした場合におけるその取引において通常成立すると認められる価格をいい、当該土地に関して地上権等の権利が存する場合には、その権利が存しないものとして通常成立すると認められる価格をいう（地価公示法2条2項）。よって、本肢は正しく、本問の正解肢となる。なお、当該土地に建物その他の定着物がある場合もその建物等は存しないものとする。","4 × 環境等が特に良好と認められる土地を選定するものではない。標準地は、土地鑑定委員会が、自然的及び社会的条件からみて類似の利用価値を有すると認められる地域において、土地の利用状況、環境等が通常と認められる一団の土地について選定するものとする（地価公示法3条）。「環境等が通常と認められる一団の土地」であって、「環境等が特に良好と認められる一団の土地」ではない。よって、本肢は誤り。"]},{"id":26,"cat":"宅建業法","title":"宅建業の意味","ans":1,"q":"宅地建物取引業の免許（以下この問において「免許」という。）に関する次の記述のうち、正しいものはどれか。","choices":["Aの所有するオフィスビルを賃借しているBが、不特定多数の者に反復継続して転貸する場合、AとBは免許を受ける必要はない。","建設業の許可を受けているCが、建築請負契約に付随して、不特定多数の者に建物の敷地の売買を反復継続してあっせんする場合、Cは免許を受ける必要はない。","Dが共有会員制のリゾートクラブ会員権（宿泊施設等のリゾート施設の全部又は一部の所有権を会員が共有するもの）の売買の媒介を不特定多数の者に反復継続して行う場合、Dは免許を受ける必要はない。","宅地建物取引業者であるE（個人）が死亡し、その相続人FがEの所有していた土地を20区画に区画割りし、不特定多数の者に宅地として分譲する場合、Fは免許を受ける必要はない。"],"exp":["1 ○ Aは、Bに建物を自ら賃貸しているにすぎず、「取引」にあたらないため、免許を必要としない。他方、Bは、Aから賃借した建物を転貸しているが、自ら転貸を行うことも「取引」にあたらないので、免許を必要としない（業法2条2号、3条1項）。よって、本肢は正しく、本問の正解肢となる。","2 × 建物の敷地は「宅地」。あっせんは「媒介」。建物の敷地は宅地であるから、その売買のあっせん（媒介等）を反復継続して行うことは、宅建業に該当する（業法2条2号）。したがって、Cは、宅建業の免許を受ける必要がある（業法3条1項）。よって、本肢は誤り。","3 × 共有会員制リゾートクラブ会員権の売買の媒介は免許必要。共有会員制のリゾートクラブ会員権（宿泊施設等のリゾート施設の全部又は一部の所有権を会員が共有するもの）の売買は建物の売買と同視でき、その媒介を業として行う行為は、宅建業に該当する（旧建設省通達、業法2条2号）。よって、本肢は誤り。","4 × 相続人が新たに宅建業を行う場合、免許必要。宅建業者の相続人は、宅建業者が締結した契約に基づく取引を結了する目的の範囲内では宅建業者とみなされる（業法76条）。しかし、本肢のように新たに宅地の分譲を行うような場合には、宅建業の免許を受ける必要がある（業法3条1項）。よって、本肢は誤り。"]},{"id":27,"cat":"宅建業法","title":"免許の申請","ans":1,"q":"宅地建物取引業の免許（以下この問において「免許」という。）に関する次の記述のうち、正しいものはいくつあるか。\nア　破産手続開始の決定を受けた個人Aは、復権を得てから5年を経過しなければ、免許を受けることができない。\nイ　宅地建物取引業法の規定に違反したことにより罰金の刑に処せられた取締役がいる法人Bは、その刑の執行が終わった日から5年を経過しなければ、免許を受けることができない。\nウ　宅地建物取引業者Cは、業務停止処分の聴聞の期日及び場所が公示された日から当該処分をする日又は当該処分をしないことを決定する日までの間に、相当の理由なく廃業の届出を行った。この場合、Cは、当該届出の日から5年を経過しなければ、免許を受けることができない。\nエ　宅地建物取引業に係る営業に関し成年者と同一の行為能力を有する未成年者Dは、その法定代理人が拘禁刑に処せられ、その刑の執行が終わった日から5年を経過しなければ、免許を受けることができない。","choices":["一つ","二つ","三つ","四つ"],"exp":["ア × 復権を得れば直ちに免許を受けることができる。破産手続開始の決定を受けても復権を得れば直ちに免許を受けることができる（業法5条1項1号）。復権を得てから5年を経過する必要はない。よって、本肢は誤り。","イ ○ 宅建業法に違反したことにより罰金の刑に処せられ、その刑の執行を終わった日から5年を経過しない取締役がいる法人Bは、免許を受けることができない（業法5条1項12号、6号）。よって、本肢は正しい。","ウ × 業務停止処分による場合は、免許を受けることができる。宅建業法66条1項8号又は9号に該当するとして、免許の取消処分の聴聞の期日及び場所が公示された日から当該処分をする日又は当該処分をしないことを決定する日までの間に、相当の理由なく廃業の届出を行った場合、当該届出の日から5年を経過しなければ免許を受けることができない（業法5条1項3号）。しかし、業務停止処分は免許の基準に該当せず、相当の理由なく廃業の届出をしたとしても5年を経過するまでの間に免許を受けることができる。よって、本肢は誤り。","エ × “有する”未成年者は法定代理人と無関係に免許可。宅建業に係る営業に関し成年者と同一の行為能力を有する未成年者は、法定代理人が免許欠格事由に該当していても、免許を受けることができる（業法5条1項11号参照）。よって、本肢は誤り。","以上より、正しいものはイの一つであり、1が本問の正解肢となる。"]},{"id":28,"cat":"宅建業法","title":"報酬額の制限","ans":4,"q":"宅地建物取引業者A（消費税課税事業者）は、Bが所有する建物について、B及びCから媒介の依頼を受け、Bを貸主、Cを借主とし、1か月分の借賃を10万円（消費税等相当額を含まない。）、CからBに支払われる権利金（権利設定の対価として支払われる金銭であって返還されないものであり、消費税等相当額を含まない。）を150万円とする定期建物賃貸借契約を成立させた。この場合における次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。なお、長期の空家等の貸借の媒介又は代理における特例については考慮しないものとする。","choices":["建物が店舗用である場合、Aは、B及びCの承諾を得たときは、B及びCの双方からそれぞれ11万円の報酬を受けることができる。","建物が居住用である場合、Aが受け取ることができる報酬の額は、CからBに支払われる権利金の額を売買に係る代金の額とみなして算出される16万5,000円が上限となる。","建物が店舗用である場合、Aは、Bからの依頼に基づくことなく広告をした場合でも、その広告が賃貸借契約の成立に寄与したときは、報酬とは別に、その広告料金に相当する額をBに請求することができる。","定期建物賃貸借契約の契約期間が終了した直後にAが依頼を受けてBC間の定期建物賃貸借契約の再契約を成立させた場合、Aが受け取る報酬については、宅地建物取引業法の規定が適用される。"],"exp":["1 × 双方から11万円を受領することはできない。居住用建物以外の賃貸借で、権利金等の授受がある場合には、権利金等の額を売買代金とみなして報酬計算した額と1カ月分の借賃とを比較して、高いほうが報酬限度額となる（業法46条、報酬告示第4、第6）。本肢の場合、権利金を基準とすると（150万円×5％）7万5,000円をB及びCから受領でき、合計は15万円となる。これは借賃1カ月分の10万円よりも高い。しかし、この7万5,000円に消費税を上乗せしても7万5,000円×1.1＝8万2,500円となるので、B及びCから11万円の報酬を受けることはできない。よって、本肢は誤り。なお、本肢の11万円は、借賃に消費税を上乗せした額であるが、借賃を基準とする報酬を当事者双方から受領することはできない。","2 × 居住用建物の場合、権利金を基準とできない。居住用建物の場合、そもそも権利金を基準として報酬額を算出することはできない（報酬告示第6）。よって、本肢は誤り。","3 × 依頼者の依頼がなければ、広告料金を請求できない。宅建業者は、依頼者の依頼がなければ、報酬とは別に広告料金を請求することはできない（業法46条、報酬告示第11）。寄与の有無は影響しない。よって、本肢は誤り。","4 ○ 定期建物賃貸借の再契約に関して宅建業者が受けることのできる報酬については、新規の契約と同様に宅建業法及び告示の規定が適用される（業法46条、報酬告示第4、解釈・運用の考え方）。よって、本肢は正しく、本問の正解肢となる。"]},{"id":29,"cat":"宅建業法","title":"広告等に関する規制","ans":1,"q":"宅地建物取引業者が行う広告に関する次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはいくつあるか。\nア　建物の所有者と賃貸借契約を締結し、当該建物を転貸するための広告をする際は、当該広告に自らが契約の当事者となって貸借を成立させる旨を明示しなければ、法第34条に規定する取引態様の明示義務に違反する。\nイ　居住用賃貸マンションとする予定の建築確認申請中の建物については、当該建物の貸借に係る媒介の依頼を受け、媒介契約を締結した場合であっても、広告をすることができない。\nウ　宅地の売買に関する広告をインターネットで行った場合において、当該宅地の売買契約成立後に継続して広告を掲載していたとしても、最初の広告掲載時点で当該宅地に関する売買契約が成立していなければ、法第32条に規定する誇大広告等の禁止に違反することはない。\nエ　新築分譲住宅としての販売を予定している建築確認申請中の物件については、建築確認申請中である旨を表示をすれば、広告をすることができる。","choices":["一つ","二つ","三つ","四つ"],"exp":["ア × 「自ら貸借」には宅建業法の規制は及ばない。自ら借り受けた建物を他に転貸する行為も「自ら貸借」に該当するため宅建業にあたらず、宅建業法の規制は及ばない。したがって、広告に自らが契約の当事者となって貸借を成立させる旨を明示しなくとも取引態様の明示義務に違反しない。よって、本肢は誤り。","イ ○ 宅建業者は、宅地の造成又は建物の建築に関する工事の完了前においては、当該工事に関し必要とされる許可、確認等があった後でなければ、すべての取引態様における広告をすることができない（業法33条）。よって、本肢は正しい。","ウ × 誇大広告等の禁止は継続的に求められる。売買契約が成立した物件のように、物件は存在するが、実際には取引の対象とはなり得ない物件に関する広告表示をすることは誇大広告等の禁止に違反し許されない（業法32条）。そして、継続的に広告を行う場合には、掲載時のみならず掲載後も継続的に違反しないことが求められる。また、インターネットによる広告の場合も当該規制は及ぶ。よって、本肢は誤り。","エ × 申請中の表示をしても広告は不可。宅建業者は、宅地の造成又は建物の建築に関する工事の完了前においては、当該工事に関し必要とされる許可、確認等があった後でなければ、すべての取引態様における広告をすることができない（業法33条）。したがって、建築確認申請中である旨の表示をしている場合であっても広告をすることはできない。よって、本肢は誤り。","以上より、正しいものはイの一つであり、1が本問の正解肢となる。"]},{"id":30,"cat":"宅建業法","title":"重要事項の説明","ans":2,"q":"宅地建物取引業者が、宅地建物取引業法第35条に規定する重要事項について説明をする場合に関する次の記述のうち、正しいものはどれか。","choices":["自ら売主として、マンション（建築工事完了前）の分譲を行うに当たり、建物の完成時における当該マンションの外壁の塗装については説明しなくてもよいが、建物の形状や構造については平面図を交付して説明しなければならない。","事業用建物の賃貸借の媒介を行うに当たっても、居住用建物と同様に、台所、浴室等の設備の整備状況について説明しなければならない。","宅地建物取引業者ではない売主から依頼されて建物の売買の媒介を行うに当たり、損害賠償額の予定は説明しなくてもよいが、売主が契約不適合担保責任を負わないことについては説明しなければならない。","自ら売主として、マンションの分譲を行うに当たり、管理組合の総会の議決権に関する事項については、管理規約を添付して説明しなければならない。"],"exp":["1 × 壁面の塗装の状況についても説明する必要がある。宅建業者は、工事完了前の建物の分譲にあたり、当該建物の工事完了時における形状、構造、主要構造部、内装および外装の構造または仕上げならびに設備の設置および構造を、重要事項として説明しなければならない（業法35条1項5号、規則16条）。ここにいう「外装の仕上げ」には、壁面の塗装の状況も含まれる（解釈・運用の考え方）。よって、外壁の塗装については説明しなくてもよいとする本肢は誤り。なお、建物の形状や構造については、平面図を交付して説明しなければならないとする点は正しい（解釈・運用の考え方）。","2 ○ 宅建業者は、建物の貸借の契約にあたり、台所、浴室、便所その他当該建物の設備の整備の状況を、重要事項として説明しなければならない（業法35条1項14号、規則16条の4の3第7号）。この点は、事業用建物であっても居住用建物であっても同様である。よって、本肢は正しく、本問の正解肢となる。","3 × 損害賠償の予定は説明必要、契約不適合担保責任は説明不要。宅建業者は、建物の売買契約にあたり、損害賠償額の予定に関する事項は重要事項として説明しなければならないが（業法35条1項9号）、契約不適合担保責任に関する事項については説明する必要はない。よって、本肢は誤り。","4 × 管理組合の総会の議決権に関する事項は説明する必要はない。宅建業者がマンションの分譲を行うにあたり、管理組合の総会の議決権に関する事項は、重要事項として説明が必要な事項に含まれていない。よって、本肢は誤り。"]},{"id":31,"cat":"宅建業法","title":"宅建業法の総合問題","ans":4,"q":"宅地建物取引業者Aは、Bが所有し、居住している甲住宅の売却の媒介を、また、宅地建物取引業者Cは、Dから既存住宅の購入の媒介を依頼され、それぞれ媒介契約を締結した。その後、B及びDは、それぞれA及びCの媒介により、甲住宅の売買契約（以下この問において「本件契約」という。）を締結した。この場合における次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはどれか。なお、この問において「建物状況調査」とは、法第34条の2第1項第4号に規定する調査をいうものとし、また、電磁的方法により提供する場合を考慮しないものとする。","choices":["Aは、甲住宅の売却の依頼を受けた媒介業者として、本件契約が成立するまでの間に、Dに対し、建物状況調査を実施する者のあっせんの有無について確認しなければならない。","A及びCは、本件契約が成立するまでの間に、Dに対し、甲住宅について、設計図書、点検記録その他の建物の建築及び維持保全の状況に関する書類で国土交通省令で定めるものの保存の状況及びそれぞれの書類に記載されている内容について説明しなければならない。","CがDとの間で媒介契約を締結する2年前に、木造の甲住宅は既に建物状況調査を受けていた。この場合において、A及びCは、本件契約が成立するまでの間に、Dに対し、建物状況調査を実施している旨及びその結果の概要について説明しなければならない。","A及びCは、Dが宅地建物取引業者である場合であっても、法第37条に基づき交付すべき書面において、甲住宅の構造耐力上主要な部分等の状況について当事者の双方が確認した事項があるときにその記載を省略することはできない。"],"exp":["1 × あっせんの有無について確認する必要はない。重要事項の説明事項となるのは、建物状況調査（実施後国土交通省令で定める期間の経過していないものに限る。）を実施しているかどうか、及びこれを実施している場合におけるその結果の概要であり、建物状況調査を実施する者のあっせんの有無ではない（業法35条1項6号の2イ）。よって、本肢は誤り。なお、建物状況調査を実施する者のあっせんの有無は、媒介契約書の記載事項である（業法34条の2第1項4号）。","2 × 書類に記載されている内容を説明する必要はない。媒介業者A及びCは、売買契約が成立するまでの間に、宅建業者でない場合のDに対して、設計図書、点検記録その他の建物の建築及び維持保全の状況に関する書類で国土交通省令で定めるものの保存の状況について重要事項として説明をしなければならない（業法35条1項6号の2ロ）。しかし、それぞれの書類に記載されている内容を説明する必要はない。よって、本肢は誤り。","3 × 建物状況調査は、木造では1年を経過していないものに限る。重要事項の説明事項となる建物状況調査は、実施後国土交通省令で定める期間である1年（鉄筋コンクリート造又は鉄骨鉄筋コンクリート造の共同住宅等にあっては2年）を経過していないものに限る（業法35条1項6号の2イ、規則16条の2の2）。したがって、媒介契約を締結する2年前に受けた木造住宅の建物状況調査は、実施している旨及びその結果の概要について重要事項として説明する必要はない。よって、本肢は誤り。","4 ○ 宅建業者は、売買契約が成立したときは、宅建業者を含む各当事者に、遅滞なく、37条書面を交付（電磁的方法による提供を含む。）しなければならない。そして、当該建物が既存の建物であるときは、建物の構造耐力上主要な部分等の状況について当事者の双方が確認した事項はこの37条書面に必ず記載する事項であり、省略することはできない（業法37条1項2号の2、4項）。よって、本肢は正しく、本問の正解肢となる。"]},{"id":32,"cat":"宅建業法","title":"業務上の規制総合","ans":3,"q":"宅地建物取引業者Aの業務に関する次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定に違反しないものはどれか。","choices":["Aは、マンションの一室の賃貸借を媒介するに当たり、建物の区分所有等に関する法律第2条第3項に規定する専有部分の用途について、管理規約で「ペット飼育禁止」の制限があったが、借主（宅地建物取引業者ではないものとする）に対し、そのことに関して法第35条の重要事項の説明を行わなかった。","Aは、自ら売主となり、土地付建物の売買契約を締結したが、買主（宅地建物取引業者ではないものとする）Bが当該建物の隣に住んでいるので、都市ガスが供給されることを知っているとして、Bに対し、ガスの供給に関して法第35条の重要事項の説明を行わなかった。","Aは、オフィスビルの所有者Cから賃貸借の媒介を依頼されたが、過去数次にわたってCの物件について賃貸借の媒介をしていたことから、当該依頼に係る媒介契約を締結したとき、Cに対し、書面の作成並びに交付及び電磁的方法による提供を行わなかった。","Aは、売主Dと買主E（宅地建物取引業者ではないものとする）との間における中古マンションの売買を媒介するに当たり、管理規約に定めのある修繕積立金をDが滞納していたが、Eに対し、そのことに関して法第35条の重要事項の説明を行わなかった。"],"exp":["1 違反する 制限がある場合は、貸借でも説明必要。区分所有建物の専有部分の用途その他の利用の制限に関する規約の定め（その案を含む）があるときは、その内容を、重要事項として説明しなければならない（業法35条1項6号、規則16条の2第3号）。そして、当該規約の定めには、ペット飼育の禁止又は制限に関するものも含まれる（解釈・運用の考え方）。したがって、Aは、管理規約で「ペット飼育禁止」の制限があることについて説明する必要がある。よって、本肢は宅建業法の規定に違反する。","2 違反する ガスの供給については説明必要。飲用水、電気及びガスの供給ならびに排水のための施設の整備の状況については、重要事項として説明しなければならない（業法35条1項4号）。したがって、Aは、ガスの供給に関して説明をする必要がある。よって、本肢は宅建業法の規定に違反する。","3 違反しない 宅建業者は、宅地又は建物の売買又は交換の媒介契約を締結したときは、遅滞なく、一定事項を記載した書面を作成して記名押印し、依頼者に交付（電磁的方法による提供を含む。）しなければならない（業法34条の2第1項、11項）。しかし、貸借の媒介契約の場合には、書面を作成して、依頼者に交付する必要はない。よって、本肢は宅建業法の規定に違反せず、本問の正解肢となる。","4 違反する 修繕積立金の滞納についても説明必要。区分所有建物の売買・交換契約においては、当該一棟の建物の計画的な維持修繕のための費用の積立てを行う旨の規約の定めがあるときは、その内容及び既に積み立てられている額について、重要事項として説明する必要がある（業法35条1項6号、規則16条の2第6号）。そして、当該区分所有建物に関し修繕積立金についての滞納があるときは、その額を告げることとする（解釈・運用の考え方）。したがって、Aは、管理規約に定めのある修繕積立金をDが滞納していることを説明する必要がある。よって、本肢は宅建業法の規定に違反する。"]},{"id":33,"cat":"宅建業法","title":"手付金等の保全措置","ans":3,"q":"宅地建物取引業者Aが、自ら売主として、宅地建物取引業者ではない個人Bとの間で、土地付建物を4,000万円で売却する売買契約（所有権の登記は当該土地付建物の引渡し時に行うものとする。）を締結する場合における宅地建物取引業法（以下この問において「法」という。）第41条又は第41条の2の規定に基づく手付金等の保全措置（以下この問において「保全措置」という。）に関する次の記述のうち、誤っているものはどれか。","choices":["Aが、保全措置を講じずにBから手付金100万円を受領する場合、その旨を、法第35条の規定に基づく重要事項説明書に記載する必要があるが、法第37条の規定により交付する書面に記載する必要はない。","当該建物が建築工事の完了後の建物である場合、AがBから手付金100万円を受領する際には保全措置は不要であるが、その後、当該土地付建物を引き渡す前に中間金400万円を受領するためには、手付金100万円と合わせて保全措置を講じた後でなければ、その中間金を受領することができない。","当該建物が建築工事の完了前の建物である場合において、Aは、保全措置を講じずに、Bから手付金300万円を受領することができる。","当該土地付建物の引渡し前に、BはAに対して2,000万円を中間金として支払う契約になっていたが、Aがその中間金について保全措置を講じていないときは、Bはこの中間金の支払いを拒むことができる。"],"exp":["1 ○ 手付金等を受領しようとする場合における手付金等の保全措置の概要は、35条書面に記載する必要がある（宅建業法35条1項10号）。手付金等が保全措置を講じることが必要となる金額であるか否かは影響しない。一方、手付金等の保全措置の概要は、37条書面の記載事項ではない（業法37条1項参照）。よって、本肢は正しい。","2 ○ 完成物件の場合、代金の10％以下かつ1,000万円以下であれば、手付金等の保全措置は不要である（業法41条の2第1項、施行令3条の5）。したがって、本肢のAは、手付金100万円を受領する際に保全措置を講じる必要がない。一方で、中間金を受領する時には、手付金と中間金の合計額が500万円となるので、Aは、手付金と中間金の合計額について保全措置を講じた後でなければ、中間金を受領することはできない。よって、本肢は正しい。","3 × 手付金等の保全措置を講じる必要がある。未完成物件の場合、代金の5％以下かつ1,000万円以下であれば手付金等の保全措置は不要である（業法41条1項、施行令3条の5）。本肢では、手付金が300万円であり、代金4,000万円の5％である200万円を超えている。したがって、Aは、手付金等の保全措置を講じずに手付金300万円を受領することはできない。よって、本肢は誤りであり、本問の正解肢となる。","4 ○ 宅建業者が必要な手付金等の保全措置を講じないとき、買主は、手付金等を支払わないことができる（業法41条4項、41条の2第5項）。したがって、Aがその中間金について手付金等の保全措置を講じていないときは、Bは中間金の支払いを拒むことができる。よって、本肢は正しい。"]},{"id":34,"cat":"宅建業法","title":"重要事項の説明","ans":2,"q":"宅地建物取引業者が行う宅地建物取引業法第35条に規定する重要事項の説明に関する次の記述のうち、正しいものはどれか。なお、説明の相手方は宅地建物取引業者ではないものとする。","choices":["宅地の売買の媒介を行う場合、売買の各当事者すなわち売主及び買主に対して、書面を交付又は売主及び買主の承諾を得て電磁的方法による提供をして説明しなければならない。","宅地の売買の媒介を行う場合、代金に関する金銭の貸借のあっせんの内容及び当該あっせんに係る金銭の貸借が成立しないときの措置について、説明しなければならない。","建物の貸借の媒介を行う場合、私道に関する負担について、説明しなければならない。","建物の売買の媒介を行う場合、天災その他不可抗力による損害の負担に関する定めがあるときは、その内容について、説明しなければならない。"],"exp":["1 × 売主には、重要事項の説明をする必要はない。宅建業者は、売買、交換又は貸借の契約が成立するまでの間に、買主、借主、交換の両当事者に、宅地建物取引士をして、一定事項を記載した書面を交付又はこれらの者の承諾を得て電磁的方法による提供をして説明をさせなければならない（業法35条1項）。しかし、売主や貸主に対しては、交付と説明は不要である。よって、本肢は誤り。","2 ○ 代金等に関する金銭の貸借をあっせんすることとした場合、あっせんの内容と当該あっせんに係る金銭の貸借が不成立のときの措置を、重要事項として説明し、重要事項説明に係る書面に記載しなければならない（業法35条1項12号）。よって、本肢は正しく、本問の正解肢となる。","3 × 建物の貸借においては、私道に関する負担は、説明事項ではない。宅地の売買・貸借においては、私道に関する負担に関する事項について説明しなければならない（業法35条1項3号）。しかし、建物の貸借においては説明事項とされていない。よって、本肢は誤り。","4 × 天災その他不可抗力による損害の負担は、重要事項説明の対象ではない。天災その他不可抗力による損害の負担に関する定め（危険負担の定め）があるときは、宅建業者は、その内容を37条書面に記載し、その書面を交付しなければならない（業法37条1項10号）。しかし、重要事項説明の対象ではない。よって、本肢は誤り。"]},{"id":35,"cat":"宅建業法","title":"免許の効力","ans":4,"q":"次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。なお、この問において「免許」とは、宅地建物取引業の免許をいう。","choices":["宅地建物取引業者Aは、免許の更新を申請したが、免許権者である甲県知事の申請に対する処分がなされないまま、免許の有効期間が満了した。この場合、Aは、当該処分がなされるまで、宅地建物取引業を営むことができない。","Bは、新たに宅地建物取引業を営むため免許の申請を行った。この場合、Bは、免許の申請から免許を受けるまでの間に、宅地建物取引業を営む旨の広告を行い、取引する物件及び顧客を募ることができる。","宅地建物取引業者Cは、宅地又は建物の売買に関連し、兼業として、新たに不動産管理業を営むこととした。この場合、Cは兼業で不動産管理業を営む旨を記載した届出書を、免許権者である国土交通大臣又は都道府県知事に提出しなければならない。","宅地建物取引業者である法人Dが、宅地建物取引業者でない法人Eに吸収合併されたことにより消滅した場合、一般承継人であるEは、Dが締結した宅地又は建物の契約に基づく取引を結了する目的の範囲内において宅地建物取引業者とみなされる。"],"exp":["1 × 処分がなされるまでの間は宅建業を行うことができる。免許の更新の申請があった場合において、その有効期間の満了の日までにその申請について処分がなされないときは、従前の免許は、同項の有効期間の満了後もその処分がなされるまでの間は、なお効力を有する（業法3条4項）。したがって、Aは免許の処分がなされるまでの間も宅建業を営むことができる。よって、本肢は誤り。","2 × 免許申請中は、広告等事業活動をすることができない。宅建業者は、新たに免許を受け、営業保証金を供託し、その旨を免許権者に届け出た後でなければ、その事業を開始してはならない（業法3条、12条2項、25条5項）。したがって、Bは免許の申請中に事業である広告をすることはできない。よって、本肢は誤り。","3 × 兼業する事業に変更が生じたとしても、届出対象とはならない。宅建業者は、免許申請書記載事項のうち一定事項について変更があったときは、30日以内に届出書を免許権者に提出しなければならない（変更の届出、業法9条1項、4条1項各号）。しかし、兼業している宅建業以外の事業の種類は、免許申請書記載事項ではあるが、変更の届出書の記載事項とはなっていない（業法9条1項、4条1項6号）。よって、本肢は誤り。","4 ○ 宅建業者が吸収合併により消滅した場合は、当該宅建業者を吸収した一般承継人である存続会社は、当該宅建業者が締結した契約に基づく取引を結了する目的の範囲内においては、なお宅建業者とみなされる（業法76条、11条1項2号）。よって、本肢は正しく、本問の正解肢となる。"]},{"id":36,"cat":"宅建業法","title":"37条書面","ans":1,"q":"宅地建物取引業者Aが宅地建物取引業法第37条の規定により交付すべき書面（以下この問において「37条書面」という。）に関する次の記述のうち、同法の規定によれば、誤っているものの組合せはどれか。なお、この問においては、電磁的方法により提供する場合を考慮しないものとする。\nア　Aが売主として宅地建物取引業者Bの媒介により、土地付建物の売買契約を締結した場合、Bが37条書面を作成し、その宅地建物取引士をして当該書面に記名させれば、Aは、宅地建物取引士による37条書面への記名を省略することができる。\nイ　Aがその媒介により、事業用宅地の定期賃貸借契約を公正証書によって成立させた場合、当該公正証書とは別に37条書面を作成して交付するに当たって、宅地建物取引士をして記名させる必要はない。\nウ　Aが売主としてCとの間で売買契約を成立させた場合（Cは自宅を売却して購入代金に充てる予定である。）、AC間の売買契約に「Cは、自宅を一定の金額以上で売却できなかった場合、本件売買契約を無条件で解除できる」旨の定めがあるときは、Aは、37条書面にその内容を記載しなければならない。","choices":["ア、イ","ア、ウ","イ、ウ","ア、イ、ウ"],"exp":["ア × 売主である宅建業者も、宅地建物取引士をして記名させなければならない。宅建業者は、37条書面には、宅地建物取引士をして記名させなければならない（業法37条3項）。売主となっている宅建業者Aも宅地建物取引士をして記名させなければならない。よって、本肢は誤り。","イ × 公正証書で契約を成立させても、宅地建物取引士の記名が必要である。宅建業者は、37条書面には、宅地建物取引士をして記名させなければならない（業法37条3項）。事業用宅地の定期賃貸借契約を公正証書によって成立させた場合でも同様である。よって、本肢は誤り。","ウ ○ 契約の解除に関する定めがあるときは、その内容を37条書面（電磁的方法による提供を含む。）に記載しなければならない（業法37条1項7号、4項）。「Cは、自宅を一定の金額以上で売却できなかった場合、本件売買契約を無条件で解除できる」旨の定めは解除に関する事項であり、その定めがあれば、37条書面に記載しなければならない。よって、本肢は正しい。","以上より、誤っているものはア、イであり、1が本問の正解肢となる。"]},{"id":37,"cat":"宅建業法","title":"宅地建物取引士証","ans":2,"q":"宅地建物取引士と宅地建物取引士証に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","choices":["宅地建物取引士は、常時宅地建物取引士証を携帯して、取引の関係者から請求があったとき提示することを要し、これに違反したときは、過料に処せられることがある。","宅地建物取引士は、宅地建物取引士証を紛失した場合、その再交付がなされるまでの間であっても、宅地建物取引士証を提示することなく、重要事項説明を行ったときは、宅地建物取引士としてすべき事務を行うことを禁止されることがある。","宅地建物取引士は、宅地建物取引士証を他人に貸与してはならず、これに違反したときは、事務の禁止の処分を受けることがあるが、情状が特に重くても、登録を消除されることはない。","宅地建物取引士は、勤務先を変更したとき、宅地建物取引士証の書換え交付の申請を行わなければならない。"],"exp":["1 × 取引関係者からの請求時に提示しなくても、罰則なし。宅地建物取引士は、取引の関係者から請求があったときには、必ず宅地建物取引士証を提示しなければならない（業法22条の4）。しかし、この規定に違反したとしても、過料に処せられることはない。重要事項の説明の際の宅地建物取引士証の提示義務に違反したときに過料に処せられることと区別してほしい。よって、本肢は誤り。","2 ○ 宅地建物取引士は、重要事項の説明をするときには、必ず宅地建物取引士証を提示しなければならない（業法35条4項）。この規定に違反すると、宅地建物取引士は、事務禁止処分を受けることがある（業法68条2項、4項）。よって、本肢は正しく、本問の正解肢となる。","3 × 情状が特に重い場合、登録を消除されることもある。宅地建物取引士は、宅地建物取引士証を他人に貸与するなどして、他人に自己の名義の使用を許し、その他人が宅地建物取引士の名義を使用して宅地建物取引士である旨を表示したときには、事務禁止処分を受けることがある（業法68条2項、4項）。そして、この規定に違反して情状が特に重いときには、登録消除処分を受けることがある（業法68条の2第1項4号）。よって、本肢は誤り。","4 × 勤務先を変更しても、宅地建物取引士証の書換えは不要。宅地建物取引士は、その氏名又は住所を変更したときは、変更の登録の申請とあわせて、宅地建物取引士証の書換え交付を申請しなければならない（規則14条の13）。しかし、勤務先を変更したときには、宅地建物取引士証の書換え交付を申請する必要はない。よって、本肢は誤り。"]},{"id":38,"cat":"宅建業法","title":"自ら売主制限総合","ans":3,"q":"自らが売主である宅地建物取引業者Aと、宅地建物取引業者でないBとの間での売買契約に関する次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはどれか。","choices":["Aは、Bとの間における建物の売買契約（代金2,000万円）の締結に当たり、手付金として100万円の受領を予定していた。この場合において、損害賠償の予定額を定めるときは、300万円を超えてはならない。","AとBが締結した建物の売買契約において、Bが手付金の放棄による契約の解除ができる期限について、金融機関からBの住宅ローンの承認が得られるまでとする旨の定めをした。この場合において、Aは、自らが契約の履行に着手する前であれば、当該承認が得られた後は、Bの手付金の放棄による契約の解除を拒むことができる。","Aは、喫茶店でBから宅地の買受けの申込みを受けたことから、翌日、前日と同じ喫茶店で当該宅地の売買契約を締結し、代金の全部の支払を受けた。その4日後に、Bから法第37条の2の規定に基づくいわゆるクーリング・オフによる当該契約を解除する旨の書面による通知を受けた場合、Aは、当該宅地をBに引き渡していないときは、代金の全部が支払われたことを理由に当該解除を拒むことはできない。","Aは、Bとの間で宅地の割賦販売の契約（代金3,000万円）を締結し、当該宅地を引き渡した。この場合において、Aは、Bから1,500万円の賦払金の支払を受けるまでに、当該宅地に係る所有権の移転登記をしなければならない。"],"exp":["1 × 400万円を超えてはならない。宅建業者が自ら売主となる売買契約においては、債務不履行を理由とする契約の解除に伴う損害賠償の予定額及び違約金を定めるときは、これらを合算して、代金額の10分の2を超える定めをしてはならない（業法38条1項）。しかし、本肢の手付金はそのいずれでもない（業法39条2項参照）。したがって、代金額の10分の2である400万円を上限として、損害賠償の予定額を定めることができる。よって、本肢は誤り。","2 × 特約は無効。Aの履行着手前であればBは手付解除可。宅建業者が自ら売主となる売買契約の締結に際して手付を受領したときは、売主が契約の履行に着手するまでは買主は手付を放棄して契約の解除をすることができ、これに反する特約で買主に不利なものは無効となる（業法39条2項、3項、判例）。本肢の特約は買主に不利な特約として無効となり、売主Aは、自らが契約の履行に着手する前であれば、Bの手付放棄による契約の解除を拒むことはできない。よって、本肢は誤り。","3 ○ 「事務所等」以外の場所で売買契約を締結した買主は、クーリング・オフをすることができる（業法37条の2第1項）。しかし、例外として、①宅建業者からクーリング・オフについて書面で告げられた日から8日を経過したとき（業法37条の2第1項1号、規則16条の6）、②物件の引渡しを受け、かつ代金の全部を支払ったとき（業法37条の2第1項2号）は、クーリング・オフをすることができなくなる。本肢の場合、まだ引渡しがなされていないため、クーリング・オフをすることができる。よって、本肢は正しく、本問の正解肢となる。","4 × 900万円を超える額の支払いを受けるまでである。宅建業者は、自ら売主として割賦販売を行った場合には、引渡しまでに買主に登記を移転しなければならない（業法43条1項本文）。ただし、代金額の10分の3以下の金銭の支払いしか受けていないときは、10分の3を超える額の金銭の支払いを受けるまでに登記を移転すればよい（業法43条1項かっこ書）。本肢では、代金額の10分の3である900万円を超える額の賦払金の支払いを受けるまでに移転登記をしなければならない。よって、本肢は誤り。"]},{"id":39,"cat":"宅建業法","title":"監督・罰則","ans":4,"q":"次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはどれか。","choices":["宅地建物取引業者A（甲県知事免許）は、マンション管理業に関し、不正又は著しく不当な行為をしたとして、マンションの管理の適正化の推進に関する法律に基づき、国土交通大臣から業務の停止を命じられた。この場合、Aは、甲県知事から法に基づく指示処分を受けることがある。","国土交通大臣は、宅地建物取引業者B（乙県知事免許）の事務所の所在地を確知できない場合、その旨を官報及び乙県の公報で公告し、その公告の日から30日を経過してもBから申出がないときは、Bの免許を取り消すことができる。","国土交通大臣は、宅地建物取引業者C（国土交通大臣免許）に対し、法第35条の規定に基づく重要事項の説明を行わなかったことを理由に業務停止を命じた場合は、遅滞なく、その旨を内閣総理大臣に通知しなければならない。","宅地建物取引業者D（丙県知事免許）は、法第72条第1項に基づく丙県職員による事務所への立入検査を拒んだ。この場合、Dは、50万円以下の罰金に処せられることがある。"],"exp":["1 × 宅建業の業務に関しないので、指示処分を受けることはない。免許権者は、宅建業者が業務に関し他の法令に違反し、宅建業者として不適当であると認められるときは、当該宅建業者に対して指示処分をすることができる（業法65条1項3号）。しかし、宅建業に関係のない業務（本肢においては「マンション管理業」）に関する法令に違反しても、宅建業法上の処分を受けることはない。よって、本肢は誤り。","2 × 免許を取り消すことができるのは、免許権者だけである。免許権者は、宅建業者の事務所の所在地を確知できないとき等において、官報又は当該都道府県の公報でその事実を公告し、その公告の日から30日を経過しても当該宅建業者から申出がないときは、当該宅建業者の免許を取り消すことができる（業法67条1項）。しかし、取り消すことができるのはあくまでも免許権者である。本肢における免許権者でない国土交通大臣はBの免許を取り消すことができない。よって、本肢は誤り。","3 × 大臣免許を受けているものに対して処分するときは、内閣総理大臣と協議。国土交通大臣が、その免許を受けた宅建業者に対して、重要事項の説明をしていなかったことを理由に、業務停止処分をしようとするときは、あらかじめ、内閣総理大臣に協議しなければならない（業法71条の2第1項、65条2項2号）。しかし、処分を命じた後、通知しなければならない旨の規定はない。よって、本肢は誤り。","4 ○ 国土交通大臣又は都道府県知事は、宅建業の適正な運営を確保するため必要があると認めるときは、その業務について必要な報告を求め、又はその職員に事務所その他その業務を行う場所に立ち入り、帳簿、書類その他業務に関係のある物件を検査させることができる。違反した宅建業者は、50万円以下の罰金に処せられることがある（業法72条1項、83条1項6号）。よって、本肢は正しく、本問の正解肢となる。"]},{"id":40,"cat":"宅建業法","title":"媒介・代理契約","ans":3,"q":"宅地建物取引業者Aは、BからB所有の宅地の売却について媒介の依頼を受けた。この場合における次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、誤っているものはいくつあるか。\nア　AがBとの間で専任媒介契約を締結し、Bから「売却を秘密にしておきたいので指定流通機構への登録をしないでほしい」旨の申出があった場合、Aは、そのことを理由に登録をしなかったとしても法に違反しない。\nイ　AがBとの間で媒介契約を締結した場合、Aは、Bに対して遅滞なく法第34条の2第1項の規定に基づく書面を交付又はBの承諾を得て電磁的方法により提供しなければならないが、Bが宅地建物取引業者であるときは、当該書面の交付（電磁的方法による提供を含む。）を省略することができる。\nウ　AがBとの間で有効期間を3月とする専任媒介契約を締結した場合、期間満了前にBから当該契約の更新をしない旨の申出がない限り、当該期間は自動的に更新される。\nエ　AがBとの間で一般媒介契約（専任媒介契約でない媒介契約）を締結し、当該媒介契約において、重ねて依頼する他の宅地建物取引業者を明示する義務がある場合において、法第34条の2第1項の書面を作成するときは、Aは、Bが明示していない他の宅地建物取引業者の媒介又は代理によって売買の契約を成立させたときの措置を当該書面に記載しなければならない。","choices":["一つ","二つ","三つ","四つ"],"exp":["ア × 依頼者からの申出があっても、指定流通機構への登録を省略することはできない。宅建業者は、専任媒介契約を締結した場合、指定流通機構に登録しなければならない（業法34条の2第5項）。そして、この登録は、たとえ本肢のように依頼者から登録しないでほしい旨の申出があっても省略することはできない。よって、本肢は誤り。","イ × 依頼者が宅建業者であっても、媒介契約書面を交付しなければならない。宅建業者は、売買の媒介契約を締結した場合、遅滞なく、一定事項を記載した書面を作成して記名押印し、依頼者にこれを交付等しなければならない（業法34条の2第1項、11項）。そして、この書面の交付は、依頼者が宅建業者の場合でも省略できない（業法78条2項参照）。よって、本肢は誤り。","ウ × 依頼者からの申出がない場合に自動更新されるわけではない。専任媒介契約の有効期間は3カ月を超えることができない。そして、この有効期間の更新は、依頼者の申出がある場合に限られる（業法34条の2第3項、4項）。依頼者からの申出がない場合に自動的に更新されるわけではない。よって、本肢は誤り。","エ ○ 売買の媒介契約の書面（電磁的方法による場合を含む。）には、媒介契約に違反した場合の措置を記載しなければならない。他の宅地建物取引業者を明示する義務がある一般媒介契約にあっては、依頼者が明示していない他の宅地建物取引業者の媒介又は代理によって売買又は交換の契約を成立させたときの措置を記載等しなければならない（業法34条の2第1項8号、11項、規則15条の9第3号）。よって、本肢は正しい。","以上より、誤っているものはア、イ、ウの三つであり、3が本問の正解肢となる。"]},{"id":41,"cat":"宅建業法","title":"事務所の設置","ans":3,"q":"次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","choices":["宅地建物取引業者は、非常勤役員には従業者であることを証する証明書を携帯させる必要はない。","宅地建物取引業者は、その事務所ごとに従業者名簿を備えなければならないが、取引の関係者から閲覧の請求があった場合であっても、宅地建物取引業法第45条に規定する秘密を守る義務を理由に、閲覧を拒むことができる。","宅地建物取引業者の従業者は、宅地の買受けの申込みをした者から請求があった場合には、その者が宅地建物取引業者であっても、その者に従業者であることを証する証明書を提示する必要がある。","宅地建物取引業者は、従業者名簿を最終の記載をした日から5年間保存しなければならない。"],"exp":["1 × 非常勤役員にも従業者証明書を携帯させる。宅建業者は、従業者に、その従業者であることを証する証明書を携帯させなければ、その者をその業務に従事させてはならない（業法48条1項）。従業者証明書を携帯させるべき者の範囲は、代表者（いわゆる社長）を含み、かつ、非常勤の役員、単に一時的に事務の補助をする者を加えるものとする（解釈・運用の考え方）。したがって、宅建業者は、非常勤役員にも従業者であることを証する証明書を携帯させる必要がある。よって、本肢は誤り。","2 × 従業者名簿を閲覧に供しなければならない。宅建業者は、取引の関係者から請求があったときは、従業者名簿をその者の閲覧に供しなければならない（業法48条4項）。したがって、宅建業者は、秘密を守る義務を理由に閲覧を拒むことはできない。よって、本肢は誤り。なお、宅建業者は、事務所ごとに、従業者名簿を備えなければならないとする部分は正しい（業法48条3項）。","3 ○ 従業者は、取引の関係者の請求があったときは、従業者証明書を提示しなければならない（業法48条2項）。宅建業者を提示請求ができる取引の関係者から除外する旨の規定はない。したがって、宅建業者の従業者は、宅地の買受けの申込みをした宅建業者から請求があった場合には、その者に従業者であることを証する証明書を提示する必要がある。よって、本肢は正しく、本問の正解肢となる。","4 × 10年間保存しなければならない。宅建業者は、従業者名簿を最終の記載をした日から10年間保存しなければならない（業法48条3項、規則17条の2第4項）。最終の記載をした日から5年間保存ではない。よって、本肢は誤り。"]},{"id":42,"cat":"宅建業法","title":"クーリング・オフ","ans":1,"q":"宅地建物取引業者Aが、自ら売主として、宅地建物取引業者Bの媒介により、宅地建物取引業者ではないCを買主とするマンションの売買契約を締結した場合における宅地建物取引業法第37条の2の規定に基づくいわゆるクーリング・オフについて告げるときに交付すべき書面（以下この問において「告知書面」という。）に関する次の記述のうち、正しいものはどれか。","choices":["告知書面には、クーリング・オフによる買受けの申込みの撤回又は売買契約の解除があったときは、Aは、その買受けの申込みの撤回又は売買契約の解除に伴う損害賠償又は違約金の支払を請求することができないことを記載しなければならない。","告知書面には、クーリング・オフについて告げられた日から起算して8日を経過するまでの間は、Cが当該マンションの引渡しを受け又は代金の全部を支払った場合を除き、書面によりクーリング・オフによる買受けの申込みの撤回又は売買契約の解除を行うことができることを記載しなければならない。","告知書面には、Cがクーリング・オフによる売買契約の解除をするときは、その旨を記載した書面がAに到達した時点で、その効力が発生することを記載しなければならない。","告知書面には、A及びBの商号又は名称及び住所並びに免許証番号を記載しなければならない。"],"exp":["1 ○ 告知書面には、クーリング・オフによる買受けの申込みの撤回又は売買契約の解除があったときは、宅建業者は、その買受けの申込みの撤回又は売買契約の解除に伴う損害賠償又は違約金の支払を請求することができないことを記載しなければならない（業法37条の2第1項、規則16条の6第4号）。よって、本肢は正しく、本問の正解肢となる。","2 × 「又は」ではなく「かつ」。告知書面には、クーリング・オフを告げられた日から起算して8日を経過する日までの間は、宅地又は建物の引渡しを受け、「かつ」、その代金の全部を支払った場合を除き、書面により買受けの申込みの撤回又は売買契約の解除を行うことができることを記載しなければならない（業法37条の2第1項1号、2号、規則16条の6第3号）。引渡しを受け、「又は」、代金の全部を支払った場合ではない。よって、本肢は誤り。","3 × 発した時点で効力が生ずることの記載を要する。告知書面には、買受けの申込みの撤回又は売買契約の解除は、買受けの申込みの撤回又は売買契約の解除を行う旨を記載した書面を発した時に、その効力を生ずることを記載しなければならない（業法37条の2第1項1号、2項、規則16条の6第5号）。告知書面が到達した時ではない。よって、本肢は誤り。","4 × 媒介業者Bについて記載する必要はない。告知書面には、売主である宅建業者の商号又は名称及び住所並びに免許証番号を記載しなければならない（業法37条の2第1項、規則16条の6第2号）。売主業者であるAについて必要なのであって、媒介業者であるBについて記載する必要はない。よって、本肢は誤り。"]},{"id":43,"cat":"宅建業法","title":"営業保証金","ans":2,"q":"宅地建物取引業者の営業保証金に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはどれか。なお、この問において、「還付請求権者」とは、同法第27条第1項の規定に基づき、営業保証金の還付を請求する権利を有する者をいう。","choices":["宅地建物取引業者は、宅地建物取引業に関し不正な行為をし、情状が特に重いとして免許を取り消されたときであっても、営業保証金を取り戻すことができる場合がある。","宅地建物取引業者は、免許の有効期間満了に伴い営業保証金を取り戻す場合は、還付請求権者に対する公告をすることなく、営業保証金を取り戻すことができる。","宅地建物取引業者は、一部の支店を廃止したことにより、営業保証金の額が政令で定める額を超えた場合は、還付請求権者に対し所定の期間内に申し出るべき旨を公告し、その期間内にその申出がなかったときに、その超過額を取り戻すことができる。","宅地建物取引業者は、宅地建物取引業保証協会の社員となった後において、社員となる前に供託していた営業保証金を取り戻す場合は、還付請求権者に対する公告をすることなく、営業保証金を取り戻すことができる。"],"exp":["1 ○ 宅建業に関し不正または著しく不当な行為をし、情状が特に重い場合は、免許は必ず取り消される（業法66条1項9号、65条2項5号）。この場合、宅建業者であった者またはその承継人は、営業保証金を取り戻すことができる（業法30条1項）。よって、本肢は正しい。","2 × 免許の有効期間満了による取戻しには公告必要。免許の有効期間が満了したときは、宅建業者であった者またはその承継人は、営業保証金を取り戻すことができる（業法30条1項）。この場合の営業保証金の取戻しには、原則として、公告が必要である（業法30条2項）。よって、本肢は誤りであり、本問の正解肢となる。","3 ○ 宅建業者は、一部の事務所を廃止した場合において、営業保証金の額が政令で定める額を超えることとなったときは、その超過額について、取り戻すことができる（業法30条1項）。そして、この場合には、原則として、還付請求権者に対し、6カ月を下らない一定期間内に申し出るべき旨を公告し、その期間内にその申出がなかった場合でなければ、取り戻すことができない（業法30条2項）。よって、本肢は正しい。","4 ○ 宅建業者は、保証協会の社員となったことにより営業保証金を供託することを要しなくなったときは、供託した営業保証金を取り戻すことができる（業法64条の14第1項）。この場合の営業保証金の取戻しには、公告は不要である。よって、本肢は正しい。"]},{"id":44,"cat":"宅建業法","title":"弁済業務保証金","ans":3,"q":"宅地建物取引業保証協会（以下この問において「保証協会」という。）に関する次の記述のうち、正しいものはどれか。","choices":["還付充当金の未納により保証協会の社員の地位を失った宅地建物取引業者は、その地位を失った日から2週間以内に弁済業務保証金を供託すれば、その地位を回復する。","保証協会は、その社員である宅地建物取引業者から弁済業務保証金分担金の納付を受けたときは、その納付を受けた日から2週間以内に、その納付を受けた額に相当する額の弁済業務保証金を供託しなければならない。","保証協会は、弁済業務保証金の還付があったときは、当該還付に係る社員又は社員であった者に対して、当該還付額に相当する額の還付充当金を保証協会に納付すべきことを通知しなければならない。","宅地建物取引業者が保証協会の社員となる前に、当該宅地建物取引業者に建物の貸借の媒介を依頼した者（宅地建物取引業者を除く）は、その取引により生じた債権に関し、当該保証協会が供託した弁済業務保証金について弁済を受ける権利を有しない。"],"exp":["1 × 保証協会の社員の地位を失った後、供託により地位を回復するという制度はない。保証協会の社員である宅建業者が保証協会から還付充当金を納付すべき旨の通知を受けた場合、その日から2週間以内に、還付充当金を納付しなければ社員の地位を失う（業法64条の10第2項、3項）。還付充当金の未納により保証協会の社員の地位を失った場合、その日から1週間以内に営業保証金を供託しなければならない（業法64条の15）。弁済業務保証金を供託することによって社員の地位を回復するといった制度はない。よって、本肢は誤り。","2 × 2週間ではなく、1週間以内に弁済業務保証金を供託しなければならない。宅地建物取引業保証協会は、社員となろうとする宅建業者から弁済業務保証金分担金の納付を受けたときは、その日から1週間以内に、その納付を受けた額に相当する額の弁済業務保証金を供託しなければならない（業法64条の7第1項）。2週間ではなく、1週間である。よって、本肢は誤り。","3 ○ 宅地建物取引業保証協会は、権利の実行により弁済業務保証金の還付があったときは、当該還付に係る社員又は社員であった者に対し、当該還付額に相当する額の還付充当金を宅地建物取引業保証協会に納付すべきことを通知しなければならない（業法64条の10第1項）。よって、本肢は正しく、本問の正解肢となる。","4 × 社員となる前に行った取引を含む。弁済業務保証金から還付を受けるためには、宅建業者と取引した者（宅建業者を除く）が取引により生じた債権を有していることが必要であるが、ここでいう取引には、宅建業者が保証協会の社員となる前にしたものも含まれる（業法64条の8第1項かっこ書）。よって、本肢は誤り。"]},{"id":45,"cat":"宅建業法","title":"住宅瑕疵担保履行法","ans":4,"q":"特定住宅瑕疵担保責任の履行の確保等に関する法律に基づく住宅販売瑕疵担保保証金の供託又は住宅販売瑕疵担保責任保険契約の締結に関する次の記述のうち、正しいものはどれか。","choices":["自ら売主として新築住宅を宅地建物取引業者でない買主に引き渡した宅地建物取引業者は、基準日に係る住宅販売瑕疵担保保証金の供託及び住宅販売瑕疵担保責任保険契約の締結の状況について届出をしなければ、当該基準日から起算して50日を経過した日以後、新たに自ら売主となる新築住宅の売買契約を締結してはならない。","宅地建物取引業者は、自ら売主として新築住宅を販売する場合だけでなく、新築住宅の売買の媒介をする場合においても、住宅販売瑕疵担保保証金の供託又は住宅販売瑕疵担保責任保険契約の締結を行う義務を負う。","住宅販売瑕疵担保責任保険契約は、新築住宅の買主が保険料を支払うことを約し、住宅瑕疵担保責任保険法人と締結する保険契約である。","自ら売主として新築住宅を販売する宅地建物取引業者は、住宅販売瑕疵担保保証金の供託をする場合、当該新築住宅の売買契約を締結するまでに、当該新築住宅の買主に対し、当該供託をしている供託所の所在地、供託所の表示等について記載した書面を交付又は買主の承諾を得て電磁的方法による提供をして説明しなければならない。"],"exp":["1 × 新たな売買契約締結が禁止されるのは、基準日の「翌日」から起算して50日を経過した日以後である。新築住宅を引き渡した宅建業者は、基準日に係る資力確保措置の状況の届出をしなければ、当該基準日の「翌日」から起算して50日を経過した日以後においては、新たに自ら売主となる新築住宅の売買契約を締結してはならない（住宅瑕疵担保履行法13条）。基準日から50日ではない。よって、本肢は誤り。","2 × 媒介業者に資力確保の義務はない。宅建業者は、毎年、基準日から3週間を経過する日までの間において、当該基準日前10年間に自ら売主となる売買契約に基づき買主に引き渡した新築住宅について、当該買主に対する特定住宅販売瑕疵担保責任の履行を確保するため、住宅販売瑕疵担保保証金の供託、又は住宅販売瑕疵担保責任保険契約の資力確保措置を講ずる義務負う（住宅瑕疵担保履行法11条1項、2項）。しかし、媒介業者には資力確保措置を講ずる義務はない。よって、本肢は誤り。","3 × 売主である宅建業者が保険料を支払う契約である。住宅瑕疵担保責任保険契約は、新築住宅を自ら売主として販売する宅建業者が住宅瑕疵担保責任保険法人と締結する保険契約であり、宅建業者が保険料を支払うことを約するものである（住宅瑕疵担保履行法11条2項かっこ書、2条7項1号）。新築住宅の買主が保険料を支払うわけではない。よって、本肢は誤り。","4 ○ 宅建業者は、自ら売主となる新築住宅の買主に対し、当該新築住宅の売買契約を締結するまでに、その住宅販売瑕疵担保保証金の供託をしている供託所の所在地等について、これらの事項を記載した書面を交付し又は買主の承諾を得て電磁的方法による提供をして説明しなければならない（住宅瑕疵担保履行法15条、10条2項、規則21条）。よって、本肢は正しく、本問の正解肢となる。"]}],"5":[],"6":[],"7":[],"8":[]};
const SETLABEL = {"0":"5点免除","1":"第1回","2":"第2回","3":"第3回","4":"第4回","5":"第5回","6":"第6回","7":"第7回","8":"第8回"};

function load(){ try{const d=JSON.parse(localStorage.getItem(KEY)); if(d&&d.rec) return d;}catch(e){} return {rec:{}}; }
function save(){ try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){} }
function rkey(set,id){ return set+"-"+id; }
function rec(set,id){ return db.rec[rkey(set,id)]||null; }
function QS(){ return SETS[curSet]||[]; }
/* 分野の並びは、その回の問番号の並び順に合わせる（未登場の分野はCATSの順で後ろに） */
function catOrder(){
  const seen=[];
  QS().forEach(q=>{ if(seen.indexOf(q.cat)<0) seen.push(q.cat); });
  CATS.forEach(c=>{ if(seen.indexOf(c)<0) seen.push(c); });
  return seen;
}
function getById(id){ return QS().find(q=>q.id===id); }

let quiz={list:[],i:0,correct:0,wrongIds:[],answered:false,single:false,exam:false,picks:{},t0:0,timer:null};
const app=document.getElementById("app");
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function fmt(ms){const s=Math.floor(ms/1000);const m=Math.floor(s/60);return m+":"+String(s%60).padStart(2,"0");}

function header(){
  const qs=QS();
  const total=qs.length;
  const ok=qs.filter(q=>{const r=rec(curSet,q.id);return r&&r.last==="o";}).length;
  const pct=total?ok/total*100:0;
  return '<header><div class="brand">宅建 本試験 過去問模試<small>5点免除＋出る順8回</small></div>'+
  '<div class="goal"><div class="lbl"><span>ゴール：全問を「直近○」にする（'+SETLABEL[curSet]+'）</span><b>'+ok+' / '+total+'</b></div>'+
  '<div class="bar"><i style="width:'+pct+'%"></i></div></div></header>';
}

function tabs(){
  let h='<div class="tabs">';
  Object.keys(SETLABEL).forEach(s=>{
    const has=(SETS[s]&&SETS[s].length>0);
    const cls='tab'+(s===curSet?' on':'')+(has?'':' dis');
    h+='<button class="'+cls+'" '+(has?'onclick="pickSet(\''+s+'\')"':'disabled')+'>'+SETLABEL[s]+(has?'':'（準備中）')+'</button>';
  });
  h+='</div>';
  return h;
}
function pickSet(s){ curSet=s; db.cur=s; save(); home(); }

function home(){
  const qs=QS();
  let html=header()+tabs();
  if(!qs.length){
    html+='<div class="note" style="margin-top:16px">'+SELABEL_note()+'</div>';
    html+=footerBoxes();
    app.innerHTML=html; window.scrollTo(0,0); return;
  }
  const ngList=qs.filter(q=>{const r=rec(curSet,q.id);return r&&r.last==="x";});
  const newCount=qs.filter(q=>!rec(curSet,q.id)).length;
  html+='<div class="modes" style="margin-top:12px">'+
  '<button class="btn primary" onclick="startAll()">全'+qs.length+'問 順番に解く</button>'+
  '<button class="btn gold" onclick="startExam()">模試モード（時間を計って一気に）</button>'+
  '<div class="row2" style="margin-top:0">'+
  '<button class="btn line" onclick="startWrong()" '+(ngList.length?'':'disabled')+'>×だけ潰す ('+ngList.length+')</button>'+
  '<button class="btn line" onclick="startNew()" '+(newCount?'':'disabled')+'>未回答だけ ('+newCount+')</button>'+
  '</div></div>';
  catOrder().forEach(cat=>{
    const cqs=qs.filter(q=>q.cat===cat);
    if(!cqs.length) return;
    html+='<div class="cathead"><h3>'+CATLABEL[cat]+'<span>'+cqs.length+'問</span></h3>'+
    '<button onclick="startCat(\''+cat+'\')">通しで解く</button></div>';
    cqs.forEach(q=>{
      const r=rec(curSet,q.id);
      const cls=r?(r.last==="o"?"ok":"ng"):"";
      const mark=r?(r.last==="o"?"○":"×"):"—";
      const cnt=r?('<b>'+r.a+'</b>回<br><b class="o">○'+r.o+'</b> <b class="x">×'+r.x+'</b>'):'未回答';
      html+='<button class="qrow '+cls+'" onclick="startOne('+q.id+')">'+
      '<span class="st">'+mark+'</span>'+
      '<span class="tt"><b>問'+q.id+'　'+esc(q.title)+'</b><span>'+CATLABEL[cat]+'</span></span>'+
      '<span class="cnt">'+cnt+'</span></button>';
    });
  });
  html+=footerBoxes();
  app.innerHTML=html;
  const vta=document.getElementById("vta"); if(vta) vta.value=buildVerifyText();
  window.scrollTo(0,0);
}
function SELABEL_note(){ return SETLABEL[curSet]+'の問題はまだ登録されていません。追加され次第ここに表示されます。'; }

function footerBoxes(){
  let h='<h2>端末間の同期（PC⇔スマホ）</h2>'+
  '<div class="gptbox"><p>進めた端末で「同期コードをコピー」→ もう一方の端末で「取り込み」に貼り付けると、全回の解答記録がそのまま移る。</p>'+
  '<button class="btn line" id="syncbtn" onclick="copySync()">同期コードをコピー</button>'+
  '<button class="btn soft" style="margin-top:8px" onclick="importSync()">同期コードを取り込み</button></div>';
  if(QS().length){
    h+='<h2>GPTで検証（'+SETLABEL[curSet]+'）</h2>'+
    '<div class="gptbox"><p>この回の全問＋正解＋解説を検証プロンプト付きでコピー。GPTに貼って読み込みミスがないかチェック。</p>'+
    '<button class="btn line" id="cpbtn" onclick="copyVerify()">検証用テキストをコピー</button>'+
    '<button class="btn soft" style="margin-top:8px" onclick="toggleVerify()">テキストを表示/非表示</button>'+
    '<textarea id="vta" readonly></textarea></div>';
  }
  h+='<button class="btn soft" style="margin-top:14px" onclick="resetSet()">この回（'+SETLABEL[curSet]+'）の記録をリセット</button>'+
  '<footer>データはこの端末のブラウザ内に保存</footer>';
  return h;
}
function resetSet(){ if(confirm(SETLABEL[curSet]+'の解答記録を消す？')){ QS().forEach(q=>{delete db.rec[rkey(curSet,q.id)];}); save(); home(); } }

function startAll(){ run(QS().map(q=>q.id),false,false); }
function startCat(cat){ run(QS().filter(q=>q.cat===cat).map(q=>q.id),false,false); }
function startWrong(){ run(QS().filter(q=>{const r=rec(curSet,q.id);return r&&r.last==="x";}).map(q=>q.id),false,false); }
function startNew(){ run(QS().filter(q=>!rec(curSet,q.id)).map(q=>q.id),false,false); }
function startOne(id){ run([id],true,false); }
function startExam(){ if(confirm(SETLABEL[curSet]+' 全'+QS().length+'問を模試モードで解く。途中で正解・解説は出ません。始める？')) run(QS().map(q=>q.id),false,true); }
function run(list,single,exam){
  if(!list.length)return;
  stopTimer();
  quiz={list:list.slice(),i:0,correct:0,wrongIds:[],answered:false,single:single,exam:exam,picks:{},t0:Date.now(),timer:null};
  if(exam){ quiz.timer=setInterval(tick,1000); }
  renderQ();
}
function stopTimer(){ if(quiz.timer){clearInterval(quiz.timer);quiz.timer=null;} }
function tick(){ const el=document.getElementById("tm"); if(el) el.textContent="⏱ "+fmt(Date.now()-quiz.t0); }
function getQ(){ return getById(quiz.list[quiz.i]); }

function renderQ(){
  const q=getQ();
  quiz.answered=false;
  const r=rec(curSet,q.id);
  const pct=Math.round(quiz.i/quiz.list.length*100);
  let top='<div class="qtop" style="margin-top:14px"><span class="chip '+CATCLS[q.cat]+'">'+CATLABEL[q.cat]+'　問'+q.id+'</span>';
  if(quiz.exam){ top+='<span class="timer" id="tm">⏱ '+fmt(Date.now()-quiz.t0)+'</span><span class="qnum">'+(quiz.i+1)+' / '+quiz.list.length+'</span>'; }
  else if(!quiz.single){ top+='<span class="qnum">'+(quiz.i+1)+' / '+quiz.list.length+'</span>'; }
  top+='</div>';
  const hist=(!quiz.exam&&r)?('<div class="qhist">これまで <b>'+r.a+'回</b>解いて <b class="o">○'+r.o+'</b> / <b class="x">×'+r.x+'</b></div>'):(!quiz.exam?'<div class="qhist">初挑戦</div>':'');
  const pbar=(quiz.single?'':'<div class="pbar"><i style="width:'+pct+'%"></i></div>');
  app.innerHTML=header()+top+pbar+hist+
  '<div class="qtext">'+esc(q.q)+'</div>'+
  q.choices.map((c,idx)=>'<button class="choice" id="ch'+idx+'" onclick="answer('+idx+')"><span class="no">'+(idx+1)+'</span><span>'+esc(c)+'</span></button>').join('')+
  '<div id="after"></div>'+
  '<button class="btn soft" style="margin-top:6px" onclick="leaveQuiz()">'+(quiz.exam?'中断して一覧へ':'一覧に戻る')+'</button>';
  window.scrollTo(0,0);
}
function leaveQuiz(){ stopTimer(); home(); }

function answer(idx){
  if(quiz.answered) return;
  const q=getQ();
  const okAns=q.ans-1;
  const good=(idx===okAns);
  // record stats (both modes)
  const k=rkey(curSet,q.id);
  const r=db.rec[k]||{a:0,o:0,x:0};
  r.a++; good?r.o++:r.x++; r.last=good?"o":"x";
  db.rec[k]=r; save();
  quiz.picks[q.id]=idx;
  if(good) quiz.correct++; else quiz.wrongIds.push(q.id);
  if(quiz.exam){
    // mark pick, brief, auto-advance
    const el=document.getElementById("ch"+idx); if(el){el.classList.add("pick");}
    q.choices.forEach((c,i2)=>{const e=document.getElementById("ch"+i2); if(e)e.disabled=true;});
    setTimeout(()=>{ if(quiz.i===quiz.list.length-1){ examResult(); } else { quiz.i++; renderQ(); } }, 180);
    return;
  }
  quiz.answered=true;
  q.choices.forEach((c,i2)=>{
    const el=document.getElementById("ch"+i2);
    el.disabled=true;
    if(i2===okAns) el.classList.add("sel-ok");
    else if(i2===idx) el.classList.add("sel-ng");
    else el.classList.add("dim");
  });
  let nextBtns;
  if(quiz.single){
    const ids=QS().map(x=>x.id); const pos=ids.indexOf(q.id); const nid=(pos>=0&&pos<ids.length-1)?ids[pos+1]:null;
    nextBtns=(nid?'<button class="btn primary" onclick="startOne('+nid+')">次の問題（問'+nid+'）</button>':'')+
    '<button class="btn soft" style="margin-top:8px" onclick="home()">一覧に戻る</button>';
  }else{
    const last=(quiz.i===quiz.list.length-1);
    nextBtns='<button class="btn primary" onclick="'+(last?'result()':'next()')+'">'+(last?'結果を見る':'次の問題へ')+'</button>';
  }
  document.getElementById("after").innerHTML=
  '<div class="verdict '+(good?'ok':'ng')+'">'+(good?'正解！':'不正解…　正解は '+q.ans)+'</div>'+
  '<div class="exp"><div class="hd">解説</div>'+q.exp.map(e=>'<p>'+esc(e)+'</p>').join('')+'</div>'+nextBtns;
  document.getElementById("after").scrollIntoView({behavior:"smooth",block:"start"});
}
function next(){ quiz.i++; renderQ(); }
function result(){
  stopTimer();
  const n=quiz.list.length;
  const missHtml=quiz.wrongIds.length?
  '<div class="rlist">'+quiz.wrongIds.map(id=>{const q=getById(id);return '<button class="rrow ng" onclick="reviewOne('+id+')"><span class="st">×</span><span class="tt"><b>問'+id+'　'+esc(q.title)+'</b><span>正解 '+q.ans+'・タップで解説</span></span></button>';}).join('')+'</div>':'';
  app.innerHTML=header()+
  '<div class="score"><b>'+quiz.correct+'<span style="font-size:20px;color:var(--sub)"> / '+n+'</span></b><br><span>'+(quiz.correct===n?'全問正解。仕上がってる。':'×を潰せば勝ち。')+'</span></div>'+
  missHtml+
  '<div class="modes" style="margin-top:18px">'+
  (quiz.wrongIds.length?'<button class="btn primary" onclick="retryWrong()">今の間違いだけやり直す</button>':'')+
  '<button class="btn soft" onclick="home()">一覧に戻る</button>'+
  '</div>';
  window.scrollTo(0,0);
}
function examResult(){
  stopTimer();
  const n=quiz.list.length;
  const elapsed=Date.now()-quiz.t0;
  const rows=quiz.list.map(id=>{
    const q=getById(id); const pick=quiz.picks[id]; const good=(pick===q.ans-1);
    return '<button class="rrow '+(good?'ok':'ng')+'" onclick="reviewOne('+id+')"><span class="st">'+(good?'○':'×')+'</span><span class="tt"><b>問'+id+'　'+esc(q.title)+'</b><span>'+CATLABEL[q.cat]+'・あなた '+(pick==null?'-':pick+1)+' / 正解 '+q.ans+'</span></span></button>';
  }).join('');
  app.innerHTML=header()+
  '<div class="score"><b>'+quiz.correct+'<span style="font-size:20px;color:var(--sub)"> / '+n+'</span></b><span class="tm">所要時間 '+fmt(elapsed)+'　（本試験ペース目安 '+n+'問'+Math.round(n*2.4)+'分）</span></div>'+
  '<div class="modes" style="margin-top:14px">'+
  (quiz.wrongIds.length?'<button class="btn primary" onclick="retryWrong()">間違い（'+quiz.wrongIds.length+'問）だけやり直す</button>':'')+
  '<button class="btn soft" onclick="home()">一覧に戻る</button></div>'+
  '<h2>全問の結果（タップで解説）</h2><div class="rlist">'+rows+'</div>';
  window.scrollTo(0,0);
}
function reviewOne(id){
  const q=getById(id); const pick=quiz.picks[id];
  const okAns=q.ans-1;
  app.innerHTML=header()+
  '<div class="qtop" style="margin-top:14px"><span class="chip '+CATCLS[q.cat]+'">'+CATLABEL[q.cat]+'　問'+q.id+'　'+esc(q.title)+'</span></div>'+
  '<div class="qtext">'+esc(q.q)+'</div>'+
  q.choices.map((c,idx)=>{
    let cls='choice';
    if(idx===okAns) cls+=' sel-ok';
    else if(pick!=null&&idx===pick) cls+=' sel-ng';
    else cls+=' dim';
    return '<div class="'+cls+'"><span class="no">'+(idx+1)+'</span><span>'+esc(c)+'</span></div>';
  }).join('')+
  '<div class="verdict '+(pick===okAns?'ok':'ng')+'">'+(pick===okAns?'正解！':'正解は '+q.ans)+'</div>'+
  '<div class="exp"><div class="hd">解説</div>'+q.exp.map(e=>'<p>'+esc(e)+'</p>').join('')+'</div>'+
  '<button class="btn soft" onclick="backToResult()">結果一覧に戻る</button>';
  window.scrollTo(0,0);
}
function backToResult(){ if(quiz.exam) examResult(); else result(); }
function retryWrong(){ run(quiz.wrongIds.slice(),false,false); }

function syncCode(){ return "HK1."+btoa(unescape(encodeURIComponent(JSON.stringify(db.rec)))); }
function copySync(){
  const t=syncCode();
  const done=()=>{const b=document.getElementById("syncbtn");b.textContent="コピーした！もう一方の端末で取り込み";b.classList.add("copied");setTimeout(()=>{b.textContent="同期コードをコピー";b.classList.remove("copied");},2500);};
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done).catch(()=>{prompt("このコードをコピーして",t);}); }
  else{ prompt("このコードをコピーして",t); }
}
function importSync(){
  const t=prompt("同期コードを貼り付けて");
  if(!t) return;
  const s=t.trim();
  if(s.indexOf("HK1.")!==0){ alert("コードの形式が違う"); return; }
  try{
    const rec=JSON.parse(decodeURIComponent(escape(atob(s.slice(4)))));
    if(typeof rec!=="object"||rec===null) throw 0;
    if(!confirm("この端末の記録をコードの内容で置き換える？")) return;
    db.rec=rec; save(); home();
    alert("同期完了");
  }catch(e){ alert("読み込めなかった。コードをもう一度コピーして試して"); }
}

function buildVerifyText(){
  const qs=QS();
  let t="以下は宅建"+(curSet==="0"?"（登録講習／5点免除）の教科書問題集":"（本試験）過去問模試")+"の書き起こしです（"+SETLABEL[curSet]+"／全"+qs.length+"問）。\n";
  t+="OCRの読み間違い・選択肢の脱落・「正解」や解説の誤りがないか、1問ずつ検証してください。\n";
  t+="特に、正解番号が問題文・選択肢と整合しているか、最新の法改正と矛盾しないかを重点的に確認し、怪しい箇所は問番号を挙げて指摘してください。\n\n";
  qs.forEach(q=>{
    t+="====================\n【問"+q.id+"】"+CATLABEL[q.cat]+"／"+q.title+"\n"+q.q+"\n\n";
    q.choices.forEach((c,i)=>{ t+=(i+1)+". "+c+"\n"; });
    t+="\n正解："+q.ans+"\n解説：\n";
    q.exp.forEach(e=>{ t+="・"+e+"\n"; });
    t+="\n";
  });
  return t;
}
function copyVerify(){
  const t=buildVerifyText();
  const done=()=>{const b=document.getElementById("cpbtn");b.textContent="コピーした！GPTに貼り付けてOK";b.classList.add("copied");setTimeout(()=>{b.textContent="検証用テキストをコピー";b.classList.remove("copied");},2500);};
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done).catch(()=>{fallbackCopy(t);done();}); }
  else{ fallbackCopy(t); done(); }
}
function fallbackCopy(t){
  const ta=document.getElementById("vta"); if(!ta)return; ta.style.display="block"; ta.value=t; ta.select();
  try{document.execCommand("copy");}catch(e){}
}
function toggleVerify(){
  const ta=document.getElementById("vta");
  ta.style.display = ta.style.display==="block"?"none":"block";
}
home();
</script>
</body>
</html>
