<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>宅建 本試験 過去問模試</title>
<style>
:root{
  --bg:#FFFFFF; --panel:#F7F8FA; --ink:#1B2430; --sub:#68758A;
  --line:#E5E9F0; --navy:#16294F;
  --gold:#C99B2E; --ok:#1FA971; --okbg:#E9F8F1; --ng:#E05252; --ngbg:#FDEDED;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;line-height:1.7;font-size:15px}
#app{max-width:600px;margin:0 auto;padding:16px 16px 48px}
header{padding:6px 0 12px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand{font-weight:700;font-size:16px}
.brand small{margin-left:8px;font-weight:500;color:var(--sub);font-size:11px;letter-spacing:.10em}
.goal{margin-top:10px}
.goal .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);font-weight:600;margin-bottom:5px}
.goal .lbl b{color:var(--ok)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:.2s}
h2{font-size:12px;color:var(--sub);font-weight:700;letter-spacing:.12em;margin:22px 0 8px}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;text-align:center}
.btn.primary{background:var(--navy);color:#fff}
.btn.gold{background:var(--gold);color:#fff}
.btn.line{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.soft{background:var(--panel);color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.row2{display:flex;gap:10px;margin-top:10px}
.row2 .btn{flex:1}
/* set tabs */
.tabs{display:flex;gap:6px;margin-bottom:6px;overflow-x:auto}
.tab{flex:none;border:1.5px solid var(--line);background:#fff;color:var(--sub);border-radius:999px;font-size:13px;font-weight:700;padding:7px 14px;cursor:pointer}
.tab.on{border-color:var(--navy);background:var(--navy);color:#fff}
.tab.dis{opacity:.45;cursor:default}
/* category list */
.cathead{display:flex;align-items:center;justify-content:space-between;margin:20px 0 8px}
.cathead h3{font-size:14px;font-weight:800}
.cathead h3 span{font-size:11px;color:var(--sub);font-weight:600;margin-left:6px}
.cathead button{border:1px solid var(--navy);color:var(--navy);background:#fff;border-radius:999px;font-size:12px;font-weight:700;padding:5px 12px;cursor:pointer}
.qrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;cursor:pointer;color:var(--ink)}
.qrow .st{flex:none;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;background:var(--panel);border:1px solid var(--line);color:#B6BFCC}
.qrow.ok .st{background:var(--okbg);border-color:#BFE8D6;color:var(--ok)}
.qrow.ng .st{background:var(--ngbg);border-color:#F5C9C9;color:var(--ng)}
.qrow .tt{flex:1;min-width:0}
.qrow .tt b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .tt span{font-size:11px;color:var(--sub)}
.qrow .cnt{flex:none;text-align:right;font-size:11px;color:var(--sub);line-height:1.5}
.qrow .cnt b{font-size:12px}
.qrow .cnt .o{color:var(--ok)} .qrow .cnt .x{color:var(--ng)}
/* quiz */
.qtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px}
.chip{font-size:11px;font-weight:700;color:var(--navy);background:#EDF1F9;border-radius:6px;padding:3px 9px;line-height:1.5}
.chip.c1{color:#16294F;background:#EDF1F9}
.chip.c2{color:#7A4A0E;background:#FBF2E2}
.chip.c3{color:#175E4C;background:#E7F5F0}
.chip.c4{color:#7A2E5B;background:#F7E9F1}
.qnum{font-size:12px;color:var(--sub);font-weight:600;flex:none}
.timer{font-size:12px;color:var(--gold);font-weight:800;flex:none;font-variant-numeric:tabular-nums}
.pbar{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.pbar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.qhist{font-size:11px;color:var(--sub);margin-bottom:10px}
.qhist b.o{color:var(--ok)} .qhist b.x{color:var(--ng)}
.qtext{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14px;white-space:pre-wrap;margin-bottom:14px}
.choice{display:flex;gap:10px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:14px;line-height:1.65;margin-bottom:10px;cursor:pointer;color:var(--ink)}
.choice .no{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--sub)}
.choice.sel-ok{border-color:var(--ok);background:var(--okbg)}
.choice.sel-ok .no{border-color:var(--ok);background:var(--ok);color:#fff}
.choice.sel-ng{border-color:var(--ng);background:var(--ngbg)}
.choice.sel-ng .no{border-color:var(--ng);background:var(--ng);color:#fff}
.choice.pick{border-color:var(--navy);background:#EDF1F9}
.choice.pick .no{border-color:var(--navy);background:var(--navy);color:#fff}
.choice.dim{opacity:.45}
.verdict{font-size:20px;font-weight:800;margin:4px 0 10px}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.exp{background:#FBF7EC;border:1px solid #EADFC2;border-radius:12px;padding:13px 14px;font-size:13px;margin-bottom:14px}
.exp p{margin-bottom:6px}
.exp p:last-child{margin-bottom:0}
.exp .hd{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:.12em;margin-bottom:6px}
.src{font-size:11px;color:var(--sub);margin-bottom:12px}
/* result */
.score{text-align:center;padding:22px 0 6px}
.score b{font-size:44px;font-weight:800}
.score span{color:var(--sub);font-size:15px}
.score .tm{display:block;margin-top:4px;font-size:13px;color:var(--sub)}
.rlist{margin-top:14px}
.rrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:7px;cursor:pointer;color:var(--ink)}
.rrow .st{flex:none;width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.rrow.ok .st{background:var(--okbg);color:var(--ok)} .rrow.ng .st{background:var(--ngbg);color:var(--ng)}
.rrow .tt{flex:1;min-width:0}
.rrow .tt b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .tt span{font-size:10.5px;color:var(--sub)}
/* boxes */
.gptbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.gptbox p{font-size:13px;color:var(--sub);margin-bottom:10px}
textarea{width:100%;height:200px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:11px;color:var(--ink);background:#fff;margin-top:10px;display:none}
.copied{color:var(--ok)!important}
.note{font-size:12px;color:var(--sub);background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:12px;text-align:center}
footer{margin-top:30px;text-align:center;font-size:11px;color:var(--sub)}
.modes{display:flex;flex-direction:column;gap:10px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SETS = {"0":[{"id":1,"cat":"宅建業法","title":"宅地建物取引業とは","ans":2,"q":"宅地建物取引業の免許(以下「免許」という。)に関する次の記述のうち、正しいものはどれか。","choices":["農家がその所有する農地を宅地に転用して売却しようとするときに、その販売代理の依頼を受ける社会福祉法人は、これを反復継続して不特定多数に売却する場合であっても、免許を必要としない。","相続財産である3棟のマンションを、そのうちの2棟を一括して売却し、残りの1棟を宅地建物取引業者に媒介を依頼して反復継続して賃貸する場合、当該マンションを単独で相続した相続人は免許を必要としない。","現在は倉庫が建っているが、将来道路となることが予定されている10区画の土地を分譲する場合、免許を必要としない。","信託業法第3条の免許を受けた信託会社が宅地建物取引業を営もうとする場合、免許を取得する必要はないが、その旨を内閣総理大臣に届け出ることが必要である。"],"exp":["1 × 売買の代理を業として行うには原則免許が必要。社会福祉法人は例外(国・地方公共団体等)に当たらない。","2 ○ 2棟の一括売却は反復継続でないため「業」に当たらず、1棟の賃貸は自ら貸主となるため「取引」に当たらない。","3 × 現に建物が建っている土地は「宅地」。将来道路予定でも10区画の分譲には免許が必要。","4 × 信託会社は免許不要だが、届出先は国土交通大臣(内閣総理大臣ではない)。"]},{"id":2,"cat":"宅建業法","title":"免許申請と事務所","ans":3,"q":"次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはいくつあるか。\n\nア 事務所に従事する専任の宅地建物取引士は、主たる業務が宅地建物取引業でなければならず、空き家・空き室等の利活用等に係る課題の整理等、その所有者に対して行われる助言又は管理業務等を行う場合は、専任としての要件を欠くことになる。\n\nイ 個人の宅地建物取引士が宅地建物取引業者となっている宅地建物取引業の事務所において、当該個人が同一の場所において土地家屋調査士の業務をあわせて行う場合には、同所の専任の宅地建物取引士と認められることとはない。\n\nウ 支店のみで宅地建物取引業を営む宅地建物取引業者は、支店だけでなく本店においてもその業務に関する帳簿を備えなければならない。","choices":["なし","一つ","二つ","三つ"],"exp":["ア × 空き家・空き室等の利活用に係る助言や管理業務等を行っても、専任の要件を欠くことにはならない(誤り)。","イ × 業務量等を勘案のうえ専任と認められる場合があり、「絶対に認められない」わけではない(誤り)。","ウ ○ 本店は主たる事務所として宅建業法上の「事務所」に当たるため、帳簿は本店にも備える必要がある(正しい)。","→ 誤っているのはア・イの二つ。"]},{"id":3,"cat":"宅建業法","title":"免許欠格事由","ans":2,"q":"宅地建物取引業の免許に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものの組合せはどれか。\n\nア A社の政令で定める使用人は、刑法第247条(背任)の罪を犯し、罰金の刑に処せられたが、その刑の執行を終えてから5年を経過しているので、A社は免許を受けることができる。\n\nイ B社の取締役が、刑法第204条(傷害)の罪で拘禁刑2年執行猶予4年の刑に処せられ、その刑が確定した日から、執行猶予期間の半分である2年を経過していれば、B社は免許を受けることができる。\n\nウ 個人Cは、かつて免許を受けていたとき、自己の名義をもって他人に宅地建物取引業を営ませ、その情状が特に重いとして免許を取り消されたが、免許取消しの日から5年を経過していないので、Cは免許を受けることができない。\n\nエ 個人Dは、かつて破産手続開始の決定を受け、現在は復権を得ているが、復権を得た日から5年を経過していないので、Dは免許を受けることができない。","choices":["アとイ","アとウ","イとエ","ウとエ"],"exp":["ア ○ 背任罪の罰金刑は欠格事由だが、刑の執行後5年を経過しているのでA社は免許を受けられる。","イ × 執行猶予期間が満了すれば直ちに免許可だが、確定から2年時点ではまだ猶予期間中なので不可。","ウ ○ 名義貸しで情状特に重いとして免許取消 → 取消日から5年経過しないと免許不可。","エ × 破産者でも復権を得れば直ちに免許を受けられる(5年待つ必要なし)。"]},{"id":4,"cat":"宅建業法","title":"免許取得後の事情変更","ans":1,"q":"甲県に本店、乙県にa支店を置き国土交通大臣の免許を受けている宅地建物取引業者A(個人)は、a支店の専任の取引士Bが不在になり、宅地建物取引業法第31条の3の要件を欠くこととなった。この場合のAの手続に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはいくつあるか。\n\nア 本店のみで宅地建物取引業を行う場合、Aは、a支店が所在する乙県知事を経由して国土交通大臣に免許換えの申請を行う必要がある。\n\nイ a支店に専任の取引士Cを置き、宅地建物取引業を行う場合、Aは、Cを置いた日から30日以内に専任の取引士の変更の届出を行う必要がある。\n\nウ 宅地建物取引業を廃止した場合、Aは、甲県知事を経由して国土交通大臣に30日以内に廃業の届出を行う必要がある。\n\nエ Aは、Bが半年間の入院をしたため、この期間、宅地建物取引業は行わないこととした場合、Aは宅地建物取引業を休止する旨の届出を行う必要がある。","choices":["一つ","二つ","三つ","四つ"],"exp":["ア × 唯一の支店を廃止し甲県内のみの事務所になる場合、甲県知事へ直接免許換えの申請をする(乙県知事経由ではない)。","イ ○ 専任の取引士の変更は30日以内に届出が必要。","ウ × 大臣免許業者の廃業届は直接国土交通大臣へ。知事は経由しない。","エ × 宅建業を「休止する旨の届出」の規定は宅建業法に存在しない(なお1年以上休止は免許取消事由)。","→ 正しいのはイの一つ。","【法改正注意】2024年5月25日以降、大臣免許の免許申請・変更届・廃業届等は知事経由が廃止され、国土交通大臣側へ直接提出。古い教材の「知事経由が正解」はもう通用しない。"]},{"id":5,"cat":"宅建業法","title":"宅地建物取引業保証協会","ans":3,"q":"宅地建物取引業保証協会(以下この問において「保証協会」という。)に関する次の記述のうち、正しいものはどれか。","choices":["還付充当金の未納により保証協会の社員の地位を失った宅地建物取引業者は、その地位を失った日から2週間以内に弁済業務保証金を供託すれば、その地位を回復する。","保証協会は、その社員である宅地建物取引業者から弁済業務保証金分担金の納付を受けたときは、その納付を受けた日から5日以内に、その納付を受けた額に相当する額の弁済業務保証金を供託しなければならない。","保証協会は、弁済業務保証金の還付があったときは、当該還付に係る社員又は社員であった者に対して、当該還付額に相当する額の還付充当金を保証協会に納付すべきことを通知しなければならない。","宅地建物取引業者が保証協会の社員となる前に、当該宅地建物取引業者に建物の貸借の媒介を依頼した者は、その取引により生じた債権に関し、当該保証協会が供託した弁済業務保証金について弁済を受ける権利を有しない。"],"exp":["1 × 社員の地位を失ったときは1週間以内に営業保証金を供託する。「2週間以内の供託で地位回復」という規定はない。","2 × 分担金の納付を受けた日から1週間以内に供託(5日以内ではない)。","3 ○ 還付があったときは、社員(または社員だった者)に還付充当金の納付を通知しなければならない。","4 × 社員になる前の宅建業の取引で生じた債権者も弁済を受ける権利に含まれる。"]},{"id":6,"cat":"宅建業法","title":"広告規制と契約締結時期の制限","ans":2,"q":"次の記述のうち、宅地建物取引業法の規定によれば、正しいものはいくつあるか。なお、この問において「建築確認」とは、建築基準法第6条第1項の確認をいうものとする。\n\nア 宅地建物取引業者は、建築確認が必要とされる建物の建築に関する工事の完了前においては、建築確認を受けた後でなければ、当該建物の交換の代理をしてはならない。\n\nイ 宅地建物取引業者は、建築確認が必要とされる建物の建築に関する工事の完了前において、建築確認の申請中である場合は、その旨を表示すれば、自ら売主として当該建物を販売する旨の広告をすることができる。\n\nウ 宅地建物取引業者は、建築確認が必要とされる建物の建築に関する工事の完了前においては、建築確認を受けた後でなければ、当該建物の貸借の代理を行う旨の広告をしてはならない。","choices":["一つ","二つ","三つ","なし"],"exp":["ア ○ 建築確認前は、売買・交換の契約締結、その代理・媒介をしてはならない(法36条)。","イ × 「建築確認申請中」と表示しても広告はできない(法33条)。","ウ ○ 貸借の代理・媒介の「広告」も建築確認前は不可(契約自体は制限されないが広告はダメ)。","→ 正しいのはア・ウの二つ。"]},{"id":7,"cat":"宅建業法","title":"媒介・代理契約","ans":1,"q":"宅地建物取引業者Aは、BからB所有の宅地の売却について媒介の依頼を受けた。この場合における次の記述のうち、宅地建物取引業法(以下この問において「法」という。)の規定によれば、正しいものはどれか。","choices":["Aは、Bとの間に媒介契約を締結したときは、当該契約が国土交通大臣が定める標準媒介契約約款に基づくものであるか否かの別を、法第34条の2第1項の規定に基づき交付すべき書面等に記載しなければならない。","Aは、Bとの間で媒介契約を締結し、Bに対して当該宅地を売却すべき価額又はその評価額について意見を述べるときは、その根拠を書面で明らかにしなければならない。","Aは、Bとの間に専属専任媒介契約を締結したときは、当該宅地の取引の申込みの受付に関する状況を含む所定の事項を指定流通機構に登録しなければならないが、Bが当該状況を確認するため、直接、同機構が管理する情報にアクセスすることはできない。","Aは、Bとの間で有効期間を1月とする専任媒介契約を締結する際、「Bが媒介契約を更新する旨を申し出ない場合は、有効期間満了により自動更新するものとする」旨の特約を定めることができる。"],"exp":["1 ○ 標準媒介契約約款に基づくか否かの別は、一般媒介契約でも34条の2書面の記載事項。","2 × 価額・評価額に意見を述べるときは根拠を明らかにすれば足り、書面である必要はない。","3 × 依頼者は指定流通機構のステータス管理機能を通じて、申込み受付状況等の登録内容を確認できる。","4 × 専任媒介契約の自動更新特約は無効。更新には依頼者からの申出が必要(3か月上限)。"]},{"id":8,"cat":"宅建業法","title":"報酬額の制限","ans":4,"q":"宅地建物取引業者A社(消費税課税事業者)は貸主Bから建物の貸借の代理の依頼を受け、宅地建物取引業者C社(消費税課税事業者)は借主Dから媒介の依頼を受け、BとDの間で賃貸借契約を成立させた。この場合における次の記述のうち、宅地建物取引業法(以下この問において「法」という。)の規定によれば誤っているものはどれか。なお1か月分の借賃は10万円である。","choices":["建物を住居として貸借する場合、C社は、Dから承諾を得ているときは、110,000円まで報酬をDから受領することができる。","建物を店舗として貸借する場合、A社がBから110,000円の報酬を受領するときは、C社はDから報酬を受領することはできない。","建物を店舗として貸借する場合、本件賃貸借契約において300万円の権利金(返還されない金銭)の授受があるときは、A社及びC社が受領できる報酬の額の合計は、308,000円以内である。","建物が1年を超えるような期間にわたり居住者が不在となっていた場合、A社は、報酬額についてBに説明し、合意を得ていれば、Bから330,000円まで報酬を受領することができる。"],"exp":["1 ○ 居住用でも依頼者の承諾があれば、借賃1.1か月分=110,000円まで受領できる。","2 ○ 貸借の報酬は双方合計で借賃1.1か月分=110,000円が上限。A社が全額受領したらC社は受領できない。","3 ○ 非居住用は権利金を売買代金とみなして計算可。300万×4%+2万=14万、14万×2社×1.1=308,000円。","4 × 長期の空家等(1年超不在はその典型例)は、媒介に要する費用を勘案し事前に説明・合意すれば貸主から原則上限を超えて受領できるが、双方から受ける報酬の合計は借賃の2.2倍=220,000円以内。330,000円は受領できない(誤り)。"]},{"id":9,"cat":"宅建業法","title":"クーリング・オフ","ans":1,"q":"売主を宅地建物取引業者であるA、買主を宅地建物取引業者でないBとする宅地の売買契約について、Bが、宅地建物取引業法第37条の2の規定に基づくいわゆるクーリング・オフによる契約の解除をする場合に関する次の記述のうち、誤っているものの組合せはどれか。\n\nア Aが、売買契約を締結した際に、売買契約の解除ができる旨及びその方法について口頭でのみ説明した場合は、その告知した日から起算して9日後で、かつ、代金の一部を支払った後であれば、Bは、クーリング・オフによる契約の解除をすることができない。\n\nイ Aが、電話によりBの自宅で売買契約に関する説明をする旨を申し出て、Bの自宅を訪問し、そこで買受けの申込みを受けた場合は、Bは、クーリング・オフによる契約の解除をすることができない。\n\nウ Aが、10区画に分けた宅地の分譲について宣伝のみを行う現地案内所でBに契約に関する説明を行い、翌日Aの事務所等から近くのホテルのロビーで売買契約を締結した場合は、Bは、クーリング・オフによる契約の解除をすることができる。\n\nエ Aが、売買契約を締結した後、宅地をBに引き渡し、かつ、その代金の全部を受領した場合は、売買契約の解除ができる旨及びその方法について告知をしていないときでも、Bは、クーリング・オフによる契約の解除をすることができない。","choices":["アとイ","ウとエ","イとウ","イとエ"],"exp":["ア 誤り。口頭のみの告知では8日間のカウントは始まらず、代金の一部支払だけでは失権要件(引渡し+全額支払)を満たさない → 解除できる。","イ 誤り。売主側から申し出た買主の自宅は「事務所等」に当たらない → 解除できる。","ウ 正しい。ホテルのロビーは事務所等に当たらない → 解除できる。","エ 正しい。引渡し+代金全部の支払があれば、告知の有無にかかわらず解除できない。","→ 誤っているのはアとイ。"]},{"id":10,"cat":"宅建業法","title":"損害賠償額の予定・手付金・保全措置","ans":2,"q":"宅地建物取引業者Aが、自ら売主として、宅地建物取引業者でないBとの間でマンション(代金4,000万円)の売買契約を締結した場合に関する次の記述のうち、宅地建物取引業法(以下この問において「法」という。)の規定に違反するものの組合せはどれか。\n\nア Aは、建築工事完了前のマンションの売買契約を締結する際に、Bから手付金200万円を受領し、さらに建築工事中に200万円を中間金として受領する前に、当該手付金と中間金について法第41条に定める保全措置を講じた。\n\nイ Aは、建築工事完了後のマンションの売買契約を締結する際に、法第41条の2に定める保全措置を講じることなくBから手付金800万円を受領した。\n\nウ Aは、建築工事完了前の売買契約を締結する際に、Bから手付金500万円を受領したが、Bに当該手付金500万円を償還して、契約を一方的に解除した。\n\nエ Aは、建築工事完了後のマンションの売買契約を締結する際に、当事者の債務の不履行を理由とする契約の解除に伴う損害賠償の予定額を800万円とする特約を定めた。","choices":["ア、ウ","イ、ウ","ア、イ、エ","ア、ウ、エ"],"exp":["ア 合法。手付金200万円だけの段階では代金の5%以下かつ1,000万円以下なので保全措置なしで受領可。その後、中間金を受け取る前に手付金を含む合計400万円について保全措置を講じているため適法。","イ 違反。完成物件は代金の10%(400万円)超で保全措置が必要。措置なしで800万円の受領は違反。","ウ 違反。売主業者が手付解除するには倍額を現実に提供する必要がある。同額の償還だけでの一方的解除は違反。","エ 合法。損害賠償の予定+違約金の合計は代金の20%(800万円)以内まで可。ちょうど800万円はOK。","→ 違反はイとウ。"]},{"id":11,"cat":"権利関係","title":"意思能力・制限行為能力","ans":4,"q":"制限行為能力者に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","choices":["百貨店の販売営業に関する営業を許された未成年者は、成年者と同一の行為能力を有するので、法定代理人の同意を得ないで、自己が居住するために建物を第三者から購入したとしても、その法定代理人は当該売買契約を取り消すことができない。","被保佐人が、その実子(17歳)が負う金銭債務について、代理して時効更新の効力を生ずる承認をする場合は、保佐人の同意を必要とする。","成年後見人が、成年被後見人に代わって、成年被後見人が居住している建物について抵当権を設定する際、後見監督人がいる場合には、後見監督人の許可があれば足り、家庭裁判所の許可は不要である。","被補助人が、補助人の同意を得なければならない行為について、同意を得ていないにもかかわらず、同意書を偽造して相手方に補助人の同意を得たと信じさせていたときは、被補助人は当該行為を取り消すことができない。"],"exp":["1 × 許可の効果は「百貨店の販売営業に関する行為」のみ。自己の居住用建物の購入は含まれず、取り消せる。","2 × 債務の承認は観念の通知であり、保佐人の同意は不要(判例)。","3 × 居住用建物への抵当権設定には家庭裁判所の許可が必要。後見監督人の許可では代替できない。","4 ○ 同意書の偽造は「詐術」に当たり、取り消すことができない(民法21条)。"]},{"id":12,"cat":"権利関係","title":"代理","ans":3,"q":"AはBの代理人として、B所有の甲土地をCに売り渡す売買契約をCと締結した。しかし、Aは甲土地を売り渡す代理権は有していなかった。この場合に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","choices":["BがAに甲土地の貸借に関する代理権を与えるため委任状及び印鑑証明、固定資産税納税証明書等を渡していた場合において、Bは、Aに甲土地を売り渡す具体的な代理権はないことをCが知らなかったことに重大な過失があることを立証したときであっても、Cに甲土地を引き渡す必要がある。","BがAに対し、甲土地に抵当権を設定する代理権を与えていたが、Aが破産したため代理人を解任していた。その半月後になされたAC間の契約は、代理権が消滅した後にさらに権限外の行為をしたものであり、Cの主観的事情に関わらず、Bが責任を負うことはない。","Bが本件売買契約を追認しない間は、Cはこの契約を取り消すことができる。ただし、Cが契約の時において、Aに甲土地を売り渡す具体的な代理権がないことについて悪意の場合は取り消せない。","Cは、Bの追認を得た場合等を除き、Aに対して損害賠償を請求することができるが、Aに代理権がなかったことを過失によって知らなかった場合は、契約時におけるAの主観的事情に関わらず、請求することができない。"],"exp":["1 × 権限外の行為の表見代理は、相手方が代理権のないことを知り、または過失により知らなかった場合には成立しない(重過失は当然に過失に含まれる)。Cの重過失をBが立証すれば免責され、引渡し不要。","2 × 代理権消滅後の表見代理(112条)が成立し得るため、Cの主観的事情次第でBが責任を負う可能性がある。","3 ○ 追認前は相手方は取消可。ただし契約時に無権代理につき悪意なら取り消せない(民法115条)。","4 × 無権代理人が自己に代理権がないことを知っていたときは、相手方に過失があっても責任を負う(117条2項2号) → Aの主観次第で請求できる。"]},{"id":13,"cat":"権利関係","title":"所有・共有","ans":3,"q":"共有に関する次の記述のうち、民法の規定によれば正しいものはどれか。","choices":["共有物を使用する共有者は、別段の合意がある場合を除き、他の共有者に対し、自己の持分を超える使用の対価を償還する義務を負うが、当該使用に関しては自己の財産と同一の注意義務を負うに過ぎない。","各共有者は、他の共有者全員の同意を得なければ、共有物に変更(その形状又は効用の著しい変更を伴わないものを含む。)を加えることができない。","共有者は、共有する建物に、期間を5年とする借地借家法第38条に規定する定期建物賃貸借を設定する場合、共有者全員の同意が必要となる。","裁判所は、共有者の所在が不明であり、共有物の分割について協議が不可能であると判断した場合、職権でその競売を命ずることができる。"],"exp":["1 × 使用する共有者は「善良な管理者の注意」をもって使用しなければならない。自己の財産と同一の注意では足りない。","2 × 軽微変更(形状・効用の著しい変更を伴わないもの)は持分価格の過半数で決められる。「含む」が誤り(正しくは「除く」)。","3 ○ 3年を超える建物賃貸借の設定は共有者全員の同意が必要。5年の定期建物賃貸借は全員同意。","4 × 分割は裁判所への「請求」が必要。請求を待たずに職権で競売命令は出せない。"]},{"id":14,"cat":"権利関係","title":"債務不履行と損害賠償・解除","ans":1,"q":"不動産売買契約(本問では「当該契約」という。)の解除に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","choices":["当該契約に基づく不動産の引渡債務の履行が、その契約の成立の時に売主の責めに帰すべき事由により不能であった場合でも、買主は、その履行の不能によって生じた損害の賠償を請求することができる。","売主は、買主が約束の期日に代金を支払わなかったので、2週間の期間を定めてその履行の催告をした。丁度その2週間後に売主の銀行口座に代金が振り込まれていたが、2週間遅れた分の法定利息が加算されていなかった場合、売主は、当該契約の解除をすることができる。","契約日から半年後に支払う約束であった残代金の支払いが遅延したことで、売主が当該契約を解除した場合、買主は、解除時の現状における不動産のみを返還すればよい。","契約後に売却不動産が滅失し履行不能となった場合、それが買主の責めに帰すべき事由によるものであっても、買主は当該契約を解除することができる。"],"exp":["1 ○ 原始的不能でも契約は有効で、履行不能による損害賠償を請求できる(民法412条の2第2項)。","2 × 期間経過時の不履行が軽微(2週間分の法定利息のみ)であるときは解除できない(541条ただし書)。","3 × 原状回復では受領時以後に生じた果実(賃料等)も返還しなければならない。現状の不動産だけでは足りない。","4 × 債務不履行が債権者(買主)の責めに帰すべき事由によるときは、債権者からの解除はできない(543条)。"]},{"id":15,"cat":"権利関係","title":"売買契約と契約不適合責任","ans":2,"q":"宅地建物取引業者でも事業者でもないAB間の不動産売買契約における売主Aの責任に関する次の記述のうち、民法の規定によれば、誤っているものはどれか。","choices":["Aは、契約不適合の責任を負わない旨の特約をしたときであっても、Bに対して、知りながら告げなかった事実については、その責任を免れることができない。","引き渡された不動産が、品質に関して契約の内容に適合しないものである場合、Bは、相当の期間を定めてAに対して改修工事の実施を催告することができ、その期間内に改修工事が行われなかったときは、改修に掛かる費用の2倍に相当する額が代金から控除される。","引き渡された不動産に品質上契約内容に適合しないものであることについて、AB共に過失があった場合でも、Bは契約不適合を理由に損害賠償を請求することができる。","AがBに不動産を引き渡した場合において、その引渡しがあった時以後にその不動産が地震により全壊したときは、Bは、その全壊を理由として、損害賠償の請求及び契約の解除をすることができず、かつ、代金を支払わなければならない。"],"exp":["1 ○ 免責特約があっても、知りながら告げなかった事実については責任を免れない(民法572条)。","2 × 追完がないときは「不適合の程度に応じた」代金減額請求ができる(563条)。改修費用の2倍が控除されるわけではない(誤り)。","3 ○ 売主側に帰責事由があることが前提だが、買主に過失があっても損害賠償請求は可能。買主の過失は過失相殺で賠償額に反映され得る。","4 ○ 引渡し後の双方無責の滅失は、買主は解除・賠償等を主張できず、代金の支払を拒めない(567条1項)。"]},{"id":16,"cat":"権利関係","title":"相続","ans":3,"q":"相続に関する次の記述のうち、民法の条文によれば正しいものはどれか。","choices":["相続による権利の承継は、遺産の分割による場合を除き、民法第900条及び同第901条の規定により算定した法定相続分を超える部分については、登記、登録その他の対抗要件を備えなければ、第三者に対抗することができない。","相続開始の時から10年を経過した後にする遺産の分割については、民法第903条に定める特別受益者の相続分及び同第904条の2に定める寄与分の規定は適用されないが、相続人が、当該期間が経過する前に家庭裁判所に遺産の分割の請求をした場合に限り、適用される。","相続の放棄をした者は、その放棄の時に相続財産に属する財産を現に占有しているときは、相続人又は民法第952条第1項の相続財産の清算人に対して当該財産を引き渡すまでの間、自己の財産におけるのと同一の注意をもって、その財産を保存しなければならない。","家庭裁判所は、相続人のあることが明らかでないことを理由に、利害関係人の請求により相続財産の清算人を選任した場合、遅滞なく、その旨及び相続人があるならば2か月以内にその権利を主張すべき旨を公告しなければならない。"],"exp":["1 × 遺産分割によるか否かにかかわらず、法定相続分を超える部分は対抗要件が必要(899条の2)。「除き」が誤り。","2 × 例外は「10年経過前の家裁への分割請求」に限定されない(やむを得ない事由があった場合等もある)。","3 ○ 放棄時に現に占有する財産は、引渡しまで自己の財産と同一の注意で保存する義務がある(940条1項)。","4 × 権利主張の公告期間は6か月を下回れない。2か月以内の公告は不適法。"]},{"id":17,"cat":"法令上の制限","title":"都市計画法―地域地区","ans":1,"q":"都市計画法に関する次の記述のうち、正しいものはどれか。","choices":["市街化区域については、少なくとも用途地域を定めるものとし、市街化調整区域については、原則として用途地域を定めないものとされている。","準都市計画区域は、都市計画区域外の区域のうち、新たに住居都市、工業都市その他の都市として開発し、及び保全する必要がある区域に指定するものとされている。","市街化区域は、未だ市街地を形成していない区域においておおむね10年以内に優先的かつ計画的に市街化を図るべき区域であり、市街化調整区域は、すでに市街化を形成している区域において更なる市街化を抑制すべき区域である。","特定用途制限地域は、用途地域内の一定の区域における当該区域の特性にふさわしい土地利用の増進、環境の保護等の特別の目的の実現を図るため当該用途地域の指定を補完して定めるものとされている。"],"exp":["1 ○ 市街化区域は少なくとも用途地域を定め、市街化調整区域は原則として定めない(都計法13条1項7号)。","2 × 「新たに都市として開発・保全する必要がある区域」は都市計画区域の要件。準都市計画区域は、放置すれば将来の整備等に支障のおそれがある区域。","3 × 市街化区域は「すでに市街地を形成している区域+おおむね10年以内に市街化を図るべき区域」。記述は内容が逆。","4 × 特定用途制限地域は用途地域が「定められていない」区域に定める。記述は特別用途地区の内容。"]},{"id":18,"cat":"法令上の制限","title":"建築基準法―建築確認・単体規定","ans":2,"q":"建築基準法に関する次の記述のうち、正しいものはどれか。","choices":["住宅の地上階における居住のための居室には、その床面積に対して5分の1以上の割合で、採光のための窓その他の開口部を設けなければならないが、国土交通大臣が定める基準に従い、照明設備の設置、有効な採光方法の確保その他これらに準ずる措置が講じられているものにあっては、その割合は7分の1までの範囲内において国土交通大臣が別に定める割合となる。","住宅の居室、学校の教室、病院の病室又は寄宿舎の寝室は、壁及び床等に防湿の措置が施され、居室内の湿度を調節する設備が設けられている等衛生上必要な一定の技術的基準に適合するものであれば、地階に設けることができる。","2階建て、延べ面積400㎡、高さ12m、軒の高さ8mの木造の建築物について、大規模な修繕をしようとする場合、都市計画区域外であれば建築確認を受ける必要がない。","商業地域内にあるキャバレーの用途に供する建築物をナイトクラブ(その用途に供する部分の床面積の合計が300㎡)に用途変更する場合、建築確認が必要である。"],"exp":["1 × 原則は床面積の1/7以上(1/5ではない)。照明設備の設置等の措置で1/10までの範囲で緩和できる。数字が逆。","2 ○ 防湿措置等の衛生上必要な技術的基準に適合すれば、地階に設けることができる(建基法29条)。","3 × 2階以上または延べ面積200㎡超の建築物の大規模修繕は、区域を問わず建築確認が必要。","4 × キャバレー→ナイトクラブは類似の用途相互間の変更なので建築確認は不要。"]},{"id":19,"cat":"法令上の制限","title":"宅地造成及び特定盛土等規制法","ans":3,"q":"宅地造成及び特定盛土等規制法(本問では以下「法」という。)に関する次の記述のうち、正しいものはどれか。なお、この問において「都道府県知事」とは、地方自治法に基づく指定都市、中核市にあってはその長をいうものとする。","choices":["都道府県は、基本方針に基づき、おおむね3年ごとに、宅地造成等工事規制区域、特定盛土等規制区域及び造成宅地防災区域の指定等のため、特定盛土等又は土石の堆積に伴う崖崩れ又は土砂の流出のおそれがある土地に関する地形、地質の状況等に関する調査を行わなければならない。","都道府県は、法第5条1項に定める基礎調査により他人に損失を与えるときは、将来生ずべき損失を算出したうえで、事前に補償しなければならない。","工事主は、宅地造成等工事規制区域内において行われる宅地造成等に関する工事の許可を申請する場合は、あらかじめ、宅地造成等に関する工事の施行に係る土地の周辺地域の住民に対し、説明会の開催その他の当該宅地造成等に関する工事の内容を周知させるため必要な措置を講じなければならない。","特定盛土等規制区域内において行われる、高さ1.5メートルの盛土でその結果崖を生じるものであり、その土地の面積が3,000平方メートルの工事については、工事主は、当該工事に着手する前に、都道府県知事の許可を受けなければならない。"],"exp":["1 × 基礎調査は「おおむね5年ごと」(3年ではない)。","2 × 損失補償は「通常生ずべき損失」を補償するもので、事前の補償ではない。","3 ○ 許可申請の前に、あらかじめ周辺住民への説明会の開催等の周知措置を講じる必要がある(盛土規制法11条)。","4 × 特定盛土等規制区域の許可対象は「盛土で崖の高さ2m超」「面積3,000㎡超」等の一定規模以上。高さ1.5m・面積3,000㎡ちょうどはいずれにも該当せず許可不要。"]},{"id":20,"cat":"法令上の制限","title":"不動産鑑定評価基準","ans":1,"q":"不動産の鑑定評価に関する次の記述のうち、不動産鑑定評価基準によれば、正しいものはどれか。","choices":["特定価格とは、市場性を有する不動産について、法令等による社会的要請を背景とする鑑定評価目的の下で、正常価格の前提となる諸条件を満たさないことにより正常価格と同一の市場概念の下において形成されるであろう市場価値と乖離することとなる場合における不動産の経済価値を適正に表示する価格をいう。","鑑定評価は、対象不動産の現況を所与の条件としなければならず、依頼目的に応じて想定上の条件を付すことはできない。","鑑定評価に当たって必要とされる取引事例は、当該事例に係る取引の事情が正常なものでなければならず、特殊な事情の事例を補正して用いることはできない。","収益還元法は、対象不動産が将来生み出すであろうと期待される純収益の現在価値の総和を求めることにより対象不動産の試算価格を求める手法であり、文化財の指定を受けた建造物等の一般的に市場性を有しない不動産といえども観光を想定することにより適用される。"],"exp":["1 ○ 特定価格の定義として正しい。","2 × 依頼目的に応じて、地域要因・個別的要因について想定上の条件を付加できる場合がある。","3 × 特殊な事情の事例でも、事情補正ができるものであれば取引事例として使える。","4 × 収益還元法は、文化財指定の建造物等の市場性を有しない不動産「以外」には基本的にすべて適用すべき手法。自用の不動産でも賃貸を想定して適用する。"]}],"1":[{"id":1,"cat":"権利関係","title":"詐欺・錯誤と第三者","ans":4,"q":"AがBに甲土地を売却し、Bが所有権移転登記を備えた場合に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。","choices":["AがBとの売買契約をBの詐欺を理由に取り消した後、CがBから甲土地を買い受けて所有権移転登記を備えた場合、AC間の関係は対抗問題となり、Aは、いわゆる背信的悪意者ではないCに対して、登記なくして甲土地の返還を請求することができない。","AがBとの売買契約をBの詐欺を理由に取り消す前に、Bの詐欺について悪意のCが、Bから甲土地を買い受けて所有権移転登記を備えていた場合、AはCに対して、甲土地の返還を請求することができる。","Aの売却の意思表示に法律行為の目的及び取引上の社会通念に照らして重要な錯誤がある場合、Aに重大な過失がなければ、Aは、Aが取り消す前にBから甲土地を買い受けた悪意のCに対して、錯誤による当該意思表示の取消しを主張して、甲土地の返還を請求することができる。","Aの売却の意思表示に法律行為の目的及び取引上の社会通念に照らして重要な錯誤がある場合、BがAに錯誤があることを過失なく知らなかったときにおいて、Aに重大な過失があったとしても、AはBに対して、錯誤による当該意思表示の取消しを主張して、甲土地の返還を請求することができる。"],"exp":["1 ○ 詐欺取消後の第三者との優劣は登記の先後で決まる（177条・判例）。背信的悪意者でないCに、Aは登記なくして返還請求できない。","2 ○ 詐欺取消は取消前の善意無過失の第三者に対抗できない（96条3項）。悪意のCには対抗でき返還請求できる。","3 ○ 錯誤取消も取消前の善意無過失の第三者に対抗できない（95条4項）。重過失のないAは悪意のCに取消主張・返還請求できる。","4 × 表意者に重過失があれば錯誤取消は主張できない（95条3項）。重過失あるAはBに取消主張できず返還請求できない。→誤り＝正解"]},{"id":2,"cat":"権利関係","title":"無権代理","ans":2,"q":"A所有の甲土地につき、Aから売却に関する代理権を与えられていないBが、Aの代理人として、Cとの間で売買契約を締結した場合における次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。なお、表見代理は成立しないものとする。","choices":["Bの無権代理行為をAが追認した場合には、AC間の売買契約は有効となる。","Aの死亡により、BがAの唯一の相続人として相続した場合、Bは、Aの追認拒絶権を相続するので、自らの無権代理行為の追認を拒絶することができる。","Bの死亡により、AがBの唯一の相続人として相続した場合、AがBの無権代理行為の追認を拒絶しても信義則には反せず、AC間の売買契約が当然に有効になるわけではない。","Aの死亡により、BがDとともにAを相続した場合、DがBの無権代理行為を追認しない限り、Bの相続分に相当する部分においても、AC間の売買契約が当然に有効になるわけではない。"],"exp":["1 ○ 無権代理を本人が追認すれば本人に効力が生じる（113条1項）。AがCに追認すればAC間は有効。","2 × 無権代理人が単独で本人を相続すると当然に有効となり、追認拒絶はできない（判例）。→誤り＝正解","3 ○ 本人が単独で無権代理人を相続しても、本人の追認拒絶は信義則に反しない（判例）。当然有効にはならない。","4 ○ 無権代理人が本人を共同相続した場合、他の共同相続人全員が共同で追認しない限り、無権代理人の相続分でも当然有効にはならない（判例）。"]},{"id":3,"cat":"権利関係","title":"債務不履行・損害賠償","ans":4,"q":"債務不履行に基づく損害賠償請求権に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。","choices":["AがBと契約を締結する前に、信義則上の説明義務に違反して契約締結の判断に重要な影響を与える情報をBに提供しなかった場合、Bが契約を締結したことにより被った損害につき、Aは、不法行為による賠償責任を負うことはあっても、債務不履行による賠償責任を負うことはない。","AB間の利息付金銭消費貸借契約において、利率に関する定めがない場合、借主Bが債務不履行に陥ったことによりAがBに対して請求することができる遅延損害金は、年3パーセントの利率により算出する。","AB間でB所有の甲不動産の売買契約を締結した後、Bが甲不動産をCに二重譲渡してCが登記を具備した場合、AはBに対して債務不履行に基づく損害賠償請求をすることができる。","AB間の金銭消費貸借契約において、借主Bは当該契約に基づく金銭の返済をCからBに支払われる売掛代金で予定していたが、その入金がなかった（Bの責めに帰すべき事由はない。）ため、返済期限が経過してしまった場合、Bは債務不履行には陥らず、Aに対して遅延損害金の支払義務を負わない。"],"exp":["1 ○ 契約締結前の説明義務違反は、不法行為責任は負っても債務不履行責任は負わない（判例）。","2 ○ 利率の定めのない利息付金銭消費貸借の遅延損害金は、遅滞責任を負った時点の法定利率（年3％）による（419条1項・404条）。","3 ○ 二重譲渡で第二買主に移転登記が完了すれば、第一買主は売主に債務不履行に基づく損害賠償請求ができる（判例）。","4 × 金銭債務は不可抗力を抗弁にできない（419条3項）。Bは債務不履行に陥り遅延損害金の支払義務を負う。→誤り＝正解"]},{"id":4,"cat":"権利関係","title":"請負・契約不適合","ans":2,"q":"Aを注文者、Bを請負人として、A所有の建物に対して独立性を有さずその構成部分となる増築部分の工事請負契約を締結し、Bは3か月間で増築工事を終了させた。この場合に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。なお、この問において「契約不適合」とは品質に関して契約の内容に適合しないことをいい、当該請負契約には契約不適合責任に関する特約は定められていなかったものとする。","choices":["AがBに請負代金を支払っていなくても、Aは増築部分の所有権を取得する。","Bが材料を提供して増築した部分に契約不適合がある場合、Aは工事が終了した日から1年以内にその旨をBに通知しなければ、契約不適合を理由とした修補をBに対して請求することはできない。","Bが材料を提供して増築した部分に契約不適合があり、Bは不適合があることを知りながらそのことをAに告げずに工事を終了し、Aが工事終了日から3年後に契約不適合を知った場合、AはBに対して、消滅時効が完成するまでは契約不適合を理由とした修補を請求することができる。","増築した部分にAが提供した材料の性質によって契約不適合が生じ、Bが材料が不適当であることを知らずに工事を終了した場合、AはBに対して、Aが提供した材料によって生じた契約不適合を理由とした修補を請求することはできない。"],"exp":["1 ○ 不動産に付合した物の所有権は不動産所有者が取得する（242条本文）。増築部分は建物に付合しAが取得。","2 × 契約不適合の通知期間は「不適合を知った時から1年以内」（637条1項）。「工事終了日から1年以内」ではない。→誤り＝正解","3 ○ 引渡時に請負人が不適合を知り又は重過失で知らなかったときは通知不要（637条2項）。消滅時効完成まで修補請求できる。","4 ○ 注文者の供した材料の性質・指図で生じた不適合は責任追及できない（636条本文）。Aの材料による不適合は修補請求できない。"]},{"id":5,"cat":"権利関係","title":"民法の条文","ans":1,"q":"次の記述のうち、民法の条文として規定されていないものはどれか。","choices":["隔地者間の契約は、承諾の通知を発した時に成立する。","無効な行為に基づく債務の履行として給付を受けた者は、相手方を原状に復させる義務を負う。","代理人が自己又は第三者の利益を図る目的で代理権の範囲内の行為をした場合において、相手方がその目的を知り、又は知ることができたときは、その行為は、代理権を有しない者がした行為とみなす。","未成年者が法律行為をするには、その法定代理人の同意を得なければならない。ただし、単に権利を得、又は義務を免れる法律行為については、この限りでない。"],"exp":["1 × 契約は承諾で成立し（522条1項）、意思表示は到達時に効力を生じる（97条1項）。「承諾の通知を発した時に成立」は民法に規定がない。→規定されていない＝正解","2 ○ 無効な行為の給付受領者は原状回復義務を負う（121条の2第1項）。規定あり。","3 ○ 代理人が利益相反目的で代理権の範囲内の行為をした場合、相手方が悪意・有過失なら無権代理とみなす（107条）。規定あり。","4 ○ 未成年者の法律行為には法定代理人の同意が必要、ただし単に利益を得・義務を免れる行為は除く（5条1項）。規定あり。"]},{"id":6,"cat":"権利関係","title":"委任","ans":2,"q":"Aが、A所有の不動産の売買をBに対して委任する場合に関する次の記述のうち、民法の規定によれば、正しいものはどれか。なお、A及びBは宅地建物取引業者ではないものとする。","choices":["不動産のような高価な財産の売買を委任する場合には、AはBに対して委任状を交付しないと、委任契約は成立しない。","Bは、委任契約をする際、有償の合意をしない限り、報酬の請求をすることができないが、委任事務のために使った費用とその利息は、Aに請求することができる。","Bが当該物件の価格の調査など善良な管理者の注意義務を怠ったため、不動産売買についてAに損害が生じたとしても、報酬の合意をしていない以上、AはBに対して賠償の請求をすることができない。","委任はいつでも解除することができるから、有償の合意があり、売買契約成立寸前にAが理由なく解除してBに不利益を与えたときでも、BはAに対して損害賠償を請求することはできない。"],"exp":["1 × 委任は諾成契約。委任状の交付がなくても契約は成立する。","2 ○ 委任は無償が原則で特約がなければ報酬請求できない（648条1項）が、委任事務に要した費用と利息は請求できる（650条1項）。→正しい＝正解","3 × 受任者は有償・無償を問わず善管注意義務を負う（644条）。これを怠り損害が生じればAはBに賠償請求できる（415条）。","4 × 委任はいつでも解除できるが、相手方に不利な時期の解除等では損害賠償義務が生じる（651条2項）。BはAに賠償請求できる。"]},{"id":7,"cat":"権利関係","title":"抵当権・法定地上権","ans":4,"q":"Aは、Bに対する貸付金債権の担保のために、当該貸付金債権額にほぼ見合う評価額を有するB所有の更地である甲土地に抵当権を設定し、その旨の登記をした。その後、Bはこの土地上に乙建物を築造し、自己所有とした。この場合、民法の規定及び判例によれば、次の記述のうち正しいものはどれか。","choices":["Aは、Bに対し、乙建物の築造行為は、甲土地に対するAの抵当権を侵害する行為であるとして、乙建物の収去を求めることができる。","Bが、甲土地及び乙建物の双方につき、Cのために抵当権を設定して、その旨の登記をした後（甲土地についてはAの後順位）、Aの抵当権が実行されるとき、乙建物のために法定地上権が成立する。","Bが、乙建物築造後、甲土地についてのみ、Dのために抵当権を設定して、その旨の登記をした場合（甲土地についてはAの後順位）、Aの抵当権及び被担保債権が存続している状態で、Dの抵当権が実行されるとき、乙建物のために法定地上権が成立する。","Aは、乙建物に抵当権を設定していなくても、甲土地とともに乙建物を競売することができるが、優先弁済権は甲土地の代金についてのみ行使できる。"],"exp":["1 × 更地に抵当権を設定した後に築造された建物の収去は請求できない。","2 × 法定地上権は抵当権設定時に建物が存在することが必要（388条・判例）。更地への設定では成立しない。","3 × 同上。設定時に更地であれば法定地上権は成立しない。","4 ○ 抵当権設定後に設定者が築造した建物は土地とともに一括競売できるが、優先弁済は土地代金についてのみ行使できる（389条1項）。→正しい＝正解"]},{"id":8,"cat":"権利関係","title":"連帯債務・連帯保証","ans":2,"q":"AからBとCとが負担部分2分の1として連帯して1,000万円を借り入れる場合と、DからEが1,000万円を借り入れ、Fがその借入金返済債務についてEと連帯して保証する場合とに関する次の記述のうち、民法の規定によれば、正しいものはどれか。","choices":["Aが、Bに対して債務を免除した場合にはCが、Cに対して債務を免除した場合にはBが、それぞれ500万円分の債務を免れる。Dが、Eに対して債務を免除した場合にはFが、Fに対して債務を免除した場合にはEが、それぞれ全額の債務を免れる。","Aが、Bに対して履行を請求した効果はCには及ばず、Cに対して履行を請求した効果もBには及ばない。Dが、Eに対して履行を請求した効果はFに及び、Fに対して履行を請求した効果はEに及ばない。","Bについて時効が完成した場合にはCが、Cについて時効が完成した場合にはBが、それぞれ500万円分の債務を免れる。Eについて時効が完成した場合にはFが、Fについて時効が完成した場合にはEが、それぞれ全額の債務を免れる。","AB間の契約が無効であった場合にはCが、AC間の契約が無効であった場合にはBが、それぞれ1,000万円の債務を負う。DE間の契約が無効であった場合はFが、DF間の契約が無効であった場合はEが、それぞれ1,000万円の債務を負う。"],"exp":["1 × 連帯債務者の1人への免除は他の債務者に影響しない（相対効・441条）。一方、主たる債務の免除は保証債務にも及ぶ（付従性）。前段が誤り。","2 ○ 連帯債務者の1人への履行請求は他に及ばない（441条）が、主たる債務者への請求は連帯保証人に及ぶ（458条・457条）。→正しい＝正解","3 × 連帯債務者の1人の時効完成は他に影響しない（相対効・441条）。連帯保証人の時効完成も主たる債務者に影響しない。","4 × 一部の契約が無効でも、他の債務者が負う債務額は変わらない。本肢は誤り。"]},{"id":9,"cat":"権利関係","title":"使用者責任・共同不法行為","ans":1,"q":"Aに雇用されているBが、勤務中にA所有の乗用車を運転し、営業活動のため顧客Cを同乗させている途中で、Dが運転していたD所有の乗用車と正面衝突した（なお、事故についてはBとDに過失がある。）場合における次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","choices":["Aは、Cに対して事故によって受けたCの損害の全額を賠償した。この場合、Aは、BとDの過失割合に従って、Dに対して求償権を行使することができる。","Aは、Dに対して事故によって受けたDの損害の全額を賠償した。この場合、Aは、被用者であるBに対して求償権を行使することはできない。","事故によって損害を受けたCは、AとBに対して損害賠償を請求することはできるが、Dに対して損害賠償を請求することはできない。","事故によって損害を受けたDは、Aに対して損害賠償を請求することはできるが、Bに対して損害賠償を請求することはできない。"],"exp":["1 ○ B・Dの共同不法行為（719条1項）で、Bの使用者Aは使用者責任を負う（715条1項）。全額賠償した使用者は、他の共同不法行為者Dに過失割合に従って求償できる（判例）。→正しい＝正解","2 × 使用者は被用者にも求償できるが、信義則上相当な限度に制限される（判例）。「求償できない」は誤り。","3 × 被害者Cは、共同不法行為者であるDに対しても損害賠償を請求できる。","4 × 被害者Dは、運転していたBに対しても損害賠償を請求できる。"]},{"id":10,"cat":"権利関係","title":"相続の承認・放棄","ans":4,"q":"相続の承認及び放棄に関する次の記述のうち、民法の規定によれば、誤っているものはどれか。","choices":["相続の放棄をする場合、その旨を家庭裁判所に申述しなければならない。","相続人が数人あるときは、限定承認は、共同相続人の全員が共同してのみこれをすることができる。","相続人が、自己のために相続の開始があったことを知った時から3カ月（家庭裁判所が期間の伸長をした場合は当該期間）以内に、限定承認又は放棄をしなかったときは、単純承認をしたものとみなされる。","被相続人の子が、相続の開始後に相続放棄をした場合、その者の子がこれを代襲して相続人となる。"],"exp":["1 ○ 相続放棄をする者は、その旨を家庭裁判所に申述しなければならない（938条）。","2 ○ 相続人が数人あるとき、限定承認は共同相続人全員が共同してのみできる（923条）。","3 ○ 自己のために相続開始を知った時から3か月以内に限定承認・放棄をしなければ単純承認とみなされる（915条1項・921条）。","4 × 相続放棄は代襲原因ではない。放棄した者の子は代襲相続しない（887条2項・939条）。→誤り＝正解"]},{"id":11,"cat":"権利関係","title":"建物買取請求権","ans":2,"q":"Aが、Bに土地を賃貸し、Bがその土地上に建物を所有している場合の契約終了に伴う建物買取請求権に関する次の記述のうち、借地借家法の規定及び判例によれば、誤っているものはどれか。","choices":["AB間の借地契約が、公正証書により10年の事業専用の目的で締結された場合には、Bは建物買取請求権を有しない。","建物買取請求権は、契約終了の理由を問わず、Bの債務不履行を原因とする契約終了の場合にも、BはAに対して建物の買取りを請求することができる。","BがAの承諾を得て土地をCに転貸し、建物を譲渡した場合、AB間、BC間の契約が、ともに期間満了し更新がなければ、CはAに対し直接建物買取請求権を有する。","Bが適法にAに建物買取請求権を行使すると、その所有権は直ちにBからAに移転するが、BはAが代金を支払うまで、建物の引渡しを拒むことができる。"],"exp":["1 ○ 公正証書・存続期間10年の事業専用（事業用定期借地権）では建物買取請求権は認められない（借地借家法23条2項等）。","2 × 借地人の債務不履行を原因とする契約終了の場合は、建物買取請求権を行使できない。→誤り＝正解","3 ○ 適法な転借地で、AB間・BC間がともに期間満了で更新がなければ、転借地権者CはAに直接建物買取請求できる。","4 ○ 建物買取請求権を行使すると所有権は直ちにBからAに移転するが、Bは代金支払まで建物の引渡しを拒める。"]},{"id":12,"cat":"権利関係","title":"借地借家法（建物賃貸借）","ans":4,"q":"Aが所有する甲建物をBに対して3年間賃貸する旨の契約をした場合における次の記述のうち、借地借家法の規定によれば、正しいものはどれか。","choices":["AがBに対し、甲建物の賃貸借契約の期間満了の1年前に更新をしない旨の通知をしていれば、AB間の賃貸借契約は期間満了によって当然に終了し、更新されない。","Aが甲建物の賃貸借契約の解約の申入れをした場合には申入れ日から3月で賃貸借契約が終了する旨を定めた特約は、Bがあらかじめ同意していれば、有効となる。","Cが甲建物を適法に転借している場合、AB間の賃貸借契約が期間満了によって終了するときに、Cがその旨をBから聞かされていれば、AはCに対して、賃貸借契約の期間満了による終了を対抗することができる。","AB間の賃貸借契約が借地借家法第38条の定期建物賃貸借で、契約の更新がない旨を定めるものである場合、当該契約前にAがBに契約の更新がなく期間の満了により終了する旨を記載した書面を交付し又はBの承諾を得て電磁的方法による提供をして説明しなければ、契約の更新がない旨の約定は無効となる。"],"exp":["1 × 期間満了の1年前から6か月前までに更新拒絶の通知をしなければ、従前と同一条件で更新したものとみなされる（借地借家法26条1項）。当然終了ではない。","2 × 建物賃貸借の解約申入れは申入れから6か月経過で終了（27条1項・30条）。これより短い特約は賃借人に不利で無効。","3 × 転貸借がある場合、賃貸人は転借人に通知しなければ期間満了による終了を対抗できない（34条1項）。Bからの説明では足りない。","4 ○ 定期建物賃貸借は、更新がない旨を書面交付又は電磁的方法＋説明しなければ、更新がない旨の定めは無効となる（借地借家法38条3項〜5項）。→正しい＝正解"]},{"id":13,"cat":"権利関係","title":"区分所有法","ans":2,"q":"建物の区分所有等に関する法律に関する次の記述のうち、誤っているものはどれか。","choices":["管理者は、少なくとも毎年1回集会を招集しなければならない。","区分所有者（議決権を有しないものを除く。）の5分の1以上の者であって議決権の5分の1以上を有するものは、管理者に対し、会議の目的たる事項を示して、集会の招集を請求することができるが、この定数は規約で減ずることはできない。","集会の招集の通知は、区分所有者が管理者に対して通知を受け取る場所をあらかじめ通知した場合には、管理者はその場所にあててすれば足りる。","集会は、区分所有者（議決権を有しないものを除く。）全員の同意があれば、招集の手続を経ないで開くことができる。"],"exp":["1 ○ 管理者は少なくとも毎年1回集会を招集しなければならない（区分所有法34条2項）。","2 × 集会招集請求の定数（区分所有者・議決権の各5分の1以上）は、規約で減ずることができる（35条3項）。「減ずることはできない」は誤り。→誤り＝正解","3 ○ 招集通知は、区分所有者があらかじめ通知を受ける場所を通知したときはその場所にあてれば足りる（35条3項）。","4 ○ 区分所有者全員の同意があれば、招集手続を経ないで集会を開ける（36条）。"]},{"id":14,"cat":"権利関係","title":"不動産登記法","ans":4,"q":"不動産登記の申請に関する次の記述のうち、誤っているものはどれか。","choices":["登記の申請を共同してしなければならない者の一方に登記手続をすべきことを命ずる確定判決による登記は、当該申請を共同してしなければならない者の他方が単独で申請することができる。","相続又は法人の合併による権利の移転の登記は、登記権利者が単独で申請することができる。","登記名義人の氏名若しくは名称又は住所についての変更の登記又は更正の登記は、登記名義人が単独で申請することができる。","所有権の登記の抹消は、所有権の移転の登記の有無にかかわらず、現在の所有権の登記名義人が単独で申請することができる。"],"exp":["1 ○ 登記手続を命ずる確定判決による登記は、他方が単独で申請できる（不登法63条1項）。","2 ○ 相続又は法人の合併による権利移転の登記は、登記権利者が単独で申請できる（63条2項）。","3 ○ 登記名義人の氏名・名称・住所の変更・更正の登記は、登記名義人が単独で申請できる（64条1項）。","4 × 所有権の登記の抹消は、所有権移転登記がない場合に限り単独で申請できる（不登法77条）。「有無にかかわらず」は誤り。→誤り＝正解"]},{"id":15,"cat":"法令上の制限","title":"都市計画法（区域区分）","ans":3,"q":"都市計画法に関する次の記述のうち、誤っているものはどれか。","choices":["都市計画区域は、一体の都市として総合的に整備し、開発し、及び保全される必要がある区域であり、2以上の都府県にまたがって指定されてもよい。","都市計画は、都市計画区域内において定められるものであるが、道路や公園などの都市施設については、特に必要があるときは当該都市計画区域外においても定めることができる。","市街化区域は、既に市街地を形成している区域であり、市街化調整区域は、おおむね10年以内に市街化を図る予定の区域及び市街化を抑制すべき区域である。","無秩序な市街化を防止し、計画的な市街化を進めるため、都市計画区域を市街化区域と市街化調整区域に区分することができるが、すべての都市計画区域において区分する必要はない。"],"exp":["1 ○ 都市計画区域は一体の都市として整備・開発・保全する区域で、2以上の都府県にまたがって指定できる（都計法5条1項）。","2 ○ 都市計画は都市計画区域内で定めるが、都市施設は必要があれば区域外にも定められる（都計法11条1項）。","3 × 記述が逆。市街化区域は既に市街地を形成している区域＋おおむね10年以内に市街化を図るべき区域（7条2項）、市街化調整区域は市街化を抑制すべき区域（7条3項）。→誤り＝正解","4 ○ 都市計画区域は市街化区域と市街化調整区域に区分できるが（7条1項）、すべての区域で区分する必要はない。"]},{"id":16,"cat":"法令上の制限","title":"開発許可","ans":3,"q":"都市計画法の開発許可に関する次の記述のうち、正しいものはどれか。なお、この問における都道府県知事とは、地方自治法に基づく指定都市、中核市及び施行時特例市にあってはその長をいうものとする。","choices":["都道府県知事は、開発許可の申請があったときは、申請があった日から21日以内に、許可又は不許可の処分をしなければならない。","開発行為とは、主として建築物の建築の用に供する目的で行う土地の区画形質の変更をいい、建築物以外の工作物の建設の用に供する目的で行う土地の区画形質の変更は開発行為には該当しない。","開発許可を受けた者は、開発行為に関する工事を廃止したときは、遅滞なく、その旨を都道府県知事に届け出なければならない。","開発行為を行おうとする者は、開発許可を受けてから開発行為に着手するまでの間に、開発行為に関係がある公共施設の管理者と協議し、その同意を得なければならない。"],"exp":["1 × 開発許可の申請には遅滞なく許可・不許可の処分をする（都計法35条1項）。「21日以内」ではない。","2 × 開発行為には特定工作物の建設目的の区画形質変更も含む（都計法4条12項）。","3 ○ 開発許可を受けた者は、工事を廃止したとき遅滞なくその旨を都道府県知事に届け出なければならない。→正しい＝正解","4 × 開発行為に関係がある公共施設の管理者との協議・同意は、開発許可の申請前に行う必要がある。"]},{"id":17,"cat":"法令上の制限","title":"建築基準法（防火・単体）","ans":1,"q":"建築基準法に関する次の記述のうち、正しいものはどれか。","choices":["防火地域にある建築物で、外壁が耐火構造のものについては、その外壁を隣地境界線に接して設けることができる。","高さ30mの建築物には、原則として非常用の昇降機を設けなければならない。","準防火地域内においては、延べ面積が2,000㎡の共同住宅は準耐火建築物としなければならない。","延べ面積が1,000㎡を超える耐火建築物は、防火上有効な構造の防火壁又は防火床によって有効に区画し、かつ、各区画における床面積の合計をそれぞれ1,000㎡以内としなければならない。"],"exp":["1 ○ 防火地域・準防火地域内にある外壁が耐火構造の建築物は、その外壁を隣地境界線に接して設けられる（建基法63条）。→正しい＝正解","2 × 非常用昇降機は高さ31mを超える建築物に必要（34条2項）。高さ30mでは不要。","3 × 準防火地域で延べ面積1,500㎡を超える建築物は耐火建築物等としなければならず、2,000㎡なら準耐火建築物では足りない。","4 × 延べ面積1,000㎡超の建築物は防火壁等で1,000㎡以内ごとに区画するが、耐火建築物・準耐火建築物はこの限りでない（26条但書）。"]},{"id":18,"cat":"法令上の制限","title":"建築基準法（集団規定）","ans":2,"q":"建築基準法（以下この問において「法」という。）に関する次の記述のうち、誤っているものはどれか。","choices":["田園住居地域内においては、建築物の高さは、一定の場合を除き、10m又は12mのうち当該地域に関する都市計画において定められた建築物の高さの限度を超えてはならない。","一の敷地で、その敷地面積の40％が第二種低層住居専用地域に、60％が第一種中高層住居専用地域にある場合は、原則として、当該敷地内には大学を建築することができない。","都市計画区域の変更等によって法第3章の規定が適用されるに至った際現に建築物が立ち並んでいる幅員2mの道で、特定行政庁の指定したものは、同章の規定における道路とみなされる。","容積率規制を適用するに当たっては、前面道路の境界線又はその反対側の境界線からそれぞれ後退して壁面線の指定がある場合において、特定行政庁が一定の基準に適合すると認めて許可した建築物については、当該前面道路の境界線又はその反対側の境界線は、それぞれ当該壁面線にあるものとみなす。"],"exp":["1 ○ 田園住居地域内では建築物の高さは10m又は12mのうち都市計画で定めた限度を超えてはならない（55条1項）。","2 × 敷地が用途規制の異なる複数地域にわたるときは、過半の属する地域の用途規制が全部に適用される（91条）。過半が第一種中高層住居専用地域なら大学を建築できる。→誤り＝正解","3 ○ 第3章適用時に現に建築物が立ち並ぶ幅員4m未満の道で特定行政庁が指定したものは道路とみなされる（42条2項）。","4 ○ 壁面線の指定があり特定行政庁が許可した建築物は、容積率算定上、前面道路の境界線が壁面線にあるものとみなされる（52条11項）。"]},{"id":19,"cat":"法令上の制限","title":"盛土規制法","ans":4,"q":"宅地造成及び特定盛土等規制法に関する次の記述のうち、誤っているものはどれか。なお、この問において「都道府県知事」とは、地方自治法に基づく指定都市及び中核市にあってはその長をいうものとし、地方自治法に基づく施行時特例市に係る経過措置については考慮しないものとする。","choices":["宅地造成等工事規制区域内において、過去に宅地造成等に関する工事が行われ現在は工事主とは異なる者がその工事が行われた土地を所有している場合、当該土地の所有者は、宅地造成に伴う災害が生じないよう、その土地を常時安全な状態に維持するように努めなければならない。","宅地造成等工事規制区域内において行われる宅地造成等に関する工事について許可をする都道府県知事は、当該許可に、工事の施行に伴う災害を防止するために必要な条件を付することができる。","宅地を宅地以外の土地にするために行う土地の形質の変更は、宅地造成に該当しない。","宅地造成等工事規制区域内において、切土であって、当該切土をする土地の面積が400㎡で、かつ、高さ1mの崖を生ずることとなるものに関する工事を行う場合には、一定の場合を除き、都道府県知事の許可を受けなければならない。"],"exp":["1 ○ 工事主と異なる土地所有者も、宅地造成に伴う災害が生じないよう常時安全な状態に維持する努力義務を負う（盛土規制法22条1項）。","2 ○ 許可をする都道府県知事は、工事の施行に伴う災害を防止するため必要な条件を付すことができる（12条3項）。","3 ○ 宅地を宅地以外の土地にするための土地の形質変更は「宅地造成」に該当しない。","4 × 切土で高さ2m以下（本肢は1m）かつ面積500㎡以下（本肢は400㎡）の工事は規模要件を満たさず、許可は不要。→誤り＝正解"]},{"id":20,"cat":"法令上の制限","title":"土地区画整理法","ans":4,"q":"土地区画整理法に関する次の記述のうち、誤っているものはどれか。","choices":["施行者は、換地処分を行う前において、換地計画に基づき換地処分を行うため必要がある場合においては、施行地区内の宅地について仮換地を指定することができる。","仮換地が指定された場合においては、従前の宅地について権原に基づき使用し、又は収益することができる者は、仮換地の指定の効力発生の日から換地処分の公告がある日まで、仮換地について、従前の宅地について有する権利の内容である使用又は収益と同じ使用又は収益をすることができる。","施行者は、仮換地を指定した場合において、特別の事情があるときは、その仮換地について使用又は収益を開始することができる日を仮換地の指定の効力発生日と別に定めることができる。","土地区画整理組合の設立の認可の公告があった日後、換地処分の公告がある日までは、施行地区内において、土地区画整理事業の施行の障害となるおそれがある土地の形質の変更を行おうとする者は、当該土地区画整理組合の許可を受けなければならない。"],"exp":["1 ○ 施行者は換地処分前に、換地計画に基づき必要がある場合、仮換地を指定できる（区画法98条1項）。","2 ○ 仮換地指定を受けた者は、指定の効力発生日から換地処分の公告日まで、仮換地を従前の宅地と同様に使用収益できる（99条1項）。","3 ○ 特別の事情があるときは、仮換地の使用収益を開始できる日を指定の効力発生日と別に定められる（99条2項）。","4 × 認可公告後の土地の形質変更等は、土地区画整理組合ではなく都道府県知事（市の区域内では市長）の許可が必要（76条1項）。→誤り＝正解"]},{"id":21,"cat":"法令上の制限","title":"農地法","ans":3,"q":"農地法（以下この問において「法」という。）に関する次の記述のうち、正しいものはどれか。","choices":["山林を開墾し現に水田として耕作している土地であっても、土地登記簿上の地目が山林である限り、法の適用を受ける農地には当たらない。","農業者が、住宅を建設するために法第4条第1項の許可を受けた農地をその後住宅建設の工事着工前に宅地として売却する場合、改めて法第5条第1項の許可を受ける必要はない。","耕作目的で農地の売買契約を締結し、代金の支払をした場合でも、法第3条第1項の許可を受けていなければその所有権の移転の効力は生じない。","農業者が、自ら農業用倉庫として利用する目的で自己の所有する農地を転用する場合には、転用する農地の面積の規模にかかわらず、法第4条第1項の許可を受ける必要がある。"],"exp":["1 × 現に耕作している土地は、登記簿上の地目にかかわらず農地に当たる（農地法2条1項）。","2 × 4条許可を受けた農地を工事着工前に宅地として売却するには、改めて5条許可が必要。","3 ○ 耕作目的の農地売買は、3条許可を受けなければ所有権移転の効力を生じない（農地法3条6項）。→正しい＝正解","4 × 自己の農地を農業用施設に転用する場合、2アール未満なら4条許可は不要（施行規則29条1号）。「面積にかかわらず必要」は誤り。"]},{"id":22,"cat":"法令上の制限","title":"国土法・重要土地等調査法","ans":1,"q":"土地を取得する場合における届出に関する次の記述のうち、正しいものはどれか。なお、この問において「事後届出」とは、国土利用計画法第23条の届出をいい、「重要土地等調査法」とは、重要施設周辺及び国境離島等における土地等の利用状況の調査及び利用の規制等に関する法律をいうものとする。","choices":["都市計画区域外において、国から一団の土地である6,000㎡と5,000㎡の土地を購入した者は、事後届出を行う必要はない。","市街化区域を除く都市計画区域内において、Aが所有する7,000㎡の土地をBが相続により取得した場合、Bは事後届出を行う必要がある。","市街化区域において、Cが所有する3,000㎡の土地をDが購入する契約を締結した場合、C及びDは事後届出を行わなければならない。","重要土地等調査法の規定による特別注視区域内にある100㎡の規模の土地に関する所有権又はその取得を目的とする権利の移転をする契約を締結する場合には、当事者は、一定の事項を、あらかじめ、内閣総理大臣に届け出なければならない。"],"exp":["1 ○ 当事者の一方又は双方が国等である場合は、事後届出は不要（国土法23条2項3号）。→正しい＝正解","2 × 相続は「対価を得て行う契約」ではなく、事後届出は不要。7,000㎡でも相続なら不要。","3 × 市街化区域で2,000㎡以上の売買は届出が必要だが、届出義務者は権利取得者（買主D）のみ。売主Cも届出、は誤り。","4 × 重要土地等調査法の特別注視区域内の届出対象は200㎡以上。100㎡は届出不要。"]},{"id":23,"cat":"税その他","title":"印紙税","ans":3,"q":"印紙税に関する次の記述のうち、正しいものはどれか。","choices":["「建物の電気工事に係る請負代金は1,100万円（うち消費税額及び地方消費税額100万円）とする」旨を記載した工事請負契約書について、印紙税の課税標準となる当該契約書の記載金額は1,100万円である。","「Aの所有する土地（価額5,000万円）とBの所有する土地（価額4,000万円）とを交換する」旨の土地交換契約書を作成した場合、印紙税の課税標準となる当該契約書の記載金額は4,000万円である。","国を売主、株式会社Cを買主とする土地の売買契約において、共同で売買契約書を2通作成し、国とC社がそれぞれ1通ずつ保存することとした場合、C社が保存する契約書には印紙税は課されない。","「契約期間は10年間、賃料は月額10万円、権利金の額は100万円とする」旨が記載された土地の賃貸借契約書は、記載金額1,300万円の土地の賃借権の設定に関する契約書として印紙税が課される。"],"exp":["1 × 消費税額が区分記載されているときは消費税額を記載金額に含めない。記載金額は1,000万円で、1,100万円ではない。","2 × 交換契約書は交換対象物の双方の価額のうち高い方が記載金額。5,000万円であり4,000万円ではない。","3 ○ 国等と私人が共同作成し私人が保存する文書は、国等が作成したものとみなされ印紙税が課されない（印紙税法4条5項・5条2号）。→正しい＝正解","4 × 土地賃貸借契約書の記載金額は権利金等（後日返還されない金銭）。記載金額は100万円で、1,300万円ではない。"]},{"id":24,"cat":"税その他","title":"不動産取得税","ans":2,"q":"不動産取得税に関する次の記述のうち、正しいものはどれか。","choices":["令和8年4月に住宅以外の家屋を取得した場合、不動産取得税の標準税率は、100分の3である。","令和8年4月に宅地を取得した場合、当該取得に係る不動産取得税の課税標準は、当該宅地の価格の2分の1の額とされる。","不動産取得税は、不動産の取得に対して、当該不動産の所在する都道府県が課する税であるが、その徴収は特別徴収の方法がとられている。","令和8年4月に床面積250㎡である新築住宅に係る不動産取得税の課税標準の算定については、当該新築住宅の価格から1,200万円が控除される。"],"exp":["1 × 住宅以外の家屋の取得の標準税率は100分の4（100分の3ではない）。","2 ○ 宅地を取得した場合の不動産取得税の課税標準は、宅地の価格の2分の1とされる（特例）。→正しい＝正解","3 × 不動産取得税の徴収は普通徴収による。特別徴収ではない。","4 × 新築住宅の1,200万円控除は床面積50㎡以上240㎡以下が要件。250㎡は範囲外で控除を受けられない。"]},{"id":25,"cat":"税その他","title":"不動産鑑定評価","ans":2,"q":"不動産の鑑定評価に関する次の記述のうち、正しいものはどれか。","choices":["不動産の価格を求める鑑定評価の手法は、原価法、取引事例比較法及び収益還元法に大別されるが、鑑定評価に当たっては、案件に即してこれらの三手法のいずれか1つを適用することが原則である。","取引事例比較法とは、まず多数の取引事例を収集して適切な事例の選択を行い、これらに係る取引価格に必要に応じて事情補正及び時点修正を行い、かつ、地域要因の比較及び個別的要因の比較を行って求められた価格を比較考量し、これによって対象不動産の試算価格を求める手法である。","収益還元法は、文化財の指定を受けた建造物等の一般的に市場性を有しない不動産も含め基本的にすべての不動産に適用すべきものであり、自用の不動産といえども賃貸を想定することにより適用されるものである。","賃料の鑑定評価において、支払賃料とは、賃料の種類の如何を問わず賃貸人等に支払われる賃料の算定の期間に対応する適正なすべての経済的対価をいい、純賃料及び不動産の賃貸借等を継続するために通常必要とされる諸経費等から成り立つものである。"],"exp":["1 × 鑑定評価は原価法・取引事例比較法・収益還元法を原則として併用すべきで、いずれか1つを適用するのではない。","2 ○ 取引事例比較法は、多数の取引事例から適切な事例を選択し、事情補正・時点修正、地域要因・個別的要因の比較を行って試算価格を求める手法。→正しい＝正解","3 × 収益還元法は、文化財等の市場性を有しない不動産「以外」のすべてに適用すべき手法。市場性を有しないものも含めすべて、は誤り。","4 × 支払賃料は各支払時期に実際に支払われる賃料。設問の説明（純賃料＋諸経費＝実質賃料）とは異なる。"]},{"id":26,"cat":"宅建業法","title":"免許（業の該当性）","ans":1,"q":"宅地建物取引業の免許（以下この問において「免許」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはいくつあるか。\n\nア Aの所有する商業ビルを賃借しているBが、フロアごとに不特定多数の者に反復継続して転貸する場合、AとBは免許を受ける必要はない。\n\nイ 宅地建物取引業者Cが、Dを代理して、Dの所有するマンション（30戸）を不特定多数の者に反復継続して分譲する場合、Dは免許を受ける必要はない。\n\nウ Eが転売目的で反復継続して宅地を購入する場合でも、売主が国その他宅地建物取引業法の適用がない者に限られているときは、Eは免許を受ける必要はない。\n\nエ Fが借金の返済に充てるため、自己所有の宅地を10区画に区画割りして、不特定多数の者に反復継続して売却する場合、Fは免許を受ける必要はない。","choices":["一つ","二つ","三つ","なし"],"exp":["ア ○ 自ら所有ビルを賃貸するAも、賃借して転貸するBも、貸借は「取引」に当たらず免許不要。","イ × 所有者Dが不特定多数に反復継続して分譲する行為は「業」に当たり、Dは免許が必要（業者に代理させても同じ）。","ウ × 転売目的で反復継続して宅地を購入するのも「業」に当たり、売主が誰でもEは免許が必要。","エ × 自己所有地を10区画に分割し不特定多数に反復継続して売却するFは免許が必要。","→免許不要が正しいのはアの一つ。①が正解。"]},{"id":27,"cat":"宅建業法","title":"事務所","ans":2,"q":"宅地建物取引業法第3条第1項に規定する事務所（以下この問において「事務所」という。）に関する次の記述のうち、正しいものはどれか。","choices":["事務所とは、契約締結権限を有する者を置き、継続的に業務を行うことができる施設を有する場所を指すものであるが、商業登記簿に登載されていない営業所又は支店は事務所には該当しない。","宅地建物取引業を営まず他の兼業業務のみを営んでいる支店は、事務所には該当しない。","宅地建物取引業者は、主たる事務所については、免許証、標識及び国土交通大臣が定めた報酬の額を掲げ、従業者名簿及び帳簿を備え付ける義務を負う。","宅地建物取引業者は、その事務所ごとに一定の数の成年者である専任の宅地建物取引士を置かなければならないが、既存の事務所がこれを満たさなくなった場合は、30日以内に必要な措置を執らなければならない。"],"exp":["1 × 商業登記簿に登載されていない営業所・支店でも、契約締結権限者を置き継続的に業務を行う施設は事務所に該当する。","2 ○ 宅建業を営まず兼業業務のみを営む支店は、事務所に該当しない。→正しい＝正解","3 × 主たる事務所には標識・報酬額の掲示、従業者名簿・帳簿の備付けが必要だが、免許証の掲示義務はない。","4 × 事務所の専任宅建士が不足したときは、2週間以内に必要な措置を執らなければならない（30日ではない）。"]},{"id":28,"cat":"宅建業法","title":"免許の欠格事由","ans":1,"q":"宅地建物取引業の免許（以下この問において「免許」という。）に関する次の記述のうち、正しいものはどれか。","choices":["免許を受けようとするA社に、刑法第204条（傷害）の罪により拘禁刑1年（刑の全部の執行猶予2年）の刑に処せられ、その執行猶予期間を満了した者が役員として在籍している場合、その満了の日から5年を経過していなくとも、A社は免許を受けることができる。","免許を受けようとするB社に、刑法206条（現場助勢）の罪により罰金の刑に処せられた者が非常勤役員として在籍している場合、その刑の執行が終わってから5年を経過していなくとも、B社は免許を受けることができる。","免許を受けようとするC社に、刑法第208条（暴行）の罪により拘留の刑に処せられた者が役員として在籍している場合、その刑の執行が終わってから5年を経過していなければ、C社は免許を受けることができない。","免許を受けようとするD社に、刑法第209条（過失傷害）の罪により科料の刑に処せられた者が非常勤役員として在籍している場合、その刑の執行が終わってから5年を経過していなければ、D社は免許を受けることができない。"],"exp":["1 ○ 傷害罪で拘禁刑・執行猶予付の役員も、執行猶予期間が満了すれば刑の言渡しは効力を失い欠格事由に当たらない。満了日から5年経過していなくてもA社は免許を受けられる。→正しい＝正解","2 × 現場助勢罪（暴力系の一定の罪）の罰金刑の役員がいると、刑の執行終了から5年経過しないとB社は免許を受けられない。","3 × 拘留は欠格事由（罰金以上の刑）に当たらない。C社は免許を受けられる。","4 × 科料は欠格事由に当たらない。D社は免許を受けられる。"]},{"id":29,"cat":"宅建業法","title":"免許（総合）","ans":3,"q":"次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはどれか。","choices":["宅地建物取引業の免許の有効期間は5年であり、免許の更新の申請は、有効期間満了の日の90日前から30日前までの間に行わなければならない。","宅地建物取引業者から免許の更新の申請があった場合において、有効期間の満了の日までにその申請について処分がなされないときは、従前の免許は、有効期間の満了後もその処分がなされるまでの間は、なお効力を有する。","個人である宅地建物取引業者A（甲県知事免許）が死亡した場合、Aの相続人は、Aの死亡の日から30日以内に、その旨を甲県知事に届け出なければならない。","法人である宅地建物取引業者B（乙県知事免許）が合併により消滅した場合、Bを代表する役員であった者は、その日から30日以内に、その旨を乙県知事に届け出なければならない。"],"exp":["1 ○ 免許の有効期間は5年、更新申請は満了日の90日前から30日前までの間に行う（業法3条2項・規則3条）。","2 ○ 更新申請後、満了日までに処分がなければ、従前の免許は処分がなされるまでなお効力を有する（3条4項）。","3 × 個人業者が死亡したときの届出は、相続人が「死亡を知った日から30日以内」（業法11条1項1号）。「死亡の日から」は誤り。→誤り＝正解","4 ○ 法人が合併消滅したときは、消滅法人を代表する役員だった者が30日以内に届け出る（11条1項2号）。"]},{"id":30,"cat":"宅建業法","title":"登録・取引士証","ans":1,"q":"宅地建物取引士の登録（以下この問において「登録」という。）及び宅地建物取引士証に関する次の記述のうち、民法及び宅地建物取引業法の規定によれば、正しいものはいくつあるか。\n\nア 登録を受けている者は、宅地建物取引士証の交付を受けていない場合は、その住所に変更があっても、登録を受けている都道府県知事に変更の登録を申請する必要はない。\n\nイ 宅地建物取引士証を亡失し、その再交付を申請している者は、再交付を受けるまでの間、宅地建物取引業法第35条に規定する重要事項の説明をする時は、宅地建物取引士証に代えて、再交付申請書の写しを提示すればよい。\n\nウ 甲県知事から宅地建物取引士証の交付を受けている者が、宅地建物取引士としての事務を禁止する処分を受け、その禁止の期間中に本人の申請により登録が消除された場合は、その者が乙県で宅地建物取引士資格試験に合格したとしても、当該期間が満了しないときは、乙県知事の登録を受けることができない。","choices":["一つ","二つ","三つ","なし"],"exp":["ア × 宅建士証の交付を受けているか否かにかかわらず、住所変更があれば変更の登録を申請しなければならない（業法20条・18条2項）。","イ × 重要事項説明の際は宅建士証の提示が必要（35条4項）。再交付申請書の写しの提示で足りる旨の規定はない。","ウ ○ 事務禁止処分の期間中に自ら登録消除を申請して登録が消除され、その禁止期間が満了しない者は登録を受けられない（18条1項11号）。","→正しいのはウの一つ。①が正解。"]},{"id":31,"cat":"宅建業法","title":"営業保証金","ans":4,"q":"宅地建物取引業者A（国土交通大臣免許）が、宅地建物取引業法の規定に基づき供託する営業保証金に関する次の記述のうち、正しいものはどれか。","choices":["Aは、営業保証金を主たる事務所又はその他の事務所のいずれかの最寄りの供託所に供託することができる。","Aが営業保証金を供託した旨は、供託所から国土交通大臣あてに通知されることから、Aがその旨を直接国土交通大臣に届け出る必要はない。","Aとの取引により生じた電気工事業者の工事代金債権について、当該電気工事業者は、営業継続中のAが供託している営業保証金から、その弁済を受ける権利を有する。","営業保証金の還付により、営業保証金の額が政令で定める額に不足することとなった場合、Aは、国土交通大臣から不足額を供託すべき旨の通知書の送付を受けた日から2週間以内にその不足額を供託しなければならない。"],"exp":["1 × 営業保証金は主たる事務所の最寄りの供託所に供託する（業法25条1項）。「いずれかの最寄り」ではない。","2 × 供託した旨は、A自身が免許権者（国土交通大臣等）に届け出なければならない（25条4項）。供託所からの通知ではない。","3 × 弁済を受けられるのは宅建業に関する「取引」により生じた債権のみ（27条1項）。電気工事代金債権は対象外。","4 ○ 還付で不足を生じたときは、免許権者からの通知書送付を受けた日から2週間以内に不足額を供託する（28条1項）。→正しい＝正解"]},{"id":32,"cat":"宅建業法","title":"保証協会","ans":3,"q":"宅地建物取引業保証協会（以下この問において「保証協会」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはどれか。","choices":["保証協会は、その名称、住所又は事務所の所在地を変更しようとするときは、あらかじめ、その旨を国土交通大臣に届け出なければならない。","保証協会は、新たに社員が加入したときは、直ちに、その旨を当該社員である宅地建物取引業者が免許を受けた国土交通大臣又は都道府県知事に報告しなければならない。","宅地建物取引業者で保証協会に加入しようとする者は、その加入した日から1週間以内に、政令で定める額の弁済業務保証金分担金を当該保証協会に納付しなければならない。","保証協会の社員は、自らが取り扱った宅地建物取引業に係る取引の相手方から当該取引に関する苦情について解決の申出が保証協会にあり、保証協会から説明を求められたときは、正当な理由がある場合でなければ、これを拒んではならない。"],"exp":["1 ○ 保証協会は名称・住所・事務所所在地を変更しようとするとき、あらかじめ国土交通大臣に届け出る。","2 ○ 新たに社員が加入したときは、直ちにその旨を当該社員の免許権者（国土交通大臣又は都道府県知事）に報告する。","3 × 分担金は「加入しようとする日までに」納付する（業法64条の9第1項）。「加入した日から1週間以内」は誤り。→誤り＝正解","4 ○ 社員は、取引の相手方からの苦情解決の申出につき保証協会から説明を求められたとき、正当な理由がなければ拒めない。"]},{"id":33,"cat":"宅建業法","title":"媒介契約","ans":2,"q":"宅地建物取引業者A社が、Bから自己所有の甲宅地の売却の媒介を依頼され、Bと媒介契約を締結した場合における次の記述のうち、宅地建物取引業法の規定によれば、正しいものはいくつあるか。\n\nア A社が、Bとの間に専任媒介契約を締結し、甲宅地の売買契約を成立させたときは、A社は、遅滞なく、登録番号、取引価格、売買契約の成立した年月日、売主及び買主の氏名を指定流通機構に通知しなければならない。\n\nイ A社は、Bとの間に媒介契約を締結し、Bに対して甲宅地を売買すべき価額又はその評価額について意見を述べるときは、その根拠を明らかにしなければならない。\n\nウ A社がBとの間に締結した専任媒介契約の有効期間は、Bからの申出により更新することができるが、更新の時から3月を超えることができない。","choices":["一つ","二つ","三つ","なし"],"exp":["ア × 指定流通機構への通知事項は登録番号・取引価格・契約成立年月日（業法34条の2第7項）。売主・買主の氏名は通知不要。","イ ○ 価額・評価額について意見を述べるときは、その根拠を明らかにしなければならない（34条の2第2項）。","ウ ○ 専任媒介契約は依頼者の申出があれば更新でき、更新後の期間は3か月を超えられない（34条の2第4項）。","→正しいのはイ・ウの二つ。②が正解。"]},{"id":34,"cat":"宅建業法","title":"広告規制","ans":1,"q":"宅地建物取引業者が行う広告に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","choices":["宅地建物取引業者は、宅地の造成又は建物の建築に関する工事が完了するまでの間は、当該工事に必要な都市計画法に基づく開発許可、建築基準法に基づく建築確認その他法令に基づく許可等の処分があった後でなければ、当該工事に係る宅地又は建物の売買その他の業務に関する広告をすることはできない。","宅地建物取引業者が、複数の区画がある宅地の売買について、数回に分けて広告をするときは、最初に行う広告以外には取引態様の別を明示する必要はない。","宅地建物取引業者は、建物の貸借の媒介において広告を行った場合には、依頼者の依頼の有無にかかわらず、報酬とは別に、当該広告の料金に相当する額を受領することができる。","宅地建物取引業の免許を取り消された者は、免許の取消し前に建物の売買の広告をしていれば、当該建物の売買契約を締結する目的の範囲内においては、なお宅地建物取引業者とみなされる。"],"exp":["1 ○ 造成・建築工事の完了前は、開発許可・建築確認等の処分後でなければ、当該工事に係る売買等の広告をすることはできない（業法33条）。→正しい＝正解","2 × 取引態様の別の明示は、広告のつど必要（業法34条1項）。最初だけでは足りない。","3 × 依頼者の依頼によって行う広告料金は、報酬とは別に受領できる（報酬告示第11）。「依頼の有無にかかわらず」ではない。","4 × 免許失効後も締結済み契約の取引を結了する範囲で宅建業者とみなされる（業法76条）が、広告をしていたというだけではみなされない。"]},{"id":35,"cat":"宅建業法","title":"重要事項説明（35条）","ans":2,"q":"宅地建物取引業者が行う宅地建物取引業法第35条に規定する重要事項の説明に関する次の記述のうち、誤っているものはどれか。なお、説明の相手方は宅地建物取引業者ではないものとする。","choices":["区分所有建物の売買の媒介を行う場合、当該1棟の建物及びその敷地の管理が委託されているときは、その委託を受けている者の氏名（法人にあっては、その商号又は名称）及び住所（法人にあっては、その主たる事務所の所在地）を説明しなければならない。","土地の売買の媒介を行う場合、移転登記の申請の時期の定めがあるときは、その内容を説明しなければならない。","住宅の売買の媒介を行う場合、宅地内のガス配管設備等に関して、当該住宅の売買後においても当該ガス配管設備等の所有権が家庭用プロパンガス販売業者にあるものとするときは、その旨を説明する必要がある。","中古マンションの売買の媒介を行う場合、当該マンションの計画的な維持修繕のための費用の積立てを行う旨の規約の定めがあるときは、その内容及び既に積み立てられている額について説明しなければならない。"],"exp":["1 ○ 区分所有建物の売買媒介で管理が委託されているときは、受託者の氏名・住所（法人は商号等・主たる事務所所在地）を35条書面で説明する（35条1項6号、規則16条の2第8号）。","2 × 移転登記の申請時期は37条書面の記載事項であり（37条1項5号）、重要事項として説明する必要はない。→誤り＝正解","3 ○ ガス配管設備等の所有権が売買後もプロパンガス販売業者にあるときは、その旨を説明しなければならない（35条1項、解釈・運用の考え方）。","4 ○ 計画的な維持修繕費用の積立てを行う旨の規約の定めがあるときは、その内容及び既に積み立てられた額を説明しなければならない（35条1項6号、規則16条の2第6号）。"]},{"id":36,"cat":"宅建業法","title":"37条書面","ans":1,"q":"宅地建物取引業者Aが宅地建物取引業法第37条の規定により交付すべき書面（以下この問において「37条書面」という。）に関する次の記述のうち、正しいものはどれか。なお、この問においては、電磁的方法により提供する場合を考慮しないものとする。","choices":["Aが媒介により建物の貸借の契約を成立させたときは、37条書面に借賃の額並びにその支払の時期及び方法を記載しなければならず、また、当該書面を契約の各当事者に交付しなければならない。","Aが媒介により宅地の貸借の契約を成立させた場合において、当該宅地の引渡しの時期について重要事項説明書に記載して説明を行ったときは、その内容を37条書面に記載する必要はない。","Aが自ら売主として宅地建物取引業者である買主と建物の売買契約を締結した場合、37条書面に宅地建物取引士をして記名させる必要はない。","Aが自ら売主として宅地の売買契約を締結した場合、代金についての金銭の貸借のあっせんに関する定めがある場合における当該あっせんに係る金銭の貸借が成立しないときの措置については、37条書面に記載する必要はない。"],"exp":["1 ○ 建物の貸借の媒介では、借賃の額並びに支払の時期・方法を37条書面に必ず記載し、各当事者に交付しなければならない（37条2項2号・5項）。→正しい＝正解","2 × 引渡しの時期は37条書面の記載事項（37条2項1号・1項4号）。重要事項説明書に記載・説明しても、37条書面への記載は省略できない。","3 × 37条書面には宅建士をして記名させなければならない（37条3項）。相手方が宅建業者でも省略できない。","4 × 金銭貸借のあっせんの定めがあるときは、あっせんが不成立の場合の措置を37条書面に記載しなければならない（37条1項9号・4項）。"]},{"id":37,"cat":"宅建業法","title":"報酬計算","ans":3,"q":"宅地建物取引業者A（消費税課税事業者）が売主B（消費税課税事業者）からB所有の土地付建物の媒介の依頼を受け、買主Cとの間で売買契約を成立させた場合、AがBから受領できる報酬の上限額は、次のうちどれか。なお、土地付建物の代金は6,600万円（うち、土地代金は4,400万円）で、消費税額及び地方消費税額を含むものとする。","choices":["1,980,000円","2,046,000円","2,178,000円","2,244,000円"],"exp":["土地代金には消費税が課されないため、建物代金のみを税抜きにする。(2,200万円÷1.1)＝2,000万円、＋土地4,400万円＝6,400万円が報酬計算の基礎。","課税事業者なので報酬上限＝(6,400万円×3％＋6万円)×1.1＝2,178,000円。","→③（2,178,000円）が正解。"]},{"id":38,"cat":"宅建業法","title":"業務上の規制","ans":2,"q":"宅地建物取引業者Aが行う業務に関する次の記述のうち、宅地建物取引業法の規定に違反するものはいくつあるか。\n\nア Aは、自ら売主として、建物の売買契約を締結するに際し、買主が手付金を持ち合わせていなかったため手付金の分割払いを提案し、買主はこれに応じた。\n\nイ Aは、建物の販売に際し、勧誘の相手方から値引きの要求があったため、広告に表示した販売価格から100万円値引きすることを告げて勧誘し、売買契約を締結した。\n\nウ Aは、土地の売買の媒介に際し重要事項の説明の前に、宅地建物取引士ではないAの従業者をして媒介の相手方に対し、当該土地の交通等の利便の状況について説明させた。\n\nエ Aは、投資用マンションの販売に際し、電話で勧誘を行ったところ、勧誘の相手方から「購入の意思がないので二度と電話をかけないように」と言われたことから、電話での勧誘を諦め、当該相手方の自宅を訪問して勧誘した。","choices":["一つ","二つ","三つ","四つ"],"exp":["ア 違反する 手付の分割受領も「信用の供与」に該当し、これにより契約締結を誘引する行為は禁止（業法47条3号）。","イ 違反しない 代金の値引きは「信用の供与」に該当しない。","ウ 違反しない 土地の交通等の利便の状況は重要事項説明の対象外。宅建士でない従業者に説明させても違反しない。","エ 違反する 相手方が契約しない旨の意思を表示したのに勧誘を継続することは禁止（47条の2第3項、規則16条の11）。","→違反するのはア・エの二つ。②が正解。"]},{"id":39,"cat":"宅建業法","title":"宅建士","ans":1,"q":"宅地建物取引業法に規定する宅地建物取引士に関する次の記述のうち、正しいものはどれか。","choices":["都道府県知事は、その登録を受けている宅地建物取引士が、他人に自己の名義の使用を許し、その他人がその名義を使用して宅地建物取引士である旨の表示をしたとき、当該宅地建物取引士に対し、必要な指示をすることができる。","宅地建物取引業者は、10戸以上の一団の建物の分譲について案内所を設置して行う場合、その案内所において業務に従事する者の数に対する宅地建物取引士の数の割合が5分の1以上の成年者である専任の宅地建物取引士を置かなければならない。","宅地建物取引業者の従業者である宅地建物取引士は、本人の同意がある場合を除き、正当な理由がある場合でも、宅地建物取引業の業務を補助したことについて知り得た秘密を他に漏らしてはならない。","宅地建物取引士Aは、甲県知事から事務の禁止の処分を受け、宅地建物取引士証を甲県知事に提出したが、禁止処分の期間が満了した場合は、返還の請求がなくても、甲県知事は、直ちに宅地建物取引士証をAに返還しなければならない。"],"exp":["1 ○ 宅建士が名義使用を許し士証を貸与するなどして他人が宅建士である旨を表示したときは、指示処分を受けることがある（業法68条1項2号）。→正しい＝正解","2 × 案内所で契約・申込みを受けるときの専任宅建士は1名以上でよい（31条の3第1項）。「業務従事者の5分の1以上」ではない。","3 × 従業者は正当な理由があれば秘密を漏らせる（守秘義務、75条の3）。正当な理由には本人の同意のほか裁判の証人になる場合等がある。「本人の同意がある場合を除き」は誤り。","4 × 事務禁止処分で提出された士証は、禁止期間満了後、提出者から返還請求があったときに返還すればよい（22条の2第8項）。「直ちに返還」は誤り。"]},{"id":40,"cat":"宅建業法","title":"監督処分","ans":2,"q":"宅地建物取引業者A（甲県知事免許）に対する監督処分に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはどれか。","choices":["Aが、乙県の区域内の業務に関し乙県知事から受けた業務停止の処分に違反した場合でも、乙県知事は、Aの免許を取り消すことはできない。","Aが、乙県の区域内の業務に関し乙県知事から指示を受け、その指示に従わなかった場合でも、甲県知事は、Aに対し業務停止の処分をすることはできない。","Aが、甲県の区域内の業務に関し甲県知事から指示を受け、その指示に従わなかった場合で、情状が特に重いときであっても、国土交通大臣は、Aの免許を取り消すことはできない。","Aの取締役が宅地建物取引業の業務に関し、建築基準法の規定に違反したとして罰金刑に処せられた場合、甲県知事は、Aに対して必要な指示をすることができる。"],"exp":["1 ○ 免許の取消しは免許権者のみができる（業法66条）。乙県知事はAの免許を取り消せない。","2 × 免許権者は、指示に従わない宅建業者に業務停止処分ができる（65条2項3号）。免許権者である甲県知事はAに業務停止処分ができる。→誤り＝正解","3 ○ 指示に従わず情状が特に重いときは免許取消処分事由に該当するが（66条1項9号）、取消しは免許権者のみ。国土交通大臣はAの免許を取り消せない。","4 ○ 取締役が業務に関し建築基準法に違反し宅建業者として不適当と認められるときは、免許権者は必要な指示ができる（65条1項3号）。"]},{"id":41,"cat":"宅建業法","title":"手付・損害賠償額の予定","ans":4,"q":"宅地建物取引業者Aが、自ら売主として宅地建物取引業者でない買主Bとの間で宅地の売買契約を締結した場合における次の記述のうち、民法及び宅地建物取引業法の規定並びに判例によれば、正しいものはどれか。","choices":["当事者の債務不履行を理由とする契約の解除に伴う損害賠償の予定額を定めていない場合、損害賠償の請求額は売買代金の額を超えてはならない。","当事者の債務不履行を理由とする契約の解除に伴う損害賠償の予定額を売買代金の2割とし、違約金の額を売買代金の1割とする定めは、これらを合算した額が売買代金の3割を超えていないことから有効である。","Aが、当該売買契約の解除を行う場合は、Bに対して「手付の倍額を現実に提供して、契約を解除する。」という意思表示を書面で行うことのみをもって、契約を解除することができる。","Aは、当該売買契約の締結日にBから手付金を受領し、翌日、Bから内金を受領した。その2日後、AがBに対して、手付の倍額を現実に提供することにより契約解除の申出を行った場合、Bは、契約の履行に着手しているとしてこれを拒むことができる。"],"exp":["1 × 損害賠償額の予定・違約金の定めがないときは、代金の額と無関係に、実際の損害額を証明して請求できる。上限（代金の2/10）は定めを置く場合の制限（業法38条1項）。","2 × 損害賠償額の予定＋違約金の合算が代金の2/10を超える定めは、超える部分についてのみ無効（業法38条2項）。全体が無効ではない。","3 × 売主が手付解除するには、買主に手付の倍額を現実に提供する必要がある（業法39条2項、民法557条）。書面での意思表示のみでは手付解除できない。","4 ○ 解約手付による解除は相手方が履行に着手するまでに行う必要がある。買主Bが内金（中間金）を支払うなど履行に着手している以上、売主Aは手付解除できず、Bはこれを拒める。→正しい＝正解"]},{"id":42,"cat":"宅建業法","title":"クーリング・オフ","ans":4,"q":"宅地建物取引業者Aが、自ら売主として、宅地建物取引業者ではない個人Bとの間で宅地の売買契約を締結し、手付金を支払ったBが、宅地建物取引業法第37条の2の規定に基づくいわゆるクーリング・オフにより、当該売買契約を契約締結の日の翌日に解除しようとしている。この場合に関する次の記述のうち、誤っているものはどれか。","choices":["Aがクーリング・オフについて告げるときに交付すべき書面には、Aの商号又は名称及び住所並びに免許証番号の記載は必要であるが、Aの宅地建物取引士の記名は必要ない。","Bが、自らの申出により、Bの勤務する会社の事務所において、宅地の買受けの申込み及びAとの売買契約の締結をした場合、Bは、クーリング・オフによる当該売買契約の解除を行うことができない。","Bが、自らの申出により、喫茶店において、宅地の買受けの申込み及びAとの売買契約の締結をした場合、Bは、クーリング・オフによる当該売買契約の解除を行うことができる。","Bは、自らの申出により、Bが融資を受ける銀行（宅地建物取引業者ではない。）において、宅地の買受けの申込み及びAとの売買契約の締結をした場合、クーリング・オフによる当該売買契約の解除を行うことができない。"],"exp":["1 ○ クーリング・オフを告げる書面には商号・住所・免許証番号等の記載が必要だが、宅建士の記名は不要（規則16条の6）。","2 ○ 買主が自らの申出により自宅又は勤務先で買受けを申し込んだ場合は、クーリング・オフできない（規則16条の5第2号）。","3 ○ 喫茶店はクーリング・オフができない「事務所等」に当たらないので、買受けを申し込んでもクーリング・オフできる。","4 × 買主が申し出た銀行も「事務所等」に当たらないので、クーリング・オフできる。「できない」は誤り。→誤り＝正解"]},{"id":43,"cat":"宅建業法","title":"自ら売主制限（総合）","ans":3,"q":"宅地建物取引業者Aが、自ら売主として、宅地建物取引業者でないBとの間で建物の売買契約を締結する場合における次の記述のうち、民法及び宅地建物取引業法の規定によれば、正しいものはどれか。","choices":["Cが建物の所有権を有している場合、AはBとの間で当該建物の売買契約を締結してはならない。ただし、AがCとの間で、すでに当該建物を取得する契約（当該建物を取得する契約の効力の発生に一定の条件が付されている。）を締結している場合は、この限りではない。","Aは、Bとの間における建物の売買契約において、「Bが、契約不適合担保責任を追及するためのその不適合をAに通知する期間は、建物の引渡しの日から1年間とする」旨の特約を付した。この場合、当該特約は無効となり、BがAに対して契約不適合である旨の通知をすべき期間は、当該引渡しの日から2年間となる。","Aは、Bから喫茶店で建物の買受けの申込みを受け、翌日、同じ喫茶店で当該建物の売買契約を締結した際に、その場で契約代金の2割を受領するとともに、残代金は5日後に決済することとした。契約を締結した日の翌日、AはBに当該建物を引き渡したが、引渡日から3日後にBから宅地建物取引業法第37条の2の規定に基づくクーリング・オフによる契約の解除が書面によって通知された。この場合、Aは、契約の解除を拒むことができない。","AB間の建物の売買契約における「宅地建物取引業法第37条の2の規定に基づくクーリング・オフによる契約の解除の際に、AからBに対して損害賠償を請求することができる」旨の特約は有効である。"],"exp":["1 × 停止条件付きで取得する契約では、自ら売主となる売買契約を締結できない（業法33条の2第1号）。","2 × 契約不適合の通知期間を「引渡しから2年以上」とする特約は有効だが、本肢の「1年間」は買主に不利で無効。無効の結果、民法の「不適合を知った時から1年以内に通知」が適用され、「引渡しから2年間」にはならない。","3 ○ 引渡し＋代金全部の支払でクーリング・オフができなくなるが、本肢は残代金支払日の前日に書面で解除通知しているため、Aは解除を拒めない。→正しい＝正解","4 × クーリング・オフが行われた場合、宅建業者は損害賠償・違約金を請求できず（業法37条の2第1項）、これに反する買主に不利な特約は無効（同4項）。"]},{"id":44,"cat":"宅建業法","title":"重要事項説明・書面交付","ans":2,"q":"宅地建物取引業者が行う宅地建物取引業法第35条に規定する重要事項の説明及び書面の交付に関する次の記述のうち、正しいものはどれか。なお、説明の相手方は宅地建物取引業者ではないものとする。","choices":["宅地建物取引業者ではない売主に対しては、買主に対してと同様に、宅地建物取引士をして、契約締結時までに重要事項を記載した書面を交付して、その説明をさせなければならない。","重要事項の説明及び書面の交付は、取引の相手方の自宅又は勤務する場所等、宅地建物取引業者の事務所以外の場所において行うことができる。","宅地建物取引業者が代理人として売買契約を締結し、建物の購入を行う場合は、代理を依頼した者に対して重要事項の説明をする必要はない。","重要事項の説明を行う宅地建物取引士は専任の宅地建物取引士でなくてもよいが、書面に記名する宅地建物取引士は専任の宅地建物取引士でなければならない。"],"exp":["1 × 重要事項の説明は、売買では買主のみ、貸借では借主のみに対して行う（業法35条）。売主には説明不要。","2 ○ 重要事項説明を行う場所に定めはなく、事務所以外の場所でも行える。→正しい＝正解","3 × 宅建業者が代理して売買契約を締結するときは、代理を依頼した者（買主）に重要事項を説明しなければならない（35条1項）。","4 × 重要事項説明を行う宅建士も、書面に記名する宅建士も、専任である必要はない（35条5項参照）。"]},{"id":45,"cat":"宅建業法","title":"住宅瑕疵担保履行法","ans":4,"q":"特定住宅瑕疵担保責任の履行の確保等に関する法律に基づく住宅販売瑕疵担保保証金の供託又は住宅販売瑕疵担保責任保険契約の締結に関する次の記述のうち、正しいものはどれか。","choices":["宅地建物取引業者は、自ら売主として宅地建物取引業者である買主との間で新築住宅の売買契約を締結し、その住宅を引き渡す場合、住宅販売瑕疵担保保証金の供託又は住宅販売瑕疵担保責任保険契約の締結を行う義務を負う。","自ら売主として新築住宅を販売する宅地建物取引業者は、住宅販売瑕疵担保保証金の供託をする場合、宅地建物取引業者でない買主へのその住宅の引渡しまでに、買主に対し、保証金を供託している供託所の所在地等について記載した書面を交付又は買主の承諾を得て電磁的方法による提供をして説明しなければならない。","自ら売主として新築住宅を宅地建物取引業者でない買主に引き渡した宅地建物取引業者は、基準日に係る住宅販売瑕疵担保保証金の供託及び住宅販売瑕疵担保責任保険契約の締結の状況について届出をしなければ、当該基準日以後、新たに自ら売主となる新築住宅の売買契約を締結することができない。","住宅販売瑕疵担保責任保険契約を締結している宅地建物取引業者は、当該保険に係る新築住宅に、構造耐力上主要な部分及び雨水の浸入を防止する部分の瑕疵（構造耐力又は雨水の浸入に影響のないものを除く。）がある場合に、特定住宅販売瑕疵担保責任の履行によって生じた損害について保険金を請求することができる。"],"exp":["1 × 資力確保措置（保証金供託又は保険契約）の義務を負うのは、宅建業者でない買主に新築住宅を売る場合。買主が宅建業者なら資力確保措置は不要（履行法2条7項2号ロ・11条）。","2 × 供託所の所在地等の書面交付・説明は「売買契約を締結するまでに」行う（履行法15条・10条2項）。「引渡しまでに」ではない。","3 × 届出をしないと新たな売買契約が禁止されるのは、基準日の「翌日から起算して50日を経過した日」以後（履行法13条）。「基準日以後」ではない。","4 ○ 保険契約を締結している宅建業者は、特定住宅販売瑕疵担保責任を履行したとき、その損害を塡補するため保険金を請求できる（履行法2条7項2号イ）。→正しい＝正解"]}],"2":[{"id":1,"cat":"権利関係","title":"錯誤","ans":3,"q":"AがBに対し土地の売却の意思表示をしたが、その意思表示は錯誤によるものであった（なお、BはAの錯誤につき善意無過失である）。この場合、次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","choices":["錯誤が法律行為の目的及び取引上の社会通念に照らして重要なものである場合であっても、この売却の意思表示を取り消すことはできない。","錯誤が、売却の意思表示をなすについての動機に関するものであり、それを当該意思表示の内容としてAがBに対して表示した場合であっても、この売却の意思表示を取り消すことはできない。","錯誤を理由としてこの売却の意思表示を取り消すことができる場合、表意者であるAに重過失があるときは、Aは、原則として、自らその取消しを主張することができない。","錯誤を理由としてこの売却の意思表示を取り消すことができる場合、表意者であるAがその錯誤を認めていないときは、Bはこの売却の意思表示の取消しを主張できる。"],"exp":["1 × 錯誤が法律行為の目的及び取引上の社会通念に照らして重要なものであれば取り消すことができる（95条1項）。","2 × 動機の錯誤も、その事情が法律行為の基礎とされていることが表示されていたときは取り消すことができる（95条2項）。","3 ○ 表意者に重大な過失があるときは、原則として錯誤取消しを主張できない（95条3項柱書）。→正しい＝正解","4 × 錯誤取消しができるのは瑕疵ある意思表示をした者・その代理人・承継人に限られる（120条2項）。第三者Bは取消しを主張できない。"]},{"id":2,"cat":"権利関係","title":"制限行為能力","ans":3,"q":"意思無能力者又は制限行為能力者に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","choices":["意思能力を欠いている者が土地を売却する意思表示を行った場合、その親族が当該意思表示を取り消せば、取消しの時点から将来に向かって無効となる。","土地を売却すると、土地の管理義務を免れることになるので、未成年者が土地を売却するに当たっては、その法定代理人の同意は必要ない。","成年被後見人が成年後見人の事前の同意を得て土地を売却する意思表示を行った場合、成年後見人は、当該意思表示を取り消すことができる。","被保佐人が保佐人の事前の同意を得て土地を売却する意思表示を行った場合、保佐人は、当該意思表示を取り消すことができる。"],"exp":["1 × 意思能力を欠く者の意思表示は無効（3条の2）。取消しにより将来に向かって無効になるのではない。","2 × 未成年者が売買契約をするには法定代理人の同意が必要（5条1項本文）。同意なしの契約は取り消せる。","3 ○ 成年被後見人の法律行為は日用品の購入等を除き取り消せる（9条）。事前同意を得ていても同様で、成年後見人も取り消せる（120条1項）。→正しい＝正解","4 × 被保佐人が保佐人の同意を得て行った行為は取り消せない（13条4項）。"]},{"id":3,"cat":"権利関係","title":"時効","ans":2,"q":"時効に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。","choices":["消滅時効の援用権者である「当事者」とは、権利の消滅について正当な利益を有する者であり、債務者のほか、保証人、物上保証人、第三取得者も含まれる。","裁判上の請求をした場合、裁判が終了するまでの間は時効が完成しないが、当該請求を途中で取り下げて権利が確定することなく当該請求が終了した場合には、その終了した時から新たに時効の進行が始まる。","権利の承認があったときは、その時から新たに時効の進行が始まるが、権利の承認をするには、相手方の権利についての処分につき行為能力の制限を受けていないことを要しない。","夫婦の一方が他方に対して有する権利については、婚姻の解消の時から6箇月を経過するまでの間は、時効が完成しない。"],"exp":["1 ○ 消滅時効の援用権者「当事者」には、債務者のほか保証人・物上保証人・第三取得者等、正当な利益を有する者が含まれる（145条）。","2 × 裁判上の請求が確定判決等によらず終了した場合、その終了時から6か月を経過するまで時効は完成しない（147条1項かっこ書）。「新たに進行が始まる」ではない。→誤り＝正解","3 ○ 権利の承認があれば時効は更新され、承認には相手方の権利についての処分能力・権限は不要（152条1項・2項）。","4 ○ 夫婦間の権利は婚姻解消の時から6か月を経過するまで時効が完成しない（159条）。"]},{"id":4,"cat":"権利関係","title":"代理","ans":3,"q":"AがBの代理人としてB所有の甲土地について売買契約を締結した場合に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","choices":["Aが甲土地の売却を代理する権限をBから書面で与えられている場合、A自らが買主となって売買契約を締結したときは、Aは甲土地の所有権を当然に取得する。","Aが甲土地の売却を代理する権限をBから書面で与えられている場合、AがCの代理人となってBC間の売買契約を締結したときは、Cは甲土地の所有権を当然に取得する。","Aが無権代理人であってDとの間で売買契約を締結した後に、Bの死亡によりAが単独でBを相続した場合、Dは甲土地の所有権を当然に取得する。","Aが無権代理人であってEとの間で売買契約を締結した後に、Aの死亡によりBが単独でAを相続した場合、Eは甲土地の所有権を当然に取得する。"],"exp":["1 × 自己契約は本人があらかじめ許諾した場合を除き無権代理行為となる（108条1項）。Aは所有権を当然取得しない。","2 × 双方代理も同様に無権代理行為となる（108条1項）。Cは所有権を当然取得しない。","3 ○ 無権代理人が単独で本人を相続した場合、無権代理行為は当然に有効となる（判例）。Dは所有権を当然取得する。→正しい＝正解","4 × 本人が無権代理人を相続しても、本人の追認拒絶は信義則に反しない（判例）。Eは当然には取得できない。"]},{"id":5,"cat":"権利関係","title":"弁済","ans":1,"q":"AのBからの借入金100万円の弁済に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。","choices":["Aの兄Cは、Aが反対しても、Bの承諾があれば、Bに弁済することができる。","Aの保証人DがBに弁済した場合、Dは、Aの承諾がなくても、Bに代位することができる。","B名義の領収証をEが持参したので、AがEに弁済した場合において、Eに受領権限がなくても、Aが過失無くしてその事情を知らなかったときは、Aは、免責される。","Aは、弁済に当たり、Bに対して領収証を請求し、Bがこれを交付しないときは、その交付がなされるまで弁済を拒むことができる。"],"exp":["1 × 正当な利益を有しない第三者は債務者の意思に反して弁済できない（474条2項本文）。単なる兄というだけでは利害関係を有しない。→誤り＝正解","2 ○ 弁済につき正当な利益を有する者は当然に債権者に代位する（法定代位・499条）。保証人Dは承諾不要で代位する。","3 ○ 受取証書の持参人に善意無過失で弁済したときは有効な弁済となる（478条）。","4 ○ 弁済者は受取証書の交付を請求でき、交付されないときは弁済を拒める（486条）。"]},{"id":6,"cat":"権利関係","title":"対抗関係・物権変動","ans":1,"q":"Aは、Aが所有している甲土地をBに売却した。この場合に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。","choices":["甲土地を何らの権原なく不法占有しているCがいる場合、BがCに対して甲土地の所有権を主張して明渡請求をするには、甲土地の所有権移転登記を備えなければならない。","Bが甲土地の所有権移転登記を備えていない場合には、Aから建物所有目的で甲土地を賃借して甲土地上にD名義の登記ある建物を有するDに対して、Bは自らが甲土地の所有者であることを主張することができない。","Bが甲土地の所有権移転登記を備えないまま甲土地をEに売却した場合、Eは、甲土地の所有権移転登記なくして、Aに対して甲土地の所有権を主張することができる。","Bが甲土地の所有権移転登記を備えた後に甲土地につき取得時効が完成したFは、甲土地の所有権移転登記を備えていなくても、Bに対して甲土地の所有権を主張することができる。"],"exp":["1 × 不法占拠者は「第三者」に当たらないので、Bは登記なくして明渡請求ができる（177条・判例）。→誤り＝正解","2 ○ 借地上に自己名義の登記ある建物を所有する賃借人は「第三者」に当たり、登記のないBは対抗できない。","3 ○ 転々移転した場合の前主Aは当事者に当たり「第三者」ではない。Eは登記なくしてAに所有権を主張できる。","4 ○ 時効完成前に所有権を取得し登記を備えたBは当事者に当たる。Fは登記なくして所有権を主張できる。"]},{"id":7,"cat":"権利関係","title":"抵当権","ans":1,"q":"AがBに対する債務の担保のためにA所有建物に抵当権を設定し、登記をした場合に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","choices":["Aが通常の利用方法を逸脱して、建物の損傷行為を行う場合、Aの債務の弁済期が到来していないときでも、Bは、抵当権に基づく妨害排除請求をすることができる。","抵当権の登記に債務の利息に関する定めがあり、他に後順位抵当権者その他の利害関係者がいない場合でも、Bは、Aに対し、満期のきた最後の2年分を超える利息については抵当権を行うことはできない。","第三者の不法行為により建物が焼失したのでAがその損害賠償金を受領した場合、Bは、Aの受領した損害賠償金に対して物上代位をすることができる。","抵当権の消滅時効の期間は20年であるから、AのBに対する債務の弁済期から10年が経過し、その債務が消滅しても、Aは、Bに対し抵当権の消滅を主張することができない。"],"exp":["1 ○ 抵当権設定者による通常の利用方法を逸脱した損傷行為は抵当権侵害に当たり、抵当権者は妨害排除請求ができる（判例）。→正しい＝正解","2 × 後順位抵当権者等の利害関係者がいない場合は、最後の2年分に制限されず優先弁済を受けられる（判例）。","3 × 物上代位は賠償金が払い渡される前に差押えが必要（372条・304条）。受領後は物上代位できない。","4 × 被担保債権が時効消滅すれば付従性により抵当権も消滅する。Aは抵当権の消滅を主張できる。"]},{"id":8,"cat":"権利関係","title":"自力救済（判決文）","ans":4,"q":"次の1から4までの記述のうち、民法の規定、判例及び下記判決文によれば、正しいものはどれか。\n\n（判決文）\n私力の行使は、原則として法の禁止するところであるが、法律に定める手続によつたのでは、権利に対する違法な侵害に対抗して現状を維持することが不可能又は著しく困難であると認められる緊急やむを得ない特別の事情が存する場合においてのみ、その必要の限度を超えない範囲内で、例外的に許されるものと解することを妨げない。","choices":["権利に対する違法な侵害に対抗して法律に定める手続によらずに自力救済することは、その必要の限度を超えない範囲内であれば、事情のいかんにかかわらず許される。","建物賃貸借契約終了後に当該建物内に家財などの残置物がある場合には、賃貸人の権利に対する違法な侵害であり、賃貸人は賃借人の同意の有無にかかわらず、原則として裁判を行わずに当該残置物を建物内から撤去することができる。","建物賃貸借契約の賃借人が賃料を1年分以上滞納した場合には、賃貸人の権利を著しく侵害するため、原則として裁判を行わずに、賃貸人は賃借人の同意なく当該建物の鍵とシリンダーを交換して建物内に入れないようにすることができる。","裁判を行っていては権利に対する違法な侵害に対抗して現状を維持することが不可能又は著しく困難であると認められる緊急やむを得ない特別の事情が存する場合には、その必要の限度を超えない範囲内で例外的に私力の行使が許される。"],"exp":["1 × 判決文は「緊急やむを得ない特別の事情が存する場合においてのみ」私力の行使を認める。事情のいかんにかかわらず許されるのではない。","2 × 残置物の撤去は私力の行使にあたり、原則として法律の定める手続によることが必要。","3 × 鍵とシリンダーの交換は賃借人の使用収益権を著しく制約し「必要の限度」を超える。","4 ○ 判決文のとおり、緊急やむを得ない特別の事情がある場合に必要の限度を超えない範囲で例外的に許される。→正しい＝正解"]},{"id":9,"cat":"権利関係","title":"使用者責任","ans":1,"q":"Aに雇用されているBが、勤務中にA所有の乗用車を運転し、営業活動のため得意先に向かっている途中で交通事故を起こし、歩いていたCに危害を加えた場合における次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","choices":["BのCに対する損害賠償義務が消滅時効にかかったとしても、AのCに対する損害賠償義務が当然に消滅するものではない。","Cが即死であった場合には、Cには事故による精神的な損害が発生する余地がないので、AはCの相続人に対して慰謝料についての損害賠償責任を負わない。","Aの使用者責任が認められてCに対して損害を賠償した場合には、AはBに対して求償することができるので、Bに資力があれば、最終的にはAはCに対して賠償した損害額の全額を常にBから回収することができる。","Cが幼児である場合には、被害者側に過失があるときでも過失相殺が考慮されないので、AはCに発生した損害の全額を賠償しなければならない。"],"exp":["1 ○ 被用者の損害賠償義務が時効消滅しても、使用者の損害賠償義務が当然に消滅するものではない（判例）。→正しい＝正解","2 × 即死の場合でも被害者に慰謝料請求権が発生し、相続人がこれを相続する（710条・896条本文、判例）。","3 × 使用者から被用者への求償は信義則上相当と認められる限度に制限される（判例）。常に全額回収できるわけではない。","4 × 被害者が幼児の場合でも被害者側の過失（親等の過失）は過失相殺で考慮される（722条2項、判例）。"]},{"id":10,"cat":"権利関係","title":"請負","ans":3,"q":"請負契約に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。","choices":["請負契約が請負人の責めに帰すべき事由によって中途で終了し、請負人が施工済みの部分に相当する報酬に限ってその支払を請求することができる場合、注文者が請負人に請求できるのは、注文者が残工事の施工に要した費用のうち、請負人の未施工部分に相当する請負代金額を超える額に限られる。","請負契約が注文者の責めに帰すべき事由によって中途で終了した場合、請負人は、残債務を免れるとともに、注文者に請負代金全額を請求できるが、自己の債務を免れたことによる利益を注文者に償還しなければならない。","請負契約の目的物に種類又は品質に関する契約不適合がある場合、注文者は、請負人から修補に代わる損害の賠償を受けていなくとも、特別の事情がない限り、報酬全額を支払わなければならない。","請負人が契約不適合を理由とする責任を負わない旨の特約をしたときであっても、知りながら告げなかった事実については、その責任を免れることはできない。"],"exp":["1 ○ 請負人の帰責事由で中途終了した場合、注文者が請求できるのは残工事費用のうち未施工部分の請負代金額を超える額に限られる（判例）。","2 ○ 注文者の帰責事由で中途終了した場合、請負人は報酬全額を請求できるが、自己の債務を免れた利益を償還しなければならない（536条2項）。","3 × 契約不適合がある場合、注文者は修補に代わる損害賠償債権と報酬債権とを同時履行の関係に立たせ、報酬の支払を拒める（判例）。→誤り＝正解","4 ○ 免責特約があっても、知りながら告げなかった事実については責任を免れない（559条・572条）。"]},{"id":11,"cat":"権利関係","title":"借地権の譲渡","ans":2,"q":"借地人Aが、令和8年9月1日に甲地所有者Bと締結した建物所有を目的とする甲地賃貸借契約に基づいてAが甲地上に所有している建物と甲地の借地権とを第三者Cに譲渡した場合に関する次の記述のうち、民法及び借地借家法の規定によれば、正しいものはどれか。","choices":["甲地上のA所有の建物が登記されている場合には、AがCと当該建物を譲渡する旨の合意をすれば、Bの承諾の有無にかかわらず、CはBに対して甲地の借地権を主張できる。","Aが借地権をCに対して譲渡するに当たり、Bに不利になるおそれがないにもかかわらず、Bが借地権の譲渡を承諾しない場合には、AはBの承諾に代わる許可を与えるように裁判所に申し立てることができる。","Aが借地上の建物をDに賃貸している場合には、Aはあらかじめの同意を得ておかなければ、借地権を譲渡することはできない。","AB間の借地契約が専ら事業の用に供する建物（居住の用に供するものを除く。）の所有を目的とし、かつ、存続期間を20年とする借地契約である場合には、AはBの承諾の有無にかかわらず、借地権をCに対して譲渡することができ、CはBに対して甲地の借地権を主張できる。"],"exp":["1 × 借地上の建物を譲渡し借地権を譲渡するには賃貸人の承諾が必要（612条1項）。合意だけでは対抗できない。","2 ○ 賃貸人に不利となるおそれがないのに承諾しないときは、裁判所に承諾に代わる許可を申し立てられる（借地借家法19条1項）。→正しい＝正解","3 × 借地上の建物の賃借人Dの同意は不要。借地権譲渡に必要なのは賃貸人Bの承諾。","4 × 事業用定期借地権であっても、借地権の譲渡には賃貸人の承諾が必要（612条1項）。"]},{"id":12,"cat":"権利関係","title":"借地借家法（借家）","ans":2,"q":"AはBと、B所有の甲建物につき、居住を目的として、期間3年、賃料月額20万円と定めて賃貸借契約（以下この問において「本件契約」という。）を締結した。この場合における次の記述のうち、借地借家法の規定及び判例によれば、誤っているものはどれか。","choices":["AもBも相手方に対し、本件契約の期間満了前に何らの通知もしなかった場合、従前の契約と同一の条件で契約を更新したものとみなされるが、その期間は定めがないものとなる。","BがAに対し、本件契約の解約を申し入れる場合、甲建物の明渡しの条件として、一定額以上の財産上の給付を申し出たときは、Bの解約の申入れに正当事由があるとみなされる。","甲建物の適法な転借人であるCが、Bの同意を得て甲建物に造作を付加した場合、期間満了により本件契約が終了するときは、CはBに対してその造作を時価で買い取るよう請求することができる。","本件契約が借地借家法第38条の定期建物賃貸借で、契約の更新がない旨を定めた場合でも、BはAに対し、同条所定の通知期間内に、期間満了により本件契約が終了する旨の通知をしなければ、期間3年での終了をAに対抗することができない。"],"exp":["1 ○ 期間満了1年前から6か月前までに更新拒絶の通知をしなければ従前と同一条件で更新したものとみなされ、その期間は定めがないものとなる（借地借家法26条1項）。","2 × 財産上の給付の申出は正当事由の考慮要素の一つにすぎず、それだけで正当事由があるとみなされるわけではない（28条）。→誤り＝正解","3 ○ 適法な転借人も、賃貸人の同意を得て付加した造作について造作買取請求ができる（33条2項・1項）。","4 ○ 定期建物賃貸借（期間1年以上）では、期間満了1年前から6か月前までに終了通知をしなければ終了を対抗できない（38条6項本文）。"]},{"id":13,"cat":"権利関係","title":"区分所有法","ans":3,"q":"建物の区分所有等に関する法律（以下この問において「法」という。）に関する次の記述のうち、誤っているものはどれか。","choices":["管理者は、利害関係人の請求があったときは、正当な理由がある場合を除いて、規約の閲覧を拒んではならない。","規約に別段の定めがある場合を除いて、各共有者の共用部分の持分は、その有する専有部分の壁その他の区画の内側線で囲まれた部分の水平投影面積の割合による。","一部共用部分に関する事項で区分所有者全員の利害に関係しないものは、区分所有者全員の規約に定めることができない。","法又は規約により集会において決議すべきとされた事項であっても、区分所有者（議決権を有しないものを除く。）全員の書面による合意があったときは、書面による決議があったものとみなされる。"],"exp":["1 ○ 管理者は、利害関係人の請求があったときは正当な理由がある場合を除き規約の閲覧を拒めない（区分所有法33条2項）。","2 ○ 各共有者の共用部分の持分は、規約に別段の定めがある場合を除き、専有部分の床面積の割合による（14条1項・3項）。","3 × 一部共用部分に関する事項で区分所有者全員の利害に関係しないものも、区分所有者全員の規約に定めることができる（30条2項）。→誤り＝正解","4 ○ 区分所有者全員の書面による合意があったときは、書面による決議があったものとみなされる（45条2項）。"]},{"id":14,"cat":"権利関係","title":"所有権保存の登記","ans":2,"q":"所有権保存の登記に関する次の記述のうち、誤っているものはどれか。","choices":["所有権の登記がされていない建物について、その所有権が自己にあることを確定判決によって確認された者は、当該建物の所有権保存の登記を申請することができる。","土地の登記簿の表題部に被相続人が所有者として記載されている場合において、その相続人が複数あるときは、共同相続人の1人は、自己の持分についてのみ所有権保存の登記を申請することができる。","土地収用法による収用によって土地の所有権を取得した者は、直接自己名義に当該土地の所有権保存の登記を申請することができる。","1棟の建物を区分した建物の登記簿の表題部所有者から所有権を取得した者は、直接自己名義に当該建物の所有権保存の登記を申請することができる。"],"exp":["1 ○ 所有権が自己にあることを確定判決により確認された者は、所有権保存の登記を申請できる（不登法74条1項2号）。","2 × 共同相続人の1人は、全員のための保存行為として全員名義の保存登記はできるが、自己の持分のみの保存登記はできない（民法252条5項）。→誤り＝正解","3 ○ 収用によって所有権を取得した者は、直接自己名義に所有権保存の登記を申請できる（不登法74条1項3号）。","4 ○ 区分建物の表題部所有者から所有権を取得した者は、直接自己名義に所有権保存の登記を申請できる（不登法74条2項）。"]},{"id":15,"cat":"法令上の制限","title":"都市計画法（地区計画等）","ans":4,"q":"都市計画法に関する次の記述のうち、正しいものはどれか。","choices":["地区計画は、建築物の建築形態、公共施設その他の施設の配置等からみて、一体としてそれぞれの区域の特性にふさわしい態様を備えた良好な環境の各街区を整備し、開発し、及び保全するための計画であり、用途地域が定められている土地の区域においてのみ定められる。","都市計画事業の認可の告示があった後においては、当該都市計画事業を施行する土地内において、当該事業の施行の障害となるおそれがある土地の形質の変更を行おうとする者は、都道府県知事及び当該事業の施行者の許可を受けなければならない。","都市計画事業については、土地収用法の規定による事業の認定及び当該認定の告示をもって、都市計画法の規定による事業の認可又は承認及び当該認可又は承認の告示とみなすことができる。","特別用途地区は、用途地域内の一定の地区における当該地区の特性にふさわしい土地利用の増進、環境の保護等の特別の目的の実現を図るため当該用途地域の指定を補完して定める地区である。"],"exp":["1 × 地区計画は用途地域が定められている区域のほか、一定の要件を満たせば用途地域の定められていない土地の区域にも定められる（都計法12条の5第1項2号）。","2 × 都市計画事業の認可の告示後、事業地内で土地の形質の変更等を行うには都道府県知事等の許可が必要（65条1項）。施行者の許可ではない。","3 × 都市計画法の事業認可等の告示をもって、土地収用法の事業認定及び告示とみなす（70条1項）。記述が逆。","4 ○ 特別用途地区は、用途地域内の一定の地区で当該地区の特性にふさわしい土地利用の増進、環境の保護等の目的で用途地域の指定を補完して定める地区（9条14項）。→正しい＝正解"]},{"id":16,"cat":"法令上の制限","title":"都市計画法（開発許可）","ans":1,"q":"都市計画法（以下この問において「法」という。）に関する次の記述のうち、正しいものはどれか。ただし、この問において条例による特別の定めはないものとし、「都道府県知事」とは、地方自治法に基づく指定都市、中核市及び施行時特例市にあってはその長をいうものとする。","choices":["市街化区域内において行う、医療法に規定する病院を建築するための1,000㎡の開発行為については、法第29条に基づく都道府県知事の許可を得る必要がある。","市街化区域内において行う、開発行為を伴わない建築物の建築で、当該建築物の床面積が1,000㎡以上のものについては、法第29条に基づく都道府県知事の許可を得る必要がある。","市街化調整区域内において行う、都市計画事業の施行のための開発行為については、法第29条に基づく都道府県知事の許可を得る必要がある。","法第29条に基づく許可を受けた者は、当該許可に係る土地についての一定の事項を開発登録簿に登録しなければならない。"],"exp":["1 ○ 市街化区域内で1,000㎡以上の開発行為は許可が必要。病院は公益上必要な建築物に該当しないので許可を要する（29条1項1号、施行令19条1項・21条26号）。→正しい＝正解","2 × 開発行為を伴わない建築物の建築は開発許可の対象外。床面積にかかわらず許可不要。","3 × 都市計画事業の施行として行う開発行為は許可不要（29条1項但書4号）。","4 × 開発登録簿に登録するのは都道府県知事（47条1項）。許可を受けた者ではない。"]},{"id":17,"cat":"法令上の制限","title":"建築基準法","ans":3,"q":"建築基準法に関する次の記述のうち、正しいものはどれか。","choices":["建築物の高さ31m以下の部分にある全ての階には、非常用の進入口を設けなければならない。","防火地域内にある3階建ての木造の建築物を増築する場合、その増築に係る部分の床面積の合計が10㎡以内であれば、その工事が完了した際に、建築主事等又は指定確認検査機関の完了検査を受ける必要はない。","4階建ての事務所の用途に供する建築物の2階以上の階にあるバルコニーその他これに類するものの周囲には、安全上必要な高さが1.1m以上の手すり壁、さく又は金網を設けなければならない。","建築基準法の改正により、現に存する建築物が改正後の規定に適合しなくなった場合、当該建築物の所有者又は管理者は速やかに当該建築物を改正後の建築基準法の規定に適合させなければならない。"],"exp":["1 × 非常用の進入口は高さ31m以下の部分にある3階以上の階に設ける（施行令126条の6）。「全ての階」ではない。","2 × 防火地域内で増築部分の床面積が10㎡以内でも、防火地域・準防火地域内では建築確認が必要であり、完了検査も必要（建基法7条1項・4項）。","3 ○ 2階以上の階にあるバルコニー等の周囲には、安全上必要な高さ1.1m以上の手すり壁・さく・金網を設けなければならない（施行令126条1項）。→正しい＝正解","4 × 法改正により現に存する建築物が不適合となった場合、既存不適格建築物として改正後の規定は適用されない（建基法3条2項）。"]},{"id":18,"cat":"法令上の制限","title":"建築基準法（第二種低層）","ans":4,"q":"第二種低層住居専用地域に指定されている区域内の土地（以下この問において「区域内の土地」という。）に関する次の記述のうち、建築基準法の規定によれば、正しいものはどれか。ただし、特定行政庁の許可については考慮しないものとする。","choices":["区域内の土地においては、美容院の用途に供する部分の床面積の合計が100㎡である2階建ての美容院を建築することができない。","区域内の土地においては、都市計画において建築物の外壁又はこれに代わる柱の面から敷地境界線までの距離の限度を2m又は1.5mとして定めることができる。","区域内の土地においては、高さが9mを超える建築物を建築することはできない。","区域内の土地においては、建築物を建築しようとする際、当該建築物に対する建築基準法第56条第1項第2号のいわゆる隣地斜線制限の適用はない。"],"exp":["1 × 第二種低層住居専用地域では、床面積の合計が150㎡以内の2階建て以下の店舗（美容院を含む）は建築できる（48条2項、別表第二（ろ）2号、施行令130条の5の2第2号）。","2 × 外壁の後退距離の限度は1.5m又は1mとして定めることができる（54条）。「2m又は1.5m」ではない。","3 × 第一種・第二種低層住居専用地域の高さ制限は10m又は12m（55条1項）。9mを超えると建築できないわけではない。","4 ○ 第一種・第二種低層住居専用地域では絶対高さ制限があるため、隣地斜線制限（56条1項2号）の適用はない。→正しい＝正解"]},{"id":19,"cat":"法令上の制限","title":"盛土規制法","ans":2,"q":"宅地造成及び特定盛土等規制法に関する次の記述のうち、誤っているものはどれか。なお、この問において「都道府県知事」とは、地方自治法に基づく指定都市及び中核市にあってはその長をいうものとし、地方自治法に基づく施行時特例市に係る経過措置については考慮しないものとする。","choices":["都道府県知事は、宅地造成等工事規制区域内の土地について、宅地造成等に伴う災害を防止するために必要があると認める場合には、その土地の所有者に対して、擁壁等の設置等の措置をとることを勧告することができる。","宅地造成等工事規制区域の指定の際に、当該宅地造成等工事規制区域内において宅地造成等に関する工事を行っている者は、当該工事について改めて都道府県知事の許可を受けなければならない。","宅地造成等工事規制区域内において、宅地造成等に関する工事の許可を受けた者が、工事施行者を変更する場合には、遅滞なくその旨を都道府県知事に届け出ればよく、改めて許可を受ける必要はない。","宅地造成等工事規制区域内において、宅地を造成するために切土をする土地の面積が500㎡であって盛土が生じない場合、切土をした部分に生じる崖の高さが1.5mであれば、都道府県知事の許可は必要ない。"],"exp":["1 ○ 都道府県知事は、宅地造成等に伴う災害防止のため必要があると認める場合、土地の所有者等に擁壁等の設置等の措置をとることを勧告できる（盛土規制法22条2項）。","2 × 区域指定の際に既に工事を行っている者は、指定日から21日以内に都道府県知事に届け出ればよく、改めて許可を受ける必要はない（21条1項）。→誤り＝正解","3 ○ 工事施行者の変更は軽微な変更に当たり、遅滞なく届け出れば足りる（16条2項、規則38条1項1号）。","4 ○ 切土で高さ2m以下の崖、かつ面積500㎡以下はいずれの規模要件にも該当せず、許可は不要。"]},{"id":20,"cat":"法令上の制限","title":"土地区画整理法","ans":3,"q":"土地区画整理法に関する次の記述のうち、誤っているものはどれか。","choices":["換地計画において参加組合員に対して与えるべきものとして定められた宅地は、換地処分の公告があった日の翌日において、当該宅地の所有者となるべきものとして換地計画において定められた参加組合員が取得する。","換地計画において換地を定める場合においては、換地及び従前の宅地の位置、地積、土質、水利、利用状況、環境等が照応するように定めなければならない。","土地区画整理組合の設立の認可の公告があった日後、換地処分の公告がある日までは、施行地区内において、土地区画整理事業の施行の障害となるおそれがある土地の形質の変更を行おうとする者は、当該土地区画整理組合の許可を受けなければならない。","土地区画整理組合の組合員は、組合員の3分の1以上の連署をもって、その代表者から理由を記載した書面を土地区画整理組合に提出して、理事又は監事の解任を請求することができる。"],"exp":["1 ○ 参加組合員に与えるべきものとして換地計画に定められた宅地は、換地処分の公告があった日の翌日に参加組合員が取得する（区画法104条10項）。","2 ○ 換地は、従前の宅地と位置・地積・土質・水利・利用状況・環境等が照応するように定めなければならない（89条1項・照応の原則）。","3 × 認可の公告後、施行地区内で事業の障害となるおそれがある土地の形質変更等をするには、都道府県知事等の許可が必要（76条1項2号）。組合の許可ではない。→誤り＝正解","4 ○ 組合員は3分の1以上の連署をもって、理事又は監事の解任を請求できる（27条7項）。"]},{"id":21,"cat":"法令上の制限","title":"農地法","ans":4,"q":"農地に関する次の記述のうち、農地法（以下この問において「法」という。）の規定によれば、正しいものはどれか。","choices":["市街化区域内の農地を耕作のために借り入れる場合、あらかじめ農業委員会に届出をすれば、法第3条第1項の許可を受ける必要はない。","市街化調整区域内の4ヘクタールを超える農地について、これを転用するために所有権を取得する場合、農林水産大臣の許可を受ける必要がある。","銀行から500万円を借り入れるために農地に抵当権を設定する場合、法第3条第1項又は第5条第1項の許可を受ける必要がある。","相続により農地の所有権を取得した者は、遅滞なく、その農地の存する市町村の農業委員会にその旨を届け出なければならない。"],"exp":["1 × 市街化区域内でも、農地を耕作目的で借り入れる（3条）場合に届出で足りる特則はない。3条許可が必要。","2 × 転用目的の権利移動は5条許可。面積にかかわらず都道府県知事等の許可であり、農林水産大臣の許可ではない。","3 × 抵当権の設定は使用収益を目的とする権利ではないため、3条・5条の許可は不要。","4 ○ 相続等により農地の権利を取得した者は、遅滞なく農業委員会にその旨を届け出なければならない（農地法3条の3）。→正しい＝正解"]},{"id":22,"cat":"法令上の制限","title":"国土利用計画法","ans":3,"q":"国土利用計画法第23条に規定する届出（以下この問において「事後届出」という。）に関する次の記述のうち、正しいものはどれか。","choices":["市街化区域内の土地（面積2,500㎡）を購入する契約を締結した者は、その契約を締結した日から起算して3週間以内に事後届出を行わなければならない。","Aが所有する監視区域内の土地（面積10,000㎡）をBが購入する契約を締結した場合、A及びBは事後届出を行わなければならない。","都市計画区域外に所在し、一団の土地である甲土地（面積6,000㎡）と乙土地（面積5,000㎡）を購入する契約を締結した者は、事後届出を行わなければならない。","市街化区域内の甲土地（面積3,000㎡）を購入する契約を締結した者が、その契約締結の1月後に甲土地と一団の土地である乙土地（面積4,000㎡）を購入することとしている場合においては、甲土地の事後届出は、乙土地の契約締結後に乙土地の事後届出と併せて行うことができる。"],"exp":["1 × 事後届出は契約締結日から起算して2週間以内（国土法23条1項）。3週間以内ではない。","2 × 監視区域内では事前届出が必要（27条の7）。事後届出ではない。","3 ○ 都市計画区域外では10,000㎡以上が対象。6,000㎡＋5,000㎡＝11,000㎡の一団の土地なので事後届出が必要。→正しい＝正解","4 × 各契約ごとに、契約締結日から2週間以内に届出を行わなければならない。甲土地の届出を乙土地の契約後まで待つことはできない。"]},{"id":23,"cat":"税その他","title":"譲渡所得の課税特例","ans":4,"q":"租税特別措置法第36条の2の特定の居住用財産の買換えの場合の長期譲渡所得の課税の特例に関する次の記述のうち、正しいものはどれか。","choices":["譲渡資産とされる家屋については、その譲渡に係る対価の額が5,000万円以下であることが、適用要件とされている。","買換資産とされる家屋については、譲渡資産の譲渡をした日からその譲渡をした日の属する年の12月31日までに取得をしたものであることが、適用要件とされている。","譲渡資産とされる家屋については、その譲渡をした日の属する年の1月1日における所有期間が5年を超えるものであることが、適用要件とされている。","買換資産とされる家屋については、その床面積のうち自己の居住の用に供する部分の床面積が50㎡以上のものであることが、適用要件とされている。"],"exp":["1 × 譲渡資産の対価の額は1億円以下であることが要件（租特法36条の2第1項）。5,000万円以下ではない。","2 × 買換資産の取得期限は、譲渡をした日の属する年の翌年12月31日まで（36条の2第1項本文）。","3 × 譲渡資産は、譲渡した日の属する年の1月1日における所有期間が10年を超えるものであることが要件。5年超ではない。","4 ○ 買換資産の家屋は、自己の居住の用に供する部分の床面積が50㎡以上であることが要件（施行令24条の2第3項1号イ）。→正しい＝正解"]},{"id":24,"cat":"税その他","title":"固定資産税","ans":3,"q":"固定資産税に関する次の記述のうち、正しいものはどれか。","choices":["固定資産税を既に全納した者が、年度の途中において土地の譲渡を行った場合には、その譲渡後の月数に応じて税額の還付を受けることができる。","固定資産税の税率は、1.7%を超えることができない。","固定資産税の納期は、4月、7月、12月及び2月中において、当該市町村の条例で定めることとされているが、特別の事情がある場合においては、これと異なる納期を定めることができる。","200㎡以下の住宅用地に対して課する固定資産税の課税標準は、課税標準となるべき価格の2分の1の額とする特例措置が講じられている。"],"exp":["1 × 固定資産税は賦課期日（1月1日）の所有者に課され、年度途中で譲渡しても税額の還付を受ける規定はない。","2 × 標準税率は1.4%で、1.7%を超える税率を定めるときは議会の議決が必要（地方税法350条2項）。上限を定める規定ではない。","3 ○ 納期は4月・7月・12月・2月中において市町村の条例で定めるが、特別の事情がある場合はこれと異なる納期を定められる（362条1項）。→正しい＝正解","4 × 200㎡以下の小規模住宅用地の課税標準は、価格の6分の1の額とされる（349条の3の2第2項1号）。2分の1ではない。"]},{"id":25,"cat":"税その他","title":"地価公示法","ans":3,"q":"地価公示法に関する次の記述のうち、誤っているものはどれか。","choices":["都市及びその周辺の地域等において、土地の取引を行う者は、取引の対象土地に類似する利用価値を有すると認められる標準地について公示された価格を指標として取引を行うよう努めなければならない。","地価公示は、土地鑑定委員会が、毎年1回、2人以上の不動産鑑定士の鑑定評価を求め、その結果を審査し、必要な調整を行って、標準地の正常な価格を判定し、これを公示するものである。","標準地の正常な価格とは、土地について、自由な取引が行われるとした場合に通常成立すると認められる価格をいい、当該土地に地上権がある場合には、その地上権が存するものとして通常成立すると認められる価格をいう。","標準地の鑑定評価は、近傍類地の取引価格から算定される推定の価格、近傍類地の地代等から算定される推定の価格及び同等の効用を有する土地の造成に要する推定の費用の額を勘案して行われる。"],"exp":["1 ○ 都市及びその周辺の地域等で土地の取引を行う者は、公示価格を指標として取引を行うよう努めなければならない（地価公示法1条の2）。","2 ○ 地価公示は、土地鑑定委員会が毎年1回、2人以上の不動産鑑定士の鑑定評価を求め、審査・調整して標準地の正常な価格を判定・公示する（2条1項）。","3 × 標準地の正常な価格は、地上権等がある場合には、これらの権利が存しないものとして通常成立すると認められる価格をいう（2条2項）。→誤り＝正解","4 ○ 標準地の鑑定評価は、近傍類地の取引価格から算定される推定の価格、近傍類地の地代等から算定される推定の価格、同等の効用を有する土地の造成に要する推定の費用の額を勘案して行う（4条）。"]},{"id":26,"cat":"宅建業法","title":"免許","ans":3,"q":"宅地建物取引業の免許（以下この問において「免許」という。）に関する次の記述のうち、正しいものはどれか。","choices":["宅地建物取引業を営もうとする者は、同一県内に2以上の事務所を設置してその事業を営もうとする場合にあっては、国土交通大臣の免許を受けなければならない。","Aが、B社が甲県に所有する1棟のマンション（20戸）を、貸主として不特定多数の者に反復継続して転貸する場合、Aは甲県知事の免許を受けなければならない。","C社が乙県にのみ事務所を設置し、Dが丙県に所有する1棟のマンション（10戸）について、不特定多数の者に反復継続して貸借の代理を行う場合、C社は乙県知事の免許を受けなければならない。","宅地建物取引業を営もうとする者が、国土交通大臣又は都道府県知事から免許を受けた場合、その有効期間は、国土交通大臣から免許を受けたときは5年、都道府県知事から免許を受けたときは3年である。"],"exp":["1 × 同一県内に2以上の事務所を設置する場合は、その都道府県知事の免許を受ける（業法3条1項）。国土交通大臣免許は2以上の都道府県に事務所を設置する場合。","2 × 自ら貸主として転貸する行為は「取引」に当たらないため、免許は不要。","3 ○ 貸借の代理は「取引」に当たり業として行うには免許が必要。事務所が乙県のみなら乙県知事免許（物件所在地は問わない）。→正しい＝正解","4 × 免許の有効期間は、国土交通大臣・都道府県知事いずれも5年（業法3条2項）。"]},{"id":27,"cat":"宅建業法","title":"免許","ans":3,"q":"宅地建物取引業の免許（以下この問において「免許」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","choices":["宅地建物取引業者Aが免許の更新の申請を行った場合において、免許の有効期間の満了の日までにその申請について処分がなされないときは、Aの従前の免許は、有効期間の満了によりその効力を失う。","甲県に事務所を設置する宅地建物取引業者B（甲県知事免許）が、乙県所在の宅地の売買の媒介をする場合、Bは国土交通大臣に免許換えの申請をしなければならない。","宅地建物取引業を営もうとする個人Cが、拘禁刑に処せられ、その刑の執行を終えた日から5年を経過しない場合、Cは免許を受けることができない。","いずれも宅地建物取引士ではないDとEが宅地建物取引業者F社の取締役に就任した。Dが常勤、Eが非常勤である場合、F社はDについてのみ役員の変更を免許権者に届け出る必要がある。"],"exp":["1 × 更新申請後、有効期間満了までに処分がされないときは、従前の免許は処分がなされるまでなお効力を有する（業法3条4項）。","2 × 免許換えが必要なのは事務所の設置状況が変わる場合。他県で媒介をするだけなら免許換えは不要。","3 ○ 拘禁刑に処せられた者は、刑の執行を終えた日から5年を経過しないと免許を受けられない（業法5条1項5号）。→正しい＝正解","4 × 役員は常勤・非常勤を問わず「役員」に含まれる。D・E両方について変更の届出が必要（業法9条・4条1項2号）。"]},{"id":28,"cat":"宅建業法","title":"業務規制（勧誘等）","ans":1,"q":"宅地建物取引業者が売主である新築分譲マンションを訪れた買主Aに対して、当該宅地建物取引業者の従業者Bが行った次の発言内容のうち、宅地建物取引業法の規定に違反しないものはいくつあるか。\n\nア A：眺望の良さが気に入った。隣接地は空地だが、将来の眺望は大丈夫なのか。\n　　B：隣接地は、市有地で、現在、建築計画や売却の予定がないことを市に確認しました。将来、建つとしても公共施設なので、市が眺望を遮るような建物を建てることは絶対ありません。ご安心ください。\n\nイ A：先日来たとき、5年後の転売で利益が生じるのが確実だと言われたが本当か。\n　　B：弊社が数年前に分譲したマンションが、先日高値で売れました。このマンションはそれより立地条件が良く、また、近隣のマンション価格の動向から見ても、5年後値上がりするのは間違いありません。\n\nウ A：購入を検討している。貯金が少なく、手付金の負担が重いのだが。\n　　B：弊社と提携している銀行の担当者から、手付金も融資の対象になっていると聞いております。ご検討ください。\n\nエ A：昨日、申込証拠金10万円を支払ったが、都合により撤回したいので申込証拠金を返してほしい。\n　　B：お預かりした10万円のうち、社内規程上、お客様の個人情報保護のため、申込書の処分手数料として、5,000円はお返しできませんが、残金につきましては法令に従いお返しします。","choices":["一つ","二つ","三つ","なし"],"exp":["ア 違反する 「市が眺望を遮るような建物を建てることは絶対ありません」は将来の環境について断定的判断を提供するもので禁止（業法47条の2第1項）。","イ 違反する 「5年後値上がりするのは間違いありません」は将来の利益について断定的判断を提供するもので禁止（47条の2第1項）。","ウ 違反しない 提携銀行の融資（住宅ローン等のあっせん）は「信用の供与」に当たらず、手付貸与の禁止（47条3号）に違反しない。","エ 違反する 申込証拠金は、申込みの撤回があれば全額返還しなければならず、処分手数料等の名目で控除することは禁止（47条の2第3項、規則16条の11第2号）。","→違反しないのはウの一つ。①が正解。"]},{"id":29,"cat":"宅建業法","title":"免許（欠格・変更）","ans":3,"q":"宅地建物取引業の免許に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","choices":["宅地建物取引業者が、免許を受けてから1年以内に事業を開始せず免許が取り消され、その後5年を経過していない場合は、免許を受けることができない。","免許を受けようとしている法人の政令で定める使用人が、破産手続開始の決定を受け、復権を得てから5年を経過していない場合、当該法人は免許を受けることができない。","免許権者は、免許に条件を付することができ、免許の更新に当たっても条件を付することができる。","宅地建物取引業者の役員の住所に変更があったときは、30日以内に免許権者に変更を届け出なければならない。"],"exp":["1 × 免許を受けてから1年以内に事業を開始せず免許を取り消された場合は、5年を経過していなくても免許を受けられる（業法5条1項2号の欠格事由に該当しない）。","2 × 破産者でも復権を得れば直ちに免許を受けられる（5条1項1号）。5年の経過は不要。","3 ○ 免許権者は免許に条件を付すことができ、免許の更新に当たっても条件を付すことができる（業法3条の2第1項）。→正しい＝正解","4 × 役員の「氏名」に変更があったときは届出が必要だが、「住所」の変更は届出事項ではない（業法9条・4条1項2号）。"]},{"id":30,"cat":"宅建業法","title":"登録・取引士証","ans":4,"q":"宅地建物取引士資格登録（以下この問において「登録」という。）及び宅地建物取引士証に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","choices":["宅地建物取引士A（甲県知事登録）が、宅地建物取引業者B社（乙県知事免許）に従事した場合、Aは乙県知事に対し、甲県知事を経由して登録の移転を申請しなければならない。","宅地建物取引士Cが、宅地建物取引業者D社を退職し、宅地建物取引業者E社に就職したが、CはD社及びE社においても専任の宅地建物取引士ではないので、宅地建物取引士資格登録簿の変更の登録は申請しなくてもよい。","Fは、不正の手段により登録を受けたとして、登録の消除の処分の聴聞の期日及び場所が公示された後、自らの申請により、登録が消除された。Fは、登録が消除された日から5年を経過せずに新たに登録を受けることができる。","宅地建物取引士Gは、宅地建物取引士証の有効期間内に更新をせず、有効期間の満了日から2週間後に宅地建物取引士証の交付を受けた。その2週間の間にGに重要事項説明を行わせた宅地建物取引業者H社は業務停止処分を受けることがある。"],"exp":["1 × 登録の移転は任意であり、「しなければならない」ではない（業法19条の2）。","2 × 勤務先の宅建業者に変更があったときは、専任か否かにかかわらず変更の登録を申請しなければならない（業法20条・18条2項）。","3 × 聴聞の公示後に自ら申請して登録が消除された者は、消除の日から5年を経過しないと新たに登録を受けられない（業法18条1項10号）。","4 ○ 有効期間満了後、新たな宅建士証の交付を受けるまでの間は宅建士ではないため、その者に重要事項説明を行わせた業者は業務停止処分を受けることがある（業法65条2項2号）。→正しい＝正解"]},{"id":31,"cat":"宅建業法","title":"営業保証金","ans":3,"q":"宅地建物取引業者A（甲県知事免許）の営業保証金に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはどれか。なお、Aは、甲県内に本店と一つの支店を設置して事業を営んでいるものとする。","choices":["Aが販売する新築分譲マンションの広告を受託した広告代理店は、その広告代金債権に関し、Aが供託した営業保証金からその債権の弁済を受ける権利を有しない。","Aは、免許の有効期間の満了に伴い、営業保証金の取戻しをするための公告をしたときは、遅滞なく、その旨を甲県知事に届け出なければならない。","Aは、マンション3棟を分譲するための現地出張所を甲県内に設置した場合、営業保証金を追加して供託しなければ、当該出張所でマンションの売買契約を締結することはできない。","Aの支店でAと宅地建物取引業に関する取引をした者は、その取引により生じた債権に関し、1,500万円を限度として、Aが供託した営業保証金からその債権の弁済を受ける権利を有する。"],"exp":["1 ○ 広告代金債権は「宅建業に関する取引」により生じた債権に当たらないので、営業保証金からの弁済を受ける権利はない（業法27条1項）。","2 ○ 取戻しのための公告をしたときは、遅滞なくその旨を免許権者（甲県知事）に届け出なければならない（業法30条2項）。","3 × 現地出張所は「事務所」に該当しないため、営業保証金の追加供託は不要。→誤り＝正解","4 ○ 本店1,000万円＋支店500万円＝1,500万円が供託額であり、取引の相手方はその範囲で弁済を受けられる（業法25条2項、施行令2条の4）。"]},{"id":32,"cat":"宅建業法","title":"保証協会","ans":3,"q":"宅地建物取引業者Aが宅地建物取引業保証協会（以下この問において「保証協会」という。）に加入した場合に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","choices":["Aが保証協会に加入する前に、Aと宅地建物取引業に関し取引をした者（宅地建物取引業者を除く）は、弁済業務保証金について弁済を受けることができない。","Aは保証協会に加入した後に新たに事務所を開設したときは、その日から2週間以内に、営業保証金500万円を主たる事務所のもよりの供託所に供託しなければならない。","Aがその一部の事務所を廃止したため、保証協会が弁済業務保証金分担金をAに返還しようとするときは、保証協会は、弁済業務保証金の還付請求権者に対し、一定期間内に認証を受けるため申し出るべき旨の公告を行う必要はない。","Aが、保証協会から弁済業務保証金の還付に係る還付充当金を納付すべき旨の通知を受けた日から2週間以内に、通知された額の還付充当金を保証協会に納付しない場合、保証協会は納付をすべき旨の催告をしなければならず、催告が到達した日から1月以内にAが納付しない場合は、Aは社員としての地位を失う。"],"exp":["1 × 社員となる前に取引をした者も、弁済業務保証金について弁済を受けることができる（業法64条の8第1項かっこ書）。","2 × 保証協会の社員は、新たに事務所を設置したときは2週間以内に弁済業務保
